<!doctype html>

<title>km-board · 기간 · 캠페인 필터</title>
<!--

  · 이 파일 하나만 열어도 렌더링되도록 공통 스타일을 포함했습니다.

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
  <style>
    body{margin:0;background:#0e0f16;color:#e8e9f2;font-family:Pretendard,"Pretendard Variable",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.006em;font-size:14px;line-height:1.62;-webkit-font-smoothing:antialiased}
    .m{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
    .nav{padding:6px 12px;color:#b5b9cd;font-size:13.5px}
    .card{background:#171a27;border:1px solid #2b3044;border-radius:10px}
    .lbl{font-size:12px;color:#8f94ab}
    .sec{font-size:15px;font-weight:600;letter-spacing:-.015em}
    .pill{display:inline-block;padding:2.5px 8px;border-radius:5px;font-size:11.5px;font-weight:600;white-space:nowrap}
    .btn{padding:6px 12px;border:1px solid #343950;border-radius:7px;font-size:12.5px;color:#b5b9cd;white-space:nowrap}
    .btnA{padding:6px 12px;border-radius:7px;background:#8b7cff;color:#0e0f16;font-size:12.5px;font-weight:600;white-space:nowrap}
    th{font-size:12px;color:#8f94ab;font-weight:500;text-align:right;padding:9px 12px;border-bottom:1px solid #2b3044;white-space:nowrap}
    td{padding:11px 12px;text-align:right;font-size:13.5px;border-bottom:1px solid #202434}
    tr:last-child td{border-bottom:none}
    .lt{text-align:left!important}
  </style>
<style>

lor:#6d7288;font-size:12.5px;white-space:nowrap"><span style="width:6px;height:6px;border-radius:50%;background:#5a5f75;flex-shrink:0"></span>플러스스토어<span style="font-size:11px;color:#6d7288;margin-left:4px">중지</span></span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid #2b3044;border-radius:7px;background:transparent;color:#6d7288;font-size:12.5px;white-space:nowrap"><span style="width:6px;height:6px;border-radius:50%;background:#5a5f75;flex-shrink:0"></span>콘텐츠_추천<span style="font-size:11px;color:#6d7288;margin-left:4px">중지</span></span></div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <span style="font-size:12px;color:#8f94ab;white-space:nowrap">8개 중 <b style="color:#e8e9f2">6개</b></span>
          <span style="padding:5px 11px;border:1px solid #343950;border-radius:7px;font-size:12.5px;color:#b5b9cd;white-space:nowrap">전체</span>

    </div>

      <span style="display:flex;align-items:center;gap:5px"><i style="width:6px;height:6px;border-radius:50%;background:#3ddc97;display:inline-block"></i>네이버에서 집행 중</span>
