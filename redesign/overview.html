<style>
  :root{
    --bg:#0d0e15; --panel:#171829; --panel-2:#1d1f33; --border:#33354a;
    --text:#f5f6fa; --muted:#a8abc4; --up:#4ade9a; --down:#ff6b85; --accent:#8b7cff; --accent-solid:#6354d6; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(circle at 10% 0%,#191a2c 0%,var(--bg) 45%);color:var(--text);font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;}
  .wrap{max-width:1480px;margin:0 auto;padding:28px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500;}
  .field input{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;font-family:'Pretendard',sans-serif;}
  .btn{border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:7px;}
  .btn-accent{background:linear-gradient(135deg,var(--accent-solid,#6354d6),#6f5fdd);color:#fff;}
  .status-msg{font-size:12px;margin-top:11px;padding:10px 12px;border-radius:8px;background:var(--panel-2);color:var(--muted);display:none;line-height:1.5;}
  .status-msg.show{display:block;}
  .status-msg.err{color:var(--down);}
  .export-btn{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 16px;font-size:14px;font-weight:500;cursor:pointer;}
  .panel{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:20px;}
  .panel-title{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--text);}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:280px;color:var(--muted);font-size:14px;text-align:center;gap:10px;line-height:1.6;}

  /* ---- 상단 요약 통계 ---- */
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:22px;}
  .stat-card{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:18px 20px;}
  .stat-card .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .stat-card .val{font-size:28px;font-weight:800;margin-top:8px;letter-spacing:-.01em;}

  /* ---- 필터바 ---- */
  .filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .biz-tab{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 18px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;}
  .biz-tab.active{border-color:var(--accent);color:var(--accent-text,var(--accent));background:rgba(139,124,255,.12);}
  .search-input{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:14px;color:var(--text);min-width:200px;}
  .search-input:focus{outline:none;border-color:var(--accent);}
  .sort-select{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:14px;color:var(--text);}
  .period-nav{display:inline-flex;align-items:center;gap:6px;}
  .period-arrow{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    height:38px;padding:0 11px;font-size:13px;line-height:1;color:var(--muted);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;}
  .period-all{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    height:38px;padding:0 13px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;}
  .period-all:hover{background:rgba(139,124,255,.14);border-color:var(--accent-solid,#6354d6);color:var(--text);}
  .period-arrow:hover:not(:disabled){background:rgba(139,124,255,.14);border-color:var(--accent-solid,#6354d6);}
  .period-arrow:disabled{opacity:.35;cursor:default;}

  /* ---- 카드 그리드 ---- */
  .client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
  .client-card{background:var(--panel-2);border:1px solid var(--border);border-radius:16px;padding:20px;cursor:pointer;transition:border-color .15s,transform .15s;position:relative;}
  .client-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .client-card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .client-card-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;}
  .client-card-name{font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;}
  .client-card-biz{font-size:12px;color:var(--muted);background:rgba(255,255,255,.08);padding:2px 8px;border-radius:10px;margin-top:3px;display:inline-block;}
  .client-card-period{font-size:12px;color:var(--muted);margin-top:3px;}
  .client-card-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .client-card-metric .m{font-size:12px;color:var(--muted);}
  .client-card-metric .v{font-size:16px;font-weight:700;margin-top:3px;}
  .client-card-badge{position:absolute;top:16px;right:44px;font-size:16px;}
  .client-card-alert-badge{position:absolute;top:14px;left:16px;font-size:12px;font-weight:800;color:#2b0a12;background:var(--down);border-radius:10px;padding:3px 8px;display:flex;align-items:center;gap:2px;}
  .client-card-trend{font-weight:700;margin-left:4px;}
  .client-card-trend.up{color:var(--up);}
  .client-card-trend.down{color:var(--down);}
  .overview-section-title{font-size:16px;font-weight:800;color:var(--text);margin:28px 0 14px;padding-top:4px;}
  .overview-section-title:first-child{margin-top:0;}
  .client-card-goal{margin-top:12px;padding-top:11px;border-top:1px dashed var(--border);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;border-radius:6px;}
  .client-card-goal:hover{background:rgba(255,255,255,.04);}
  .client-card-goal.goal-met{color:var(--up);}
  .client-card-goal.goal-miss{color:var(--down);}
  .client-card-goal-empty{color:var(--muted);}
  .client-card-goal-edit{font-size:12px;color:var(--accent-text,var(--accent));font-weight:700;white-space:nowrap;}
  .client-card-pin{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:2px;z-index:2;}
  .client-card-pin:hover{color:#f5c542;}
  .client-card-pin.pinned{color:#f5c542;}
  .client-card-spark{margin-top:12px;display:flex;align-items:center;gap:8px;}
  .client-card-spark-lbl{font-size:11px;color:var(--muted);}
  .risk-panel-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);font-size:14px;}
  .risk-panel-row:last-child{border-bottom:none;}
  .risk-panel-row .name{font-weight:700;min-width:90px;}
  .risk-panel-row .text{color:var(--muted);flex:1;}
  .risk-panel-sev{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

/* 표 숫자 칸은 줄바꿈 금지 — '92,539,282' 뒤에 '원'만 다음 줄로 떨어지는 문제 방지.
   첫 칸(키워드·상품명 등)만 두 줄 허용하고, 표가 넓어지면 카드 안에서 가로로 스크롤된다. */
table td, table th { white-space: nowrap; }
table td.kw-name, table td:first-child { white-space: normal; word-break: keep-all; }
table td.kw-name { min-width: 150px; }
</style>

<style id="km-redesign-skin">
/* ===== 신규 디자인 적용 — 데이터·기능은 그대로, 보이는 것만 바꿈 ===== */
:root{
  --bg:#0e0f16;
  --panel:#141622;
  --panel-2:#171a27;
  --border:#2b3044;
  --text:#e8e9f2;
  --muted:#8f94ab;
  --radius:11px;
}
body{
  background:#0e0f16 !important;
  letter-spacing:-.006em;
}

/* 큰 카드 */
.card{ border-radius:12px !important; padding:20px 22px !important; }
.panel{ border-radius:11px !important; padding:16px 18px !important; }
.panel-title{
  font-size:15px !important; font-weight:600 !important;
  letter-spacing:-.015em !important; margin-bottom:12px !important;
}

/* 목표 대비 KPI — 라벨은 조용하게, 숫자는 크게 */
.kpi-row{ gap:10px !important; margin-bottom:20px !important; }
.kpi{ border-radius:11px !important; padding:15px 17px !important; }
.kpi-label{
  text-transform:none !important; letter-spacing:0 !important;
  font-weight:400 !important; font-size:12px !important;
  color:var(--muted) !important; margin-bottom:6px !important;
}
.kpi-value{
  font-size:25px !important; font-weight:600 !important;
  letter-spacing:-.022em !important; font-variant-numeric:tabular-nums;
}
.kpi-note{
  font-size:12.5px !important; font-weight:600 !important;
  padding:4px 9px !important; border-radius:6px !important;
}

/* 배지 · 버튼 · 탭 */
.badge{ border-radius:5px !important; font-size:11.5px !important; font-weight:600 !important; padding:2.5px 8px !important; }
.btn{ border-radius:8px !important; font-weight:600 !important; font-size:13px !important; padding:11px !important; }
.tabs{ gap:6px !important; }
.tab{ border-radius:7px !important; padding:7px 12px !important; font-size:13px !important; }
.export-btn{ border-radius:8px !important; font-size:12.5px !important; }

/* 표 — 줄 간격 넓히고 숫자 자릿수 맞춤 */
table{ font-variant-numeric:tabular-nums; }
table th{ font-size:12px !important; font-weight:500 !important; color:var(--muted) !important; letter-spacing:0 !important; text-transform:none !important; }
table td{ font-size:13.5px !important; }
table td, table th{ padding-top:10px !important; padding-bottom:10px !important; }

/* 왼쪽 필터 */
.filter-panel{ border-radius:11px !important; }
.filter-group-title{ font-size:11.5px !important; letter-spacing:.05em !important; }
.filter-item{ font-size:13px !important; }
.section-title{ font-size:11.5px !important; letter-spacing:.05em !important; }

/* 업체 선택 */
.client-switcher-btn{ border-radius:8px !important; font-size:13.5px !important; }
.client-switcher-dropdown{ border-radius:11px !important; }
.client-switcher-item{ font-size:13.5px !important; }

/* 작은 글씨들 살짝 키움 */
.lbl, .sub, .kpi-note, .chg{ font-size:12.5px !important; }

/* 목표 대비 KPI — 4칸 + 진행 막대 */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:10px}
.kpi-cell{background:var(--panel-2);padding:15px 17px}
.kpi-cell .k-lab{font-size:12px;color:var(--muted)}
.kpi-cell .k-lab i{font-style:normal;color:#6d7288}
.kpi-cell .k-val{font-size:25px;font-weight:600;letter-spacing:-.022em;margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi-cell .k-bar{height:5px;border-radius:3px;background:var(--bg);overflow:hidden;margin-top:9px;display:flex}
.kpi-cell .k-bar b{display:block;height:100%;border-radius:3px}
.kpi-cell .k-foot{font-size:12px;color:var(--muted);margin-top:7px;min-height:17px}
.kpi-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:22px}
.kpi-mini > div{background:var(--panel-2);padding:11px 15px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.kpi-mini .m-lab{font-size:12px;color:var(--muted)}
.kpi-mini .m-val{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi-mini .kpi-note{font-size:11.5px!important;padding:2px 7px!important}
@media(max-width:1100px){.kpi-strip{grid-template-columns:repeat(2,1fr)}}

/* ---- 상단 필터 바 ---- */
.filterbar{display:flex;align-items:center;gap:0;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:4px 6px;margin:0 0 14px}
.filterbar .fb-g{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 12px;border-right:1px solid var(--border)}
.filterbar .fb-g:last-child{border-right:0}
.filterbar .fb-lab{font-size:11px;color:var(--muted);letter-spacing:.04em;font-weight:600}
.filterbar select{background:transparent!important;border:1px solid var(--border)!important;border-radius:7px!important;padding:4px 8px!important;font-size:12.5px!important}
.filterbar button{border-radius:7px!important}
.filterbar .day-preset-pill-idx{border-radius:7px!important;padding:5px 11px!important;font-size:12.5px!important}
.filterbar #dayRangeCustomToggle{border-radius:7px!important;padding:5px 11px!important;font-size:12.5px!important}
header.rep{align-items:center!important;padding-bottom:14px!important;margin-bottom:14px!important}
header.rep .totals{display:none}
.idn-name{font-size:20px!important;font-weight:600!important;letter-spacing:-.02em!important}
.period{font-size:12.5px!important;color:var(--muted)!important;margin-top:3px!important}
@media(max-width:900px){.filterbar .fb-g{border-right:0}}

/* ---- 성과 인사이트 2단 ---- */
.ins-top{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text);margin-bottom:12px}
.ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ins-col{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:13px 15px 14px}
.ins-col-good{border-left:3px solid var(--up)}
.ins-col-warn{border-left:3px solid var(--down)}
.ins-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:9px}
.ins-h b{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:1px 8px}
.ins-ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ins-li{position:relative;padding-left:13px;font-size:12.5px;line-height:1.65;color:var(--text)}
.ins-li::before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%}
.ins-good::before{background:var(--up)} .ins-warn::before{background:var(--down)} .ins-info::before{background:var(--muted)}
.ins-neutral{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.ins-neutral .ins-li{color:var(--muted)}
#insightsPanel{border-left:0!important}
@media(max-width:900px){.ins-grid{grid-template-columns:1fr}}

.dc-two{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
@media(max-width:1000px){.dc-two{grid-template-columns:1fr}}

/* ---- 큰 숫자 줄 ----
   칸 수가 6개(DB)/7개(B2C)로 달라지고 화면 폭에 따라 줄바꿈되는데, grid로 하면 마지막 줄에 빈칸이 남는다.
   flex + flex-grow 로 두면 남은 칸들이 늘어나 폭을 꽉 채운다. */
.dc-kpi{display:flex;flex-wrap:wrap;gap:1px;background:#262a3b;border:1px solid #262a3b;border-radius:9px;overflow:hidden}
.dc-kpi > div{flex:1 1 142px;min-width:0}

.dc-kpi2{display:flex;flex-direction:column;gap:1px;background:#262a3b;border:1px solid #262a3b;border-radius:9px;overflow:hidden}
.dc-k-top,.dc-k-bot{display:flex;flex-wrap:wrap;gap:1px;background:#262a3b}
.dc-k-top > div,.dc-k-bot > div{flex:1 1 160px;min-width:0}

.ov-row:hover td{background:#1b1e2c}
.ov-row td{transition:background .12s}

/* ---- 표: 목업과 같은 모양으로 통일 ---- */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table thead tr{background:#1d2030}
table th{font-size:12px!important;font-weight:500!important;letter-spacing:.04em!important;
  color:#8f94ab!important;padding:9px 14px!important;border-bottom:1px solid #262a3b!important;
  text-transform:none!important;white-space:nowrap}
table td{font-size:13.5px!important;padding:9px 14px!important;border-bottom:1px solid #262a3b!important}
table tbody tr:hover td{background:#1b1e2c}
.panel table,.card table{border-radius:0}

/* 줄 많은 표 — 높이를 잘라 안쪽 스크롤, 머리글 고정 */
.dc-scroll{max-height:440px;overflow-y:auto;overflow-x:auto;border:1px solid #262a3b;border-radius:9px}
.dc-scroll table{margin:0}
.dc-scroll thead th{position:sticky;top:0;z-index:1;background:#1d2030}
.dc-scroll td{padding-top:5px!important;padding-bottom:5px!important;font-size:12.5px!important}
.dc-scroll th{padding-top:8px!important;padding-bottom:8px!important}
.dc-scroll tbody tr:last-child td{border-bottom:0!important}
.dc-scroll::-webkit-scrollbar{width:9px;height:9px}
.dc-scroll::-webkit-scrollbar-thumb{background:#3f4468;border-radius:5px}
.dc-scroll::-webkit-scrollbar-track{background:transparent}

/* 카드·패널이 안쪽 표 때문에 늘어나지 않게 (안 그러면 화면 오른쪽이 잘림) */
.wrap,.main-layout,.card,.panel,.chart-box{min-width:0}
.card,.panel{overflow-x:hidden}
.dc-scroll{overflow-x:auto}
.dc-scroll-x{max-height:none;overflow-y:visible}
.hr-scroll{overflow-x:auto}

/* ---- 상단 메뉴바 ---- */
.topbar{display:flex;align-items:center;gap:3px;flex-wrap:wrap;row-gap:6px;
  margin:0 0 14px;padding:7px 12px;background:#12131c;border:1px solid #262a3b;border-radius:11px}
.nv-logo{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;
  letter-spacing:-.01em;color:#e8e9f2;margin-right:14px;white-space:nowrap}
.nv-mark{width:20px;height:20px;border-radius:6px;background:#8b7cff;display:inline-block;flex-shrink:0}
.nv{padding:5px 11px;border-radius:7px;font-size:12.5px;color:#a9adc2;text-decoration:none;white-space:nowrap;transition:background .12s,color .12s}
.nv:hover{background:#1b1e2c;color:#e8e9f2}
.nv-on{background:#232640;color:#e8e9f2;font-weight:500}
.nv-b{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 5px;
  margin-left:5px;border-radius:8px;background:#f5a524;color:#12131c;font-size:10px;font-weight:700;vertical-align:1px}
.topbar .client-switcher{margin-left:auto}

/* ===== 표 가독성 공통(_kmread.css) — 시작 ===== */
/* ══════════════════════════════════════════════════════════════════════
   표 가독성 공통 규칙
   숫자가 왼쪽으로 붙어 있고 모든 값이 같은 무게라, 뭐가 중요한지 알려면
   표를 다 읽어야 했다. 아래 규칙으로 훑기만 해도 눈에 걸리게 만든다.
   ※ 숫자 자체는 손대지 않는다(네이버와 같아야 하므로). 보이는 방식만 바꾼다.
   ══════════════════════════════════════════════════════════════════════ */

/* ① 숫자는 오른쪽 정렬 + 자릿수 고정폭.
   이게 없으면 1,531,644 와 987,000 의 자릿수가 안 맞아 크기 비교가 눈으로 안 된다.
   첫 칸(이름)과 kw-name/camp-name 은 글자라 왼쪽 그대로 둔다. */
table th, table td { text-align: right; font-variant-numeric: tabular-nums; }
table th:first-child, table td:first-child,
table td.kw-name, table th.camp-name-cell, table td.camp-name-cell { text-align: left; }
/* 캠페인·구분처럼 글자가 들어가는 칸은 개별적으로 왼쪽 정렬 */
table td.km-text, table th.km-text { text-align: left; }

/* ② 한 줄 걸러 옅은 배경 — 가로로 눈이 미끄러지지 않게 */
table tbody tr:nth-child(even) td { background: rgba(255,255,255,.022); }
table tbody tr:hover td { background: #1b1e2c; }

/* ③ 보조 지표(노출·클릭)는 뒤로 물린다.
   판단에 바로 쓰는 값은 비용·전환·CPA·ROAS 인데, 노출·클릭이 같은 무게로 끼어들면
   시선이 분산된다. 값은 그대로 두고 색만 옅게. */
table td.km-sub { color: var(--muted); }

/* ④ 핵심 값은 굵게 — 비용은 규모, 전환은 성과 */
table td.km-key { font-weight: 700; }

/* ⑤ 나쁜 값만 빨강 — 전환 0, 비정상적으로 높은 CPA 등 */
table td.km-bad { color: var(--down); font-weight: 700; }

/* ⑥ 가로 스크롤 시 이름 칸이 따라다니게 — 오른쪽 열을 볼 때
   "이게 무슨 키워드였지" 하고 되돌아가지 않아도 된다. */
.km-stick table td:first-child,
.km-stick table th:first-child {
  position: sticky; left: 0; z-index: 2;
  background: var(--panel);
  box-shadow: 1px 0 0 var(--border);
}
.km-stick table tbody tr:nth-child(even) td:first-child { background: var(--panel); }
.km-stick table tbody tr:hover td:first-child { background: #1b1e2c; }

/* ⑦ 표 위 요약 줄 — 지금 조건에서 얼마를 쓰고 얼마를 벌었는지 한 줄로 */
.km-summary { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.km-summary > div {
  flex:1; min-width:112px; background:var(--panel-2);
  border:1px solid var(--border); border-radius:9px; padding:9px 12px;
}
.km-summary .lb { font-size:11px; color:var(--muted); display:block; }
.km-summary .vl { font-size:16px; font-weight:700; display:block; margin-top:2px;
  font-variant-numeric:tabular-nums; }
.km-summary .vl.warn { color: var(--down); }
.km-summary .vl.good { color: var(--up); }

/* ===== 표 가독성 공통 — 끝 ===== */
</style>

(function initKmMenu(){
  const items=[...document.querySelectorAll('.kmenu .mitem[data-menu]')];
  const closeAll=except=>items.forEach(it=>{ if(it!==except) it.classList.remove('on'); });
  items.forEach(it=>{
    const btn=it.querySelector('.mbtn');
    let closeTimer=null;
    it.addEventListener('mouseenter',()=>{ clearTimeout(closeTimer); closeAll(it); it.classList.add('on'); });
    it.addEventListener('mouseleave',()=>{ clearTimeout(closeTimer); closeTimer=setTimeout(()=>it.classList.remove('on'),260); });
    btn.addEventListener('click',e=>{ e.preventDefault(); const open=it.classList.contains('on'); closeAll(it); it.classList.toggle('on',!open); });
  });
  document.addEventListener('click',e=>{ if(!e.target.closest('.kmenu .mitem[data-menu]')) closeAll(null); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeAll(null); });
  const here=(location.pathname.split('/').pop()||'index.html').toLowerCase();
  document.querySelectorAll('.kmenu a[href]').forEach(a=>{
    if((a.getAttribute('href')||'').toLowerCase()!==here) return;
    a.classList.add('cur');
    const p=a.closest('.mitem'), pb=p&&p.querySelector('button.mbtn');
    if(pb) pb.classList.add('cur');
  });
})();

<script>
function slugify(name){ return name.trim().replace(/[\s\/\\'"]+/g,'_'); }
function fmtMan(man){ return man>=10000 ? (man/10000).toFixed(man%10000===0?0:1)+'억' : Math.round(man).toLocaleString('ko-KR')+'만'; }
function fmtWon(man){ return Math.round(man*10000).toLocaleString('ko-KR'); }
function fmtNum(n){ return Math.round(n).toLocaleString('ko-KR'); }
function contrastText(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.6 ? '#12131c' : '#ffffff';
}

/* ---------- 저장소 (Firestore) ---------- */
const DETAIL_DATA_FIELDS = ['keywordsByCampaign','wasteKeywordsByCampaign','expandKeywordsByCampaign','brandKeywordsByCampaign','wasteBrandKeywordsByCampaign','expandBrandKeywordsByCampaign','searchTermsByCampaign','wasteSearchTermsByCampaign','expandSearchTermsByCampaign','hourly','hourlyByCampaign','hourlyByDow','hourlyByDowByCampaign','hourlyByAdgroup','hourlyByCampaignDate','adgroupsByCampaign','dailyByCampaign','dailyByKeyword'];
function fieldEmptyDefault(f){ return (f==='hourly'||f==='hourlyByCampaign'||f==='hourlyByDow'||f==='hourlyByDowByCampaign'||f==='hourlyByAdgroup'||f==='hourlyByCampaignDate'||f==='dailyByCampaign'||f==='dailyByKeyword') ? [] : {}; }
function userClientsRef(){
  if(!auth.currentUser) throw new Error('not signed in');
  return db.collection('clients');
}
let isAdminUser = false;
let currentUserEmail = '';
function rolesConfigRef(){ return db.collection('config').doc('roles'); }
async function checkIsAdmin(email){
  try{
    const doc = await rolesConfigRef().get();
    if(!doc.exists) return false;
    const admins = doc.data().adminEmails || [];
    return admins.includes(email);
  }catch(e){ console.error(e); return false; }
}
async function listClients(){
  try{
    const snap = await userClientsRef().get();
    return snap.docs.map(d=>'client:'+d.id);
  }catch(e){ console.error(e); return []; }
}

/* 플레이스(캠페인유형 코드 6)는 지도 노출 기반이라 검색광고 지표와 성격이 달라 대시보드에서 제외한다.
   월 합계에서도 플레이스 몫을 빼서 다른 페이지 숫자와 어긋나지 않게 한다. */
const IS_PLACE_TYPE = (t) => { const v = String(t==null?'':t).trim();
  return v === '6' || v.indexOf('플레이스') >= 0; };
/* ── 브랜드검색 정액제 비용 얹기 ────────────────────────────────────────────
   브랜드검색광고는 정액제라 네이버 일별 리포트의 비용이 0원으로 온다. input.html에서
   등록한 계약(brandContracts: 캠페인·시작월·종료월·계약금액)을 읽어, 계약 금액을 계약
   기간의 각 달에 일수 비율로 나눠 그 달 그 캠페인의 비용으로 채운다. 월 합계(cost)에도
   같은 금액을 더해서 대시보드 어디서 보든 숫자가 어긋나지 않게 한다.
   금액 단위: 저장은 '원', 월/캠페인 데이터는 '만원' 단위라 10000으로 나눠서 넣는다.
   이미 비용이 잡혀 있으면(정액제가 아닌 경우) 건드리지 않는다. */
function __bcMonthDays(y,m){ return new Date(y,m,0).getDate(); }
function __bcParseYM(v){ const mm=String(v||'').match(/^(\d{4})-(\d{2})$/); return mm?{y:+mm[1],m:+mm[2]}:null; }
function __bcSplit(start,end,amount){
  const s=__bcParseYM(start), e=__bcParseYM(end);
  if(!s||!e||!(amount>0)) return {};
  if(e.y*12+e.m < s.y*12+s.m) return {};
  const spans=[]; let y=s.y,m=s.m,total=0;
  while(y*12+m <= e.y*12+e.m){
    const d=__bcMonthDays(y,m);
    spans.push({label:y+'.'+String(m).padStart(2,'0'), days:d}); total+=d;
    m++; if(m>12){ m=1; y++; }
  }
  if(!total) return {};
  const out={}; let acc=0;
  spans.forEach((sp,i)=>{
    const c = (i===spans.length-1) ? (amount-acc) : Math.round(amount*sp.days/total);
    if(i<spans.length-1) acc+=c;
    out[sp.label]=(out[sp.label]||0)+c;
  });
  return out;
}
function applyBrandContracts(data){
  if(!data || !Array.isArray(data.months)) return data;
  const contracts = data.brandContracts;
  if(!Array.isArray(contracts) || !contracts.length) return data;
  // 캠페인 → { 'YYYY.MM': 원 } 로 펼쳐둔다(계약이 여러 건이면 같은 달끼리 합산).
  const byCamp = {};
  contracts.forEach(ct=>{
    if(!ct || !ct.campaign) return;
    const split = __bcSplit(ct.start, ct.end, Number(ct.amount)||0);
    const bucket = byCamp[ct.campaign] || (byCamp[ct.campaign]={});
    Object.keys(split).forEach(lab=>{ bucket[lab]=(bucket[lab]||0)+split[lab]; });
  });
  data.months.forEach(m=>{
    const lab = String(m.label||'');
    let added = 0;
    (m.campaigns||[]).forEach(c=>{
      const won = byCamp[c.campaign] && byCamp[c.campaign][lab];
      if(!won) return;
      if(Number(c.cost)>0) return;   // 이미 실비용이 있으면 덮어쓰지 않는다
      const man = won/10000;
      c.cost = man;
      c.__brandContractCost = true;  // 화면에서 '계약금액 기준'임을 표시할 때 쓴다
      added += man;
    });
    if(added>0 && typeof m.cost==='number') m.cost = m.cost + added;
  });
  return data;
}
/* ── 광고비 기준 통일(부가세 제외) ──────────────────────────────────────────
   네이버가 시기에 따라 부가세를 포함한 금액을 주기도 하고 뺀 금액을 주기도 해서,
   2025.10~2026.03 구간은 캠페인·월 합계가 부가세 포함으로 저장돼 있다.
   반면 하루치(daily)는 전 기간 부가세 제외로 통일돼 있다.
   그래서 하루치를 기준으로 삼아 캠페인·월 합계를 같은 기준으로 낮춘다.
   (원본은 그대로 두고 화면에 그릴 때만 맞춘다 — 플레이스 제외·브랜드검색 계약과 같은 방식)
   · 2025.10~2026.02: 모든 캠페인이 정확히 1.1배라 환산이 정확함
   · 2026.03: 달 중간에 기준이 바뀌어 캠페인마다 1.06~1.10로 제각각 — 월 합계는 정확히 맞고
     캠페인 개별값은 최대 2% 안쪽 오차가 남음
   · 2026.04 이후: 이미 같은 기준이라 건드리지 않음 */
function normalizeCostBasis(data){
  if(!data || !Array.isArray(data.months)) return data;
  data.months.forEach(m=>{
    const dailySum = (m.daily||[]).reduce((a,x)=>a+(x.cost||0),0);
    const campSum  = (m.campaigns||[]).reduce((a,c)=>a+(c.cost||0),0);
    if(!(dailySum>0) || !(campSum>0)) return;
    const k = dailySum / campSum;
    if(k > 0.999) return;   // 이미 같은 기준이면 그대로
    if(k < 0.85)  return;   // 부가세 차이로 보기엔 너무 큰 격차 — 다른 원인이므로 손대지 않음
    (m.campaigns||[]).forEach(c=>{ if(typeof c.cost === 'number') c.cost = c.cost * k; });
    if(typeof m.cost === 'number') m.cost = dailySum;
    m.__costRebased = true;   // 화면에서 "기준 맞춤" 표시가 필요할 때 쓴다
  });
  return data;
}
function stripPlaceCampaigns(data){
  /* 2026-09-11: 플레이스를 다시 보여주기로 함 — 수집기가 플레이스를 정상 저장하므로
     화면에서 걸러내면 네이버 관리자 화면 금액과 어긋난다. 아래 옛 제외 로직은 그대로 두되 쓰지 않는다. */
  return data;
  if(!data || !Array.isArray(data.months)) return data;
  data.months.forEach(m=>{
    const camps = m.campaigns || [];
    const place = camps.filter(c=>IS_PLACE_TYPE(c.type));
    /* [중요] 플레이스는 두 갈래로 존재한다.
       ① 캠페인 목록에 유형이 '플레이스'로 남아 있는 경우 → 아래에서 걸러낸다.
       ② 수집기가 저장할 때 이미 캠페인 목록에서는 빼놨는데 하루치 상세에는 남아 있는 경우
          → 캠페인 목록에 없으니 ①로는 절대 못 찾는다. 태림이 이 경우였고, 그래서
            "월 합계 54,717,412 vs 일별 합계 58,723,251"처럼 화면 숫자가 어긋났다.
            (차액 4,005,839원 = 하루치에만 있는 캠페인 77개의 합)
       그래서 '캠페인 목록에 없는데 하루치에만 있는 캠페인'도 함께 제외 대상으로 잡는다. */
    const known = new Set(camps.map(c=>c.campaign));
    const orphanNames = new Set();
    if(Array.isArray(m.dailyByCampaign)){
      m.dailyByCampaign.forEach(r=>{ if(r && r.campaign && !known.has(r.campaign)) orphanNames.add(r.campaign); });
    }
    const names = new Set([...place.map(c=>c.campaign), ...orphanNames]);
    if(!names.size) return;

    // 하루치에서 뺄 몫을 미리 뽑아둔다(아래에서 dailyByCampaign을 걸러내기 전에).
    const placeDailyRows = Array.isArray(m.dailyByCampaign)
      ? m.dailyByCampaign.filter(r=>r && names.has(r.campaign)) : [];

    m.campaigns = camps.filter(c=>!IS_PLACE_TYPE(c.type));
    // 월 합계에서 플레이스 몫 차감 (캠페인 목록에 남아 있던 것만 — 나머지는 애초에 월 합계에 없음)
    ['cost','revenue','conv','impressions','clicks'].forEach(k=>{
      if(typeof m[k] === 'number'){
        const sub = place.reduce((a,c)=>a+(Number(c[k])||0),0);
        m[k] = Math.max(0, m[k] - sub);
      }
    });
    // 하루치 합계(daily)에서도 같은 몫을 뺀다 — daily엔 캠페인 이름이 없으므로 날짜로 맞춘다.
    if(Array.isArray(m.daily) && m.daily.length && placeDailyRows.length){
      const byDate = {};
      placeDailyRows.forEach(r=>{
        if(!r || !r.date) return;
        const b = byDate[r.date] || (byDate[r.date] = {cost:0,revenue:0,conv:0,impressions:0,clicks:0});
        ['cost','revenue','conv','impressions','clicks'].forEach(k=>{ b[k] += Number(r[k])||0; });
      });
      m.daily = m.daily.map(d=>{
        const sub = d && d.date ? byDate[d.date] : null;
        if(!sub) return d;
        const out = { ...d };
        ['cost','revenue','conv','impressions','clicks'].forEach(k=>{
          if(typeof out[k] === 'number') out[k] = Math.max(0, out[k] - (sub[k]||0));
        });
        return out;
      });
    }
    // 캠페인 이름이 붙은 상세 배열에서도 제거
    ['dailyByCampaign','dailyByKeyword','hourlyByCampaign','hourlyByDowByCampaign','hourlyByAdgroup','hourlyByCampaignDate']
      .forEach(f=>{ if(Array.isArray(m[f])) m[f] = m[f].filter(r=>!r || !names.has(r.campaign)); });
    // 캠페인별 지도형 데이터에서도 제거
    ['keywordsByCampaign','wasteKeywordsByCampaign','expandKeywordsByCampaign','brandKeywordsByCampaign',
     'wasteBrandKeywordsByCampaign','expandBrandKeywordsByCampaign','searchTermsByCampaign',
     'wasteSearchTermsByCampaign','expandSearchTermsByCampaign','adgroupsByCampaign']
      .forEach(f=>{ const o=m[f]; if(o && typeof o==='object'){ names.forEach(n=>{ delete o[n]; }); } });
  });
  return data;
}
async function getClient(key){
  try{
    const id = key.replace(/^client:/,'');
    const docRef = userClientsRef().doc(id);
    const doc = await docRef.get();
    if(!doc.exists) return null;
    const data = applyBrandContracts(normalizeCostBasis(stripPlaceCampaigns(doc.data())));
    // 개요 페이지는 마지막 월 요약 수치만 필요해서, 무거운 상세데이터(detailData 하위컬렉션)는 굳이 안 불러옴 — 로딩 속도 최적화.
    return data;
  }catch(e){ console.error(e); return null; }
}

/* ---------- 전체 업체 개요 ---------- */
let overviewRows = [];
let overviewBizFilter = 'ALL';
let overviewSortMode = 'efficiency';
let overviewIndustryFilter = 'ALL';
let overviewGroupByIndustry = false;
let overviewGoalMissOnly = false;
let overviewPinnedOnly = false;
// overviewRangeState: { start, end } 각각 'LATEST'(업체별 최신 달, 기존 동작) 또는 실제 월 라벨 문자열(예: '2026.07').
// 어느 한쪽이라도 'LATEST'면 "업체별 최신 달 1개만" 보는 기존 방식으로 동작하고, 둘 다 구체적인 라벨이면
// 그 사이(양끝 포함) 기간을 업체별로 합산해서 보여줌.
let overviewRangeState = { start: 'LATEST', end: 'LATEST' };
let overviewAllClientData = []; // { key, data } — 월 선택이 바뀔 때마다 재조회 없이 다시 계산하기 위해 원본 보관
let overviewCachedAlerts = []; // computeAlerts() 결과 — 알림은 항상 "현재 최신 달" 기준이라 월 선택과 무관해서 캐시해둠
// 라벨은 보통 "YYYY.MM" 형식이지만 월이 0패딩 없이(예: "2026.7") 저장된 경우도 섞여 있을 수 있어서,
// 단순 문자열 정렬 대신 연/월을 숫자로 뽑아 비교함. 여러 함수에서 재사용해서 최상위로 뺌.
function labelSortKey(l){
  const m = String(l).match(/(\d{4})\D+(\d{1,2})/);
  return m ? Number(m[1])*100 + Number(m[2]) : -Infinity;
}

// 즐겨찾기(핀) — 브라우저별 로컬 저장. 자주 확인하는 업체를 그리드 맨 위로 고정할 때 사용.
const PIN_KEY = 'ad_dashboard_pinned_clients';
function getPinned(){ try{ return new Set(JSON.parse(localStorage.getItem(PIN_KEY)||'[]')); }catch(e){ return new Set(); } }
function togglePinned(key){
  const pinned = getPinned();
  if(pinned.has(key)) pinned.delete(key); else pinned.add(key);
  localStorage.setItem(PIN_KEY, JSON.stringify([...pinned]));
  return pinned;
}
// 카드 미니 스파크라인 — 최근 30일 이내 일별 비용 추이를 작은 SVG 라인으로 표시(index.html의 sparkPath와 동일 로직)
function sparkPath(vals, w, h){
  if(!vals.length) return '';
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = (max - min) || 1;
  const step = w / (Math.max(vals.length-1,1));
  return vals.map((v,i)=>{
    const x = i*step;
    const y = h - ((v-min)/range)*h;
    return `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
}
function sparklineHTML(vals, color){
  if(!vals || vals.length<2) return '';
  const w=100, h=28;
  const d = sparkPath(vals, w, h);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible;"><path d="${d}" fill="none" stroke="${color||'var(--accent)'}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

// 선택된 기간 범위(overviewRangeState)에 해당하는 업체 한 곳의 달들을 골라 반환.
// start/end 어느 한쪽이라도 'LATEST'면 그 업체의 가장 최근 달 1개만(기존 동작과 동일).
// 그 외엔 라벨을 연/월 숫자로 변환해 범위 비교하므로, 업체마다 보유한 월이 서로 달라도
// (예: A업체는 2026.03부터, B업체는 2026.05부터 데이터가 있음) 각자 가진 달 중 겹치는 부분만 자연스럽게 반영됨.
function monthsOfClientInRange(data, range){
  const months = data.months || [];
  if(!months.length) return [];
  if(range.start==='LATEST' || range.end==='LATEST') return [months[months.length-1]];
  const sKey = labelSortKey(range.start), eKey = labelSortKey(range.end);
  const lo = Math.min(sKey, eKey), hi = Math.max(sKey, eKey);
  return months.filter(m => { const k = labelSortKey(m.label); return k>=lo && k<=hi; });
}
function buildOverviewRowForClient(key, data, range){
  if(!data) return null;
  if(!isAdminUser && !(data.allowedUsers||[]).includes(currentUserEmail)) return null;
  const monthsInView = monthsOfClientInRange(data, range);
  if(!monthsInView.length) return null; // 이 업체는 선택한 기간에 해당하는 데이터가 아예 없음 — 그리드에서 제외
  const isMultiMonth = monthsInView.length > 1;
  const cost = monthsInView.reduce((a,m)=>a+(m.cost||0),0);
  const revenue = monthsInView.reduce((a,m)=>a+(m.revenue||0),0);
  const conv = monthsInView.reduce((a,m)=>a+(m.conv||0),0);
  const roas = cost>0 ? (revenue/cost*100) : 0;
  const cpa = conv>0 ? (cost*10000/conv) : 0;

  // 트렌드 배지(▲▼)와 전월 대비 비교는 "선택 구간의 마지막 달 vs 그 직전 달"이라는 단일 월 비교를 그대로 유지함
  // (index.html 등 다른 페이지에서도 구간 전체를 둘로 나눠 비교하지 않고 이 방식을 채택함 — 일관성 유지).
  const last = monthsInView[monthsInView.length-1];
  const allMonths = data.months || [];
  const lastIdx = allMonths.findIndex(m=>m.label===last.label);
  const lastRoas = last.cost>0 ? (last.revenue/last.cost*100) : 0;
  const lastCpa = last.conv>0 ? (last.cost*10000/last.conv) : 0;
  let trend = null;
  let prev = null;
  if(lastIdx>=1){
    prev = allMonths[lastIdx-1];
    if(data.bizType==='DB'){
      const prevCpa = prev.conv>0 ? (prev.cost*10000/prev.conv) : 0;
      if(prevCpa>0 && lastCpa>0 && Math.abs(lastCpa-prevCpa)/prevCpa>=0.03){
        trend = { dir: lastCpa<prevCpa?'down':'up', good: lastCpa<prevCpa };
      }
    } else {
      const prevRoas = prev.cost>0 ? (prev.revenue/prev.cost*100) : 0;
      if(prevRoas>0 && Math.abs(lastRoas-prevRoas)>=3){
        trend = { dir: lastRoas>prevRoas?'up':'down', good: lastRoas>prevRoas };
      }
    }
  }
  // 카드 미니 스파크라인용 — 선택된 구간 전체의 일별 비용 추이(월 순서대로 이어붙인 뒤 최대 30개로 자름)
  const dailyCost = monthsInView.flatMap(m=>(m.daily||[]).map(d=>d.cost||0)).slice(-30);
  const periodLabel = isMultiMonth ? `${monthsInView[0].label} ~ ${last.label} 누적` : last.label;
  return { key, name:data.name, color:data.color, bizType:data.bizType, industry:data.industry||'미분류',
    allowedUsers: data.allowedUsers||[], goal: data.goal||null,
    lastLabel:last.label, periodLabel, cost, revenue, conv, roas, cpa, trend,
    prevCost: prev ? (prev.cost||0) : null, prevConv: prev ? (prev.conv||0) : null,
    prevRevenue: prev ? (prev.revenue||0) : null, dailyCost };
}

async function loadOverview(){
  const grid = document.getElementById('overviewGrid');
  grid.innerHTML = `<div class="empty-state">불러오는 중...</div>`;
  const keys = await listClients();
  // 클라이언트별 조회를 순차(for...of + await)가 아니라 Promise.all로 동시에 실행 —
  // 클라이언트 수가 늘어날수록 순차 방식은 "클라이언트 수 × 왕복시간"만큼 그대로 느려지는데,
  // 각 클라이언트 조회는 서로 의존관계가 없어서 동시에 실행해도 안전함(로딩 속도 최적화).
  // 알림 개수도 같은 시점에 동시에 계산해서 업체 카드에 바로 표시함(🔔 배지) — 매번 알림 벨을
  // 눌러야만 어떤 업체에 문제가 있는지 알 수 있던 것을 그리드에서 한눈에 보이게 함.
  const results = await Promise.all(keys.map(async key=>{
    let data;
    try{ data = await getClient(key); }catch(e){ console.error(e); return null; }
    return data ? { key, data } : null;
  }));
  overviewAllClientData = results.filter(Boolean);
  // 방금 받은 문서를 그대로 넘겨서 알림을 계산 — 같은 문서를 두 번 읽지 않음
  overviewCachedAlerts = await computeAlerts(overviewAllClientData).catch(e=>{ console.error(e); return []; });

  // 시작/종료 월 드롭다운 옵션을 실제 데이터에 존재하는 월 라벨들의 합집합으로 채움(과거순 — 범위 선택이라
  // 시작~종료 순서로 눈에 보이는 게 자연스러움. 기존 단일 선택은 최신순이었지만 그건 '이 달만 보기' 용도였음).
  const startSel = document.getElementById('overviewRangeStartSelect');
  const endSel = document.getElementById('overviewRangeEndSelect');
  const allLabels = [...new Set(overviewAllClientData.flatMap(({data})=> (data.months||[]).map(m=>m.label)))];
  allLabels.sort((a,b)=> labelSortKey(a) - labelSortKey(b));
  const optionsHtml = '<option value="LATEST">최근 기간(자동)</option>' + allLabels.map(l=>`<option value="${l}">${l}</option>`).join('');
  startSel.innerHTML = optionsHtml;
  endSel.innerHTML = optionsHtml;
  const validOrLatest = v => (v==='LATEST' || allLabels.includes(v)) ? v : 'LATEST';
  overviewRangeState = { start: validOrLatest(overviewRangeState.start), end: validOrLatest(overviewRangeState.end) };
  startSel.value = overviewRangeState.start;
  endSel.value = overviewRangeState.end;

  await applySelectedMonth();
}

async function applySelectedMonth(){
  // 알림(computeAlerts)은 항상 "현재 진행 중인 실제 최신 달" 기준으로만 의미가 있어서(예산 소진 임박 등은
  // 오늘 날짜 기준 계산), 과거 월을 조회 중이어도 다시 계산하지 않고 loadOverview()에서 캐시해둔 걸 재사용함.
  const alerts = overviewCachedAlerts;
  const rowResults = overviewAllClientData.map(({key,data})=> buildOverviewRowForClient(key, data, overviewRangeState));
  const alertCountByKey = {};
  alerts.forEach(a=>{ alertCountByKey[a.key] = (alertCountByKey[a.key]||0) + 1; });
  overviewRows = rowResults.filter(Boolean).map(r=> ({ ...r, alertCount: alertCountByKey[r.key]||0 }));

  // 업종 필터 드롭다운 옵션을 실제 등록된 업종들로 채움 (매번 데이터가 바뀔 수 있어 갱신마다 다시 채움)
  const industrySel = document.getElementById('overviewIndustryFilter');
  const industries = [...new Set(overviewRows.map(r=>r.industry))].sort((a,b)=>a.localeCompare(b,'ko'));
  const prevIndustryVal = industrySel.value || 'ALL';
  industrySel.innerHTML = '<option value="ALL">전체 업종</option>' + industries.map(ind=>`<option value="${ind}">${ind}</option>`).join('');
  industrySel.value = industries.includes(prevIndustryVal) ? prevIndustryVal : 'ALL';
  overviewIndustryFilter = industrySel.value;

  // \uc0c1\ub2e8 \uc22b\uc790\uc5d0 \u300c\ud655\uc778 \ud544\uc694 N\uac74\u300d\uc744 \ub744\uc6b0\ub824\uba74 \uc54c\ub9bc\uc744 \uba3c\uc800 \ub9cc\ub4e4\uc5b4\uc57c \ud568
  window.__overviewAlerts = alerts || [];
  if(typeof syncPeriodArrows === 'function') syncPeriodArrows();
  renderStatRow();
  renderOverviewGrid();
  if(isAdminUser){
    renderPermOverviewPanel();
    renderRiskPanel(alerts);
  }
}

function momBadgeHTML(curr, prev, goodDir){
  // goodDir: 'up'이면 증가가 좋은 지표(전환수 등), 'down'이면 감소가 좋은 지표
  if(prev===null || prev===undefined || !prev) return '';
  const pct = (curr-prev)/prev*100;
  if(!isFinite(pct) || Math.abs(pct)<0.5) return '';
  const isUp = pct>0;
  const good = goodDir==='up' ? isUp : !isUp;
  return `<span style="font-size:12px;font-weight:700;margin-left:8px;color:${good?'var(--up)':'var(--down)'};">${isUp?'▲':'▼'} ${Math.abs(pct).toFixed(0)}%</span>`;
}

const dcWon = man => dcNum((man||0)*10000)+'원';

function dcAlignTables(root){
  const scope = root || document;
  scope.querySelectorAll('table').forEach(tb=>{
    const body = tb.tBodies && tb.tBodies[0];
    if(!body || !body.rows.length) return;
    const head = tb.tHead && tb.tHead.rows[0];
    const cols = Math.max(...[...body.rows].map(r=>r.cells.length));
    for(let c=0;c<cols;c++){
      let num=0, tot=0;
      for(const row of body.rows){
        const cell = row.cells[c];
        if(!cell || cell.colSpan>1) continue;
        const txt = (cell.textContent||'').trim();
        if(!txt || txt==='-' || txt==='—') continue;
        tot++;
        if(/^[₩$]?[\d,.]+\s*(원|건|개|위|%|만|억)?/.test(txt) && /\d/.test(txt)) num++;
      }
      if(tot>=2 && num/tot >= 0.7){
        for(const row of body.rows){ const cell=row.cells[c]; if(cell && cell.colSpan===1 && !cell.style.textAlign) cell.style.textAlign='right'; }
        if(head && head.cells[c] && !head.cells[c].style.textAlign) head.cells[c].style.textAlign='right';
      }
    }
  });
}

/* 줄이 많은 표는 화면을 끝없이 늘려서, 일정 높이로 잘라 안쪽에서만 스크롤되게 한다.
   (머리글은 스크롤해도 위에 붙어 있어서 어느 칸인지 계속 보임) */
function dcCompactTables(root){
  const scope = root || document;
  scope.querySelectorAll('table').forEach(tb=>{
    if(tb.dataset.dcCompact) return;
    const body = tb.tBodies && tb.tBodies[0];
    if(!body) return;
    if(tb.closest('.hr-scroll, .dc-scroll')) { tb.dataset.dcCompact='1'; return; }
    const parent = tb.parentElement;
    if(!parent) return;
    // 줄이 많아서 세로로 길거나(16줄↑), 칸이 많아서 가로로 넓은(부모보다 큰) 표를 상자에 넣는다.
    // 가로로 넓은 표를 그냥 두면 카드 전체가 늘어나서 화면 오른쪽이 잘림.
    const tooTall = body.rows.length >= 16;
    const tooWide = tb.scrollWidth > parent.clientWidth + 4;
    if(!tooTall && !tooWide) return;
    const wrap = document.createElement('div');
    wrap.className = tooTall ? 'dc-scroll' : 'dc-scroll dc-scroll-x';
    parent.insertBefore(wrap, tb);
    wrap.appendChild(tb);
    tb.dataset.dcCompact = '1';
  });
}
// 화면이 다시 그려질 때마다 자동으로 정렬을 다시 적용 (페이지마다 렌더 함수가 달라서 한 곳에서 처리)
(function(){
  let t = null;
  const run = ()=>{ t=null; try{ dcCompactTables(document); dcAlignTables(document); }catch(e){} };
  const start = ()=>{
    try{ new MutationObserver(()=>{ if(t) return; t=setTimeout(run,60); }).observe(document.body,{childList:true,subtree:true}); }catch(e){}
    run();
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
// 큰 숫자 줄 — 윗줄은 결과(크게), 아랫줄은 과정(작게). 칸이 모자라면 남은 칸이 늘어나 폭을 채운다.
function dcCellHTML(lab, val, delta, big){
  const L = String(val).length;
  const fs = big ? (L>17?21:L>13?24:27) : (L>17?15:L>13?17:19);
  return `<div style="padding:${big?'16px 20px':'13px 20px'};background:${DC.card};min-width:0">
    <div style="font-size:11.5px;color:${DC.mut};margin-bottom:${big?'7px':'5px'}">${lab}</div>
    <div style="display:flex;align-items:baseline;flex-wrap:wrap"><span class="m" style="font-size:${fs}px;font-weight:600;letter-spacing:-.025em;color:${DC.txt};white-space:nowrap">${val}</span>${delta||''}</div>
  </div>`;
}
function dcDelta(now, prev, inv){
  if(prev===null||prev===undefined||!isFinite(prev)||prev===0||now===null||!isFinite(now)) return '';
  const p = (now/prev-1)*100, good = inv ? p<0 : p>0;
  return `<span class="m" style="font-size:12px;color:${good?DC.up:DC.dn};margin-left:8px">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(1)}</span>`;
}
function dcKpi2HTML(top, bottom){
  const r = arr => arr.filter(Boolean).map(c=>dcCellHTML(c[0], c[1], c[2], c[3])).join('');
  return `<div class="dc-kpi2"><div class="dc-k-top">${r(top)}</div>${bottom&&bottom.length?`<div class="dc-k-bot">${r(bottom)}</div>`:''}</div>`;
}

const dcTh = (t,r) => `<th class="m" style="text-align:${r?'right':'left'};font-size:12px;font-weight:500;letter-spacing:.04em;color:${DC.mut};padding:9px 14px;border-bottom:1px solid ${DC.line};white-space:nowrap">${t}</th>`;
const dcTd = (inner,r) => `<td class="m" style="text-align:${r?'right':'left'};padding:9px 14px;border-bottom:1px solid ${DC.line};white-space:nowrap">${inner}</td>`;
const dcTable = (headHtml, bodyHtml) => `<div style="border:1px solid ${DC.line};border-radius:9px;overflow:hidden;background:${DC.card}">
  <div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums">
  <thead><tr style="background:${DC.head}">${headHtml}</tr></thead><tbody>${bodyHtml}</tbody></table></div></div>`;
// 미니 스파크라인 (비용 추이)
function dcSpark(vals, w, h){
  const v = (vals||[]).filter(x=>isFinite(x));
  if(v.length < 2) return '';
  const W = w||84, H = h||22, max = Math.max(...v), min = Math.min(...v), span = (max-min)||1;
  const pts = v.map((x,i)=>`${(i/(v.length-1)*W).toFixed(1)},${(H - (x-min)/span*(H-2) - 1).toFixed(1)}`).join(' ');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="vertical-align:middle;overflow:visible">
    <polyline points="${pts}" fill="none" stroke="${DC.acc}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/></svg>`;
}

function renderStatRow(){
  const el = document.getElementById('statRow');
  if(!overviewRows.length){ el.innerHTML = ''; return; }
  /* 예전엔 여기서 overviewRows(전체)를 그대로 합산해서, 아래 표는 3개 업체인데
     위 KPI는 80개 전체 합계가 뜨는 상태였다. 이제 화면에 걸린 조건과 같은 목록으로 계산한다. */
  const kpiRows = (typeof overviewFilteredRows === 'function') ? overviewFilteredRows() : overviewRows;
  const kpiFiltered = (typeof overviewFilterOn === 'function') && overviewFilterOn() && kpiRows.length !== overviewRows.length;
  if(!kpiRows.length){
    el.innerHTML = '<div style="padding:14px 4px;color:'+DC.mut+';font-size:13px;">조건에 맞는 업체가 없어요.</div>';
    return;
  }
  const totalCost = kpiRows.reduce((a,r)=>a+r.cost,0);
  const totalConv = kpiRows.reduce((a,r)=>a+r.conv,0);
  const dbCount = kpiRows.filter(r=>r.bizType==='DB').length;
  const b2cCount = kpiRows.filter(r=>r.bizType!=='DB').length;

  // 전월 대비 총합 변화율 — prevCost/prevConv가 있는(=지난달 데이터가 있는) 업체만 합산해서 비교.
  // 없는 업체까지 0으로 섞으면 왜곡되므로, 이번 달·지난 달 둘 다 있는 업체만 골라서 비교함.
  const withPrev = kpiRows.filter(r=>r.prevCost!==null);
  const prevTotalCost = withPrev.reduce((a,r)=>a+r.prevCost,0);
  const prevTotalConv = withPrev.reduce((a,r)=>a+r.prevConv,0);
  const costMom = momBadgeHTML(totalCost, prevTotalCost, 'down');
  const convMom = momBadgeHTML(totalConv, prevTotalConv, 'up');

  // 업종 유형별 평균 효율 — DB는 평균 CPA(낮을수록 좋음), B2C는 평균 ROAS(높을수록 좋음)
  const dbRows = kpiRows.filter(r=>r.bizType==='DB' && r.cpa>0);
  const b2cRows = kpiRows.filter(r=>r.bizType!=='DB' && r.cost>0);
  /* 예전엔 업체별 CPA를 그냥 평균냈는데, 그러면 월 100만원 쓰는 업체와 1억 쓰는 업체가 같은 무게를
     가져서 대표값이 안 됨. 총비용/총전환, 총매출/총비용으로 계산해야 전체를 대표하는 값이 됨
     (hourly.html은 이미 전환수·비용 가중으로 계산하고 있어 같은 기준으로 맞춤). */
  const dbCost = dbRows.reduce((a,r)=>a+(r.cost||0),0);
  const dbConv = dbRows.reduce((a,r)=>a+(r.conv||0),0);
  const b2cCost = b2cRows.reduce((a,r)=>a+(r.cost||0),0);
  const b2cRev  = b2cRows.reduce((a,r)=>a+(r.revenue||0),0);
  const avgCpa = dbConv > 0 ? (dbCost*10000/dbConv) : null;  // 비용이 만원 단위로 저장돼 있어 10000을 곱해야 '원'이 됨
  const avgRoas = b2cCost > 0 ? (b2cRev/b2cCost*100) : null;
  const effLines = [
    avgCpa!==null ? `DB 평균 CPA ${fmtNum(avgCpa)}원` : null,
    avgRoas!==null ? `B2C 평균 ROAS ${avgRoas.toFixed(0)}%` : null
  ].filter(Boolean);
  const effVal = effLines.length ? effLines.join('<br>') : '-';

  // 윗줄 = 전체가 얼마 쓰고 얼마 벌었나(결과), 아랫줄 = 업체 구성과 유형별 평균 효율(과정)
  const riskCount = (window.__overviewAlerts||[]).length;
  const riskClients = new Set((window.__overviewAlerts||[]).map(a=>a.key)).size;
  el.innerHTML = dcKpi2HTML(
    [ ['총 비용', dcWon(totalCost), dcDelta(totalCost, prevTotalCost||null, true), 1],
      ['총 전환', dcNum(totalConv)+'건', dcDelta(totalConv, prevTotalConv||null), 1],
      riskCount ? ['확인 필요', riskCount+'건',
        `<span style="font-size:12px;color:${DC.mut};margin-left:8px">${riskClients}개 업체</span>`, 1]
      : ['업체 수', kpiRows.length+'개', '', 1] ],
    [ ['업체 수', `${kpiRows.length}개`, `<span style="font-size:12px;color:${DC.mut};margin-left:8px">DB ${dbCount} · B2C ${b2cCount}${kpiFiltered?` · 전체 ${overviewRows.length}개 중`:''}</span>`],
      ['DB 평균 CPA', avgCpa!==null ? dcNum(avgCpa)+'원' : '-', dbRows.length?`<span style="font-size:12px;color:${DC.mut};margin-left:8px">${dbRows.length}개 업체</span>`:''],
      ['B2C 평균 ROAS', avgRoas!==null ? Math.round(avgRoas)+'%' : '-', b2cRows.length?`<span style="font-size:12px;color:${DC.mut};margin-left:8px">${b2cRows.length}개 업체</span>`:''] ]
  );
}

function isGoalMissed(r){
  if(!r.goal || !r.goal.target) return false;
  const isDB = r.bizType==='DB';
  const target = Number(r.goal.target);
  const curr = isDB ? r.cpa : r.roas;
  const met = isDB ? (curr>0 && curr<=target) : (curr>=target);
  return !met;
}
function goalLineHTML(r){
  const isDB = r.bizType==='DB';
  if(!r.goal || !r.goal.target){
    return `<div class="client-card-goal client-card-goal-empty" data-key="${r.key}" title="목표 KPI를 설정해보세요">🎯 목표 미설정 <span class="client-card-goal-edit">설정하기 ›</span></div>`;
  }
  const target = Number(r.goal.target);
  const curr = isDB ? r.cpa : r.roas;
  const met = isDB ? (curr>0 && curr<=target) : (curr>=target);
  const targetTxt = isDB ? `CPA ${fmtNum(target)}원 이하` : `ROAS ${target}% 이상`;
  // 목표 대비 진행률 막대 — index.html 개별 업체 화면의 목표 진행 바(renderGoalPanelHTML)와 같은 방식으로,
  // 전체 업체를 훑어보는 이 카드 목록에서도 숫자만이 아니라 시각적으로 한눈에 들어오게 함.
  // DB는 CPA가 낮을수록 좋아서 target/curr(역수), B2C는 ROAS가 높을수록 좋아서 curr/target로 비율 계산.
  const ratio = isDB ? (curr>0 && target>0 ? target/curr : 0) : (target>0 ? curr/target : 0);
  const pct = Math.round(Math.min(1, Math.max(0, ratio))*100);
  const barColor = met ? 'var(--up)' : 'var(--down)';
  return `<div class="client-card-goal ${met?'goal-met':'goal-miss'}" data-key="${r.key}" title="목표 수정하기" style="flex-direction:column;align-items:stretch;gap:6px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
      <span>🎯 목표 ${targetTxt} ${met?'· 달성 중':'· 미달'}</span>
      <span class="client-card-goal-edit">수정 ›</span>
    </div>
    <div style="height:5px;border-radius:3px;background:var(--panel-2);overflow:hidden;">
      <div style="height:100%;width:${pct}%;border-radius:3px;background:${barColor};"></div>
    </div>
  </div>`;
}

  const eff = r.bizType==='DB'

  const biz = r.bizType==='DB'

    : `<span class="m" style="font-size:11px;padding:1px 7px;border-radius:4px;background:#1b2c33;color:#6fd3e8">B2C</span>`;
  const alertCell = r.alertCount>0

        <button class="client-card-pin ${isPinned?'pinned':''}" data-key="${r.key}" type="button" title="${isPinned?'즐겨찾기 해제':'즐겨찾기에 추가'}" style="position:static;background:none;border:0;color:${isPinned?'#f5c542':DC.mut};font-size:14px;cursor:pointer;padding:0;line-height:1">${isPinned?'★':'☆'}</button>
        <span style="width:24px;height:24px;border-radius:7px;background:${r.color};color:${textColor};display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;flex-shrink:0">${initial}</span>

    ${dcTd(biz)}
    ${dcTd(dcWon(r.cost), 1)}
    ${r.bizType==='DB' ? '' : dcTd(dcWon(r.revenue), 1)}
    ${dcTd(dcNum(r.conv)+'건', 1)}
    ${dcTd(eff+trend, 1)}
    ${dcTd(dcSpark(r.dailyCost)||`<span style="color:${DC.mut}">—</span>`, 1)}

}
function overviewTableHTML(rows, bestKeys, worstKeys, pinnedSet, isDB){
  const head = dcTh('업체')+dcTh('유형')+dcTh('비용',1)+(isDB?'':dcTh('전환매출',1))+dcTh('전환',1)
             + dcTh(isDB?'CPA':'ROAS',1)+dcTh('최근 비용 추이',1)+dcTh('확인',1);
  return dcTable(head, rows.map(r=>overviewRowHTML(r,bestKeys,worstKeys,pinnedSet)).join(''));
}
function overviewCardHTML(r, bestKeys, worstKeys, pinnedSet){
  const initial = (r.name||'?').trim().charAt(0);
  const textColor = contrastText(r.color||'#8b7cff');
  const badge = bestKeys.has(r.key) ? '<span class="client-card-badge" title="이번 기간 가장 효율적">🏆</span>'
    : worstKeys.has(r.key) ? '<span class="client-card-badge" title="점검이 필요해요">⚠️</span>' : '';
  // 알림 배지 — 알림 벨을 직접 열어봐야 알 수 있던 "이 업체에 문제가 있는지"를 카드에서 바로 보이게 함.
  const alertBadge = r.alertCount>0 ? `<span class="client-card-alert-badge" title="확인 필요한 알림 ${r.alertCount}건">🔔 ${r.alertCount}</span>` : '';
  const trendHtml = r.trend ? `<span class="client-card-trend ${r.trend.good?'up':'down'}">${r.trend.dir==='up'?'▲':'▼'}</span>` : '';
  const isPinned = pinnedSet && pinnedSet.has(r.key);
  const pinHtml = `<button class="client-card-pin ${isPinned?'pinned':''}" data-key="${r.key}" type="button" title="${isPinned?'즐겨찾기 해제':'즐겨찾기에 추가'}">${isPinned?'★':'☆'}</button>`;
  const sparkHtml = r.dailyCost && r.dailyCost.length>=2 ? `<div class="client-card-spark">${sparklineHTML(r.dailyCost, r.color||'var(--accent)')}<span class="client-card-spark-lbl">최근 비용 추이</span></div>` : '';
  return `
    <div class="client-card" data-key="${r.key}">
      ${pinHtml}
      ${badge}
      ${alertBadge}
      <div class="client-card-head">
        <div class="client-card-icon" style="background:${r.color};color:${textColor};">${initial}</div>
        <div>
          <div class="client-card-name">${r.name}</div>
          <span class="client-card-biz">${r.bizType==='DB'?'DB · 상담/전환':'B2C · 매출/ROAS'} · ${r.industry}</span>
          <div class="client-card-period">${r.periodLabel} 기준</div>
        </div>
      </div>
      <div class="client-card-metrics">
        <div class="client-card-metric"><div class="m">비용</div><div class="v">${fmtMan(r.cost)}원</div></div>
        <div class="client-card-metric"><div class="m">전환수</div><div class="v">${fmtNum(r.conv)}건</div></div>
        <div class="client-card-metric"><div class="m">${r.bizType==='DB'?'CPA':'ROAS'}</div><div class="v">${r.bizType==='DB' ? fmtNum(r.cpa)+'원' : r.roas.toFixed(0)+'%'}${trendHtml}</div></div>
        ${r.bizType==='DB' ? '' : `<div class="client-card-metric"><div class="m">전환매출</div><div class="v">${fmtMan(r.revenue)}원</div></div>`}
      </div>
      ${sparkHtml}
      ${goalLineHTML(r)}
    </div>`;
}
function renderOneSection(containerEl, rows, sectionRows, sectionLabel){
  // sectionRows: 이 섹션(DB 또는 B2C) 전체(필터 적용 전)를 기준으로 순위(🏆/⚠️) 계산 — 다른 업종 유형과
  // 섞이지 않도록 항상 같은 bizType 안에서만 비교함(완전 분리).
  const isDB = sectionRows.length ? sectionRows[0].bizType==='DB' : null;
  let ranked;
  if(isDB){
    ranked = sectionRows.filter(r=>r.cpa>0).sort((a,b)=>a.cpa-b.cpa);
  } else {
    ranked = sectionRows.filter(r=>r.cost>0).sort((a,b)=>b.roas-a.roas);
  }
  const bestKeys = new Set(), worstKeys = new Set();
  if(ranked.length>=2){ bestKeys.add(ranked[0].key); worstKeys.add(ranked[ranked.length-1].key); }
  const pinnedSet = getPinned();

  if(!rows.length){
    containerEl.innerHTML = `
      <div class="overview-section-title">${sectionLabel} <span style="font-weight:400;color:var(--muted);">(0개)</span></div>
      <div class="empty-state"><div style="font-size:28px;">🔎</div><div>조건에 맞는 업체가 없어요.</div></div>`;
    return;
  }

  let bodyHtml;
  if(overviewGroupByIndustry){
    const groups = {};
    rows.forEach(r=>{ if(!groups[r.industry]) groups[r.industry]=[]; groups[r.industry].push(r); });
    const industryNames = Object.keys(groups).sort((a,b)=>a.localeCompare(b,'ko'));
    bodyHtml = industryNames.map(ind=>`
      <div style="font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 8px;">${ind} <span style="font-weight:400;">(${groups[ind].length}개)</span></div>
      ${overviewTableHTML(groups[ind], bestKeys, worstKeys, pinnedSet, isDB)}
    `).join('');
  } else {
    bodyHtml = overviewTableHTML(rows, bestKeys, worstKeys, pinnedSet, isDB);
  }

  containerEl.innerHTML = `
    <div class="overview-section-title">${sectionLabel} <span style="font-weight:400;color:var(--muted);">(${rows.length}개)</span></div>
    ${bodyHtml}`;

  containerEl.querySelectorAll('.client-card, .ov-row').forEach(el=>{
    el.onclick = (ev)=>{
      if(ev.target.closest('.client-card-goal') || ev.target.closest('.client-card-pin')) return; // 목표 설정/즐겨찾기 클릭은 아래에서 별도 처리
      localStorage.setItem('ad_dashboard_active_client', el.dataset.key);
      window.location.href = 'index.html';
    };
  });
  containerEl.querySelectorAll('.client-card-goal').forEach(el=>{
    el.onclick = (ev)=>{
      ev.stopPropagation();
      localStorage.setItem('ad_dashboard_goal_target_client', el.dataset.key);
      window.location.href = 'input.html#goal';
    };
  });
  containerEl.querySelectorAll('.client-card-pin').forEach(el=>{
    el.onclick = (ev)=>{
      ev.stopPropagation();
      togglePinned(el.dataset.key);
      renderOverviewGrid(); // 즐겨찾기 상태·정렬(핀 우선)이 바로 반영되도록 전체 다시 렌더
    };
  });
}

/* 화면에 걸린 조건(업종·검색어·목표미달·즐겨찾기·DB/B2C 탭)을 적용한 업체 목록.
   예전엔 이 필터가 그리드 안에만 있어서, 위쪽 KPI와 엑셀 내려받기는 필터를 무시하고
   전체 업체를 그대로 썼다 — 3개만 걸러놓고 받아도 파일엔 80개가 나오던 문제.
   이제 한 곳에서 만들어 그리드·KPI·엑셀이 모두 같은 목록을 쓴다. */
function overviewFilteredRows(){
  const el = document.getElementById('overviewSearch');
  const term = el ? el.value.trim().toLowerCase() : '';
  const pinnedSet = getPinned();
  let rows = overviewRows.slice();
  if(overviewIndustryFilter!=='ALL') rows = rows.filter(r=> r.industry===overviewIndustryFilter);
  if(term) rows = rows.filter(r=> r.name.toLowerCase().includes(term));
  if(overviewGoalMissOnly) rows = rows.filter(r=> isGoalMissed(r));
  if(overviewPinnedOnly) rows = rows.filter(r=> pinnedSet.has(r.key));
  if(overviewBizFilter==='DB')  rows = rows.filter(r=> r.bizType==='DB');
  if(overviewBizFilter==='B2C') rows = rows.filter(r=> r.bizType!=='DB');
  return rows;
}
// 조건이 하나라도 걸려 있는지 — KPI 옆에 "조건 적용됨"을 알려주기 위해 씀.
function overviewFilterOn(){
  const el = document.getElementById('overviewSearch');
  const term = el ? el.value.trim() : '';
  return overviewIndustryFilter!=='ALL' || !!term || overviewGoalMissOnly
      || overviewPinnedOnly || overviewBizFilter!=='ALL';
}

function renderOverviewGrid(){
  const gridDB = document.getElementById('overviewGrid');
  const gridB2C = document.getElementById('overviewGridB2C');
  const term = document.getElementById('overviewSearch').value.trim().toLowerCase();
  const pinnedSet = getPinned();
  let rows = overviewRows.slice();
  if(overviewIndustryFilter!=='ALL') rows = rows.filter(r=> r.industry===overviewIndustryFilter);
  if(term) rows = rows.filter(r=> r.name.toLowerCase().includes(term));
  if(overviewGoalMissOnly) rows = rows.filter(r=> isGoalMissed(r));
  if(overviewPinnedOnly) rows = rows.filter(r=> pinnedSet.has(r.key));
  renderStatRow(); // 조건이 바뀌면 위쪽 KPI도 같이 다시 계산한다.

  const sortFn = (a,b)=>{
    // 즐겨찾기한 업체는 어떤 정렬 기준을 골라도 항상 그 안에서 맨 위로 고정됨.
    const aPinned = pinnedSet.has(a.key), bPinned = pinnedSet.has(b.key);
    if(aPinned!==bPinned) return aPinned ? -1 : 1;
    if(overviewSortMode==='efficiency'){
      if(a.bizType==='DB'){ const av=a.cpa>0?a.cpa:Infinity, bv=b.cpa>0?b.cpa:Infinity; return av-bv; }
      return b.roas-a.roas;
    } else if(overviewSortMode==='cost_desc'){
      return b.cost-a.cost;
    } else if(overviewSortMode==='cost_asc'){
      return a.cost-b.cost;
    } else if(overviewSortMode==='name'){
      return a.name.localeCompare(b.name,'ko');
    }
    return 0;
  };

  // DB와 B2C를 하나의 그리드로 섞지 않고, 항상 완전히 분리된 두 개의 섹션으로 렌더링함.
  // 전체/DB/B2C 탭은 이제 "섞어서 보여주는 필터"가 아니라 "어떤 섹션을 보여줄지"만 결정함.
  const showDB = overviewBizFilter==='ALL' || overviewBizFilter==='DB';
  const showB2C = overviewBizFilter==='ALL' || overviewBizFilter==='B2C';

  const dbAll = overviewRows.filter(r=>r.bizType==='DB');
  const b2cAll = overviewRows.filter(r=>r.bizType!=='DB');
  const dbRows = rows.filter(r=>r.bizType==='DB').sort(sortFn);
  const b2cRows = rows.filter(r=>r.bizType!=='DB').sort(sortFn);

  if(showDB){
    gridDB.style.display = '';
    renderOneSection(gridDB, dbRows, dbAll, '📋 DB 업체 (상담·전환)');
  } else {
    gridDB.style.display = 'none';
    gridDB.innerHTML = '';
  }
  if(showB2C){
    gridB2C.style.display = '';
    renderOneSection(gridB2C, b2cRows, b2cAll, '🛒 B2C 업체 (매출·ROAS)');
  } else {
    gridB2C.style.display = 'none';
    gridB2C.innerHTML = '';
  }
}

// \uae30\uac04 \u2039 \u203a \ud654\uc0b4\ud45c \u2014 \uc9c0\uae08 \ubcf4\ub294 \uae30\uac04\uc758 \uae38\uc774(\uba87 \uac1c\uc6d4\uc778\uc9c0)\ub97c \uadf8\ub300\ub85c \uc720\uc9c0\ud55c \ucc44 \uc55e/\ub4a4\ub85c \uc774\ub3d9.
// '\ucd5c\uadfc \uae30\uac04(\uc790\ub3d9)' \uc0c1\ud0dc\uc5d0\uc11c \u2039 \ub97c \ub204\ub974\uba74 \uac00\uc7a5 \ucd5c\uadfc \ub2ec\uc744 \uae30\uc900\uc73c\ub85c \ud55c \ub2ec \uc804\uc73c\ub85c \uac04\ub2e4.
function overviewMonthOptions(){
  const sel = document.getElementById('overviewRangeStartSelect');
  return [].slice.call(sel.options).map(o=>o.value).filter(v=>v!=='LATEST');
}
function overviewLatestLabel(){
  const opts = overviewMonthOptions();
  return opts.length ? opts[opts.length-1] : null;
}
async function shiftOverviewPeriod(dir){
  const opts = overviewMonthOptions();
  if(!opts.length) return;
  const latest = overviewLatestLabel();
  let s = overviewRangeState.start === 'LATEST' ? latest : overviewRangeState.start;
  let e = overviewRangeState.end   === 'LATEST' ? latest : overviewRangeState.end;
  let si = opts.indexOf(s), ei = opts.indexOf(e);
  if(si < 0) si = opts.length-1;
  if(ei < 0) ei = opts.length-1;
  // \uc2dc\uc791\u00b7\uc885\ub8cc\ub97c \uac19\uc740 \uce78\uc218\ub9cc\ud07c \uc62e\uae30\ubbc0\ub85c \uae30\uac04 \uae38\uc774\ub294 \uc790\uc5f0\ud788 \uc720\uc9c0\ub428
  let nsi = si + dir, nei = ei + dir;
  if(nsi < 0 || nei > opts.length-1) return;
  overviewRangeState.start = opts[nsi];
  overviewRangeState.end   = opts[nei];
  document.getElementById('overviewRangeStartSelect').value = overviewRangeState.start;
  document.getElementById('overviewRangeEndSelect').value   = overviewRangeState.end;
  const grid = document.getElementById('overviewGrid');
  grid.innerHTML = `<div class="empty-state">\ubd88\ub7ec\uc624\ub294 \uc911...</div>`;
  await applySelectedMonth();
}
function syncPeriodArrows(){
  const opts = overviewMonthOptions();
  const prevBtn = document.getElementById('overviewPeriodPrev');
  const nextBtn = document.getElementById('overviewPeriodNext');
  if(!prevBtn || !nextBtn || !opts.length) return;
  const latest = overviewLatestLabel();
  const s = overviewRangeState.start === 'LATEST' ? latest : overviewRangeState.start;
  const e = overviewRangeState.end   === 'LATEST' ? latest : overviewRangeState.end;
  let si = opts.indexOf(s), ei = opts.indexOf(e);
  if(si < 0) si = opts.length-1;
  if(ei < 0) ei = opts.length-1;
  prevBtn.disabled = (si <= 0);
  nextBtn.disabled = (ei >= opts.length-1);
}
document.getElementById('overviewPeriodPrev').onclick = ()=> shiftOverviewPeriod(-1);
document.getElementById('overviewPeriodNext').onclick = ()=> shiftOverviewPeriod(1);
// \u300c\uc804\uccb4\u300d \u2014 \uac00\uc7a5 \uacfc\uac70 \ub2ec\ubd80\ud130 \ucd5c\uc2e0 \ub2ec\uae4c\uc9c0 \ub204\uc801\ud574\uc11c \ubcf4\uae30 (\ub2e4\ub978 \ud398\uc774\uc9c0 \ub3d9\uc791\uacfc \ub3d9\uc77c)

// 눌렀다/뗐다 하는 토글형 필터 버튼 공통 처리 — 업종별 묶기 외에 목표 미달만/즐겨찾기만 필터도 같은 방식으로 동작함.
function setupToggleBtn(id, getVal, setVal, onLabel, offLabel){
  const btn = document.getElementById(id);
  btn.onclick = ()=>{
    const next = !getVal();
    setVal(next);
    btn.dataset.active = next ? '1' : '0';
    btn.style.borderColor = next ? 'var(--accent)' : '';
    btn.style.color = next ? 'var(--accent)' : '';
    btn.style.background = next ? 'rgba(139,124,255,.12)' : '';
    btn.textContent = next ? onLabel : offLabel;
    renderOverviewGrid();
  };
}

      : `<span style="color:var(--muted);">전체 공개</span>`;
    const emailsHtml = restricted
      ? `<div style="font-size:12px;color:var(--muted);margin-top:3px;">${r.allowedUsers.map(e=>e.replace(/</g,'&lt;')).join(', ')}</div>`
      : '';
    return `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border);">
        <div style="min-width:120px;font-size:14px;font-weight:600;">${r.name}</div>

          <div style="font-size:14px;">${statusHtml}</div>

  panel.innerHTML = `
    <div class="panel">
      <div class="panel-title">🔐 업체별 접근 권한 현황 <span style="font-weight:400;color:var(--muted);font-size:12px;">(관리자 전용 · 전체 공개 ${rows.length-restrictedCount}개 · 제한 ${restrictedCount}개)</span></div>
      <div>${rowsHtml}</div>
    </div>`;
}

document.getElementById('exportAllExcelBtn').onclick = ()=>{
  if(!overviewRows.length) return;
  /* 화면에 걸린 조건(업종·검색어·목표미달·즐겨찾기·DB/B2C 탭)을 그대로 적용해서 내보낸다.
     예전엔 overviewRows(전체)를 썼기 때문에, 3개만 걸러놓고 받아도 파일엔 80개가 들어갔다. */
  const expRows = overviewFilteredRows();
  if(!expRows.length){ alert('조건에 맞는 업체가 없어요. 조건을 풀고 다시 시도해 주세요.'); return; }
  const header = ['업체명','업종','업종 유형','기간','비용(원)','전환수(건)','전환매출(원)','ROAS(%)','CPA(원)'];
  const body = expRows.map(r=>[
    r.name, r.industry, r.bizType==='DB'?'DB(상담·전환)':'B2C(매출·ROAS)', r.periodLabel,
    Math.round(r.cost*10000), r.conv, r.bizType==='DB' ? '' : Math.round(r.revenue*10000),
    r.bizType==='DB' ? '' : Number(r.roas.toFixed(1)),
    r.bizType==='DB' ? Math.round(r.cpa) : ''
  ]);
  // 어떤 조건으로 뽑았는지 파일 안에 남겨둔다 — 나중에 파일만 봐도 알 수 있게.
  const condParts = [];
  if(overviewBizFilter!=='ALL') condParts.push('유형 ' + overviewBizFilter);
  if(overviewIndustryFilter!=='ALL') condParts.push('업종 ' + overviewIndustryFilter);
  const sEl = document.getElementById('overviewSearch');
  if(sEl && sEl.value.trim()) condParts.push('검색어 "' + sEl.value.trim() + '"');
  if(overviewGoalMissOnly) condParts.push('목표 미달만');
  if(overviewPinnedOnly) condParts.push('즐겨찾기만');
  const meta = [
    ['전체 업체 요약'],
    ['조건', condParts.length ? condParts.join(' / ') : '조건 없음 (전체)'],
    ['업체 수', expRows.length + '개' + (expRows.length!==overviewRows.length ? ' (전체 ' + overviewRows.length + '개 중)' : '')],
    []
  ];
  const ws = XLSX.utils.aoa_to_sheet([...meta, header, ...body]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '전체업체요약');
  XLSX.writeFile(wb, `전체업체요약_${new Date().toISOString().slice(0,10)}.xlsx`);
};

/* ---------- 이상 징후 알림(벨) ---------- */
// index.html과 동일한 로직 — 전체 업체를 훑어서 CPA 급등/ROAS 급락/전환 0건 캠페인/예산 소진 임박을 감지.
const ALERT_SEEN_KEY = 'ad_dashboard_seen_alerts';
const ALERT_CPA_SPIKE_PCT = 20;
const ALERT_ROAS_DROP_PCT = 10;
// 예산 규모별 알림 민감도 배율 — 작은 계정(월 비용 50만원 미만)은 CPA/ROAS가 표본이 적어 원래 변동폭이
// 크기 때문에 기준을 완화(둔감하게)하고, 큰 계정(300만원 이상)은 같은 %변화라도 실제 손실 금액이 커서
// 기준을 강화(민감하게)함. costMan은 last(가장 최근 달) 비용, 단위 만원.
function alertSensitivityMult(costMan){
  if(costMan < 50) return 1.5;   // 소액 계정: 기준을 1.5배 완화 (예: CPA 20% → 30%)
  if(costMan >= 300) return 0.75; // 대형 계정: 기준을 0.75배 강화 (예: CPA 20% → 15%)
  return 1;
}
function getSeenAlertIds(){
  try{ return new Set(JSON.parse(localStorage.getItem(ALERT_SEEN_KEY)||'[]')); }catch(e){ return new Set(); }
}
function markAlertsSeen(ids){
  try{
    const seen = getSeenAlertIds();
    ids.forEach(id=>seen.add(id));
    const arr = [...seen].slice(-500);
    localStorage.setItem(ALERT_SEEN_KEY, JSON.stringify(arr));
  }catch(e){ console.error(e); }
}
/* preloaded: [{key, data}] — 이미 받아둔 업체 문서가 있으면 그걸 그대로 씀.
   loadOverview()가 전 업체를 가져오는데 같은 Promise.all 안에서 computeAlerts()가 또 전부 가져와서
   업체 7개면 읽기가 14회였음. 넘겨주면 7회로 줄어듦. 알림 벨에서 단독 호출할 땐 인자 없이 부르면
   예전처럼 직접 조회함. */
async function computeAlerts(preloaded){
  const preMap = new Map((preloaded||[]).filter(Boolean).map(r=>[r.key, r.data]));
  const keys = preMap.size ? [...preMap.keys()] : await listClients();
  const todayDate = new Date();
  const todayStr = todayDate.toISOString().slice(0,10);
  // 클라이언트별 조회·판정을 Promise.all로 동시에 실행 — 순차 for-loop는 클라이언트 수만큼 왕복시간이
  // 그대로 누적되는데, 알림 벨은 페이지 열 때마다/드롭다운 열 때마다 매번 다시 계산돼서 체감 영향이 큼.
  const perClientResults = await Promise.all(keys.map(async key=>{
    const alerts = [];
    let data = preMap.get(key);
    if(!data){ try{ data = await getClient(key); }catch(e){ return alerts; } }
    if(!data || !data.months || !data.months.length) return alerts;
    const months = data.months;
    const last = months[months.length-1];
    const prev = months.length>=2 ? months[months.length-2] : null;
    const isDB = data.bizType==='DB';
    const name = data.name;
    const sensMult = alertSensitivityMult(last.cost||0);
    if(prev){
      if(isDB){
        const prevCpa = prev.conv>0 ? (prev.cost*10000/prev.conv) : null;
        const currCpa = last.conv>0 ? (last.cost*10000/last.conv) : null;
        if(prevCpa && currCpa && last.conv>=5 && prev.conv>=5){
          const diff = (currCpa-prevCpa)/prevCpa*100;
          const threshold = ALERT_CPA_SPIKE_PCT*sensMult;
          if(diff>=threshold){
            alerts.push({ id:`${key}:cpa-spike:${last.label}`, key, name, icon:'📈', text:`CPA가 직전 기간 대비 ${diff.toFixed(0)}% 상승했어요 (${Math.round(prevCpa).toLocaleString('ko-KR')}원 → ${Math.round(currCpa).toLocaleString('ko-KR')}원)` });
          }
        }
      } else {
        const prevRoas = prev.cost>0 ? (prev.revenue/prev.cost*100) : null;
        const currRoas = last.cost>0 ? (last.revenue/last.cost*100) : null;
        if(prevRoas!==null && currRoas!==null && last.cost>=5 && prev.cost>=5){
          const diff = prevRoas-currRoas;
          const threshold = ALERT_ROAS_DROP_PCT*sensMult;
          if(diff>=threshold){
            alerts.push({ id:`${key}:roas-drop:${last.label}`, key, name, icon:'📉', text:`ROAS가 직전 기간 대비 ${diff.toFixed(0)}%p 하락했어요 (${prevRoas.toFixed(0)}% → ${currRoas.toFixed(0)}%)` });
          }
        }
      }
    }
    // 목표(goal) 대비 직접 비교 — "직전 기간보다 나빠졌는지"와는 별개로, 애초에 계약/설정해둔 목표치를
    // 못 맞추고 있으면 그 자체로도 알림. index.html의 goalBadge(🎯)와 같은 goal 필드를 재사용.
    if(data.goal && data.goal.target){
      const target = Number(data.goal.target);
      if(target>0){
        if(isDB && data.goal.metric==='cpa' && last.conv>=5){
          const currCpa = last.conv>0 ? (last.cost*10000/last.conv) : null;
          if(currCpa!==null && currCpa > target*1.1){
            const overPct = ((currCpa-target)/target*100);
            alerts.push({ id:`${key}:goal-miss-cpa:${last.label}`, key, name, icon:'🎯', text:`CPA가 목표(${Math.round(target).toLocaleString('ko-KR')}원)보다 ${overPct.toFixed(0)}% 높아요 (현재 ${Math.round(currCpa).toLocaleString('ko-KR')}원)` });
          }
        } else if(!isDB && data.goal.metric==='roas' && last.cost>=5){
          const currRoas = last.cost>0 ? (last.revenue/last.cost*100) : null;
          if(currRoas!==null && currRoas < target*0.9){
            const underPct = ((target-currRoas)/target*100);
            alerts.push({ id:`${key}:goal-miss-roas:${last.label}`, key, name, icon:'🎯', text:`ROAS가 목표(${target}%)보다 ${underPct.toFixed(0)}% 낮아요 (현재 ${currRoas.toFixed(0)}%)` });
          }
        }
      }
    }
    if(last.campaigns && last.campaigns.length){
      const zeroConv = last.campaigns.filter(c=>(c.cost||0)>=1 && (c.conv||0)===0);
      if(zeroConv.length){
        const totalWaste = zeroConv.reduce((s,c)=>s+c.cost,0);
        alerts.push({ id:`${key}:zero-conv:${last.label}`, key, name, icon:'🚫', text:`전환 0건인 캠페인이 ${zeroConv.length}개 있어요 (합계 비용 ${fmtWon(totalWaste)}원)` });
      }
    }
    // 평균노출순위(avgRank, 숫자가 작을수록 상위) 급락 — index.html의 computeAlerts와 동일 로직(알림은
    // 두 페이지에서 같은 결과를 내야 해서 항상 같이 수정함). 노출수가 일정 이상인 캠페인만 비교(표본 부족 방지).
    if(prev && last.campaigns && prev.campaigns && last.campaigns.length){
      const prevRankMap = {};
      prev.campaigns.forEach(c=>{ if(c.avgRank!==null && c.avgRank!==undefined && (c.impressions||0)>=50) prevRankMap[c.campaign]=c.avgRank; });
      const rankDrops = [];
      last.campaigns.forEach(c=>{
        if(c.avgRank===null || c.avgRank===undefined || (c.impressions||0)<50) return;
        const pr = prevRankMap[c.campaign];
        if(pr===undefined) return;
        const diff = c.avgRank - pr;
        if(diff>=1){ rankDrops.push({ campaign:c.campaign, prevRank:pr, currRank:c.avgRank, diff }); }
      });
      if(rankDrops.length){
        rankDrops.sort((a,b)=>b.diff-a.diff);
        const top = rankDrops[0];
        alerts.push({ id:`${key}:rank-drop:${last.label}`, key, name, icon:'📊', text:`'${top.campaign}' 평균노출순위가 ${top.prevRank.toFixed(1)}위 → ${top.currRank.toFixed(1)}위로 떨어졌어요${rankDrops.length>1?` (외 ${rankDrops.length-1}개 캠페인도 순위 하락)`:''}` });
      }
    }
    if(data.goal && data.goal.budgetTarget && last.daily && last.daily.length>=3){
      const lm = last.label.match(/(\d{4})\D*(\d{1,2})/);
      if(lm && parseInt(lm[1],10)===todayDate.getFullYear() && parseInt(lm[2],10)===(todayDate.getMonth()+1)){
        const daysElapsed = last.daily.length;
        const daysInMonth = new Date(todayDate.getFullYear(), todayDate.getMonth()+1, 0).getDate();
        if(daysElapsed<daysInMonth){
          const avgDailyCost = last.cost/daysElapsed;
          const projectedCost = avgDailyCost*daysInMonth;
          const budgetTargetMan = data.goal.budgetTarget/10000;
          if(budgetTargetMan>0 && projectedCost/budgetTargetMan>=1.05){
            const exhaustDay = Math.min(daysInMonth, Math.ceil(budgetTargetMan/avgDailyCost));
            alerts.push({ id:`${key}:budget-pace:${todayStr}`, key, name, icon:'💸', text:`이 페이스면 예산이 ${exhaustDay}일쯤 소진될 것으로 보여요 (목표 ${fmtMan(budgetTargetMan)}원)` });
          }
        }
      }
    }
    return alerts;
  }));
  return perClientResults.flat();
}
async function loadAlerts(){
  const badge = document.getElementById('alertBellBadge');
  const dropdown = document.getElementById('alertBellDropdown');
  if(!badge || !dropdown) return;
  let alerts = [];
  try{ alerts = await computeAlerts(); }catch(e){ console.error(e); }
  window.__alerts = alerts;
  const seen = getSeenAlertIds();
  const unread = alerts.filter(a=>!seen.has(a.id));
  if(unread.length){ badge.textContent = unread.length>99?'99+':String(unread.length); badge.style.display = 'block'; }
  else badge.style.display = 'none';
  if(!alerts.length){
    dropdown.innerHTML = `<div style="padding:20px 10px;text-align:center;color:var(--muted);font-size:12px;">🔔 이상 징후가 없어요.</div>`;
    return;
  }
  dropdown.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 6px 10px;border-bottom:1px solid var(--border);margin-bottom:6px;">
      <span style="font-size:12px;font-weight:700;color:var(--text);">이상 징후 알림 (${alerts.length})</span>
      <button id="alertMarkAllReadBtn" style="background:none;border:none;color:var(--accent-text,var(--accent));font-size:12px;cursor:pointer;">모두 읽음</button>
    </div>
    ${alerts.map(a=>{
      const isUnread = !seen.has(a.id);
      return `<div class="alert-item" data-key="${a.key}" data-id="${a.id.replace(/"/g,'&quot;')}" style="display:flex;gap:8px;padding:9px 6px;border-radius:8px;cursor:pointer;${isUnread?'background:rgba(139,124,255,.08);':''}">
        <span style="font-size:14px;flex-shrink:0;">${a.icon}</span>
        <div style="min-width:0;">
          <div style="font-size:12px;font-weight:700;color:var(--text);">${a.name}${isUnread?' <span style="color:var(--accent-text,var(--accent));">●</span>':''}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4;">${a.text}</div>
        </div>
      </div>`;
    }).join('')}
  `;
  dropdown.querySelectorAll('.alert-item').forEach(el=>{
    el.onclick = ()=>{
      markAlertsSeen([el.dataset.id]);
      localStorage.setItem('ad_dashboard_active_client', el.dataset.key);
      window.location.href = 'index.html';
    };
  });
  const markAllBtn = document.getElementById('alertMarkAllReadBtn');
  if(markAllBtn) markAllBtn.onclick = (e)=>{
    e.stopPropagation();
    markAlertsSeen(alerts.map(a=>a.id));
    loadAlerts();
  };
}
document.getElementById('alertBellBtn').onclick = (e)=>{
  e.stopPropagation();
  const dropdown = document.getElementById('alertBellDropdown');
  const willOpen = dropdown.style.display==='none';
  dropdown.style.display = willOpen ? 'block' : 'none';
  if(willOpen) loadAlerts();
};
document.addEventListener('click', (e)=>{
  const bell = document.getElementById('alertBell');
  if(bell && !bell.contains(e.target)) document.getElementById('alertBellDropdown').style.display = 'none';
});

auth.onAuthStateChanged(async (user)=>{
  if(user){
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    document.getElementById('authUserEmail').textContent = user.email;
    currentUserEmail = user.email;
    isAdminUser = await checkIsAdmin(user.email);
    const inputLink = document.querySelector('a[href="input.html"]');
    if(inputLink) inputLink.style.display = isAdminUser ? '' : 'none';
    await loadOverview();
    loadAlerts();
  } else {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
  }
});
