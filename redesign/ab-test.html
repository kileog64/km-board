<script>
/* ── 업체 색(accent)이 업체마다 달라서 글씨 대비가 들쭉날쭉해지는 걸 막는 보정기 ──
   --accent        : 업체 색 그대로 (선·아이콘·그래프용)
   --accent-text   : 어두운 배경 위에서 읽히도록 밝기를 올린 글씨용 색
   --accent-solid  : 흰 글씨를 얹어도 읽히도록 밝기를 낮춘 채움 배경용 색
   두 값 모두 대비 4.5:1을 넘을 때까지 자동으로 조정한다. */
function applyAccentColor(hex){
  const root = document.documentElement.style;
  root.setProperty('--accent', hex);
  const H = String(hex||'').trim().replace('#','');
  if(H.length !== 6){ return; }
  const toRgb = h => [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));
  const toHex = a => '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  const lum = ([r,g,b]) => { const f=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)};
    return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b); };
  const ratio = (a,b)=>{ const l1=lum(a),l2=lum(b),hi=Math.max(l1,l2),lo=Math.min(l1,l2); return (hi+0.05)/(lo+0.05); };
  const base = toRgb(H);
  const PANEL=[23,26,39], WHITE=[255,255,255];
  let text = base.slice();
  for(let i=0;i<24 && ratio(text,PANEL)<4.5;i++) text = text.map(v=>v+(255-v)*0.10);
  let solid = base.slice();
  for(let i=0;i<24 && ratio(solid,WHITE)<4.5;i++) solid = solid.map(v=>v*0.92);
  root.setProperty('--accent-text', toHex(text));
  root.setProperty('--accent-solid', toHex(solid));
}

<style>

  .file-drop input[type=file]{font-size:12px;color:var(--muted);width:100%;}
  .file-drop .status{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5;}
  .file-drop .status.ok{color:var(--up);}
  .file-drop .status.err{color:var(--down);}

  .status-msg.ok{color:var(--up);}

  .client-switcher-empty{padding:14px;color:var(--muted);font-size:12px;text-align:center;}
  .ai-chat-toggle{position:fixed;bottom:24px;right:24px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a89aff);border:none;font-size:28px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:100;}

  .ai-chat-icon-btn{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:2px;}
  .ai-chat-setup{padding:16px;display:none;}
  .ai-chat-setup.show{display:block;}
  .ai-chat-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-height:320px;}
  .ai-chat-msg{font-size:14px;line-height:1.65;padding:11px 14px;border-radius:10px;max-width:90%;white-space:pre-wrap;}
  .ai-chat-msg.user{align-self:flex-end;background:var(--accent-solid);color:#fff;}
  .ai-chat-msg.assistant{align-self:flex-start;background:var(--panel);color:var(--text);}
  .ai-chat-msg.system{align-self:center;color:var(--muted);font-size:12px;text-align:center;}
  .ai-chat-input-row{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border);}
  .ai-chat-input-row textarea{flex:1;resize:none;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--text);font-size:14px;font-family:'Pretendard',sans-serif;max-height:140px;min-height:44px;}
  .ai-chat-input-row button{background:var(--accent-solid);color:#fff;border:none;border-radius:8px;padding:0 14px;font-size:14px;font-weight:600;cursor:pointer;}
  @media (max-width:640px){
    .ai-chat-panel{right:10px;left:10px;width:auto;bottom:84px;}
    .ai-chat-toggle{right:16px;bottom:16px;}
  }

  .main-layout{display:grid;grid-template-columns:1fr 250px;gap:20px;align-items:start;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px 28px;min-height:400px;}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:360px;color:var(--muted);font-size:14px;text-align:center;gap:10px;line-height:1.6;}
  header.rep{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:14px;}

/* 표 숫자 칸은 줄바꿈 금지 — '92,539,282' 뒤에 '원'만 다음 줄로 떨어지는 문제 방지.
   첫 칸(키워드·상품명 등)만 두 줄 허용하고, 표가 넓어지면 카드 안에서 가로로 스크롤된다. */

<script>
let activeSlug = null;
const filterState = {};
const monthRangeState = {}; // key -> { start: label, end: label } — campaigns/keywords.html과 동일한 시작~종료 임의 구간 패턴
const compareMonthState = {};
function ensureMonthRange(key, allMonths){
  if(!allMonths.length) return;
  const cur = monthRangeState[key];
  const has = l => allMonths.some(m=>m.label===l);
  if(!cur || !has(cur.start) || !has(cur.end)){
    monthRangeState[key] = { start: allMonths[0].label, end: allMonths[allMonths.length-1].label };
  }
}
function monthsInRange(allMonths, range){
  const si = allMonths.findIndex(m=>m.label===range.start);
  const ei = allMonths.findIndex(m=>m.label===range.end);
  if(si<0 || ei<0) return allMonths;
  const lo = Math.min(si,ei), hi = Math.max(si,ei);
  return allMonths.slice(lo, hi+1);
}
const dayCompareCampaigns = {};
const dayCompareMetric = {};
function slugify(name){ return name.trim().replace(/[\s\/\\'"]+/g,'_'); }
const CAMPAIGN_TYPE_LABELS = { WEB_SITE:'파워링크', SHOPPING:'쇼핑검색', POWER_CONTENTS:'파워컨텐츠', BRAND_SEARCH:'브랜드검색광고', PLACE:'플레이스', PLACE_TP:'플레이스', CATEGORY_EDIT:'세부업종', CAMPAIGN_TYPE_UNKNOWN:'기타' };
function campaignTypeLabel(t){ return CAMPAIGN_TYPE_LABELS[t] || t; }
function fmtWon(man){ return Math.round(man*10000).toLocaleString('ko-KR'); }
function fmtMan(man){ return man>=10000 ? (man/10000).toFixed(man%10000===0?0:1)+'억' : Math.round(man).toLocaleString('ko-KR')+'만'; }
function hexToRgba(hex, alpha){
  if(!hex) return `rgba(139,124,255,${alpha})`;
  hex = hex.trim();
  let h = hex.replace('#','');
  if(h.length===3) h = h.split('').map(c=>c+c).join('');
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  if(Number.isNaN(r) || Number.isNaN(g) || Number.isNaN(b)) return `rgba(139,124,255,${alpha})`;
  return `rgba(${r},${g},${b},${alpha})`;
}
function fmtNum(n){ return Math.round(n).toLocaleString('ko-KR'); }

function randomAccentColor(){
  const hue = Math.floor(Math.random()*360);
  const sat = 60 + Math.random()*15;
  const light = 52 + Math.random()*10;
  return hslToHex(hue, sat, light);
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
function contrastText(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.6 ? '#12131c' : '#ffffff';
}
function sparkPath(vals, w, h){
  if(!vals.length) return '';
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = (max - min) || 1;
  const step = w / (Math.max(vals.length-1,1));
  return vals.map((v,i)=>{
    const x = i*step;
    const y = h - ((v-min)/range)*h;
    return `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
}
function dateKey(d){ return String(d).replace(/\D/g,''); }
function weekdayOf(dateStr){
  // "2026.07.01" -> Date
  const parts = dateStr.split('.').map(s=>s.trim()).filter(Boolean);
  if(parts.length<3) return null;
  const dt = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
  return dt.getDay(); // 0=Sun..6=Sat
}
const WEEKDAY_LABELS = ['일','월','화','수','목','금','토'];

/* ---------- 파일 파싱 ---------- */

  const el = document.getElementById('statusMsg');

/* ---------- 저장소 (Firestore, 로그인한 팀 전체가 공유) ---------- */

const DETAIL_DATA_FIELDS = ['keywordsByCampaign','wasteKeywordsByCampaign','expandKeywordsByCampaign','brandKeywordsByCampaign','wasteBrandKeywordsByCampaign','expandBrandKeywordsByCampaign','searchTermsByCampaign','wasteSearchTermsByCampaign','expandSearchTermsByCampaign','hourly','hourlyByCampaign','hourlyByDow','hourlyByDowByCampaign','hourlyByAdgroup','hourlyByCampaignDate','adgroupsByCampaign','dailyByCampaign','dailyByKeyword'];
// hourlyByDowByAdgroup(요일×시간×광고그룹)은 광고그룹·캠페인이 많은 계정에서 요일 구분 없이도
// Firestore 문서 1MB 한도를 넘길 만큼 커질 수 있어서 hourlyByAdgroup(시간 단위만)로 대체하고 폐기함.
// DETAIL_DATA_FIELDS에서는 빠졌지만 예전에 그 이름으로 저장된 문서가 남아있을 수 있어서 정리 대상에 포함.
const RETIRED_DETAIL_FIELDS = ['hourlyByDowByAdgroup'];
function fieldEmptyDefault(f){ return (f==='hourly'||f==='hourlyByCampaign'||f==='hourlyByDow'||f==='hourlyByDowByCampaign'||f==='hourlyByAdgroup'||f==='hourlyByCampaignDate'||f==='dailyByCampaign'||f==='dailyByKeyword') ? [] : {}; }
// Firebase Storage 상세데이터 경로 — 업체(id)별 폴더 아래 "월라벨__필드명.json" 파일 하나씩.
function detailStorageRef(id, label, field){ return storage.ref(`clients/${id}/${label}__${field}.json`); }
// 반환값: { notFound:true }(파일이 원래 없음 — 정상, 빈 값으로 취급해도 안전) |
// { failed:true }(네트워크/CORS 등으로 못 가져옴 — 실제로 있는 파일일 수 있어서 빈 값 취급하면 안 됨) |
// { value }(정상적으로 읽어옴)
async function fetchDetailFile(ref){
  try{
    const url = await ref.getDownloadURL();
    const res = await fetch(url);
    if(!res.ok) return { failed:true };
    const json = await res.json();
    return { value: json.value };
  }catch(e){
    if(e && (e.code==='storage/object-not-found')) return { notFound:true };
    console.error('[fetchDetailFile]', ref.fullPath, e);
    return { failed:true };
  }
}

// 상단 탭 목록(refreshTabs)이나 AI 채팅 전체요약처럼 이름·색상·업종·최근월 요약만 필요한 경우를 위한
// 가벼운 버전 — 매 페이지를 열 때마다 모든 업체의 상세데이터(detailData 하위컬렉션)까지 통째로 읽어오는 낭비를 피함.

/* 플레이스(네이버 캠페인유형 코드 6)는 지도 노출 기반이라 검색광고 지표와 성격이 달라 대시보드에서 제외한다.
   여기 한 곳에서 걸러내면 필터·표·합계·인사이트·AI까지 전부 자동으로 빠진다.
   월 합계(cost/revenue/conv/impressions/clicks)에서도 플레이스 몫을 빼서 숫자가 어긋나지 않게 한다. */
const IS_PLACE_TYPE = (t) => { const v = String(t==null?'':t).trim();
  return v === '6' || v.indexOf('플레이스') >= 0; };
function stripPlaceCampaigns(data){
  if(!data || !Array.isArray(data.months)) return data;
  data.months.forEach(m=>{
    const camps = m.campaigns || [];
    const place = camps.filter(c=>IS_PLACE_TYPE(c.type));
    if(!place.length) return;
    const names = new Set(place.map(c=>c.campaign));
    m.campaigns = camps.filter(c=>!IS_PLACE_TYPE(c.type));
    // 월 합계에서 플레이스 몫 차감
    ['cost','revenue','conv','impressions','clicks'].forEach(k=>{
      if(typeof m[k] === 'number'){
        const sub = place.reduce((a,c)=>a+(Number(c[k])||0),0);
        m[k] = Math.max(0, m[k] - sub);
      }
    });
    // 캠페인 이름이 붙은 상세 배열에서도 제거
    ['dailyByCampaign','dailyByKeyword','hourlyByCampaign','hourlyByDowByCampaign','hourlyByAdgroup','hourlyByCampaignDate']
      .forEach(f=>{ if(Array.isArray(m[f])) m[f] = m[f].filter(r=>!r || !names.has(r.campaign)); });
    // 캠페인별 지도형 데이터에서도 제거
    ['keywordsByCampaign','wasteKeywordsByCampaign','expandKeywordsByCampaign','brandKeywordsByCampaign',
     'wasteBrandKeywordsByCampaign','expandBrandKeywordsByCampaign','searchTermsByCampaign',
     'wasteSearchTermsByCampaign','expandSearchTermsByCampaign','adgroupsByCampaign']
      .forEach(f=>{ const o=m[f]; if(o && typeof o==='object'){ names.forEach(n=>{ delete o[n]; }); } });
  });
  return data;
}
async function getClientLight(key){
  try{
    const id = key.replace(/^client:/,'');
    const docRef = userClientsRef().doc(id);
    const doc = await docRef.get();
    if(!doc.exists) return null;
    return stripPlaceCampaigns(doc.data());
  }catch(e){ console.error(e); return null; }
}
async function getClient(key){
  try{
    const id = key.replace(/^client:/,'');
    const docRef = userClientsRef().doc(id);
    const doc = await docRef.get();
    if(!doc.exists) return null;
    const data = stripPlaceCampaigns(doc.data());
    const months = data.months || [];
    // 문서 용량(1MB) 제한 대응: 무거운 필드(상세데이터)는 월별 하위 컬렉션에 따로 저장돼있어서 여기서 합쳐줌.
    // 아직 하위 컬렉션으로 안 옮겨진(예전 형식) 업체는 month 객체에 그대로 남아있는 값을 그대로 씀(하위호환).
    if(months.length){
      // 상세데이터는 예전엔 월 하나당 문서 하나(모든 필드를 합쳐서)로 저장했는데, 광고그룹별 시간대
      // 분석처럼 필드 하나만으로도 캠페인×광고그룹×요일×시간 조합이 많은 계정은 그 합쳐진 문서 하나가
      // Firestore 문서당 1MB 한도를 넘어버리는 경우가 생겨서, 이제 "월라벨__필드명" 단위로 문서를 더
      // 잘게 나눠 저장함 — 필드 하나가 아무리 커져도 같은 달의 다른 필드와 합쳐져서 한도를 넘는 일이 없어짐.
      // 예전 형식(월 하나에 모든 필드가 합쳐진 문서, id가 그냥 월라벨)으로 저장된 달은 그대로 읽어서 하위호환함.
      // 1순위: Storage 파일("clients/{id}/{월라벨}__{필드명}.json"). 없으면 아래 Firestore 경로로 폴백.
      const storageResults = await Promise.all(
        months.flatMap(m => DETAIL_DATA_FIELDS.map(f => ({ label:m.label, field:f })))
          .map(async ({label,field}) => ({ label, field, res: await fetchDetailFile(detailStorageRef(id,label,field)) }))
      );
      const storageMap = {}; // "월라벨__필드명" -> value (Storage에서 정상적으로 찾은 것만)
      const failedSet = new Set(); // "월라벨__필드명" — Storage에 파일이 있을 수도 있는데 네트워크/CORS 등으로 못 가져온 것
      storageResults.forEach(r=>{
        if(r.res && r.res.value!==undefined) storageMap[r.label+'__'+r.field] = r.res.value;
        else if(r.res && r.res.failed) failedSet.add(r.label+'__'+r.field);
      });
      const detailSnap = await docRef.collection('detailData').get().catch(()=>({docs:[]}));
      const fieldDocMap = {}; // "월라벨__필드명" -> {value}
      const legacyDocMap = {}; // "월라벨" -> {필드명: 값, ...}
      detailSnap.docs.forEach(d=>{
        const sep = d.id.indexOf('__');
        const fname = sep>0 ? d.id.slice(sep+2) : null;
        if(fname && DETAIL_DATA_FIELDS.includes(fname)) fieldDocMap[d.id] = d.data();
        else legacyDocMap[d.id] = d.data();
      });
      data.months = months.map(m=>{
        const legacy = legacyDocMap[m.label];
        const merged = { ...m };
        const unreliable = [];
        DETAIL_DATA_FIELDS.forEach(f=>{
          const key2 = m.label+'__'+f;
          if(storageMap[key2]!==undefined){ merged[f] = storageMap[key2]; return; }
          const perField = fieldDocMap[key2];
          if(perField){ merged[f] = perField.value!==undefined ? perField.value : fieldEmptyDefault(f); return; }
          if(legacy){ merged[f] = legacy[f]!==undefined ? legacy[f] : fieldEmptyDefault(f); return; }
          if(failedSet.has(key2)){
            // Storage 파일을 못 가져왔을 뿐 실제로는 데이터가 있을 수 있음 — 화면 표시는 일단 빈 값으로 하되,
            // 이 상태로 저장(setClient)하면 진짜 데이터를 빈 값으로 덮어쓸 위험이 있으니 표시해둠.
            merged[f] = fieldEmptyDefault(f);
            unreliable.push(f);
            return;
          }
          if(m[f]===undefined) merged[f] = fieldEmptyDefault(f);
        });
        if(unreliable.length) merged.__unreliableFields = unreliable;
        return merged;
      });
    }
    return data;
  }catch(e){ console.error(e); return null; }
}
async function setClient(key, data){
  try{
    const id = key.replace(/^client:/,'');
    const docRef = userClientsRef().doc(id);
    const months = data.months || [];
    // 문서 용량(1MB) 제한 대응: 무거운 필드(상세데이터)는 메인 문서에서 빼서 월별 하위 컬렉션 문서로 분리 저장
    const lightMonths = months.map(m=>{
      const light = { ...m };
      DETAIL_DATA_FIELDS.forEach(f=> delete light[f]);
      delete light.__unreliableFields; // getClient가 붙인 임시 내부 마커 — Firestore엔 저장하지 않음
      return light;
    });
    // lastBackup(되돌리기용 백업)에 예전 코드가 실수로 dailyByCampaign(날짜×캠페인 상세)까지 저장해둔
    // 경우가 있어서, 이미 Firestore에 저장돼있던 무거운 백업을 그대로 불러와 다시 저장하면 메인 문서 저장
    // 요청 자체가 커져서 실패할 수 있음 — 어떤 경로로 만들어진 백업이든 저장 시점에 항상 가볍게 정리함
    // (매번 자동으로 정리되므로 한 번만 저장해도 예전에 쌓인 무거운 백업이 자연히 사라짐).
    const lightData = { ...data };
    if(lightData.lastBackup && Array.isArray(lightData.lastBackup.entries)){
      lightData.lastBackup = {
        ...lightData.lastBackup,
        entries: lightData.lastBackup.entries.map(entry=>{
          if(!entry || !entry.month) return entry;
          const { dailyByCampaign, ...restMonth } = entry.month;
          return { ...entry, month: restMonth };
        })
      };
    }
    // 메인(가벼운) 문서를 먼저 저장 — 아래 상세데이터 저장 중 어떤 이유로든 실패하더라도 이름·색상·목표 등
    // 최신 요약 정보는 반영되도록 함.
    await docRef.set({ ...lightData, months: lightMonths });
    // 월별 상세데이터(키워드·시간대·일별 등)는 Firebase Storage에 "clients/{id}/{월라벨}__{필드명}.json"
    // 파일로 하나씩 저장함. Firestore 문서(1MB 한도)와 달리 Storage 파일은 사실상 용량 제한이 없음.
    // __unreliableFields: getClient가 이 필드를 Storage에서 불러오다 실패해서(네트워크/CORS 등) 화면엔
    // 일단 빈 값으로 채워둔 필드 목록 — 실제로는 값이 있을 수 있으므로 여기서 그대로 다시 저장하면
    // 진짜 데이터를 빈 값으로 영구히 덮어쓸 수 있음. 이런 필드는 업로드를 건너뛰고 기존 파일을 그대로 둠.
    const uploadTasks = [];
    for(const m of months){
      if(!m.label) continue;
      const unreliable = new Set(m.__unreliableFields||[]);
      for(const f of DETAIL_DATA_FIELDS){
        if(unreliable.has(f)) continue;
        const value = m[f]!==undefined ? m[f] : fieldEmptyDefault(f);
        uploadTasks.push({ label:m.label, field:f, value });
      }
    }
    const CONCURRENCY = 6;
    for(let i=0; i<uploadTasks.length; i+=CONCURRENCY){
      const slice = uploadTasks.slice(i, i+CONCURRENCY);
      await Promise.all(slice.map(async ({label,field,value})=>{
        const payloadStr = JSON.stringify({ value });
        await detailStorageRef(id, label, field).putString(payloadStr, 'raw', { contentType:'application/json' });
      }));
    }
    // 예전 Firestore 형식(합쳐진 문서, "월라벨__필드명" 단위 문서, 폐기된 필드)이 남아있다면 정리.
    const deleteDocIds = [];
    for(const m of months){
      if(!m.label) continue;
      deleteDocIds.push(m.label);
      DETAIL_DATA_FIELDS.forEach(f=> deleteDocIds.push(m.label+'__'+f));
      RETIRED_DETAIL_FIELDS.forEach(f=> deleteDocIds.push(m.label+'__'+f));
    }
    const CLEANUP_CHUNK = 450;
    for(let i=0; i<deleteDocIds.length; i+=CLEANUP_CHUNK){
      const cleanupBatch = db.batch();
      deleteDocIds.slice(i, i+CLEANUP_CHUNK).forEach(docId=> cleanupBatch.delete(docRef.collection('detailData').doc(docId)));
      await cleanupBatch.commit().catch(e=>console.warn('[setClient] legacy detailData cleanup failed (non-fatal)', e));
    }
    return true;
  }catch(e){ console.error(e); return false; }
}

const ACTIVE_CLIENT_STORAGE = 'ad_dashboard_active_client';
function getStoredActiveClient(){ return localStorage.getItem(ACTIVE_CLIENT_STORAGE) || null; }
function setStoredActiveClient(key){ if(key) localStorage.setItem(ACTIVE_CLIENT_STORAGE, key); else localStorage.removeItem(ACTIVE_CLIENT_STORAGE); }
let clientListCache = []; // [{key, name, color}] - 검색/드롭다운용 캐시
async function refreshTabs(selectAfter){
  const keys = await listClients();
  const dataList = await Promise.all(keys.map(k=>getClientLight(k)));
  clientListCache = [];
  keys.forEach((key,i)=>{
    const data = dataList[i];
    if(!data) return;
    if(!isAdminUser && !(data.allowedUsers||[]).includes(currentUserEmail)) return;
    clientListCache.push({ key, name: data.name, color: data.color, bizType: data.bizType });
  });
  // 다른 페이지에서 이미 업체를 선택했다면(localStorage), 이 페이지 첫 로드 때도 그 업체를 그대로 이어서 보여줌
  if(!selectAfter && !activeSlug){
    const stored = getStoredActiveClient();
    if(stored && clientListCache.some(c=>c.key===stored)) selectAfter = stored;
  }
  renderClientSwitcher();
  if(selectAfter){
    activeSlug = selectAfter;
    setStoredActiveClient(selectAfter);
    const data = await getClient(selectAfter);
    if(data){ renderAbTestPage(data); renderClientSwitcher(); }
  }
}
let clientSwitcherBizFilter = 'ALL';
function renderClientSwitcher(searchTerm){
  const active = clientListCache.find(c=>c.key===activeSlug);
  document.getElementById('clientSwitcherLabel').textContent = active ? active.name : '업체 선택';
  document.getElementById('clientSwitcherDot').style.background = active ? active.color : '#666';
  const listEl = document.getElementById('clientSwitcherList');
  const term = (searchTerm||'').trim().toLowerCase();
  let filtered = term ? clientListCache.filter(c=>c.name.toLowerCase().includes(term)) : clientListCache.slice();
  if(clientSwitcherBizFilter!=='ALL') filtered = filtered.filter(c=> (clientSwitcherBizFilter==='DB' ? c.bizType==='DB' : c.bizType!=='DB'));
  listEl.innerHTML = filtered.length ? filtered.map(c=>`
    <div class="client-switcher-item${c.key===activeSlug?' active':''}" data-key="${c.key}">
      <span class="dot" style="background:${c.color}"></span>${c.name}
    </div>`).join('') : `<div class="client-switcher-empty">검색 결과가 없어요</div>`;
  listEl.querySelectorAll('.client-switcher-item').forEach(el=>{
    el.onclick = async ()=>{

      activeSlug = key;
      setStoredActiveClient(key);
      document.getElementById('clientSwitcherDropdown').classList.remove('open');
      const data = await getClient(key);
      if(data){ renderAbTestPage(data); }
      renderClientSwitcher();
    };
  });
}

const AI_KEY_STORAGE = 'ad_dashboard_gemini_key';

/* 제미나이 무료 등급은 요청이 몰리면 "high demand"로 자주 막힌다(특히 데이터를 통째로 넣는 총평).
   같은 모델을 계속 두드리는 대신, 막히면 다른 모델로 바로 넘어간다.
   앞쪽일수록 답변 품질이 좋고, 뒤쪽(lite)은 4배쯤 빠르고 덜 막힌다. */
const AI_MODELS = ['gemini-flash-latest','gemini-3.5-flash','gemini-flash-lite-latest','gemini-3.5-flash-lite'];
async function aiFetchWithFallback(apiKey, bodyObj, onRetry){
  let lastErr = null;
  for(let mi=0; mi<AI_MODELS.length; mi++){
    const model = AI_MODELS[mi];
    try{
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
        method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(bodyObj)
      });
      if(res.ok) return await res.json();
      const errBody = await res.json().catch(()=>({}));
      const msg = (errBody && errBody.error && errBody.error.message) || `HTTP ${res.status}`;
      const err = new Error(msg); err.status = res.status; lastErr = err;
      // 혼잡/과부하/한도면 다음 모델로. 그 외(키 오류 등)는 바꿔봐야 소용없으니 중단.
      const switchable = res.status===429 || res.status===503 || res.status===500 || /high demand|overloaded|quota|rate/i.test(msg);
      if(!switchable) throw err;
      if(onRetry && mi < AI_MODELS.length-1) onRetry(mi+1, AI_MODELS.length, AI_MODELS[mi+1]);
      await new Promise(r=>setTimeout(r, 600));
    }catch(e){
      lastErr = e;
      if(e.status && e.status!==429 && e.status!==503 && e.status!==500) throw e;
    }
  }
  throw lastErr || new Error('AI 응답 실패');
}
function getAIApiKey(){ return localStorage.getItem(AI_KEY_STORAGE) || ''; }

function extractTopKeywordsFromClientData(data){
  const months = data.months || [];
  if(!months.length) return [];
  const last = months[months.length-1];
  const maps = [last.keywordsByCampaign, last.brandKeywordsByCampaign, last.searchTermsByCampaign].filter(Boolean);
  const all = [];
  maps.forEach(map=>{
    Object.keys(map||{}).forEach(camp=>{
      (map[camp]||[]).forEach(item=> all.push({ ...item, campaign: camp }));
    });
  });
  all.sort((a,b)=> ((b.revenue||0)-(a.revenue||0)) || ((b.conv||0)-(a.conv||0)));
  return all.slice(0,15);
}

  if(ctx.bestDay) lines.push(ctx.isDB

function formatChatText(text){
  // 마크다운 별표(**굵게**, * 목록)를 그대로 화면에 노출하지 않고 자연스러운 텍스트로 바꿔줌
  let s = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/^[*-]\s+/gm, '• ');
  s = s.replace(/\*/g, '');
  s = s.replace(/^-{3,}\s*$/gm, '');
  return s;
}

async function sendAIChat(){

  input.value = '';
  aiChatHistory.push({ role:'user', content: text });
  saveChatHistory();
  const sendBtn = document.getElementById('aiChatSendBtn');
  sendBtn.disabled = true;
  const loadingEl = appendChatMsg('assistant', '생각 중...');
  try{
    const contextStr = await buildAIContext();
    const systemPrompt = `당신은 네이버 검색광고 성과 데이터를 분석해주는 어시스턴트입니다. 아래는 지금 대행사 담당자가 보고 있는 화면의 데이터 요약입니다. 이 데이터를 바탕으로 한국어로 간결하고 실용적으로 답변하세요. 데이터에 없는 내용은 추측하지 말고 모른다고 답하세요.\n\n${contextStr}`;
    const contents = aiChatHistory.slice(-10).map(m=>({ role: m.role==='assistant' ? 'model' : 'user', parts: [{ text: m.content }] }));
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${encodeURIComponent(apiKey)}`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        contents,
        systemInstruction: { parts: [{ text: systemPrompt }] }
      })
    });
    if(!res.ok){
      const errBody = await res.json().catch(()=>({}));
      throw new Error((errBody && errBody.error && errBody.error.message) || `HTTP ${res.status}`);
    }
    const json = await res.json();
    const cand = (json.candidates && json.candidates[0]) || {};
    const parts = (cand.content && cand.content.parts) || [];
    const replyText = parts.map(p=>p.text||'').join('\n').trim() || '(응답이 없어요)';
    loadingEl.innerHTML = formatChatText(replyText);
    aiChatHistory.push({ role:'assistant', content: replyText });
    saveChatHistory();
  }catch(e){
    console.error(e);
    loadingEl.innerHTML = formatChatText('오류가 발생했어요: ' + (e.message||e));
    loadingEl.style.color = 'var(--down)';
  }finally{
    sendBtn.disabled = false;
    input.focus();
  }
}

/* ---------- AI 총평 (성과 인사이트를 자연스러운 문단으로 종합) ---------- */
// campaigns.html과 동일한 방식 — 기존 챗봇의 Gemini 연동·컨텍스트(buildAIContext)를 재사용해서
// 규칙 기반 인사이트를 나열하지 않고 하나의 자연스러운 총평 문단으로 종합해서 보여줌.
const aiSummaryState = {}; // "client:slug::기간라벨" -> { status:'loading'|'done'|'error', text, errorMsg }
function aiSummaryStateKey(key, periodLabel){ return key + '::' + periodLabel; }
// Gemini API가 "high demand"(일시적 과부하) 응답을 줄 때가 잦아서, 매번 사용자가 손으로 "다시 시도"를
// 누르지 않아도 되도록 몇 초 간격을 두고 자동으로 재시도함. 429(요청 과다)·503(서버 과부하)류의 일시적
// 오류나 "overloaded"/"high demand" 문구가 섞인 오류만 재시도 대상으로 보고, 그 외(예: API 키 자체가
// 잘못된 경우)는 재시도해봐야 소용없으니 바로 실패 처리함.
const GEMINI_RETRY_DELAYS_MS = [1500, 4000, 9000]; // 최대 3회 자동 재시도, 갈수록 간격을 늘림
function isRetryableGeminiError(status, errBody){
  if(status===429 || status===503) return true;
  const msg = ((errBody && errBody.error && errBody.error.message) || '').toLowerCase();
  return msg.includes('overloaded') || msg.includes('high demand') || msg.includes('unavailable');
}
async function callGeminiGenerateContent(apiKey, systemPrompt, userText, onRetry){
  for(let attempt=0; ; attempt++){
    let res, networkErr = null;
    try{
      // 한 모델이 막히면 다른 모델로 넘어간다(같은 모델 재시도보다 성공률이 훨씬 높음)
      const _json = await aiFetchWithFallback(apiKey, {
        contents: [{ role:'user', parts:[{ text:userText }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] }
      }, onRetry ? (i,total,next)=>onRetry(i,total) : null);
      const _c = (_json.candidates && _json.candidates[0]) || {};
      const _p = (_c.content && _c.content.parts) || [];
      return _p.map(p=>p.text||'').join('\n').trim() || '(응답이 없어요)';
    }catch(e){ networkErr = e; }
    if(!networkErr && res.ok){
      const json = await res.json();
      const cand = (json.candidates && json.candidates[0]) || {};
      const parts = (cand.content && cand.content.parts) || [];
      return parts.map(p=>p.text||'').join('\n').trim() || '(응답이 없어요)';
    }
    const errBody = networkErr ? null : await res.json().catch(()=>({}));
    const canRetry = attempt < GEMINI_RETRY_DELAYS_MS.length && (networkErr || isRetryableGeminiError(res.status, errBody));
    if(!canRetry){
      if(networkErr) throw networkErr;
      throw new Error((errBody && errBody.error && errBody.error.message) || `HTTP ${res.status}`);
    }
    if(onRetry) onRetry(attempt+1, GEMINI_RETRY_DELAYS_MS.length+1);
    await new Promise(r=>setTimeout(r, GEMINI_RETRY_DELAYS_MS[attempt]));
  }
}

    refreshChatUI();
    return;
  }
  const sKey = aiSummaryStateKey(key, periodLabel);
  aiSummaryState[sKey] = { status:'loading' };
  renderAbTestPage(data);
  try{
    const contextStr = await buildAIContext();
    const systemPrompt = `당신은 네이버 검색광고 대행사의 시니어 매니저입니다. 아래는 지금 보고 있는 화면(일별 전용 보기)의 데이터 요약과, 이미 규칙 기반으로 뽑아낸 인사이트 목록입니다.\n\n${contextStr}\n\n위 내용을 바탕으로, 고객 보고서에 그대로 붙여넣을 수 있는 자연스러운 한국어 총평을 2~4문장으로 작성하세요. 규칙: (1) 위 데이터·인사이트에 없는 내용은 추측하지 마세요. (2) 인사이트 목록을 그대로 나열하지 말고 핵심만 골라 하나의 자연스러운 글로 종합하세요. (3) 가능하면 다음 기간에 시도해볼 만한 액션을 한 가지 짧게 제안하세요. (4) 마크다운(별표, 목록 기호 등)은 쓰지 마세요.`;
    const replyText = await callGeminiGenerateContent(apiKey, systemPrompt, '위 데이터를 바탕으로 총평을 작성해주세요.', (attempt, max)=>{
      aiSummaryState[sKey] = { status:'loading', retryAttempt: attempt, retryMax: max };
      renderAbTestPage(data);
    });
    aiSummaryState[sKey] = { status:'done', text: replyText };
  }catch(e){
    console.error(e);
    aiSummaryState[sKey] = { status:'error', errorMsg: e.message||String(e) };
  }
  renderAbTestPage(data);
}

function ensureFilterState(key, data){
  if(filterState[key]) return filterState[key];
  const campSet = new Set();
  const typeSet = new Set();
  (data.months||[]).forEach(m=>{
    (m.campaigns||[]).forEach(c=>{ if(IS_PLACE_TYPE(c.type)) return; campSet.add(c.campaign); typeSet.add(c.type); });
  });
  filterState[key] = { types: new Set(typeSet), campaigns: new Set(campSet) };
  return filterState[key];
}


// monthsScope를 주면 그 기간에 실제로 돌아간(노출·클릭·비용 중 하나라도 있는) 캠페인만 남긴다.
// 예전엔 전체 기간 목록을 그대로 뿌려서, 어제 하루를 봐도 몇 달 전에 끝난 캠페인이 필터에 잔뜩 남았음.
function mergedCampaignList(data, monthsScope){
  const map = {};
  const scope = (monthsScope && monthsScope.length) ? monthsScope : (data.months||[]);
  const active = new Set();
  scope.forEach(m=>{ (m.campaigns||[]).forEach(c=>{
    if((c.cost||0)>0 || (c.impressions||0)>0 || (c.clicks||0)>0 || (c.conv||0)>0) active.add(c.campaign);
  }); });
  (scope).forEach(m=>{
    (m.campaigns||[]).forEach(c=>{
      if(IS_PLACE_TYPE(c.type)) return;
      if(active.size && !active.has(c.campaign)) return;
      if(!map[c.campaign]) map[c.campaign] = { type:c.type, campaign:c.campaign };
    });
  });
  return Object.values(map);
}

const newTestFormState = {}; // key -> { name, hypothesis, A:{...}, B:{...} }
const expandedNewForm = {}; // key -> boolean (새 테스트 폼이 펼쳐져 있는지)
// axis: 'adgroup'(광고그룹) | 'keyword'(키워드) | 'hour'(시간대) — 무엇을 기준으로 A/B를 나눌지.
// axis별로 쓰는 필드가 다름: adgroup→adgroup, keyword→keyword, hour→hourStart/hourEnd. 나머지는 null로 둠.
function defaultSideState(){ return { axis:'adgroup', campaign:null, adgroup:null, keyword:null, hourStart:null, hourEnd:null, start:null, end:null }; }
function ensureNewTestForm(key){
  if(!newTestFormState[key]) newTestFormState[key] = { name:'', hypothesis:'', A: defaultSideState(), B: defaultSideState() };
  return newTestFormState[key];
}
function allCampaignNames(data){ return mergedCampaignList(data).map(c=>c.campaign); }
// 캠페인 안의 광고그룹 목록은 adgroupsByCampaign(월별 스냅샷)에서 모아옴 — 여러 달에 걸쳐 이름이
// 다를 수 있어서 전체 기간 기준으로 합집합을 만듦.
function campaignAdgroups(data, campaign){
  const set = new Set();
  (data.months||[]).forEach(m=>{
    const list = (m.adgroupsByCampaign && m.adgroupsByCampaign[campaign]) || [];
    list.forEach(ag=> set.add(ag.adgroup));
  });
  return [...set].sort((a,b)=>a.localeCompare(b,'ko'));
}
// 캠페인 안의 키워드 목록 — dailyByKeyword(일별, 있으면)와 keywordsByCampaign(월별 스냅샷, 상위 25개) 둘 다에서 모아옴.
function campaignKeywords(data, campaign){
  if(!campaign) return [];
  const set = new Set();
  (data.months||[]).forEach(m=>{
    (m.dailyByKeyword||[]).forEach(r=>{ if(r.campaign===campaign) set.add(r.keyword); });
    const list = (m.keywordsByCampaign && m.keywordsByCampaign[campaign]) || [];
    list.forEach(k=> set.add(k.keyword));
  });
  return [...set].sort((a,b)=>a.localeCompare(b,'ko'));
}
// 캠페인에 dailyByKeyword(일별 키워드 데이터)가 있는지 — 있으면 일 단위로 정확히, 없으면 월 단위 합계로만 계산 가능.
function campaignHasDailyKeyword(data, campaign){
  return (data.months||[]).some(m=>(m.dailyByKeyword||[]).some(r=>r.campaign===campaign));
}
// 캠페인에 hourlyByCampaignDate(일별 시간대 데이터)가 있는지.
function campaignHasHourlyDate(data, campaign){
  return (data.months||[]).some(m=>(m.hourlyByCampaignDate||[]).some(r=>!campaign || r.campaign===campaign));
}
// 캠페인(또는 계정 전체)에 실제 일별 데이터가 존재하는 날짜 목록 — 드롭다운 옵션으로 씀
function campaignDateOptions(data, campaign){
  const set = new Set();
  (data.months||[]).forEach(m=>{
    if(campaign){
      (m.dailyByCampaign||[]).forEach(r=>{ if(r.campaign===campaign) set.add(r.date); });
    } else {
      (m.daily||[]).forEach(r=> set.add(r.date));
    }
  });
  return [...set].sort((a,b)=>dateKey(a).localeCompare(dateKey(b)));
}
function monthLabelOptions(data){ return (data.months||[]).map(m=>m.label); }

// A/B 각 side의 성과를 계산. axis(분류 축)에 따라 집계 소스와 단위(일/월)가 달라짐:
//  - adgroup: 광고그룹까지 지정하면 월 단위 스냅샷(adgroupsByCampaign)만 있어서 월 단위,
//    캠페인 이하(캠페인 전체 또는 계정 전체)면 일별 데이터(daily/dailyByCampaign)로 정확한 날짜 구간 계산.
//  - keyword: dailyByKeyword(일별, 상위 25개 키워드까지만 있음)가 있으면 일 단위로, 없으면
//    keywordsByCampaign(월별 스냅샷, 상위 25개 합계)로 월 단위 계산.
//  - hour: hourlyByCampaignDate(일별)가 있으면 일 단위+시간대 범위로, 없으면 hourlyByCampaign(월별
//    스냅샷)으로 월 단위 시간대 합계.
function computeSideMetrics(data, side){
  const axis = side.axis || 'adgroup';
  const agg = { impressions:0, clicks:0, cost:0, conv:0, revenue:0 };
  let unitCount = 0;
  let granularity = 'day';

  if(axis==='keyword'){
    const hasDaily = side.campaign && campaignHasDailyKeyword(data, side.campaign);
    if(hasDaily){
      const lo = dateKey(side.start||''), hi = dateKey(side.end||'99999999');
      (data.months||[]).forEach(m=>{
        (m.dailyByKeyword||[]).forEach(r=>{
          if(r.campaign!==side.campaign) return;
          if(side.keyword && r.keyword!==side.keyword) return;
          const dk = dateKey(r.date);
          if(side.start && dk<lo) return;
          if(side.end && dk>hi) return;
          agg.impressions+=r.impressions||0; agg.clicks+=r.clicks||0; agg.cost+=r.cost||0; agg.conv+=r.conv||0; agg.revenue+=r.revenue||0;
          unitCount++;
        });
      });
    } else {
      granularity = 'month';
      const allLabels = monthLabelOptions(data);
      let si = allLabels.indexOf(side.start), ei = allLabels.indexOf(side.end);
      if(si<0) si = 0; if(ei<0) ei = allLabels.length-1;
      const lo = Math.min(si,ei), hi = Math.max(si,ei);
      (data.months||[]).forEach((m,idx)=>{
        if(idx<lo || idx>hi || !side.campaign) return;
        const list = (m.keywordsByCampaign && m.keywordsByCampaign[side.campaign]) || [];
        list.forEach(k=>{
          if(side.keyword && k.keyword!==side.keyword) return;
          agg.impressions+=k.impressions||0; agg.clicks+=k.clicks||0; agg.cost+=k.cost||0; agg.conv+=k.conv||0; agg.revenue+=k.revenue||0;
          unitCount++;
        });
      });
    }
  } else if(axis==='hour'){
    const hasDaily = campaignHasHourlyDate(data, side.campaign);
    const hs = side.hourStart!==null && side.hourStart!==undefined && side.hourStart!=='' ? parseInt(side.hourStart,10) : 0;
    const he = side.hourEnd!==null && side.hourEnd!==undefined && side.hourEnd!=='' ? parseInt(side.hourEnd,10) : 23;
    const fullHourRange = (hs===0 && he===23); // 시간 범위를 안 좁혔으면 '시간 미상' 실적도 합계에 포함
    if(hasDaily){
      const lo = dateKey(side.start||''), hi = dateKey(side.end||'99999999');
      (data.months||[]).forEach(m=>{
        (m.hourlyByCampaignDate||[]).forEach(r=>{
          if(side.campaign && r.campaign!==side.campaign) return;
          if(!isRealHour(r.hour)){ if(!fullHourRange) return; }
          else { const h = parseInt(r.hour,10); if(h<hs || h>he) return; }
          const dk = dateKey(r.date);
          if(side.start && dk<lo) return;
          if(side.end && dk>hi) return;
          agg.impressions+=r.impressions||0; agg.clicks+=r.clicks||0; agg.cost+=r.cost||0; agg.conv+=r.conv||0; agg.revenue+=r.revenue||0;
          unitCount++;
        });
      });
    } else {
      granularity = 'month';
      const allLabels = monthLabelOptions(data);
      let si = allLabels.indexOf(side.start), ei = allLabels.indexOf(side.end);
      if(si<0) si = 0; if(ei<0) ei = allLabels.length-1;
      const lo = Math.min(si,ei), hi = Math.max(si,ei);
      (data.months||[]).forEach((m,idx)=>{
        if(idx<lo || idx>hi) return;
        (m.hourlyByCampaign||[]).forEach(r=>{
          if(side.campaign && r.campaign!==side.campaign) return;
          if(!isRealHour(r.hour)){ if(!fullHourRange) return; }
          else { const h = parseInt(r.hour,10); if(h<hs || h>he) return; }
          agg.impressions+=r.impressions||0; agg.clicks+=r.clicks||0; agg.cost+=r.cost||0; agg.conv+=r.conv||0; agg.revenue+=r.revenue||0;
          unitCount++;
        });
      });
    }
  } else if(side.adgroup){
    granularity = 'month';
    const allLabels = monthLabelOptions(data);
    let si = allLabels.indexOf(side.start), ei = allLabels.indexOf(side.end);
    if(si<0) si = 0; if(ei<0) ei = allLabels.length-1;
    const lo = Math.min(si,ei), hi = Math.max(si,ei);
    (data.months||[]).forEach((m,idx)=>{
      if(idx<lo || idx>hi) return;
      const list = (m.adgroupsByCampaign && m.adgroupsByCampaign[side.campaign]) || [];
      const ag = list.find(a=>a.adgroup===side.adgroup);
      if(!ag) return;
      agg.impressions+=ag.impressions||0; agg.clicks+=ag.clicks||0; agg.cost+=ag.cost||0; agg.conv+=ag.conv||0; agg.revenue+=ag.revenue||0;
      unitCount++;
    });
  } else {
    const lo = dateKey(side.start||'');
    const hi = dateKey(side.end||'99999999');
    (data.months||[]).forEach(m=>{
      const rows = side.campaign ? (m.dailyByCampaign||[]).filter(r=>r.campaign===side.campaign) : (m.daily||[]);
      rows.forEach(r=>{
        const dk = dateKey(r.date);
        if(side.start && dk<lo) return;
        if(side.end && dk>hi) return;
        agg.impressions+=r.impressions||0; agg.clicks+=r.clicks||0; agg.cost+=r.cost||0; agg.conv+=r.conv||0; agg.revenue+=r.revenue||0;
        unitCount++;
      });
    });
  }
  const hasData = unitCount>0 && (agg.impressions>0 || agg.cost>0);
  return {
    ...agg,
    granularity,
    unitCount, hasData,
    cpa: agg.conv>0 ? Math.round(agg.cost*10000/agg.conv) : null,
    ctr: agg.impressions>0 ? (agg.clicks/agg.impressions*100) : 0,
    cvr: agg.clicks>0 ? (agg.conv/agg.clicks*100) : 0,
    roas: agg.cost>0 ? (agg.revenue/agg.cost*100) : 0,
  };
}
/* 네이버에서 삭제된 캠페인은 이름 대신 내부 ID('cmp-a001-01-000000010333253')로 내려옴.
   드롭다운에서 A안/B안을 이름 보고 고르는 화면이라 ID만 보이면 선택 자체가 불가능해서,
   index.html과 같은 규칙으로 '삭제된 캠페인 (…333253)'처럼 바꿔서 보여줌. */
function isDeletedCampaignName(name){
  return /(^|·\s*)cmp-[a-z0-9]+-\d+-\d+\s*$/i.test(String(name||'').trim());
}
function displayCampaignName(name){
  const s = String(name||'').trim();
  if(!isDeletedCampaignName(s)) return s;
  const m = s.match(/^(\d+)\s*·/);
  const idPart = s.replace(/^\d+\s*·\s*/,'');
  return `${m?m[1]+' · ':''}삭제된 캠페인 (…${idPart.slice(-6)})`;
}
const escAb = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* hour='99' = 네이버가 시간을 특정하지 못한 실적. 사용자가 시간 범위를 좁히지 않았을 때(0~23시 전체)는
   합계에 포함해야 다른 화면과 숫자가 맞음. 범위를 좁혔다면 몇 시인지 모르는 행이라 제외. */
function isRealHour(h){ return /^([01]?\d|2[0-3])$/.test(String(h).trim()); }
function sideEntityLabel(side){
  const axis = side.axis || 'adgroup';
  const parts = [side.campaign ? displayCampaignName(side.campaign) : '전체 계정'];
  if(axis==='keyword'){
    if(side.keyword) parts.push(side.keyword); else parts.push('키워드 전체');
  } else if(axis==='hour'){
    const hs = side.hourStart!==null && side.hourStart!==undefined && side.hourStart!=='' ? side.hourStart : '0';
    const he = side.hourEnd!==null && side.hourEnd!==undefined && side.hourEnd!=='' ? side.hourEnd : '23';
    parts.push(`${hs}시~${he}시`);
  } else {
    if(side.adgroup) parts.push(side.adgroup);
  }
  return parts.join(' › ');
}
function sideRangeLabel(side){
  if(!side.start && !side.end) return '기간 미지정';
  return `${side.start||'?'} ~ ${side.end||'?'}`;
}
async function saveAbTests(key, data){

/* crownable=false면 👑와 색 강조를 빼고 숫자만 보여줌. 전환 표본이 적을 때 CTR이 0.01%p 높다고

function metricRowHTML(label, aVal, bVal, aBetter, unit, higherIsBetter, crownable){
  let aWin=false, bWin=false;
  if(aBetter!==null && crownable!==false){
    if(higherIsBetter){ aWin = aBetter>0; bWin = aBetter<0; }

  }

    <td style="color:var(--muted);">${label}</td>
    <td style="font-weight:${aWin?800:500};color:${aWin?'var(--up)':'var(--text)'};">${aVal}${aWin?' 👑':''}</td>
    <td style="font-weight:${bWin?800:500};color:${bWin?'var(--up)':'var(--text)'};">${bVal}${bWin?' 👑':''}</td>

}
function renderTestComparisonHTML(test, data, isDB){
  const mA = computeSideMetrics(data, test.sideA);
  const mB = computeSideMetrics(data, test.sideB);
  if(!mA.hasData || !mB.hasData){
    return `<div style="color:var(--muted);font-size:12px;padding:8px 0;">${!mA.hasData?'A안':'B안'}에 해당하는 기간의 데이터가 아직 없어요.</div>`;
  }
  const pctDiff = (a,b)=> (a===null||b===null||b===0) ? null : (a-b)/b*100;
  const cpaDiff = pctDiff(mA.cpa, mB.cpa); // 음수면 A가 더 낮음(좋음)
  const roasDiff = pctDiff(mA.roas, mB.roas);
  const ctrDiff = pctDiff(mA.ctr, mB.ctr);
  const cvrDiff = pctDiff(mA.cvr, mB.cvr);
  const effDiff = isDB ? cpaDiff : roasDiff;

  /* 표본 크기 확인 — A안 전환 1건, B안 2건이어도 "40% 더 효율적"이라고 단언하던 문제.
     전환이 몇 건 안 되면 차이는 대부분 우연이라, 승자를 못박는 대신 "판단하기 이르다"로 바꿈.
     기준(3건)은 index.html의 '표본 적음' 규칙과 같게 맞춤. hourly.html도 같은 이유로 최소 표본을 두고 있음. */
  const MIN_CONV_AB = 3;
  const lowSample = (mA.conv < MIN_CONV_AB) || (mB.conv < MIN_CONV_AB);
  const zeroConvSide = (mA.conv === 0 || mB.conv === 0);

  let verdict = '';
  if(zeroConvSide && !(mA.conv===0 && mB.conv===0)){
    // 한쪽 전환이 0건이면 CPA가 null이 되어 예전엔 "차이가 뚜렷하지 않아요"로 빠졌는데, 이건 완전히 반대되는 결론임.
    const zeroSide = mA.conv===0 ? 'A안' : 'B안';
    const otherSide = mA.conv===0 ? 'B안' : 'A안';
    const otherConv = mA.conv===0 ? mB.conv : mA.conv;
    verdict = `<div style="margin-top:10px;padding:10px 12px;border-radius:8px;background:rgba(255,93,122,.1);font-size:12px;color:var(--down);font-weight:600;">
      ${zeroSide}은 전환이 0건이에요 (비용 ${fmtWon(mA.conv===0?mA.cost:mB.cost)}원). ${otherSide}은 ${otherConv}건${otherConv<MIN_CONV_AB?' — 이쪽도 표본이 적어 확신하긴 일러요':''}.
    </div>`;
  } else if(lowSample){

   (숫자가 왼쪽에 붙어 있으면 칸이 넓을 때 값들이 멀리 떨어져 보여서 읽기 힘듦) */

// 상단 메뉴 '할 일' 옆 숫자 배지 — 알림 개수가 정해지면 표시

function dcAlignTables(root){
  const scope = root || document;
  scope.querySelectorAll('table').forEach(tb=>{
    const body = tb.tBodies && tb.tBodies[0];
    if(!body || !body.rows.length) return;
    const head = tb.tHead && tb.tHead.rows[0];
    const cols = Math.max(...[...body.rows].map(r=>r.cells.length));
    for(let c=0;c<cols;c++){
      let num=0, tot=0;
      for(const row of body.rows){
        const cell = row.cells[c];
        if(!cell || cell.colSpan>1) continue;
        const txt = (cell.textContent||'').trim();
        if(!txt || txt==='-' || txt==='—') continue;
        tot++;
        if(/^[₩$]?[\d,.]+\s*(원|건|개|위|%|만|억)?/.test(txt) && /\d/.test(txt)) num++;
      }
      if(tot>=2 && num/tot >= 0.7){
        for(const row of body.rows){ const cell=row.cells[c]; if(cell && cell.colSpan===1 && !cell.style.textAlign) cell.style.textAlign='right'; }
        if(head && head.cells[c] && !head.cells[c].style.textAlign) head.cells[c].style.textAlign='right';
      }
    }
  });
}

/* 줄이 많은 표는 화면을 끝없이 늘려서, 일정 높이로 잘라 안쪽에서만 스크롤되게 한다.
   (머리글은 스크롤해도 위에 붙어 있어서 어느 칸인지 계속 보임) */
function dcCompactTables(root){
  const scope = root || document;
  scope.querySelectorAll('table').forEach(tb=>{
    if(tb.dataset.dcCompact) return;
    const body = tb.tBodies && tb.tBodies[0];
    if(!body) return;
    if(tb.closest('.hr-scroll, .dc-scroll')) { tb.dataset.dcCompact='1'; return; }
    const parent = tb.parentElement;
    if(!parent) return;
    // 줄이 많아서 세로로 길거나(16줄↑), 칸이 많아서 가로로 넓은(부모보다 큰) 표를 상자에 넣는다.
    // 가로로 넓은 표를 그냥 두면 카드 전체가 늘어나서 화면 오른쪽이 잘림.
    const tooTall = body.rows.length >= 16;
    const tooWide = tb.scrollWidth > parent.clientWidth + 4;
    if(!tooTall && !tooWide) return;
    const wrap = document.createElement('div');
    wrap.className = tooTall ? 'dc-scroll' : 'dc-scroll dc-scroll-x';
    parent.insertBefore(wrap, tb);
    wrap.appendChild(tb);
    tb.dataset.dcCompact = '1';
  });
}
// 화면이 다시 그려질 때마다 자동으로 정렬을 다시 적용 (페이지마다 렌더 함수가 달라서 한 곳에서 처리)
(function(){
  let t = null;
  const run = ()=>{ t=null; try{ dcCompactTables(document); dcAlignTables(document); }catch(e){} };
  const start = ()=>{
    try{ new MutationObserver(()=>{ if(t) return; t=setTimeout(run,60); }).observe(document.body,{childList:true,subtree:true}); }catch(e){}
    run();
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
// 큰 숫자 줄 — 윗줄은 결과(크게), 아랫줄은 과정(작게). 칸이 모자라면 남은 칸이 늘어나 폭을 채운다.
function dcCellHTML(lab, val, delta, big){
  const L = String(val).length;
  const fs = big ? (L>17?21:L>13?24:27) : (L>17?15:L>13?17:19);
  return `<div style="padding:${big?'16px 20px':'13px 20px'};background:${DC.card};min-width:0">
    <div style="font-size:11.5px;color:${DC.mut};margin-bottom:${big?'7px':'5px'}">${lab}</div>
    <div style="display:flex;align-items:baseline;flex-wrap:wrap"><span class="m" style="font-size:${fs}px;font-weight:600;letter-spacing:-.025em;color:${DC.txt};white-space:nowrap">${val}</span>${delta||''}</div>
  </div>`;
}
function dcDelta(now, prev, inv){
  if(prev===null||prev===undefined||!isFinite(prev)||prev===0||now===null||!isFinite(now)) return '';
  const p = (now/prev-1)*100, good = inv ? p<0 : p>0;
  return `<span class="m" style="font-size:12px;color:${good?DC.up:DC.dn};margin-left:8px">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(1)}</span>`;
}
function dcKpi2HTML(top, bottom){
  const r = arr => arr.filter(Boolean).map(c=>dcCellHTML(c[0], c[1], c[2], c[3])).join('');
  return `<div class="dc-kpi2"><div class="dc-k-top">${r(top)}</div>${bottom&&bottom.length?`<div class="dc-k-bot">${r(bottom)}</div>`:''}</div>`;
}
// 표 조각
const dcTh = (t,r) => `<th class="m" style="text-align:${r?'right':'left'};font-size:12px;font-weight:500;letter-spacing:.04em;color:${DC.mut};padding:9px 14px;border-bottom:1px solid ${DC.line};white-space:nowrap">${t}</th>`;
const dcTd = (inner,r) => `<td class="m" style="text-align:${r?'right':'left'};padding:9px 14px;border-bottom:1px solid ${DC.line};white-space:nowrap">${inner}</td>`;
const dcTable = (headHtml, bodyHtml) => `<div style="border:1px solid ${DC.line};border-radius:9px;overflow:hidden;background:${DC.card}">
  <div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums">
  <thead><tr style="background:${DC.head}">${headHtml}</tr></thead><tbody>${bodyHtml}</tbody></table></div></div>`;
// 미니 스파크라인 (비용 추이)
function dcSpark(vals, w, h){
  const v = (vals||[]).filter(x=>isFinite(x));
  if(v.length < 2) return '';
  const W = w||84, H = h||22, max = Math.max(...v), min = Math.min(...v), span = (max-min)||1;
  const pts = v.map((x,i)=>`${(i/(v.length-1)*W).toFixed(1)},${(H - (x-min)/span*(H-2) - 1).toFixed(1)}`).join(' ');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="vertical-align:middle;overflow:visible">
    <polyline points="${pts}" fill="none" stroke="${DC.acc}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/></svg>`;
}

(function(){

    if(document.getElementById('panelToggleBtn')) return;
    if(!document.querySelector('.main-layout')) return;

    };
    paint();
    document.body.appendChild(btn);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', initPanelToggle);
  else initPanelToggle();
  setTimeout(initPanelToggle, 1500);
})();

</script>
