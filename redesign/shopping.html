// 미니 스파크라인 (비용 추이)
function dcSpark(vals, w, h){
  const v = (vals||[]).filter(x=>isFinite(x));
  if(v.length < 2) return '';
  const W = w||84, H = h||22, max = Math.max(...v), min = Math.min(...v), span = (max-min)||1;
  const pts = v.map((x,i)=>`${(i/(v.length-1)*W).toFixed(1)},${(H - (x-min)/span*(H-2) - 1).toFixed(1)}`).join(' ');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="vertical-align:middle;overflow:visible">
    <polyline points="${pts}" fill="none" stroke="${DC.acc}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/></svg>`;
}

/* 날짜 프리셋을 누르면 위쪽 '기간(월)' 위젯도 그 날짜가 속한 달로 같이 옮긴다.
   안 그러면 좁힌 날짜와 월 단위 표가 서로 다른 기간을 봐서 한 화면에서 숫자가 안 맞음. */
function monthFirstDay(label){ const t=String(label||'').replace('.','-'); return t?`${t}-01`:null; }
function monthLastDay(label){ const t=String(label||'').split('.'); if(t.length<2) return null;
  const y=+t[0], m=+t[1]; return `${y}-${String(m).padStart(2,'0')}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`; }
function dayToMonthLabel(d){ return String(d||'').slice(0,7).replace('-','.'); }
function syncMonthRangeToDays(key, allMonths, dr){
  if(!dr || !dr.start || !dr.end) return false;
  const labels = (allMonths||[]).map(m=>m.label);
  const si = labels.indexOf(dayToMonthLabel(dr.start));
  const ei = labels.indexOf(dayToMonthLabel(dr.end));
  if(si<0 || ei<0) return false;
  const a = Math.min(si,ei), b = Math.max(si,ei);
  const cur = monthRangeState[key] || {};
  if(cur.start===labels[a] && cur.end===labels[b]) return false;
  monthRangeState[key] = { start: labels[a], end: labels[b] };
  if(typeof compareMonthState !== 'undefined') compareMonthState[key] = 'AUTO';
  return true;
}

function renderKeywordsPage(data){
  const key = 'client:' + slugify(data.name);
  const fstate = ensureFilterState(key, data);
  applyAccentColor(data.color);
  const allMonths = data.months || [];
  ensureMonthRange(key, allMonths);
  const months = monthsInRange(allMonths, monthRangeState[key]);
  const isMultiMonth = months.length > 1;
  const campaignList = mergedCampaignList(data, months);
  // 기간을 바꾸면 목록이 달라지므로, 처음 보는 캠페인은 기본으로 켜 둔다(사용자가 끈 건 그대로 유지).
  if(!fstate.seen) fstate.seen = new Set(fstate.campaigns);
  campaignList.forEach(c=>{ if(!fstate.seen.has(c.campaign)){ fstate.seen.add(c.campaign); fstate.campaigns.add(c.campaign); } });
  // 사용자가 일부러 전체 해제한 상태는 그대로 존중한다(자동으로 다시 켜지 않음).
  // 다만 '한 번도 본 적 없는' 캠페인만 켜는 위 규칙 때문에, 예전 상태가 지금 목록과
  // 전혀 겹치지 않는 경우(업체·기간이 바뀌어 목록이 통째로 달라진 경우)에는 빈 화면이
  // 되므로, 그때만 새 목록을 기본 선택으로 되돌린다.
  if(campaignList.length && !campaignList.some(c=>fstate.seen.has(c.campaign))){
    campaignList.forEach(c=>{ fstate.campaigns.add(c.campaign); fstate.seen.add(c.campaign); });
  }
  campaignList.forEach(c=>{ if(c.type!=null && !fstate.types.has(c.type) && !fstate.seenTypes) fstate.types.add(c.type); });
  const allTypes = [...new Set(campaignList.map(c=>c.type))];
  const isDB = data.bizType === 'DB';
  const hasShoppingData = allMonths.some(m=>m.searchTermsByCampaign && Object.keys(m.searchTermsByCampaign).length);
  // 파워링크 검색어(EXPKEYWORD) — 수집기가 채워주면 나타남. 쇼핑검색 위주 업체는 비어 있을 수 있음.
  const hasPlTermData = allMonths.some(m=>m.plSearchTermsByCampaign && Object.keys(m.plSearchTermsByCampaign).length);
  const hasBrandData = allMonths.some(m=>m.brandKeywordsByCampaign && Object.keys(m.brandKeywordsByCampaign).length);

  const MODE_FIELD = { powerlink:'keywordsByCampaign', plterm:'plSearchTermsByCampaign', shopping:'searchTermsByCampaign', brand:'brandKeywordsByCampaign' };
  const MODE_WASTE_FIELD = { powerlink:'wasteKeywordsByCampaign', plterm:'wastePlSearchTermsByCampaign', shopping:'wasteSearchTermsByCampaign', brand:'wasteBrandKeywordsByCampaign' };
  const MODE_EXPAND_FIELD = { powerlink:'expandKeywordsByCampaign', plterm:'expandPlSearchTermsByCampaign', shopping:'expandSearchTermsByCampaign', brand:'expandBrandKeywordsByCampaign' };
  const MODE_LABEL = { powerlink:'파워링크 키워드', plterm:'파워링크 검색어', shopping:'쇼핑검색 상품', brand:'브랜드검색 키워드' };
  if(!(key in keywordPageState)) keywordPageState[key] = 'shopping';
  keywordPageState[key] = 'shopping'; // 이 페이지는 쇼핑검색 전용
  // 데이터가 없는 모드가 선택돼 있으면(업체를 바꿨거나 예전 선택이 남은 경우) 파워링크로 되돌림 —
  // 빈 표에 날짜 버튼까지 비활성인 화면이 뜨면 "왜 아무것도 안 되지"로 보이기 때문.
  // 쇼핑검색 전용 페이지라 다른 모드로 되돌리지 않음
  const mode = keywordPageState[key];
  // 파워링크 '검색어'(EXPKEYWORD) 보고서에는 전환/매출 컬럼 자체가 없음(12컬럼: 0~11).
  // 그래서 이 모드에서는 전환·매출·ROAS·CPA·전환율을 그리지 않고,
  // 비용을 얼마나 쓰고 있는지(= 제외어 후보 발굴) 중심으로 컬럼을 바꿔 끼운다.
  const noConv = (mode === 'plterm');

  if(!(key in kwSortState)) kwSortState[key] = { field:'default', dir:'desc' };
  if(!(key in wasteSortState)) wasteSortState[key] = { field:'cost', dir:'desc' };
  if(!(key in topVisibleCount)) topVisibleCount[key] = 10;
  if(!(key in expandVisibleCount)) expandVisibleCount[key] = 10;
  if(!(key in wasteVisibleCount)) wasteVisibleCount[key] = 10;
  const sort = kwSortState[key];
  const wsort = wasteSortState[key];

  // TOP 키워드 표의 날짜 선택(dayRange)용 — dailyByKeyword(캠페인당 top+waste+expand 합쳐 최대 75개 키워드만
  // 날짜별로 저장됨)에서 현재 모드(파워링크/쇼핑검색/브랜드검색)에 해당하는 것만 골라 날짜 경계(최소/최대)를 뽑아 씀.
  // sourceMode가 없는 항목(이 변경 이전에 저장된 구버전 데이터)은 파워링크로 간주(하위 호환).
  // 키워드별 일별 추이/비교 차트는 "키워드를 하나하나 골라야 하는" 방식이 실사용에 안 맞아서 제거함 —
  // 날짜 범위 자체는 아래 TOP 표 필터에 계속 쓰임.
  let allDailyByKeyword = [];
  months.forEach(m=>{ (m.dailyByKeyword||[]).forEach(r=>{ if(fstate.campaigns.has(r.campaign) && (r.sourceMode||'powerlink')===mode) allDailyByKeyword.push(r); }); });
  const dayBoundsMinKw = allDailyByKeyword.length ? toDateInputValue(allDailyByKeyword.slice().sort((a,b)=>dateKey(a.date).localeCompare(dateKey(b.date)))[0].date) : null;
  const dayBoundsMaxKwArr = allDailyByKeyword.length ? allDailyByKeyword.slice().sort((a,b)=>dateKey(a.date).localeCompare(dateKey(b.date))) : [];
  const dayBoundsMaxKw = dayBoundsMaxKwArr.length ? toDateInputValue(dayBoundsMaxKwArr[dayBoundsMaxKwArr.length-1].date) : null;
  if(!(key in dayRangeState)){ dayRangeState[key] = { start: null, end: null }; dayPresetChoice[key] = null; }
  if(!(key in dayRangeCustomOpen)) dayRangeCustomOpen[key] = false;
  {
    const dr = dayRangeState[key];
    if(dayBoundsMinKw && dayBoundsMaxKw){
      // 데이터 범위를 벗어나면 통째로 지우지 말고 범위 안으로 당긴다.
      // (통째로 지우면 '최근 7일' 같은 버튼이 눌린 걸로 인식이 안 돼서 색이 안 들어감)
      if(dr.start && dr.start < dayBoundsMinKw) dr.start = dayBoundsMinKw;
      if(dr.start && dr.start > dayBoundsMaxKw) dr.start = null;
      if(dr.end && dr.end > dayBoundsMaxKw) dr.end = dayBoundsMaxKw;
      if(dr.end && dr.end < dayBoundsMinKw) dr.end = null;
      if(dr.start && dr.end && dr.start > dr.end) { dr.start = null; dr.end = null; }
    } else { dr.start = null; dr.end = null; }
  }
  const hasKwTrendDayFilter = !!(dayRangeState[key].start || dayRangeState[key].end);
  // 날짜 필터는 세 모드(파워링크/쇼핑검색/브랜드검색) 모두 적용 가능 — 다만 그 모드에 실제로 dailyByKeyword가
  // 있을 때만(dayBoundsMinKw로 판단, 없으면 프리셋 버튼 자체가 비활성화됨).
  const hasDayFilter = !!dayBoundsMinKw && hasKwTrendDayFilter;

  let rows = hasDayFilter ? mergeKwRowsByDayRange(months, fstate, dayRangeState[key], mode) : mergeKwRows(months, fstate, MODE_FIELD[mode]);
  rows = rows.map(r=>({ ...r, cpa: r.conv>0 ? Math.round(r.cost*10000/r.conv) : null, roas: r.cost>0 ? (r.revenue/r.cost*100) : 0,
    ctr: r.impressions>0 ? (r.clicks/r.impressions*100) : 0, cvr: r.clicks>0 ? (r.conv/r.clicks*100) : 0 }));
  function applySort(list, sortState, defaultField){
    const field = sortState.field==='default' ? defaultField : sortState.field;
    const mult = sortState.dir==='asc' ? 1 : -1;
    return [...list].sort((a,b)=>{
      // undefined/NaN이 섞이면 비교 함수가 일관성을 잃어 브라우저마다 순서가 달라짐 → 숫자 아닌 값은 맨 뒤로.
      let av=a[field], bv=b[field];
      if(!Number.isFinite(av)) av = -Infinity;
      if(!Number.isFinite(bv)) bv = -Infinity;
      return (av-bv)*mult;
    });
  }
  // ── 상품 / 검색어를 갈라서 각각 별도의 표로 보여준다
  rows = rows.map(r=>({ ...r, shopKind: shopKindOf(r.keyword) }));
  const shopCounts = { prod: rows.filter(r=>r.shopKind==='prod').length, term: rows.filter(r=>r.shopKind==='term').length };
  const shopCosts  = { prod: rows.filter(r=>r.shopKind==='prod').reduce((a,r)=>a+(r.cost||0),0),
                       term: rows.filter(r=>r.shopKind==='term').reduce((a,r)=>a+(r.cost||0),0) };
  if(!(key in shopTermVisible)) shopTermVisible[key] = 10;

  // 검색어 모드는 전환/매출이 전부 0이라 그걸로 정렬하면 순서가 무의미해짐 → 비용 큰 순.
  const sortKey = noConv ? 'cost' : (isDB?'conv':'revenue');
  /* 예전엔 여기서 50개로 잘랐는데, 제목은 자르기 전 개수(예: "쇼핑상품 300개 · 비용 500만원")를
     그대로 보여줘서 표에 있는 50개와 숫자가 안 맞았다. 더보기 버튼도 잘린 50 기준으로 세어
     "250개 더 있음"을 못 알려줬다. → 자르지 않고 넘기고 화면은 더보기로 끊어 그린다. */
  let prodRows = applySort(rows.filter(r=>r.shopKind==='prod'), sort, sortKey);
  let termRows = applySort(rows.filter(r=>r.shopKind==='term'), sort, sortKey);
  /* 조건 좁히기 — 상품 표와 검색어 표에 각각 따로 건다(성격이 달라 같은 조건을 공유하면 불편).
     키워드·캠페인 페이지와 같은 공통 도구(_kmtable)를 쓴다. */
  const kmStProd = kmFilterState('shopprod:' + key);
  const kmStTerm = kmFilterState('shopterm:' + key);
  const prodBefore = prodRows.length, termBefore = termRows.length;
  prodRows = kmApplyFilter(prodRows, kmStProd, { nameKey:'keyword' });
  termRows = kmApplyFilter(termRows, kmStTerm, { nameKey:'keyword' });
  rows = applySort(rows, sort, sortKey).slice(0,50); // 아래 인사이트/확대·제외 추천은 기존대로 전체 기준

  // 전기간 대비 추이 & 신규 키워드 판별용: 기준 기간의 직전 기간 데이터 확보
  // refMonth = 현재 보고 있는 구간의 마지막 달(단일 월/전체 누적/임의 구간 모두 이 정의 하나로 처리)
  let refMonth = months.length ? months[months.length-1] : null;
  if(!(key in compareMonthState)) compareMonthState[key] = 'AUTO';
  let prevMonth = null;
  if(refMonth){
    if(compareMonthState[key]!=='AUTO'){
      prevMonth = allMonths.find(m=>m.label===compareMonthState[key]) || null;
      if(prevMonth && prevMonth.label===refMonth.label) prevMonth = null;
    } else {
      const idx = allMonths.findIndex(m=>m.label===refMonth.label);
      if(idx>0) prevMonth = allMonths[idx-1];
    }
  }
  /* 날짜 필터가 켜져 있으면 현재 값은 잘린 기간인데 비교 대상은 '직전 달 한 달 전체'라서
     표 전체에 ▼80% 같은 값이 찍혔음. 필터 중엔 바로 앞의 같은 길이 날짜 구간과 비교하고,
     그 구간에 데이터가 없으면 ▲▼ 자체를 표시하지 않음. */
  const enrichKw = r => ({ ...r,
    cpa: r.conv>0 ? Math.round(r.cost*10000/r.conv) : null, roas: r.cost>0 ? (r.revenue/r.cost*100) : 0,
    ctr: r.impressions>0 ? (r.clicks/r.impressions*100) : 0, cvr: r.clicks>0 ? (r.conv/r.clicks*100) : 0,
    // 검색어 모드 TOP 표에서 전환 컬럼 대신 쓰는 값 (waste/expand와 같은 계산식)
    avgCpc: r.clicks>0 ? Math.round(r.cost*10000/r.clicks) : null });
  let prevMap = {};
  let prevPeriodLabel = null;
  let dayTrendOff = false;
  if(hasDayFilter){
    const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const curStart = dayRangeState[key].start || dayBoundsMinKw;
    const curEnd   = dayRangeState[key].end   || dayBoundsMaxKw;
    const d1 = new Date(curStart+'T00:00:00'), d2 = new Date(curEnd+'T00:00:00');
    const lenDays = Math.round((d2-d1)/86400000) + 1;
    if(lenDays>0 && isFinite(lenDays)){
      const pEnd = new Date(d1.getTime() - 86400000);
      const pStart = new Date(pEnd.getTime() - (lenDays-1)*86400000);
      const prevRange = { start: ymd(pStart), end: ymd(pEnd) };
      const prevRows = mergeKwRowsByDayRange(allMonths, fstate, prevRange, mode);
      if(prevRows.length){
        prevRows.forEach(r=>{ prevMap[r.keyword] = enrichKw(r); });
        prevPeriodLabel = `${prevRange.start} ~ ${prevRange.end} (같은 ${lenDays}일)`;
      } else { dayTrendOff = true; }
    } else { dayTrendOff = true; }
  } else if(prevMonth){
    mergeKwRows([prevMonth], fstate, MODE_FIELD[mode]).forEach(r=>{ prevMap[r.keyword] = enrichKw(r); });
    prevPeriodLabel = prevMonth.label;
  }
  const hasPrevForTrend = Object.keys(prevMap).length > 0;
  function pctOf(curr, prev){
    if(prev===null || prev===undefined || curr===null || curr===undefined) return null;
    if(prev===0) return curr>0 ? 100 : null;
    return (curr-prev)/prev*100;
  }
  /* goodDir: 'up'=올라가면 좋음, 'down'=내려가야 좋음(비용·CPA·평균노출순위).
     호출부는 방향을 넘기는데 함수가 안 써서 비용·CPA가 올라도 초록으로 보이던 문제. */
  function cellTrend(pct, goodDir){
    if(pct===null || pct===undefined || isNaN(pct) || Math.abs(pct)<5) return '';
    const rising = pct >= 0;
    const isGood = (goodDir === 'down') ? !rising : rising;
    return `<span style="margin-left:5px;font-size:12px;font-weight:700;color:${isGood?'var(--up)':'var(--down)'};">${rising?'▲':'▼'}${Math.abs(pct).toFixed(0)}%</span>`;
  }
  rows = rows.map(k=>{
    const prev = hasPrevForTrend ? prevMap[k.keyword] : null;
    const isNewKw = hasPrevForTrend && !prev;
    const trends = prev ? {
      cost: pctOf(k.cost, prev.cost), conv: pctOf(k.conv, prev.conv), revenue: pctOf(k.revenue, prev.revenue),
      cpa: pctOf(k.cpa, prev.cpa), roas: pctOf(k.roas, prev.roas), ctr: pctOf(k.ctr, prev.ctr), cvr: pctOf(k.cvr, prev.cvr),
      avgRank: pctOf(k.avgRank, prev.avgRank)
    } : {};
    return { ...k, isNewKw, trends };
  });

  // 날짜 필터가 걸려 있으면(현재 모드에 날짜별 원본이 있을 때) 그 모드의 제외추천/확대추천도 dailyByKeyword
  // 기준으로 그 기간에 맞춰 다시 계산함 — 나머지 두 모드는 항상 월 단위(mergeKwWaste/mergeKwExpand) 그대로,
  // 날짜별 원본 자체가 없는 모드도 마찬가지(dayBoundsMinKw가 null이면 hasDayFilter가 애초에 false가 됨).
  /* 날짜 필터를 켜면 현재 모드만 그 기간으로 잘리고 나머지 두 모드는 월 전체 값이라,
     "최근 7일 파워링크 3만원"과 "한 달치 쇼핑검색 200만원"이 한 표에서 비용순으로 경쟁했음.
     기간이 다른 값을 같은 순위표에 섞지 않도록, 필터 중엔 현재 모드만 보여줌. */
  const OTHER_MODES = hasDayFilter ? [] : ['powerlink','plterm','shopping','brand'].filter(m=>m!==mode);
  const dayFilteredWasteExpand = hasDayFilter ? computeWasteExpandByDayRange(months, fstate, dayRangeState[key], isDB, mode) : null;
  let waste = [
    ...(dayFilteredWasteExpand ? dayFilteredWasteExpand.waste : mergeKwWaste(months, fstate, MODE_WASTE_FIELD[mode], mode)),
    ...OTHER_MODES.flatMap(m=>mergeKwWaste(months, fstate, MODE_WASTE_FIELD[m], m)),
  ];
  waste = waste.map(w=>({ ...w, cpa: w.conv>0 ? Math.round(w.cost*10000/w.conv) : null, roas: w.cost>0 ? (w.revenue/w.cost*100) : 0,
    ctr: w.impressions>0 ? (w.clicks/w.impressions*100) : 0, cvr: w.clicks>0 ? (w.conv/w.clicks*100) : 0,
    avgCpc: w.clicks>0 ? Math.round(w.cost*10000/w.clicks) : null }));
  waste = applySort(waste, wsort, 'cost').slice(0,50);

  // 확대 추천: 효율은 좋은데 비용이 평균보다 낮은 키워드 (제외추천과 대칭)
  let expand = [
    ...(dayFilteredWasteExpand ? dayFilteredWasteExpand.expand : mergeKwExpand(months, fstate, MODE_EXPAND_FIELD[mode], mode)),
    ...OTHER_MODES.flatMap(m=>mergeKwExpand(months, fstate, MODE_EXPAND_FIELD[m], m)),
  ];
  expand = expand.map(e=>({ ...e, cpa: e.conv>0 ? Math.round(e.cost*10000/e.conv) : null, roas: e.cost>0 ? (e.revenue/e.cost*100) : 0,
    ctr: e.impressions>0 ? (e.clicks/e.impressions*100) : 0, cvr: e.clicks>0 ? (e.conv/e.clicks*100) : 0,
    avgCpc: e.clicks>0 ? Math.round(e.cost*10000/e.clicks) : null }));
  if(!(key in expandSortState)) expandSortState[key] = { field:'default', dir:'desc' };
  const esort = expandSortState[key];
  expand = applySort(expand, esort, isDB?'cpa':'roas');
  if(esort.field==='default'){ expand.sort((a,b)=> isDB ? a.cpa-b.cpa : b.roas-a.roas); }
  expand = expand.slice(0,50);

  // 💡 키워드 성과 인사이트 (현재 모드·기간·필터 기준)
  // 원인 추정: 전환 없이 비용만 쓴 키워드 — 클릭은 있는데 전환이 없으면 타겟팅/랜딩페이지 불일치,
  // 노출 자체가 적으면 아직 판단하기 이르다는 식으로 campaigns.html의 원인 진단과 같은 관점을 키워드 단위로 적용.
  function diagnoseWasteKeywordIssue(w){
    const clicks = w.clicks||0, impressions = w.impressions||0;
    if(clicks>=INSIGHT_THRESHOLDS.WASTE_HIGH_CLICKS) return `클릭은 ${clicks}건 있었는데 전환이 없어요 — 키워드 검색 의도와 랜딩페이지가 맞지 않거나 타겟팅이 어긋났을 수 있어요, 랜딩페이지를 점검해보세요.`;
    if(clicks>=INSIGHT_THRESHOLDS.WASTE_LOW_CLICKS) return `클릭 대비 전환이 없어요 — 광고 문구(소재)가 이 키워드의 검색 의도와 맞는지, 랜딩페이지가 적절한지 점검해보세요.`;
    if(impressions<INSIGHT_THRESHOLDS.WASTE_MIN_IMPRESSIONS) return `아직 노출·클릭이 적어서(노출 ${impressions}회) 판단하기엔 일러요 — 조금 더 지켜본 뒤 결정하세요.`;
    return `클릭률이 낮아 판단할 데이터가 부족해요 — 입찰가나 키워드 매칭 방식을 점검해보세요.`;
  }
  // 원인 추정: 직전 기간 대비 CPA/ROAS가 크게 나빠진 키워드 — CTR 하락이면 소재(문구) 매칭 문제,
  // CVR 하락이면 랜딩페이지/타겟팅 문제, 평균노출순위 하락이면 입찰 경쟁(입찰가) 문제로 구분.
  function diagnoseKeywordTrendIssue(r){
    const t = r.trends||{};
    if(t.ctr!==null && t.ctr!==undefined && t.ctr<=INSIGHT_THRESHOLDS.TREND_DECLINE_PCT) return `클릭률이 크게 떨어졌어요 — 키워드와 광고 문구(소재)가 검색 의도와 잘 맞는지 점검해보세요.`;
    if(t.cvr!==null && t.cvr!==undefined && t.cvr<=INSIGHT_THRESHOLDS.TREND_DECLINE_PCT) return `클릭 대비 전환율이 크게 떨어졌어요 — 랜딩페이지나 타겟팅을 점검해보세요.`;
    if(t.avgRank!==null && t.avgRank!==undefined && t.avgRank>=INSIGHT_THRESHOLDS.RANK_WORSEN_PCT) return `평균노출순위가 밀렸어요 — 입찰 경쟁이 심해졌을 수 있어요, 입찰가를 확인해보세요.`;
    return null;
  }
  function generateKeywordInsights(){
    const insights = [];
    // 검색어 모드: 전환/매출 데이터가 없으므로 "성과가 좋다/나쁘다"를 말할 수 없다.
    // 대신 돈이 어디로 새는지(비용 집중·클릭률)만 근거 있게 짚어준다.
    if(noConv){
      if(rows.length){
        const top = rows[0];
        const totalCost = rows.reduce((a,b)=>a+b.cost,0);
        const share = totalCost>0 ? (top.cost/totalCost*100) : 0;
        insights.push({type:'neutral', text:`'${top.keyword}' 검색어에 비용이 가장 많이 나갔어요 (${fmtMan(top.cost)}원, 상위 50개 중 ${share.toFixed(0)}%). 우리 상품과 맞는 검색어인지 확인해보세요.`});
        const lowCtr = rows.filter(r=>r.cost>0 && r.clicks>0 && r.ctr < 1).sort((a,b)=>b.cost-a.cost).slice(0,1)[0];
        if(lowCtr) insights.push({type:'warn', text:`'${lowCtr.keyword}'는 ${fmtMan(lowCtr.cost)}원을 쓰면서 클릭률이 ${lowCtr.ctr.toFixed(2)}%로 낮아요 — 검색 의도가 우리 상품과 어긋났을 수 있으니 제외어 후보로 검토해보세요.`});
        const noClick = rows.filter(r=>r.cost>0 && (r.clicks||0)===0);
        if(noClick.length) insights.push({type:'warn', text:`클릭이 한 번도 없는데 비용이 나간 검색어가 ${noClick.length}개 있어요 (총 ${fmtMan(noClick.reduce((a,b)=>a+b.cost,0))}원).`});
      }
      insights.push({type:'neutral', text:'ℹ️ 네이버 검색어 보고서에는 전환·매출 항목이 없어서 이 화면에서는 ROAS·CPA를 계산할 수 없어요. 성과 판단은 파워링크 키워드 화면에서 해주세요.'});
      return insights;
    }
    if(rows.length){
      const top = rows[0];
      if(!isDB && top.revenue>0) insights.push({type:'good', text:`'${top.keyword}' ${MODE_LABEL[mode]}가 매출 ${fmtMan(top.revenue)}원으로 가장 성과가 좋아요 (비용 ${fmtMan(top.cost)}원 기준).`});
      else if(top.conv>0) insights.push({type:'good', text:`'${top.keyword}' ${MODE_LABEL[mode]}가 전환 ${top.conv}건으로 가장 성과가 좋아요 (비용 ${fmtMan(top.cost)}원 기준).`});
    }
    if(waste.length){
      const totalWasteCost = waste.reduce((a,b)=>a+b.cost,0);
      const worstWaste = waste[0];
      const diag = worstWaste ? ` 가장 큰 '${worstWaste.keyword}'(${fmtMan(worstWaste.cost)}원)의 경우: ${diagnoseWasteKeywordIssue(worstWaste)}` : '';
      insights.push({type:'warn', text:`전환 없이 비용만 쓴 키워드/검색어가 ${waste.length}개, 총 ${fmtMan(totalWasteCost)}원이에요.${diag} 아래 제외 추천 목록을 확인해보세요.`});
    }
    if(expand.length){
      const top2 = expand[0];
      insights.push({type:'good', text:`💡 '${top2.keyword}'는 효율은 좋은데 비용을 적게 쓰고 있어요 (${isDB ? 'CPA '+(top2.cpa!==null?top2.cpa.toLocaleString('ko-KR')+'원':'-') : 'ROAS '+top2.roas.toFixed(0)+'%'}). 입찰가·예산 확대를 검토해보세요.`});
    }
    const bigMoves = rows.filter(r=>{
      const t = r.trends||{};
      return (isDB
        ? (t.cpa!==null && t.cpa!==undefined && Math.abs(t.cpa)>=INSIGHT_THRESHOLDS.BIG_MOVE_CPA_PCT && r.conv>=INSIGHT_THRESHOLDS.BIG_MOVE_MIN_SAMPLE)
        : (t.roas!==null && t.roas!==undefined && Math.abs(t.roas)>=INSIGHT_THRESHOLDS.BIG_MOVE_ROAS_PP && r.cost>=INSIGHT_THRESHOLDS.BIG_MOVE_MIN_SAMPLE));
    }).slice(0,2);
    bigMoves.forEach(r=>{
      const t = r.trends;
      const isBad = isDB ? t.cpa>0 : t.roas<0;
      const diagTxt = isBad ? diagnoseKeywordTrendIssue(r) : null;
      if(isDB) insights.push({type: t.cpa<=0?'good':'warn', text:`'${r.keyword}', 직전 기간 대비 CPA가 ${Math.abs(t.cpa).toFixed(0)}% ${t.cpa<=0?'개선':'상승'}됐어요.${diagTxt?' '+diagTxt:''}`});
      else insights.push({type: t.roas>=0?'good':'warn', text:`'${r.keyword}', 직전 기간 대비 ROAS가 ${Math.abs(t.roas).toFixed(0)}%p ${t.roas>=0?'상승':'하락'}했어요.${diagTxt?' '+diagTxt:''}`});
    });
    if(!insights.length) insights.push({type:'neutral', text:'아직 인사이트를 뽑기엔 데이터가 더 필요해요.'});
    return insights;
  }
  function buildKeywordInsightsHTML(insights){
    const icon = t => t==='good' ? '📈' : t==='warn' ? '⚠️' : 'ℹ️';
    const color = t => t==='good' ? 'var(--up)' : t==='warn' ? 'var(--down)' : 'var(--text)';
    return insights.map(i=>`<div style="display:flex;gap:8px;font-size:12px;color:var(--text);padding:5px 0;"><span>${icon(i.type)}</span><span style="color:${color(i.type)};">${i.text}</span></div>`).join('');
  }
  const keywordInsights = generateKeywordInsights();
  window.__currentClientData = data;
  const periodLabel = isMultiMonth ? `${months[0].label} ~ ${months[months.length-1].label} 누적` : (months[0] ? months[0].label : '기간 없음');
  window.__pageAIContext = {
    isDB, mode, modeLabel: MODE_LABEL[mode],
    periodLabel,
    topRows: rows.slice(0,15).map(r=>({ keyword:r.keyword, cost:r.cost, conv:r.conv, revenue:r.revenue, cpa:r.cpa, roas:r.roas })),
    wasteCount: waste.length,
    wasteCost: waste.reduce((a,b)=>a+b.cost,0),
    expandTop: expand.slice(0,5).map(r=>({ keyword:r.keyword, cpa:r.cpa, roas:r.roas })),
    insights: keywordInsights.map(i=>i.text)
  };

  const initial = (data.name||'?').trim().charAt(0);
  const textColor = contrastText(data.color);
  const sortTh = (label, field, state, mode) => `<th data-sort="${mode}" data-field="${field}" style="cursor:pointer;user-select:none;">${label}${state.field===field?(state.dir==='desc'?' ▼':' ▲'):''}</th>`;

  const card = document.getElementById('card');
  // 상품 표와 검색어 표를 같은 모양으로 두 번 그리기 위한 공용 함수
  const shopPanel = ({SR, VIS, MORE, TITLE, SUB, COL1, RIGHT, EMPTY, FOOT, BAR}) => `
    <div class="panel" data-shop-panel="${MORE}">
      <div class="panel-title" style="display:flex;align-items:center;justify-content:space-between;">
        <span>${TITLE} <span style="font-size:12px;color:var(--muted);font-weight:400;">— ${SUB}</span></span>
        <div style="display:flex;gap:6px;">${RIGHT}</div>
      </div>
      ${BAR||''}
      <table>
        <thead><tr>
          <th style="min-width:270px">${COL1}</th><th>캠페인</th>
          ${sortTh('비용','cost',sort,'top')}
          ${noConv ? '' : (isDB ? sortTh('전환수','conv',sort,'top') : sortTh('전환매출','revenue',sort,'top'))}
          ${noConv ? '' : sortTh('CPA','cpa',sort,'top')}
          ${(noConv || isDB) ? '' : sortTh('ROAS','roas',sort,'top')}
          ${noConv ? sortTh('노출수','impressions',sort,'top') : ''}
          ${noConv ? sortTh('클릭수','clicks',sort,'top') : ''}
          ${sortTh('클릭률','ctr',sort,'top')}
          ${noConv ? sortTh('평균CPC','avgCpc',sort,'top') : sortTh('전환율','cvr',sort,'top')}
          ${sortTh('평균노출순위','avgRank',sort,'top')}
        </tr></thead>
        <tbody>
          ${SR.length ? SR.slice(0, VIS).map(k=>{

  document.getElementById('monthRangeEndSelect').onchange = (e)=>{
    const r = monthRangeState[key];
    r.end = e.target.value;
    const allLabels = allMonths.map(m=>m.label);
    if(allLabels.indexOf(r.end) < allLabels.indexOf(r.start)) r.start = r.end;
    compareMonthState[key] = 'AUTO';
    topVisibleCount[key] = 10; expandVisibleCount[key] = 10; wasteVisibleCount[key] = 10;
    renderKeywordsPage(data);
  };
  document.getElementById('monthRangeAllBtn').onclick = ()=>{
    monthRangeState[key] = { start: allMonths[0].label, end: allMonths[allMonths.length-1].label };
    compareMonthState[key] = 'AUTO';
    topVisibleCount[key] = 10; expandVisibleCount[key] = 10; wasteVisibleCount[key] = 10;
    renderKeywordsPage(data);
  };
  document.getElementById('monthPrevBtn').onclick = ()=>{
    const allLabels = allMonths.map(m=>m.label);
    const r = monthRangeState[key];
    const si = allLabels.indexOf(r.start), ei = allLabels.indexOf(r.end);
    if(si<=0) return; // 이미 맨 앞(가장 과거) 달까지 와있음
    const len = ei - si;
    const newSi = si - 1, newEi = newSi + len;
    monthRangeState[key] = { start: allLabels[newSi], end: allLabels[newEi] };
    compareMonthState[key] = 'AUTO';
    topVisibleCount[key] = 10; expandVisibleCount[key] = 10; wasteVisibleCount[key] = 10;
    renderKeywordsPage(data);
  };
  document.getElementById('monthNextBtn').onclick = ()=>{
    const allLabels = allMonths.map(m=>m.label);
    const r = monthRangeState[key];
    const si = allLabels.indexOf(r.start), ei = allLabels.indexOf(r.end);
    if(ei>=allLabels.length-1) return; // 이미 맨 뒤(가장 최신) 달까지 와있음
    const len = ei - si;
    const newEi = ei + 1, newSi = newEi - len;
    monthRangeState[key] = { start: allLabels[newSi], end: allLabels[newEi] };
    compareMonthState[key] = 'AUTO';
    topVisibleCount[key] = 10; expandVisibleCount[key] = 10; wasteVisibleCount[key] = 10;
    renderKeywordsPage(data);
  };
  document.getElementById('compareFilterSelect').onchange = (e)=>{
    compareMonthState[key] = e.target.value;
    renderKeywordsPage(data);
  };
  document.querySelectorAll('.kw-mode-btn').forEach(btn=>{
    btn.onclick = ()=>{ keywordPageState[key] = btn.dataset.mode; topVisibleCount[key] = 10; renderKeywordsPage(data); };
  });
  document.querySelectorAll('.kw-more-btn[data-target="shopterm"]').forEach(btn=>{
    btn.onclick = ()=>{ shopTermVisible[key] += 20; renderKeywordsPage(data); };
  });
  document.querySelectorAll('th[data-sort]').forEach(th=>{
    th.onclick = ()=>{
      const field = th.dataset.field;
      const sortGroup = th.dataset.sort;
      const stateObj = sortGroup==='top' ? kwSortState[key] : sortGroup==='expand' ? expandSortState[key] : wasteSortState[key];
      if(stateObj.field===field){ stateObj.dir = stateObj.dir==='desc' ? 'asc' : 'desc'; }
      else { stateObj.field = field; stateObj.dir = 'desc'; }
      if(sortGroup==='top') topVisibleCount[key] = 10;
      else if(sortGroup==='expand') expandVisibleCount[key] = 10;
      else wasteVisibleCount[key] = 10;
      renderKeywordsPage(data);
    };
  });
  /* 예전엔 '.kw-more-btn' 전체를 다시 잡아서, 위에서 따로 배선해 둔 검색어 표(shopterm)의
     더보기까지 여기서 덮어썼다. 그 결과 검색어 더보기를 누르면 else 로 빠져 제외추천 표가 펴지고,
     검색어 표는 10줄에서 영영 늘어나지 않았다. → shopterm 은 제외하고 잡는다. */
  /* 조건 좁히기 + 엑셀 — 상품/검색어 패널을 각각 따로 배선한다.
     한 화면에 조건 줄이 둘이라 범위를 안 넘기면 서로의 입력이 섞인다. */
  // 패널 이름은 shopPanel 의 MORE 값과 같아야 한다(상품 패널은 'shopprod'이 아니라 'top').
  [['top', kmStProd, ()=>prodRows, prodBefore, '상품', '상품명'],
   ['shopterm', kmStTerm, ()=>termRows, termBefore, '검색어', '검색어']].forEach(([mk, st, getRows, before, sheetName, label])=>{
    const root = document.querySelector('[data-shop-panel="'+mk+'"]');
    if(!root) return;
    kmWireFilterBar(st, ()=>renderKeywordsPage(data), root);
    kmWireExcel(()=>{
      const rs = getRows();
      const cond = [];
      if(String(st.minCost).trim()!=='')   cond.push('비용 ' + Number(st.minCost).toLocaleString('ko-KR') + '원 이상');
      if(String(st.minClicks).trim()!=='') cond.push('클릭수 ' + st.minClicks + '건 이상');
      if(String(st.minConv).trim()!=='')   cond.push('전환수 ' + st.minConv + '건 이상');
      if(String(st.q||'').trim()!=='')     cond.push(label + '에 "' + st.q + '" 포함');
      const cols = [
        { h:label, v:r=>r.keyword, w:34, text:1 },
        { h:'캠페인', v:r=>((r.campaigns&&r.campaigns.length)?r.campaigns.join(', '):(r.campaign||'')), w:28, text:1 },
        { h:'비용(원)', v:r=>Math.round((r.cost||0)*10000) },
        { h:'노출수', v:r=>r.impressions||0 },
        { h:'클릭수', v:r=>r.clicks||0 },
        { h:'클릭률(%)', v:r=>+((r.ctr||0).toFixed(2)) },
        { h:'평균CPC(원)', v:r=>(r.avgCpc===null||r.avgCpc===undefined)?'':r.avgCpc },
      ];
      if(!noConv){
        cols.push({ h:'총 전환수', v:r=>r.conv||0 });
        if(!isDB) cols.push({ h:'전환매출(원)', v:r=>Math.round((r.revenue||0)*10000) });
        cols.push({ h:'CPA(원)', v:r=>(r.cpa===null||r.cpa===undefined)?'':r.cpa });
        if(!isDB) cols.push({ h:'ROAS(%)', v:r=>(r.conv>0)?+((r.roas||0).toFixed(0)):'' });
      }
      cols.push({ h:'평균노출순위', v:r=>(r.avgRank===null||r.avgRank===undefined)?'':+r.avgRank.toFixed(1) });
      return { rows: rs, cols,
        meta:[['기간', periodLabel||''],['구분', sheetName],
              ['조건', cond.length?cond.join(' / '):'조건 없음 (전체)'],
              ['건수', rs.length + '개' + (rs.length!==before?(' (전체 '+before+'개 중)'):'')]],
        title: data.name + ' — 쇼핑검색 ' + sheetName, sheet: sheetName,
        filename: data.name + '_쇼핑검색_' + sheetName };
    }, root);
  });
  document.querySelectorAll('.kw-more-btn:not([data-target="shopterm"])').forEach(btn=>{
    btn.onclick = ()=>{
      if(btn.dataset.target==='top') topVisibleCount[key] += 10;
      else if(btn.dataset.target==='expand') expandVisibleCount[key] += 10;
      else wasteVisibleCount[key] += 10;
      renderKeywordsPage(data);
    };
  });
  // '외 N개' 클릭 → 나머지 캠페인 이름을 그 칸에서 바로 펼침/접음.
  // 다시 그리면 스크롤 위치가 튀므로 화면만 토글한다.
  document.querySelectorAll('.kw-camp-toggle').forEach(btn=>{
    btn.onclick = ()=>{
      const box = btn.parentElement && btn.parentElement.querySelector('.kw-camp-rest');
      if(!box) return;
      const opened = !box.hidden;
      box.hidden = opened;
      btn.textContent = btn.textContent.replace(opened ? '▴' : '▾', opened ? '▾' : '▴');
    };
  });
  document.querySelectorAll('.ai-summary-btn').forEach(btn=>{
    btn.onclick = ()=> generateAISummary(data, key, periodLabel);
  });
  document.querySelectorAll('.day-preset-pill-kw').forEach(btn=>{
    btn.onclick = ()=>{
      const pk = btn.dataset.preset;
      dayPresetChoice[key] = pk;
      if(pk === 'all'){
        monthRangeState[key] = { start: allMonths[0].label, end: allMonths[allMonths.length-1].label };
        if(typeof compareMonthState !== 'undefined') compareMonthState[key] = 'AUTO';
        dayRangeState[key] = { start: null, end: null }; dayPresetChoice[key] = null;
        dayRangeCustomOpen[key] = false;
        renderKeywordsPage(data);
        return;
      }
      const fullMin = allMonths.length ? monthFirstDay(allMonths[0].label) : dayBoundsMinKw;
      const fullMax = allMonths.length ? monthLastDay(allMonths[allMonths.length-1].label) : dayBoundsMaxKw;
      const p = presetDayRange(pk, fullMin, fullMax) || presetDayRange(pk, dayBoundsMinKw, dayBoundsMaxKw);
      if(!p) return;
      dayRangeState[key] = p;
      syncMonthRangeToDays(key, allMonths, p);
      dayRangeCustomOpen[key] = false;
      renderKeywordsPage(data);
    };
  });
  const kwDayCustomToggle = document.getElementById('kwDayRangeCustomToggle');
  if(kwDayCustomToggle) kwDayCustomToggle.onclick = ()=>{
    dayRangeCustomOpen[key] = !dayRangeCustomOpen[key];
    renderKeywordsPage(data);
  };
  const kwDayStartInput = document.getElementById('kwDayRangeStartInput');
  if(kwDayStartInput) kwDayStartInput.onchange = (e)=>{
    const dr = dayRangeState[key];
    dayPresetChoice[key] = null;
    dr.start = e.target.value || null;
    if(dr.start && dr.end && dr.start > dr.end) dr.end = dr.start;
    renderKeywordsPage(data);
  };
  const kwDayEndInput = document.getElementById('kwDayRangeEndInput');
  if(kwDayEndInput) kwDayEndInput.onchange = (e)=>{
    const dr = dayRangeState[key];
    dayPresetChoice[key] = null;
    dr.end = e.target.value || null;
    if(dr.start && dr.end && dr.end < dr.start) dr.start = dr.end;
    renderKeywordsPage(data);
  };
  const kwDayResetBtn = document.getElementById('kwDayRangeResetBtn');
  if(kwDayResetBtn) kwDayResetBtn.onclick = ()=>{ dayRangeState[key] = { start:null, end:null }; dayPresetChoice[key] = null; dayRangeCustomOpen[key] = false; renderKeywordsPage(data); };
  renderFilterPanel(key, data, campaignList, allTypes, renderKeywordsPage);
}


/* ---------- 광고계정 / 삭제된 캠페인 표시 (index.html과 동일 규칙) ---------- */
function accountOfCampaign(name){
  const m = String(name||'').match(/^(\d{6,})\s*·\s*/);
  return m ? m[1] : null;
}
function accountListOf(campaignList){
  const set = new Set();
  campaignList.forEach(c=>{ const a = accountOfCampaign(c.campaign); if(a) set.add(a); });
  return [...set].sort();
}
/* 네이버 마스터 보고서에는 현재 존재하는 캠페인만 내려오는데 과거 성과 데이터에는 삭제된
   캠페인 기록이 남아 있어, 이름을 못 찾고 원본 ID가 그대로 노출됨. 표시만 알아보기 쉽게 바꾼다. */
function isDeletedCampaignName(name){
  return /(^|·\s*)cmp-[a-z0-9]+-\d+-\d+\s*$/i.test(String(name||'').trim());
}
function displayCampaignName(name){
  const s = String(name||'').trim();
  if(!isDeletedCampaignName(s)) return s;
  const m = s.match(/^(\d+)\s*·/);
  const idPart = s.replace(/^\d+\s*·\s*/,'');
  return `${m?m[1]+' · ':''}삭제된 캠페인 (…${idPart.slice(-6)})`;
}
function renderFilterPanel(key, data, campaignList, allTypes, renderFn){
  renderFn = renderFn || renderCard;
  const fstate = filterState[key];
  const mount = document.getElementById('mainLayout');
  let panel = document.getElementById('filterPanel');
  if(!panel){
    panel = document.createElement('div');
    panel.className = 'filter-panel';
    panel.id = 'filterPanel';
    mount.children[1].replaceWith(panel);
  }
  const accountList = accountListOf(campaignList);
  panel.innerHTML = `
    <div class="filter-head">필터</div>
    ${accountList.length > 1 ? `
    <div class="filter-group">
      <div class="filter-group-title">광고계정</div>
      ${accountList.map(a=>{
        const camps = campaignList.filter(c=>accountOfCampaign(c.campaign)===a);
        const anyOn = camps.some(c=>fstate.campaigns.has(c.campaign));
        const label = (data.accountLabels && data.accountLabels[a]) ? `${a} · ${data.accountLabels[a]}` : a;
        return `<label class="filter-item"><input type="checkbox" data-kind="account" value="${a}" ${anyOn?'checked':''}> ${label} <span style="color:var(--muted);font-size:12px;">(${camps.length})</span></label>`;
      }).join('')}
    </div>` : ''}
    <div class="filter-group">
      <div class="filter-group-title">캠페인 유형</div>
      ${allTypes.map(t=>{
        // 체크 표시는 '그 유형의 캠페인이 실제로 하나라도 켜져 있는가'로 판단한다.
        const typeCamps = campaignList.filter(c=>String(c.type)===String(t));
        const anyOn = typeCamps.some(c=>fstate.campaigns.has(c.campaign));
        return `<label class="filter-item"><input type="checkbox" data-kind="type" value="${t}" ${anyOn?'checked':''}> ${campaignTypeLabel(t)} <span style="color:var(--muted);font-size:12px;">(${typeCamps.length})</span></label>`;
      }).join('')}
    </div>
    <div class="filter-group campaigns">
      <div class="filter-group-title">캠페인명</div>
      <div class="filter-campaign-list">
      ${campaignList.map(c=>`
        <label class="filter-item"><input type="checkbox" data-kind="campaign" value="${c.campaign}" ${fstate.campaigns.has(c.campaign)?'checked':''}> ${displayCampaignName(c.campaign)}</label>
      `).join('')}
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-ghost" id="filterSelectAllBtn" style="flex:1;">전체 선택</button>
      <button class="btn btn-ghost" id="filterDeselectAllBtn" style="flex:1;">전체 해제</button>
    </div>
  `;
  panel.querySelectorAll('input[data-kind="type"]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) fstate.types.add(cb.value); else fstate.types.delete(cb.value);
      // 유형 체크에 맞춰 해당 유형의 캠페인들도 함께 토글
      campaignList.filter(c=>String(c.type)===String(cb.value)).forEach(c=>{
        if(cb.checked) fstate.campaigns.add(c.campaign); else fstate.campaigns.delete(c.campaign);
      });
      renderFn(data);
    };
  });
  panel.querySelectorAll('input[data-kind="account"]').forEach(cb=>{
    cb.onchange = ()=>{
      campaignList.filter(c=>accountOfCampaign(c.campaign)===cb.value).forEach(c=>{
        if(cb.checked) fstate.campaigns.add(c.campaign); else fstate.campaigns.delete(c.campaign);
      });
      allTypes.forEach(t=>{
        const campsOfType = campaignList.filter(c=>String(c.type)===String(t)).map(c=>c.campaign);
        if(campsOfType.some(c=>fstate.campaigns.has(c))) fstate.types.add(t); else fstate.types.delete(t);
      });
      renderFn(data);
    };
  });
  panel.querySelectorAll('input[data-kind="campaign"]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) fstate.campaigns.add(cb.value); else fstate.campaigns.delete(cb.value);
      // 캠페인명 체크에 맞춰 유형 체크박스 표시도 동기화 (그 유형의 캠페인이 하나라도 선택돼 있으면 유형도 선택된 것으로 표시)
      allTypes.forEach(t=>{
        const campsOfType = campaignList.filter(c=>String(c.type)===String(t)).map(c=>c.campaign);
        const anySelected = campsOfType.some(c=>fstate.campaigns.has(c));
        if(anySelected) fstate.types.add(t); else fstate.types.delete(t);
      });
      renderFn(data);
    };
  });
  document.getElementById('filterSelectAllBtn').onclick = ()=>{
    fstate.types = new Set(allTypes);
    fstate.campaigns = new Set(campaignList.map(c=>c.campaign));
    renderFn(data);
  };
  document.getElementById('filterDeselectAllBtn').onclick = ()=>{
    fstate.types = new Set();
    fstate.campaigns = new Set();
    renderFn(data);
  };
}

/* 필터 접기 버튼 — 어느 페이지에서든 화면 오른쪽 가장자리에 붙는다. */
(function(){
  function initPanelToggle(){
    if(document.getElementById('panelToggleBtn')) return;
    if(!document.querySelector('.main-layout')) return;
    var KEY='kmPanelOff';
    var btn=document.createElement('button');
    btn.id='panelToggleBtn'; btn.type='button';
    function paint(){
      var off=document.body.classList.contains('panel-off');
      btn.textContent = off ? '필터 펴기 ‹' : '필터 접기 ›';
      btn.title = off ? '오른쪽 필터를 다시 표시' : '오른쪽 필터를 숨기고 넓게 보기';
    }
    try{ if(localStorage.getItem(KEY)==='1') document.body.classList.add('panel-off'); }catch(e){}
    btn.onclick=function(){
      document.body.classList.toggle('panel-off');
      try{ localStorage.setItem(KEY, document.body.classList.contains('panel-off')?'1':'0'); }catch(e){}
      paint();
      window.dispatchEvent(new Event('resize')); // 차트가 새 폭에 맞게 다시 그려지도록
    };
    paint();
    document.body.appendChild(btn);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', initPanelToggle);
  else initPanelToggle();
  setTimeout(initPanelToggle, 1500);
})();
