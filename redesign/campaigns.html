function monthFirstDay(label){ const t=String(label||'').replace('.','-'); return t?`${t}-01`:null; }
function monthLastDay(label){ const t=String(label||'').split('.'); if(t.length<2) return null;
  const y=+t[0], m=+t[1]; return `${y}-${String(m).padStart(2,'0')}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`; }
function dayToMonthLabel(d){ return String(d||'').slice(0,7).replace('-','.'); }
function syncMonthRangeToDays(key, allMonths, dr){
  if(!dr || !dr.start || !dr.end) return false;
  const labels = (allMonths||[]).map(m=>m.label);
  const si = labels.indexOf(dayToMonthLabel(dr.start));
  const ei = labels.indexOf(dayToMonthLabel(dr.end));
  if(si<0 || ei<0) return false;
  const a = Math.min(si,ei), b = Math.max(si,ei);
  const cur = monthRangeState[key] || {};
  if(cur.start===labels[a] && cur.end===labels[b]) return false;
  monthRangeState[key] = { start: labels[a], end: labels[b] };
  if(typeof compareMonthState !== 'undefined') compareMonthState[key] = 'AUTO';
  return true;
}

function renderCampaignsPage(data){
  const key = 'client:' + slugify(data.name);
  const fstate = ensureFilterState(key, data);
  applyAccentColor(data.color);
  const allMonths = data.months || [];
  ensureMonthRange(key, allMonths);
  const months = monthsInRange(allMonths, monthRangeState[key]);
  const isMultiMonth = months.length > 1;
  const campaignList = mergedCampaignList(data, months);
  // 기간을 바꾸면 목록이 달라지므로, 처음 보는 캠페인은 기본으로 켜 둔다(사용자가 끈 건 그대로 유지).
  if(!fstate.seen) fstate.seen = new Set(fstate.campaigns);
  campaignList.forEach(c=>{ if(!fstate.seen.has(c.campaign)){ fstate.seen.add(c.campaign); fstate.campaigns.add(c.campaign); } });
  // 사용자가 일부러 전체 해제한 상태는 그대로 존중한다(자동으로 다시 켜지 않음).
  // 다만 '한 번도 본 적 없는' 캠페인만 켜는 위 규칙 때문에, 예전 상태가 지금 목록과
  // 전혀 겹치지 않는 경우(업체·기간이 바뀌어 목록이 통째로 달라진 경우)에는 빈 화면이
  // 되므로, 그때만 새 목록을 기본 선택으로 되돌린다.
  if(campaignList.length && !campaignList.some(c=>fstate.seen.has(c.campaign))){
    campaignList.forEach(c=>{ fstate.campaigns.add(c.campaign); fstate.seen.add(c.campaign); });
  }
  campaignList.forEach(c=>{ if(c.type!=null && !fstate.types.has(c.type) && !fstate.seenTypes) fstate.types.add(c.type); });
  const allTypes = [...new Set(campaignList.map(c=>c.type))];
  const isDB = data.bizType === 'DB';

  if(!(key in cpSortState)) cpSortState[key] = { field:'default', dir:'desc' };
  const sort = cpSortState[key];

  // 📊 캠페인별 일별 비교 — 옛 daily.html 전용 페이지에서 이 페이지로 이전한 패널. dailyByCampaign(날짜×캠페인) 기반.
  if(!(key in dayCompareCampaigns)) dayCompareCampaigns[key] = [];
  if(!(key in dayCompareMetric)) dayCompareMetric[key] = 'conv';
  if(isDB && dayCompareMetric[key]==='roas') dayCompareMetric[key] = 'conv';
  if(!isDB && dayCompareMetric[key]==='cpa') dayCompareMetric[key] = 'roas';
  const compareCampaigns = dayCompareCampaigns[key];
  const compareMetric = dayCompareMetric[key];
  function enrichDayRow(r){
    return { ...r, cpa: r.conv>0 ? Math.round(r.cost*10000/r.conv) : null, ctr: r.impressions>0 ? (r.clicks/r.impressions*100) : 0, cvr: r.clicks>0 ? (r.conv/r.clicks*100) : 0, roas: r.cost>0 ? (r.revenue/r.cost*100) : 0 };
  }
  // 캘린더 날짜 범위 필터용 최소/최대 날짜 — 선택된 월 구간(months) 안의 dailyByCampaign 실제 날짜 기준
  const allDbcDates = [];
  months.forEach(m=>(m.dailyByCampaign||[]).forEach(r=>allDbcDates.push(r.date)));
  allDbcDates.sort((a,b)=>dateKey(a).localeCompare(dateKey(b)));
  const dayBoundsMin = allDbcDates.length ? toDateInputValue(allDbcDates[0]) : null;
  const dayBoundsMax = allDbcDates.length ? toDateInputValue(allDbcDates[allDbcDates.length-1]) : null;
  if(!(key in dayRangeState)){ dayRangeState[key] = { start: null, end: null }; dayPresetChoice[key] = null; }
  if(!(key in dayRangeCustomOpen)) dayRangeCustomOpen[key] = false;
  {
    const dr = dayRangeState[key];
    if(dayBoundsMin && dayBoundsMax){
      // 데이터 범위를 벗어나면 통째로 지우지 말고 범위 안으로 당긴다.
      // (통째로 지우면 '최근 7일' 같은 버튼이 눌린 걸로 인식이 안 돼서 색이 안 들어감)
      if(dr.start && dr.start < dayBoundsMin) dr.start = dayBoundsMin;
      if(dr.start && dr.start > dayBoundsMax) dr.start = null;
      if(dr.end && dr.end > dayBoundsMax) dr.end = dayBoundsMax;
      if(dr.end && dr.end < dayBoundsMin) dr.end = null;
      if(dr.start && dr.end && dr.start > dr.end) { dr.start = null; dr.end = null; }
    } else { dr.start = null; dr.end = null; }
  }
  const hasDayFilter = !!dayBoundsMin && !!(dayRangeState[key].start || dayRangeState[key].end);
  const compareData = {};
  if(compareCampaigns.length){
    compareCampaigns.forEach(camp=>{
      const map = {};
      months.forEach(m=>{
        (m.dailyByCampaign||[]).forEach(r=>{
          if(r.campaign!==camp) return;
          if(!map[r.date]) map[r.date] = { date:r.date, impressions:0, clicks:0, cost:0, conv:0, revenue:0 };
          map[r.date].impressions += r.impressions||0; map[r.date].clicks += r.clicks||0; map[r.date].cost += r.cost||0; map[r.date].conv += r.conv||0; map[r.date].revenue += r.revenue||0;
        });
      });
      let arr = Object.values(map).sort((a,b)=>dateKey(a.date).localeCompare(dateKey(b.date))).map(enrichDayRow);
      if(hasDayFilter) arr = filterRowsByDayRange(arr, dayRangeState[key]);
      compareData[camp] = arr;
    });
  }
  const dayCompareLabels = compareCampaigns.length ? [...new Set(compareCampaigns.flatMap(c=>(compareData[c]||[]).map(r=>r.date)))].sort((a,b)=>dateKey(a).localeCompare(dateKey(b))) : [];

  let rows = hasDayFilter ? mergeCampaignRowsByDayRange(months, fstate, dayRangeState[key]) : mergeCampaignRows(months, fstate);
  applyCampaignStatus(rows, months, data);
  rows = rows.map(r=>({ ...r, cpa: r.conv>0 ? Math.round(r.cost*10000/r.conv) : null, roas: r.cost>0 ? (r.revenue/r.cost*100) : 0,
    ctr: r.impressions>0 ? (r.clicks/r.impressions*100) : 0, cvr: r.clicks>0 ? (r.conv/r.clicks*100) : 0,
    cpc: r.clicks>0 ? (r.cost*10000/r.clicks) : null }));
  function applySort(list, sortState, defaultField){
    const field = sortState.field==='default' ? defaultField : sortState.field;
    const mult = sortState.dir==='asc' ? 1 : -1;
    return [...list].sort((a,b)=>{
      // null만 처리하면 날짜 필터 상황에서 undefined - undefined = NaN이 나와 비교 함수가 일관성을 잃고
      // 브라우저마다 순서가 달라짐. 숫자가 아닌 값은 전부 맨 뒤로 보냄.
      let av=a[field], bv=b[field];
      if(!Number.isFinite(av)) av = -Infinity;
      if(!Number.isFinite(bv)) bv = -Infinity;
      return (av-bv)*mult;
    });
  }
  rows = applySort(rows, sort, isDB?'cost':'revenue');
  /* 조건 좁히기 — 키워드 페이지와 같은 도구(_kmtable)를 쓴다.
     캠페인이 수십~수백 개인 계정에서 "10만원 넘게 쓴 것만" 같은 식으로 볼 대상을 줄인다. */
  const kmSt = kmFilterState('camp:' + key);
  const kmTotalBefore = rows.length;
  rows = kmApplyFilter(rows, kmSt, { nameKey:'campaign' });

  // 전기간 대비 추이: 기준 기간의 직전 기간 데이터 확보
  // refMonth = 현재 보고 있는 구간의 마지막 달(단일 월/전체 누적/임의 구간 모두 이 정의 하나로 처리)
  let refMonth = months.length ? months[months.length-1] : null;
  if(!(key in compareMonthState)) compareMonthState[key] = 'AUTO';
  let prevMonth = null;
  if(refMonth){
    if(compareMonthState[key]!=='AUTO'){
      prevMonth = allMonths.find(m=>m.label===compareMonthState[key]) || null;
      if(prevMonth && prevMonth.label===refMonth.label) prevMonth = null;
    } else {
      const idx = allMonths.findIndex(m=>m.label===refMonth.label);
      if(idx>0) prevMonth = allMonths[idx-1];
    }
  }
  /* 날짜 필터가 켜져 있으면 현재 값은 "최근 7일"처럼 잘린 값인데, 비교 대상은 '직전 달 한 달 전체'였음.
     7일치 비용과 한 달치 비용을 나누니 표 전체에 ▼85% 같은 값이 찍혀서 추이가 의미를 잃었음.
     그래서 필터가 걸린 동안엔 '바로 앞의 같은 길이 날짜 구간'을 잘라서 비교함(직전 달로 넘어가도 됨).
     그 구간에 데이터가 아예 없으면 추이 표시를 통째로 끔 — 틀린 화살표보다 없는 편이 낫다. */
  const enrichRow = r => ({ ...r,
    cpa: r.conv>0 ? Math.round(r.cost*10000/r.conv) : null, roas: r.cost>0 ? (r.revenue/r.cost*100) : 0,
    ctr: r.impressions>0 ? (r.clicks/r.impressions*100) : 0, cvr: r.clicks>0 ? (r.conv/r.clicks*100) : 0,
    cpc: r.clicks>0 ? (r.cost*10000/r.clicks) : null });
  let prevMap = {};
  let prevPeriodLabel = null;   // 표 위 안내문에 쓸 "무엇과 비교했는지"
  let dayTrendOff = false;      // 날짜 필터 상태에서 비교 구간을 못 만든 경우
  if(hasDayFilter){
    const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const curStart = dayRangeState[key].start || dayBoundsMin;
    const curEnd   = dayRangeState[key].end   || dayBoundsMax;
    const d1 = new Date(curStart+'T00:00:00'), d2 = new Date(curEnd+'T00:00:00');
    const lenDays = Math.round((d2-d1)/86400000) + 1;
    if(lenDays>0 && isFinite(lenDays)){
      const pEnd = new Date(d1.getTime() - 86400000);
      const pStart = new Date(pEnd.getTime() - (lenDays-1)*86400000);
      const prevRange = { start: ymd(pStart), end: ymd(pEnd) };
      const prevRows = mergeCampaignRowsByDayRange(allMonths, fstate, prevRange);
      if(prevRows.length){
        prevRows.forEach(r=>{ prevMap[r.campaign] = enrichRow(r); });
        prevPeriodLabel = `${prevRange.start} ~ ${prevRange.end} (같은 ${lenDays}일)`;
      } else {
        dayTrendOff = true;
      }
    } else {
      dayTrendOff = true;
    }
  } else if(prevMonth){
    mergeCampaignRows([prevMonth], fstate).forEach(r=>{ prevMap[r.campaign] = enrichRow(r); });
    prevPeriodLabel = prevMonth.label;
  }
  const hasPrevForTrend = Object.keys(prevMap).length > 0;
  function pctOf(curr, prev){
    if(prev===null || prev===undefined || curr===null || curr===undefined) return null;
    if(prev===0) return curr>0 ? 100 : null;
    return (curr-prev)/prev*100;
  }
  /* goodDir: 'up'=올라가면 좋음(전환·매출·ROAS·CTR·CVR), 'down'=내려가야 좋음(비용·CPA·평균노출순위).
     호출부는 방향을 제대로 넘기고 있었는데 함수가 무시해서, 비용이나 CPA가 올라도 초록(▲)으로 보였음. */
  function cellTrend(pct, goodDir){
    if(pct===null || pct===undefined || isNaN(pct) || Math.abs(pct)<5) return '';
    const rising = pct >= 0;
    const isGood = (goodDir === 'down') ? !rising : rising;
    return `<span style="margin-left:5px;font-size:12px;font-weight:700;color:${isGood?'var(--up)':'var(--down)'};">${rising?'▲':'▼'}${Math.abs(pct).toFixed(0)}%</span>`;
  }
  rows = rows.map(r=>{
    const prev = hasPrevForTrend ? prevMap[r.campaign] : null;
    const isNewCamp = hasPrevForTrend && !prev;
    const trends = prev ? {
      cost: pctOf(r.cost, prev.cost), conv: pctOf(r.conv, prev.conv), revenue: pctOf(r.revenue, prev.revenue),
      cpa: pctOf(r.cpa, prev.cpa), roas: pctOf(r.roas, prev.roas), ctr: pctOf(r.ctr, prev.ctr), cvr: pctOf(r.cvr, prev.cvr),
      /* roas는 '상대 변화율(%)'이라 %p로 쓰면 안 된다. ROAS 300→360%는 상대 20%지만 실제로는 60%p다.
         인사이트 문구와 판단 기준은 %p를 써야 하므로 진짜 차이를 따로 담는다(대시보드와 같은 방식). */
      roasPP: (r.roas!==null && r.roas!==undefined && prev.roas!==null && prev.roas!==undefined) ? (r.roas - prev.roas) : null,
      cpc: pctOf(r.cpc, prev.cpc), avgRank: pctOf(r.avgRank, prev.avgRank)
    } : {};
    return { ...r, isNewCamp, trends };
  });
  const pinnedSet = new Set(data.pinnedCampaigns || []);
  rows.sort((a,b)=> (pinnedSet.has(b.campaign)?1:0) - (pinnedSet.has(a.campaign)?1:0));
  if(!(key in expandedCampaignsState)) expandedCampaignsState[key] = new Set();
  const expandedCampaigns = expandedCampaignsState[key];

  // 💡 캠페인 성과 인사이트 (현재 선택된 기간·필터·비교 기준 기준)
  // warn 항목은 생성 시점에 severity(원화 기준 추정 영향 규모, 단위: 만원)를 함께 붙여서
  // 텍스트 재파싱 없이 "실제로 돈이 얼마나 걸린 문제인지" 기준으로 정렬할 수 있게 함.
  // 캠페인 간(같은 기간, best vs 문제 캠페인) CTR·CVR·CPC·평균노출순위를 비교해서
  // "타겟팅/소재/입찰가" 중 어디가 문제일 가능성이 높은지 추정 텍스트를 만들어 붙임.
  // 시간 축(직전 기간 대비)이 아니라 캠페인 축(같은 기간, 잘하는 캠페인 대비) 비교라는 점이
  // decomposeCpaChange()(직전 기간 대비 CPC/CVR 요인분해)와 다름.
  function diagnoseCampaignIssue(worst, best){
    const reasons = [];
    const lowImpression = worst.impressions < INSIGHT_THRESHOLDS.DIAG_MIN_IMPRESSIONS;
    const badRank = worst.avgRank!==null && best.avgRank!==null && worst.avgRank - best.avgRank >= 2;
    const lowCtr = best.ctr>0 && worst.ctr < best.ctr*INSIGHT_THRESHOLDS.DIAG_LOW_CTR_RATIO && worst.impressions>=INSIGHT_THRESHOLDS.DIAG_MIN_IMPRESSIONS;
    const lowCvr = best.cvr>0 && worst.cvr < best.cvr*INSIGHT_THRESHOLDS.DIAG_LOW_CVR_RATIO && worst.clicks>=INSIGHT_THRESHOLDS.DIAG_LOW_CVR_MIN_CLICKS;
    const highCpc = best.cpc!==null && worst.cpc!==null && worst.cpc > best.cpc*INSIGHT_THRESHOLDS.DIAG_HIGH_CPC_RATIO;

    if(lowImpression || badRank){
      const rankTxt = badRank ? ` (평균노출순위 ${worst.avgRank.toFixed(1)}위, '${best.campaign}'은 ${best.avgRank.toFixed(1)}위)` : '';
      reasons.push(`입찰가·노출 경쟁에서 밀리고 있을 수 있어요${rankTxt} — 입찰가나 일예산을 올려서 노출이 늘어나는지 확인해보세요.`);
    }
    if(lowCvr){
      reasons.push(`클릭 대비 전환이 낮아요(CVR ${worst.cvr.toFixed(2)}%, '${best.campaign}' ${best.cvr.toFixed(2)}%) — 타겟팅이나 랜딩페이지(방문자와 실제 니즈의 불일치)를 점검해보세요.`);
    }
    if(lowCtr){
      reasons.push(`노출 대비 클릭이 낮아요(CTR ${worst.ctr.toFixed(2)}%, '${best.campaign}' ${best.ctr.toFixed(2)}%) — 소재 문구나 이미지 교체를 검토해보세요.`);
    }
    if(highCpc && !lowCvr && !lowCtr){
      reasons.push(`클릭당 비용이 높아요(CPC ${Math.round(worst.cpc).toLocaleString('ko-KR')}원, '${best.campaign}' ${Math.round(best.cpc).toLocaleString('ko-KR')}원) — 입찰가나 키워드 경쟁 강도를 점검해보세요.`);
    }
    if(!reasons.length) return '타겟팅이나 소재 점검을 추천해요.';
    return reasons[0];
  }
  function generateCampaignInsights(){
    const insights = [];
    const MIN_CONV = INSIGHT_THRESHOLDS.MIN_SAMPLE_CONV, MIN_COST_MAN = INSIGHT_THRESHOLDS.MIN_SAMPLE_COST_MAN;
    if(isDB){
      const withConv = rows.filter(r=>r.cpa!==null && r.conv>=MIN_CONV);
      if(withConv.length>=2){
        const best = withConv.reduce((a,b)=>a.cpa<b.cpa?a:b);
        const worst = withConv.reduce((a,b)=>a.cpa>b.cpa?a:b);
        // 전환수로 가중한 전체 평균 CPA — best 캠페인이 이 평균에 비해 지나치게 낮으면(표본이 적어 우연히 CPA가
        // 튄 경우가 많음) "예산을 옮기면 N건 더 나온다" 추정이 (예산 / best.cpa)로 인해 비현실적으로 커짐.
        // 예: 브랜드키워드 캠페인 CPA가 358원처럼 튀면 288만원 이동만으로 "8031건 증가" 같은 값이 나옴.
        const totalConvAll = withConv.reduce((s,r)=>s+r.conv,0);
        const totalCostAllMan = withConv.reduce((s,r)=>s+r.cost,0);
        const avgCpaAll = totalConvAll>0 ? (totalCostAllMan*10000/totalConvAll) : null;
        const bestCpaIsUnrealistic = avgCpaAll!==null && best.cpa < avgCpaAll/5;
        insights.push({type:'good', text:`'${best.campaign}' 캠페인이 가장 효율적이에요 (CPA ${best.cpa.toLocaleString('ko-KR')}원, 전환 ${best.conv}건 기준)`});
        if(worst.campaign!==best.campaign){
          // severity = 이 캠페인이 best 대비 CPA 초과분으로 날린 추정 비용(만원)
          const wasteMan = Math.max(0, worst.cost - (worst.conv*best.cpa/10000));
          const diagnosis = diagnoseCampaignIssue(worst, best);
          insights.push({type:'warn', severity: wasteMan, campaign: worst.campaign, kind:'high-cpa', text:`'${worst.campaign}' 캠페인은 CPA가 ${worst.cpa.toLocaleString('ko-KR')}원으로 높아요 (전환 ${worst.conv}건 기준). ${diagnosis}`});
          if(worst.cpa > best.cpa*1.3 && !bestCpaIsUnrealistic){
            const shiftMan = Math.round(worst.cost*0.3*10)/10;
            if(shiftMan>=1){
              const shiftWon = shiftMan*10000;
              const gain = Math.round(shiftWon/best.cpa) - Math.round(shiftWon/worst.cpa);
              if(gain>=1) insights.push({type:'good', text:`💡 '${worst.campaign}' 예산 중 ${fmtMan(shiftMan)}원(약 30%)을 '${best.campaign}'로 옮기면, 같은 총예산으로 전환이 약 ${gain}건 더 나올 수 있어요 (추정치).`});
            }
          }
        }
      }
      const zeroConvBase = rows.filter(r=>r.impressions>=INSIGHT_THRESHOLDS.DIAG_MIN_IMPRESSIONS && r.conv>=MIN_CONV);
      const avgCtrForZero = zeroConvBase.length ? zeroConvBase.reduce((a,r)=>a+r.ctr,0)/zeroConvBase.length : null;
      rows.filter(r=>r.conv===0 && r.cost>1).slice(0,3).forEach(r=>{
        // severity = 전환 0건인 채로 소진한 비용 전액(만원) — 가장 명백한 손실이라 CPA 상승 경고보다 우선순위가 높아야 함
        let diagnosis;
        if(r.clicks>=INSIGHT_THRESHOLDS.ZERO_CONV_HIGH_CLICKS){
          diagnosis = `클릭이 ${r.clicks}건이나 있었는데도 전환이 없었어요 — 소재보다는 랜딩페이지나 타겟팅(방문자와 실제 구매/상담 니즈의 불일치)을 먼저 점검해보세요.`;
        } else if(r.impressions<INSIGHT_THRESHOLDS.DIAG_MIN_IMPRESSIONS || (r.avgRank!==null && r.avgRank>5)){
          const rankTxt = (r.avgRank!==null && r.avgRank>5) ? ` (평균노출순위 ${r.avgRank.toFixed(1)}위)` : '';
          diagnosis = `노출 자체가 적어요(${r.impressions.toLocaleString('ko-KR')}회${rankTxt}) — 입찰가가 낮아 노출 경쟁에서 밀리고 있을 수 있어요. 입찰가나 일예산을 올려서 노출이 늘어나는지 먼저 확인해보세요.`;
        } else if(avgCtrForZero!==null && r.impressions>=INSIGHT_THRESHOLDS.DIAG_MIN_IMPRESSIONS && r.ctr < avgCtrForZero*INSIGHT_THRESHOLDS.ZERO_CONV_LOW_CTR_RATIO){
          diagnosis = `노출 대비 클릭이 적어요(CTR ${r.ctr.toFixed(2)}%, 전체 평균 ${avgCtrForZero.toFixed(2)}%) — 소재 문구나 이미지가 매력적이지 않을 수 있어요. 소재 교체를 검토해보세요.`;
        } else {
          diagnosis = '예산 재배치를 검토해보세요.';
        }
        insights.push({type:'warn', severity: r.cost, campaign: r.campaign, kind:'zero-conv', text:`'${r.campaign}' 캠페인은 ${fmtMan(r.cost)}원을 썼는데 전환이 0건이에요. ${diagnosis}`});
      });
    } else {
      const withCost = rows.filter(r=>r.cost>=MIN_COST_MAN);
      if(withCost.length>=2){
        const best = withCost.reduce((a,b)=>a.roas>b.roas?a:b);
        const worst = withCost.reduce((a,b)=>a.roas<b.roas?a:b);
        insights.push({type:'good', text:`'${best.campaign}' 캠페인 ROAS가 ${best.roas.toFixed(0)}%로 가장 높아요 (비용 ${fmtMan(best.cost)}원 기준).`});
        if(worst.campaign!==best.campaign && worst.roas<100){
          // severity = 손익분기(ROAS 100%) 대비 못 미친 매출 격차(만원)
          const gapMan = Math.max(0, worst.cost - worst.revenue);
          const diagnosis = diagnoseCampaignIssue(worst, best);
          insights.push({type:'warn', severity: gapMan, campaign: worst.campaign, kind:'roas-low', text:`'${worst.campaign}' 캠페인은 ROAS가 ${worst.roas.toFixed(0)}%로 손익분기 이하예요 (비용 ${fmtMan(worst.cost)}원 기준). ${diagnosis}`});
        }
      }
    }
    // 직전 기간 대비 큰 변화가 있는 캠페인 (트렌드가 이미 계산돼 있음)
    const bigMoves = rows.filter(r=>{
      const t = r.trends||{};
      return (isDB
        ? (t.cpa!==null && t.cpa!==undefined && Math.abs(t.cpa)>=INSIGHT_THRESHOLDS.BIG_MOVE_CPA_PCT && r.conv>=MIN_CONV)
        : (t.roasPP!==null && t.roasPP!==undefined && Math.abs(t.roasPP)>=INSIGHT_THRESHOLDS.BIG_MOVE_ROAS_PP && r.cost>=MIN_COST_MAN));
    }).slice(0,3);
    bigMoves.forEach(r=>{
      const t = r.trends;
      // severity = 이번 기간 비용 규모(만원) × 악화 정도 — 비용이 큰 캠페인의 급격한 악화를 우선 노출
      if(isDB){
        const isBad = t.cpa>0;
        insights.push({type: isBad?'warn':'good', severity: isBad ? r.cost * (Math.abs(t.cpa)/100) : 0, text:`'${r.campaign}' 캠페인, 직전 기간 대비 CPA가 ${Math.abs(t.cpa).toFixed(0)}% ${t.cpa<=0?'개선':'상승'}됐어요.`});
      } else {
        const isBad = t.roasPP<0;
        insights.push({type: isBad?'warn':'good', severity: isBad ? r.cost * (Math.abs(t.roasPP)/100) : 0, text:`'${r.campaign}' 캠페인, 직전 기간 대비 ROAS가 ${Math.abs(t.roasPP).toFixed(0)}%p ${t.roasPP>=0?'상승':'하락'}했어요.`});
      }
    });
    if(!insights.length) insights.push({type:'neutral', text:'아직 인사이트를 뽑기엔 데이터가 더 필요해요.'});
    return insights;
  }
  // 잘하고 있는 부분(good)을 먼저, 확인이 필요한 부분(warn)을 심각도(severity, 만원 기준 추정 영향 규모) 순으로 묶어서 보여줌.
  // severity는 generateCampaignInsights에서 원본 데이터로 직접 계산해 붙인 값 — 텍스트를 다시 파싱하지 않음
  // (텍스트 속 %만 보면 "39% 상승"이 "232만원 날림"보다 커 보이는 왜곡이 생길 수 있어서).
  // 상위 2개만 펼쳐서 보여주고 나머지는 접어둠(스크롤 부담 감소).
  function buildCampaignInsightsHTML(insights){
    const icon = t => t==='good' ? '📈' : t==='warn' ? '⚠️' : 'ℹ️';
    const color = t => t==='good' ? 'var(--up)' : t==='warn' ? 'var(--down)' : 'var(--text)';
    const appliedSet = new Set(data.appliedSuggestions || []);
    const currentMonthLabel = refMonth ? refMonth.label : (allMonths.length ? allMonths[allMonths.length-1].label : '');
    const applyToggleHtml = i => {
      if(!i.campaign || !i.kind || !currentMonthLabel) return '';
      const k = suggestionKey(currentMonthLabel, i.campaign, i.kind);
      const isApplied = appliedSet.has(k);
      return isApplied
        ? `<button class="applied-toggle-btn" data-key="${k}" data-applied="1" style="flex-shrink:0;background:rgba(74,222,154,.12);border:1px solid rgba(74,222,154,.4);color:var(--up);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;">✓ 적용함</button>`
        : `<button class="applied-toggle-btn" data-key="${k}" data-applied="0" style="flex-shrink:0;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer;white-space:nowrap;">적용 표시</button>`;
    };
    const row = i => `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--text);padding:5px 0;"><span style="display:flex;gap:8px;"><span>${icon(i.type)}</span><span style="color:${color(i.type)};">${i.text}</span></span>${applyToggleHtml(i)}</div>`;
    const good = insights.filter(i=>i.type==='good');
    const warn = insights.filter(i=>i.type==='warn').sort((a,b)=>(b.severity||0)-(a.severity||0));
    const neutral = insights.filter(i=>i.type!=='good'&&i.type!=='warn');
    const groupLabel = (text, count, extra) => `<div style="display:flex;align-items:center;justify-content:space-between;margin:${count?'10px':'0'} 0 2px;"><span style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;">${text}</span>${extra||''}</div>`;
    let html = '';
    if(good.length) html += groupLabel('잘하고 있어요', 0) + good.map(row).join('');
    if(warn.length){
      const TOP_N = 2;
      const topWarn = warn.slice(0, TOP_N);
      const restWarn = warn.slice(TOP_N);
      const badge = `<span style="font-size:11px;color:var(--down);font-weight:700;background:rgba(255,107,133,.14);padding:2px 8px;border-radius:10px;">심각도 순 ${warn.length}건</span>`;
      html += groupLabel('확인이 필요해요', good.length, badge) + topWarn.map(row).join('');
      if(restWarn.length){
        const detailsId = 'warnMore_' + Math.random().toString(36).slice(2,8);
        html += `<details style="margin-top:2px;"><summary style="cursor:pointer;font-size:12px;color:var(--muted);padding:4px 0;">나머지 ${restWarn.length}건 더 보기</summary><div id="${detailsId}">${restWarn.map(row).join('')}</div></details>`;
      }
    }
    if(neutral.length) html += neutral.map(row).join('');
    return html;
  }
  const campaignInsights = generateCampaignInsights();

  // 목표(KPI) 대비 캠페인별 갭 — 목표는 input.html에서 업체 단위로 설정되는데(전체 CPA/ROAS 목표),
  // 정작 "어떤 캠페인 때문에 목표를 못 맞추는지"는 index.html의 goalBadge(업체 전체 요약)만으로는
  // 알 수 없었음. 같은 목표를 캠페인 단위로 적용해서 갭이 큰 캠페인을 바로 짚어줌.
  let goalGapInfo = null;
  if(data.goal && data.goal.target){
    const target = Number(data.goal.target);
    const metricOk = isDB ? data.goal.metric==='cpa' : data.goal.metric==='roas';
    if(target>0 && metricOk){
      // 표본 부족한 캠페인은 갭 계산에서 제외 — 위 인사이트 계산과 같은 최소 표본 기준(INSIGHT_THRESHOLDS)을 재사용
      /* 이미 꺼둔 캠페인(on===false)은 목표 미달 경고에서 제외 — 지난달에 끈 캠페인을 매달 다시
         "목표 미달"로 올려주면 조치할 것도 없는 항목이 리스트를 차지함. 상태를 모르면(undefined)
         기존과 동일하게 포함. */
      const live = rows.filter(r=>r.on !== false);
      const eligible = isDB
        ? live.filter(r=>r.conv>=INSIGHT_THRESHOLDS.MIN_SAMPLE_CONV && r.cpa!==null)
        : live.filter(r=>r.cost>=INSIGHT_THRESHOLDS.MIN_SAMPLE_COST_MAN);
      const withGap = eligible.map(r=>{
        const curr = isDB ? r.cpa : r.roas;
        const gapPct = isDB ? ((curr-target)/target*100) : ((target-curr)/target*100); // 양수면 목표 미달
        return { ...r, curr, gapPct, met: isDB ? curr<=target : curr>=target };
      });
      const missing = withGap.filter(r=>!r.met).sort((a,b)=>b.gapPct-a.gapPct).slice(0,5);
      goalGapInfo = { target, missing, totalEligible: withGap.length, totalMissing: withGap.filter(r=>!r.met).length };
    }
  }

  // CPA/ROAS 원인 분해 — 항등식 기반 추정치(실제 원인은 데이터로 확정된 사실이 아니라 가설이며,
  // 참고한 타사 대시보드도 같은 방식으로 "CPC 요인 X% / CVR 요인 Y%"를 계산해서 보여줌).
  // CPA = CPC / CVR 이므로, CPA 변화율은 로그 근사로 CPC 변화율 + (-CVR 변화율)로 분해 가능함.
  // ROAS = CVR * 객단가(revenue/conv) / CPC 이지만, 데이터에 객단가 변동을 분리할 근거가 약해
  // 여기서는 ROAS도 CPA와 동일하게 "클릭단가(CPC) 요인 vs 전환율(CVR) 요인"으로만 분해함(단순화된 근사치).
  function decomposeCpaChange(curr, prev){
    if(!prev || curr.cpc===null || prev.cpc===null || curr.cvr<=0 || prev.cvr<=0 || curr.cpc<=0 || prev.cpc<=0) return null;
    const cpcChangeLn = Math.log(curr.cpc / prev.cpc);
    const cvrChangeLn = Math.log(curr.cvr / prev.cvr);
    const totalAbsLn = Math.abs(cpcChangeLn) + Math.abs(cvrChangeLn);
    if(totalAbsLn < 0.0001) return { cpcSharePct: 50, cvrSharePct: 50, cpcChangePct: 0, cvrChangePct: 0, dominant: null };
    const cpcSharePct = Math.round(Math.abs(cpcChangeLn) / totalAbsLn * 100);
    return {
      cpcSharePct, cvrSharePct: 100 - cpcSharePct,
      cpcChangePct: (curr.cpc/prev.cpc - 1) * 100,
      cvrChangePct: (curr.cvr/prev.cvr - 1) * 100,
      dominant: cpcSharePct >= 55 ? 'cpc' : (100-cpcSharePct >= 55 ? 'cvr' : null)
    };
  }
  const decompCandidates = hasPrevForTrend ? rows
    .filter(r => (isDB ? r.conv>=5 : r.cost>=5) && prevMap[r.campaign])
    .map(r => ({ row:r, decomp: decomposeCpaChange(r, prevMap[r.campaign]) }))
    .filter(x => x.decomp)
    .sort((a,b)=> Math.abs(isDB?(b.row.trends.cpa||0):(b.row.trends.roas||0)) - Math.abs(isDB?(a.row.trends.cpa||0):(a.row.trends.roas||0)))
    .slice(0,5)
    : [];
  function buildDecompHTML(){
    if(!hasPrevForTrend) return `<div style="font-size:12px;color:var(--muted);">비교할 직전 기간이 없어서 원인 분해를 볼 수 없어요.</div>`;
    if(!decompCandidates.length) return `<div style="font-size:12px;color:var(--muted);">원인 분해를 계산하기엔 데이터(전환수/비용)가 아직 부족해요.</div>`;
    const cardHTML = ({row, decomp})=>{
      const metricLabel = isDB ? 'CPA' : 'ROAS';
      const metricPct = isDB ? row.trends.cpa : row.trends.roas;
      const metricDir = isDB ? (metricPct>=0?'상승':'개선') : (metricPct>=0?'상승':'하락');
      const metricColor = isDB ? (metricPct>=0?'var(--down)':'var(--up)') : (metricPct>=0?'var(--up)':'var(--down)');
      const dominantText = decomp.dominant==='cpc' ? '주로 클릭단가(CPC) 변화 때문' : decomp.dominant==='cvr' ? '주로 전환율(CVR) 변화 때문' : 'CPC·CVR이 비슷하게 영향';
      return `<div style="padding:10px 0;border-bottom:1px solid var(--border);">
        <div style="font-size:12px;color:var(--text);font-weight:600;">${row.campaign} <span style="font-weight:400;color:${metricColor};">${metricLabel} ${Math.abs(metricPct||0).toFixed(0)}% ${metricDir}</span></div>
        <div style="font-size:12px;color:var(--muted);margin-top:3px;">${dominantText} — CPC 요인 ${decomp.cpcSharePct}% (${decomp.cpcChangePct>=0?'+':''}${decomp.cpcChangePct.toFixed(0)}%) · CVR 요인 ${decomp.cvrSharePct}% (${decomp.cvrChangePct>=0?'+':''}${decomp.cvrChangePct.toFixed(0)}%)</div>
        <div style="display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px;">
          <div style="width:${decomp.cpcSharePct}%;background:var(--accent);"></div>
          <div style="width:${decomp.cvrSharePct}%;background:var(--border);"></div>
        </div>
      </div>`;
    };
    const TOP_N = 2;
    const top = decompCandidates.slice(0, TOP_N);
    const rest = decompCandidates.slice(TOP_N);
    let html = top.map(cardHTML).join('');
    if(rest.length){
      html += `<details><summary style="cursor:pointer;font-size:12px;color:var(--muted);padding:6px 0;">변동폭이 작은 ${rest.length}개 캠페인 더 보기</summary>${rest.map(cardHTML).join('')}</details>`;
    }
    html += `<div style="font-size:12px;color:var(--muted);margin-top:8px;">* 항등식(CPA=CPC/CVR) 기반 추정치예요 — 실제 원인은 데이터로 확정된 사실이 아니라 가설이니 참고용으로만 봐주세요.</div>`;
    return html;
  }
  window.__currentClientData = data;
  const periodLabel = isMultiMonth ? `${months[0].label} ~ ${months[months.length-1].label} 누적` : (months[0] ? months[0].label : '기간 없음');
  window.__pageAIContext = {
    isDB,
    periodLabel,
    rows: rows.slice(0,20).map(r=>({ campaign:r.campaign, type:r.type, cost:r.cost, conv:r.conv, revenue:r.revenue, cpa:r.cpa, roas:r.roas, avgRank:r.avgRank })),
    insights: campaignInsights.map(i=>i.text)
  };

  const initial = (data.name||'?').trim().charAt(0);
  const textColor = contrastText(data.color);
  const CMP_COLORS = ['#8b7cff','#3fd4a3','#ff9d4d','#ff5d7a','#4dd0ff'];
  const sortTh = (label, field) => `<th data-field="${field}" style="cursor:pointer;user-select:none;">${label}${sort.field===field?(sort.dir==='desc'?' ▼':' ▲'):''}</th>`;

  const card = document.getElementById('card');
  card.innerHTML = `
    <header class="rep">
      <div class="idn">
        <div class="icon" style="background:${data.color};color:${textColor}">${initial}</div>
        <div>
          <div class="idn-name">${data.name} <span class="badge">캠페인 비교 전용 보기</span></div>
          <div class="period" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span>${isMultiMonth ? `${months[0].label} ~ ${months[months.length-1].label} (${months.length}개 기간) 누적` : (months[0] ? months[0].label : '-')} 기준${hasDayFilter ? ` · 📆 ${dayRangeState[key].start||dayBoundsMin} ~ ${dayRangeState[key].end||dayBoundsMax} 날짜 필터 적용 중(캠페인 표에도 반영됨, 평균노출순위는 일별 데이터엔 없어서 표시 안 됨)` : ''}</span>
          </div>
          ${dayBoundsMin && dayRangeCustomOpen[key] ? `
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;">
            <input type="date" id="dayRangeStartInput" min="${dayBoundsMin}" max="${dayBoundsMax}" value="${dayRangeState[key].start || dayBoundsMin || ''}" style="background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:3px 6px;font-size:12px;">
            <span style="color:var(--muted);font-size:12px;">~</span>
            <input type="date" id="dayRangeEndInput" min="${dayBoundsMin}" max="${dayBoundsMax}" value="${dayRangeState[key].end || dayBoundsMax || ''}" style="background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:3px 6px;font-size:12px;">
            ${hasDayFilter ? `<button id="dayRangeResetBtn" style="background:var(--panel-2);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:6px 11px;font-size:12px;cursor:pointer;">✕ 날짜 필터 해제</button>` : ''}
          </div>` : ''}
        </div>
      </div>
    </header>
    <div class="filterbar">
      <div class="fb-g"><span class="fb-lab">기간</span>
            <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">
              <button id="monthPrevBtn" title="이전(더 과거)으로 구간 이동" style="background:var(--panel-2);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:6px 9px;font-size:12px;cursor:pointer;">◀</button>
              <select id="monthRangeStartSelect" title="시작 월" style="background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600;cursor:pointer;">
                ${allMonths.map(m=>`<option value="${m.label}" ${monthRangeState[key].start===m.label?'selected':''}>${m.label}</option>`).join('')}
              </select>
              <span style="color:var(--muted);font-size:12px;">~</span>
              <select id="monthRangeEndSelect" title="종료 월" style="background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600;cursor:pointer;">
                ${allMonths.map(m=>`<option value="${m.label}" ${monthRangeState[key].end===m.label?'selected':''}>${m.label}</option>`).join('')}

      const fullMin = allMonths.length ? monthFirstDay(allMonths[0].label) : dayBoundsMin;
      const fullMax = allMonths.length ? monthLastDay(allMonths[allMonths.length-1].label) : dayBoundsMax;
      const p = presetDayRange(pk, fullMin, fullMax) || presetDayRange(pk, dayBoundsMin, dayBoundsMax);
      if(!p) return;
      dayRangeState[key] = p;
      syncMonthRangeToDays(key, allMonths, p);
      dayRangeCustomOpen[key] = false;
      renderCampaignsPage(data);
    };
  });
  const cpDayCustomToggle = document.getElementById('dayRangeCustomToggle');
  if(cpDayCustomToggle) cpDayCustomToggle.onclick = ()=>{
    dayRangeCustomOpen[key] = !dayRangeCustomOpen[key];
    renderCampaignsPage(data);
  };
  const cpDayStartInput = document.getElementById('dayRangeStartInput');
  if(cpDayStartInput) cpDayStartInput.onchange = (e)=>{
    const dr = dayRangeState[key];
    dayPresetChoice[key] = null;
    dr.start = e.target.value || null;
    if(dr.start && dr.end && dr.start > dr.end) dr.end = dr.start;
    renderCampaignsPage(data);
  };
  const cpDayEndInput = document.getElementById('dayRangeEndInput');
  if(cpDayEndInput) cpDayEndInput.onchange = (e)=>{
    const dr = dayRangeState[key];
    dayPresetChoice[key] = null;
    dr.end = e.target.value || null;
    if(dr.start && dr.end && dr.end < dr.start) dr.start = dr.end;
    renderCampaignsPage(data);
  };
  const cpDayResetBtn = document.getElementById('dayRangeResetBtn');
  if(cpDayResetBtn) cpDayResetBtn.onclick = ()=>{ dayRangeState[key] = { start:null, end:null }; dayPresetChoice[key] = null; dayRangeCustomOpen[key] = false; renderCampaignsPage(data); };
  const dayCmpSearchEl = document.getElementById('dayCmpSearch');
  if(dayCmpSearchEl){
    dayCmpSearchEl.oninput = ()=>{
      dayCompareSearch[key] = dayCmpSearchEl.value;
      const pos = dayCmpSearchEl.selectionStart;
      renderCampaignsPage(data);
      // 다시 그리면 입력창이 새로 만들어져 포커스가 날아감 — 커서 위치까지 복원해야 계속 타이핑됨
      const again = document.getElementById('dayCmpSearch');
      if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
    };
  }
  document.querySelectorAll('.day-cmp-camp').forEach(cb=>{
    cb.onchange = ()=>{
      const set = new Set(dayCompareCampaigns[key]);
      if(cb.checked) set.add(cb.value); else set.delete(cb.value);
      dayCompareCampaigns[key] = [...set].slice(0,3);
      renderCampaignsPage(data);
    };
  });
  document.querySelectorAll('.day-cmp-metric-btn').forEach(btn=>{
    btn.onclick = ()=>{ dayCompareMetric[key] = btn.dataset.metric; renderCampaignsPage(data); };
  });
  if(compareCampaigns.length){
    const cmpEl = document.getElementById('chartDayCompare');
    if(cmpEl){
      const cmpDatasets = compareCampaigns.map((camp, i)=>{
        const arr = compareData[camp] || [];
        const byDate = {}; arr.forEach(r=> byDate[r.date]=r);
        const vals = dayCompareLabels.map(dt=>{
          const r = byDate[dt];
          if(!r) return 0;
          return compareMetric==='cost' ? Number(r.cost.toFixed(1)) : compareMetric==='ctr' ? Number(r.ctr.toFixed(2)) : compareMetric==='cvr' ? Number(r.cvr.toFixed(2)) : compareMetric==='cpa' ? (r.cpa||0) : compareMetric==='roas' ? Number(r.roas.toFixed(1)) : r.conv;
        });
        return { type:'line', label:camp, data:vals, borderColor:CMP_COLORS[i%CMP_COLORS.length], backgroundColor:CMP_COLORS[i%CMP_COLORS.length], tension:.25, pointRadius: dayCompareLabels.length>60?0:2 };
      });
      new Chart(cmpEl, {
        data:{ labels:dayCompareLabels, datasets:cmpDatasets },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#8d90a8',font:{size:10}}}},
          scales:{ y:{grid:{color:'#292a3d'},ticks:{color:'#8d90a8',font:{size:10}}}, x:{grid:{display:false},ticks:{color:'#8d90a8',font:{size:9},maxTicksLimit:20,autoSkip:true}} } }
      });
    }
  }
  document.getElementById('monthPrevBtn').onclick = ()=>{
    const allLabels = allMonths.map(m=>m.label);
    const r = monthRangeState[key];
    const si = allLabels.indexOf(r.start), ei = allLabels.indexOf(r.end);
    if(si<=0) return; // 이미 맨 앞(가장 과거) 달까지 와있음
    const len = ei - si;
    const newSi = si - 1, newEi = newSi + len;
    monthRangeState[key] = { start: allLabels[newSi], end: allLabels[newEi] };
    compareMonthState[key] = 'AUTO';
    renderCampaignsPage(data);
  };
  document.getElementById('monthNextBtn').onclick = ()=>{
    const allLabels = allMonths.map(m=>m.label);
    const r = monthRangeState[key];
    const si = allLabels.indexOf(r.start), ei = allLabels.indexOf(r.end);
    if(ei>=allLabels.length-1) return; // 이미 맨 뒤(가장 최신) 달까지 와있음
    const len = ei - si;
    const newEi = ei + 1, newSi = newEi - len;
    monthRangeState[key] = { start: allLabels[newSi], end: allLabels[newEi] };
    compareMonthState[key] = 'AUTO';
    renderCampaignsPage(data);
  };
  document.getElementById('compareFilterSelect').onchange = (e)=>{
    compareMonthState[key] = e.target.value;
    renderCampaignsPage(data);
  };
  document.querySelectorAll('th[data-field]').forEach(th=>{
    th.onclick = ()=>{
      const field = th.dataset.field;
      if(sort.field===field){ sort.dir = sort.dir==='desc' ? 'asc' : 'desc'; }
      else { sort.field = field; sort.dir = 'desc'; }
      renderCampaignsPage(data);
    };
  });
  // 조건 좁히기 입력 + 엑셀 내려받기 배선 (공통 도구)
  kmWireFilterBar(kmSt, ()=>renderCampaignsPage(data));
  kmWireExcel(()=>{
    const cond = [];
    if(String(kmSt.minCost).trim()!=='')   cond.push('비용 ' + Number(kmSt.minCost).toLocaleString('ko-KR') + '원 이상');
    if(String(kmSt.minClicks).trim()!=='') cond.push('클릭수 ' + kmSt.minClicks + '건 이상');
    if(String(kmSt.minConv).trim()!=='')   cond.push('전환수 ' + kmSt.minConv + '건 이상');
    if(String(kmSt.q||'').trim()!=='')     cond.push('캠페인명에 "' + kmSt.q + '" 포함');
    const cols = [
      { h:'캠페인', v:r=>r.campaign, w:30, text:1 },
      { h:'유형', v:r=>r.type||'', w:12, text:1 },
      { h:'비용(원)', v:r=>Math.round((r.cost||0)*10000) },
      { h:'노출수', v:r=>r.impressions||0 },
      { h:'클릭수', v:r=>r.clicks||0 },
      { h:'클릭률(%)', v:r=>+((r.ctr||0).toFixed(2)) },
      { h:'평균CPC(원)', v:r=>(r.cpc===null||r.cpc===undefined)?'':Math.round(r.cpc) },
    ];
    if(isDB) cols.push({ h:'전환수', v:r=>r.conv||0 });
    else { cols.push({ h:'전환수', v:r=>r.conv||0 }); cols.push({ h:'전환매출(원)', v:r=>Math.round((r.revenue||0)*10000) }); }
    cols.push({ h:'CPA(원)', v:r=>(r.cpa===null||r.cpa===undefined)?'':Math.round(r.cpa) });
    if(!isDB) cols.push({ h:'ROAS(%)', v:r=>(r.conv>0)?+((r.roas||0).toFixed(0)):'' });
    cols.push({ h:'평균노출순위', v:r=>(r.avgRank===null||r.avgRank===undefined)?'':+r.avgRank.toFixed(1) });
    return { rows, cols,
      meta:[['기간', periodLabel||''],['조건', cond.length?cond.join(' / '):'조건 없음 (전체)'],
            ['건수', rows.length + '개' + (rows.length!==kmTotalBefore?(' (전체 '+kmTotalBefore+'개 중)'):'')]],
      title: data.name + ' — 캠페인', sheet:'캠페인', filename: data.name + '_캠페인' };
  });
  document.querySelectorAll('.pin-star-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const campaign = btn.dataset.campaign;
      const isPinned = pinnedSet.has(campaign);
      try{
        const id = key.replace(/^client:/,'');
        const op = isPinned ? firebase.firestore.FieldValue.arrayRemove(campaign) : firebase.firestore.FieldValue.arrayUnion(campaign);
        await userClientsRef().doc(id).update({ pinnedCampaigns: op });
        const fresh = await getClient(key);
        if(fresh) renderCampaignsPage(fresh);
      }catch(e){ console.error(e); }
    };
  });
  document.querySelectorAll('.expand-adgroup-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const campaign = btn.dataset.campaign;
      if(expandedCampaigns.has(campaign)) expandedCampaigns.delete(campaign);
      else expandedCampaigns.add(campaign);
      renderCampaignsPage(data);
    };
  });
  document.querySelectorAll('.ai-summary-btn').forEach(btn=>{
    btn.onclick = ()=> generateAISummary(data, key, periodLabel);
  });
  document.querySelectorAll('.applied-toggle-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const k = btn.dataset.key;
      const isApplied = btn.dataset.applied==='1';
      btn.disabled = true;
      try{
        const id = key.replace(/^client:/,'');
        const op = isApplied ? firebase.firestore.FieldValue.arrayRemove(k) : firebase.firestore.FieldValue.arrayUnion(k);
        await userClientsRef().doc(id).update({ appliedSuggestions: op });
        const fresh = await getClient(key);
        if(fresh) renderCampaignsPage(fresh);
      }catch(e){ console.error(e); btn.disabled = false; }
    };
  });
  renderFilterPanel(key, data, campaignList, allTypes, renderCampaignsPage);
}


/* ---------- 광고계정 / 삭제된 캠페인 표시 (index.html과 동일 규칙) ---------- */
function accountOfCampaign(name){
  const m = String(name||'').match(/^(\d{6,})\s*·\s*/);
  return m ? m[1] : null;
}
function accountListOf(campaignList){
  const set = new Set();
  campaignList.forEach(c=>{ const a = accountOfCampaign(c.campaign); if(a) set.add(a); });
  return [...set].sort();
}
/* 네이버 마스터 보고서에는 현재 존재하는 캠페인만 내려오는데 과거 성과 데이터에는 삭제된
   캠페인 기록이 남아 있어, 이름을 못 찾고 원본 ID가 그대로 노출됨. 표시만 알아보기 쉽게 바꾼다. */
function isDeletedCampaignName(name){
  return /(^|·\s*)cmp-[a-z0-9]+-\d+-\d+\s*$/i.test(String(name||'').trim());
}
/* 캠페인 이름은 "1584606 · 실제이름" 형태로 계정번호가 앞에 붙어 있다.
   표에서는 번호를 작은 뱃지로 빼고 이름만 크게 보여줘야 읽기 쉽다. */
function campAcctBadge(name){
  const m = String(name||'').match(/^(\d+)\s*·/);
  return m ? `<span class="camp-acct">${m[1]}</span>` : '';
}
function campBareName(name){
  const full = displayCampaignName(name);
  return full.replace(/^\d+\s*·\s*/, '');
}
function displayCampaignName(name){
  const s = String(name||'').trim();
  if(!isDeletedCampaignName(s)) return s;
  const m = s.match(/^(\d+)\s*·/);
  const idPart = s.replace(/^\d+\s*·\s*/,'');
  return `${m?m[1]+' · ':''}삭제된 캠페인 (…${idPart.slice(-6)})`;
}
function renderFilterPanel(key, data, campaignList, allTypes, renderFn){
  renderFn = renderFn || renderCard;
  const fstate = filterState[key];
  const mount = document.getElementById('mainLayout');
  let panel = document.getElementById('filterPanel');
  if(!panel){
    panel = document.createElement('div');
    panel.className = 'filter-panel';
    panel.id = 'filterPanel';
    mount.children[1].replaceWith(panel);
  }
  const accountList = accountListOf(campaignList);
  panel.innerHTML = `
    <div class="filter-head">필터</div>
    ${accountList.length > 1 ? `
    <div class="filter-group">
      <div class="filter-group-title">광고계정</div>
      ${accountList.map(a=>{
        const camps = campaignList.filter(c=>accountOfCampaign(c.campaign)===a);
        const anyOn = camps.some(c=>fstate.campaigns.has(c.campaign));
        const label = (data.accountLabels && data.accountLabels[a]) ? `${a} · ${data.accountLabels[a]}` : a;
        return `<label class="filter-item"><input type="checkbox" data-kind="account" value="${a}" ${anyOn?'checked':''}> ${label} <span style="color:var(--muted);font-size:12px;">(${camps.length})</span></label>`;
      }).join('')}
    </div>` : ''}
    <div class="filter-group">
      <div class="filter-group-title">캠페인 유형</div>
      ${allTypes.map(t=>{
        // 체크 표시는 '그 유형의 캠페인이 실제로 하나라도 켜져 있는가'로 판단한다.
        const typeCamps = campaignList.filter(c=>String(c.type)===String(t));
        const anyOn = typeCamps.some(c=>fstate.campaigns.has(c.campaign));
        return `<label class="filter-item"><input type="checkbox" data-kind="type" value="${t}" ${anyOn?'checked':''}> ${campaignTypeLabel(t)} <span style="color:var(--muted);font-size:12px;">(${typeCamps.length})</span></label>`;
      }).join('')}
    </div>
    <div class="filter-group campaigns">
      <div class="filter-group-title">캠페인명</div>
      <input id="campaignSearchInput" type="text" placeholder="🔍 캠페인명 검색..." style="width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:7px;padding:7px 9px;color:var(--text);font-size:12px;margin-bottom:7px;">
      <div class="filter-campaign-list">
      ${campaignList.map(c=>`
        <label class="filter-item" data-campaign-label="${c.campaign.replace(/"/g,'&quot;')}"><input type="checkbox" data-kind="campaign" value="${c.campaign}" ${fstate.campaigns.has(c.campaign)?'checked':''}> ${displayCampaignName(c.campaign)}</label>
      `).join('')}
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-ghost" id="filterSelectAllBtn" style="flex:1;">전체 선택</button>
      <button class="btn btn-ghost" id="filterDeselectAllBtn" style="flex:1;">전체 해제</button>
    </div>
  `;
  const searchInput = document.getElementById('campaignSearchInput');
  if(searchInput){
    searchInput.oninput = ()=>{
      const q = searchInput.value.trim().toLowerCase();
      panel.querySelectorAll('.filter-campaign-list label[data-campaign-label]').forEach(label=>{
        const name = (label.getAttribute('data-campaign-label')||'').toLowerCase();
        label.style.display = (!q || name.includes(q)) ? '' : 'none';
      });
    };
  }
  panel.querySelectorAll('input[data-kind="type"]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) fstate.types.add(cb.value); else fstate.types.delete(cb.value);
      // 유형 체크에 맞춰 해당 유형의 캠페인들도 함께 토글
      campaignList.filter(c=>String(c.type)===String(cb.value)).forEach(c=>{
        if(cb.checked) fstate.campaigns.add(c.campaign); else fstate.campaigns.delete(c.campaign);
      });
      renderFn(data);
    };
  });
  panel.querySelectorAll('input[data-kind="account"]').forEach(cb=>{
    cb.onchange = ()=>{
      campaignList.filter(c=>accountOfCampaign(c.campaign)===cb.value).forEach(c=>{
        if(cb.checked) fstate.campaigns.add(c.campaign); else fstate.campaigns.delete(c.campaign);
      });
      allTypes.forEach(t=>{
        const campsOfType = campaignList.filter(c=>String(c.type)===String(t)).map(c=>c.campaign);
        if(campsOfType.some(c=>fstate.campaigns.has(c))) fstate.types.add(t); else fstate.types.delete(t);
      });
      renderFn(data);
    };
  });
  panel.querySelectorAll('input[data-kind="campaign"]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) fstate.campaigns.add(cb.value); else fstate.campaigns.delete(cb.value);
      // 캠페인명 체크에 맞춰 유형 체크박스 표시도 동기화 (그 유형의 캠페인이 하나라도 선택돼 있으면 유형도 선택된 것으로 표시)
      allTypes.forEach(t=>{
        const campsOfType = campaignList.filter(c=>String(c.type)===String(t)).map(c=>c.campaign);
        const anySelected = campsOfType.some(c=>fstate.campaigns.has(c));
        if(anySelected) fstate.types.add(t); else fstate.types.delete(t);
      });
      renderFn(data);
    };
  });
  document.getElementById('filterSelectAllBtn').onclick = ()=>{
    fstate.types = new Set(allTypes);
    fstate.campaigns = new Set(campaignList.map(c=>c.campaign));
    renderFn(data);
  };
  document.getElementById('filterDeselectAllBtn').onclick = ()=>{
    fstate.types = new Set();
    fstate.campaigns = new Set();
    renderFn(data);
  };
}

/* 필터 접기 버튼 — 어느 페이지에서든 화면 오른쪽 가장자리에 붙는다. */
(function(){
  function initPanelToggle(){
    if(document.getElementById('panelToggleBtn')) return;
    if(!document.querySelector('.main-layout')) return;
    var KEY='kmPanelOff';
    var btn=document.createElement('button');
    btn.id='panelToggleBtn'; btn.type='button';
    function paint(){
      var off=document.body.classList.contains('panel-off');
      btn.textContent = off ? '필터 펴기 ‹' : '필터 접기 ›';
      btn.title = off ? '오른쪽 필터를 다시 표시' : '오른쪽 필터를 숨기고 넓게 보기';
    }
    try{ if(localStorage.getItem(KEY)==='1') document.body.classList.add('panel-off'); }catch(e){}
    btn.onclick=function(){
      document.body.classList.toggle('panel-off');
      try{ localStorage.setItem(KEY, document.body.classList.contains('panel-off')?'1':'0'); }catch(e){}
      paint();
      window.dispatchEvent(new Event('resize')); // 차트가 새 폭에 맞게 다시 그려지도록
    };
    paint();
    document.body.appendChild(btn);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', initPanelToggle);
  else initPanelToggle();
  setTimeout(initPanelToggle, 1500);
})();
