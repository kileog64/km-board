<script>
/* ── 업체 색(accent)이 업체마다 달라서 글씨 대비가 들쭉날쭉해지는 걸 막는 보정기 ──
   --accent        : 업체 색 그대로 (선·아이콘·그래프용)
   --accent-text   : 어두운 배경 위에서 읽히도록 밝기를 올린 글씨용 색
   --accent-solid  : 흰 글씨를 얹어도 읽히도록 밝기를 낮춘 채움 배경용 색
   두 값 모두 대비 4.5:1을 넘을 때까지 자동으로 조정한다. */
function applyAccentColor(hex){
  const root = document.documentElement.style;
  root.setProperty('--accent', hex);
  const H = String(hex||'').trim().replace('#','');
  if(H.length !== 6){ return; }
  const toRgb = h => [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));
  const toHex = a => '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  const lum = ([r,g,b]) => { const f=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)};
    return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b); };
  const ratio = (a,b)=>{ const l1=lum(a),l2=lum(b),hi=Math.max(l1,l2),lo=Math.min(l1,l2); return (hi+0.05)/(lo+0.05); };
  const base = toRgb(H);
  const PANEL=[23,26,39], WHITE=[255,255,255];
  let text = base.slice();
  for(let i=0;i<24 && ratio(text,PANEL)<4.5;i++) text = text.map(v=>v+(255-v)*0.10);
  let solid = base.slice();
  for(let i=0;i<24 && ratio(solid,WHITE)<4.5;i++) solid = solid.map(v=>v*0.92);
  root.setProperty('--accent-text', toHex(text));
  root.setProperty('--accent-solid', toHex(solid));
}

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCzJ77rABIdRQk51xMlzC4FmI40hPG7doQ",

<style>
  :root{
    --bg:#0d0e15; --panel:#171829; --panel-2:#1d1f33; --border:#33354a;
    --text:#f5f6fa; --muted:#a8abc4; --up:#4ade9a; --down:#ff6b85; --accent:#8b7cff; --accent-solid:#6354d6; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(circle at 10% 0%,#191a2c 0%,var(--bg) 45%);color:var(--text);font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;}

  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500;}
  .field input{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;font-family:'Pretendard',sans-serif;}
  .section-title{font-size:12px;color:var(--accent-text,var(--accent));font-weight:700;margin:16px 0 9px;letter-spacing:.01em;}
  .file-drop{border:1px dashed var(--border);border-radius:10px;padding:14px;text-align:center;background:var(--panel-2);margin-bottom:10px;transition:border-color .15s,background .15s;}
  .file-drop.dragover{border-color:var(--accent);background:rgba(139,124,255,.1);}
  .file-drop label{display:block;font-size:14px;color:var(--text);font-weight:600;margin-bottom:7px;}
  .file-drop input[type=file]{font-size:12px;color:var(--muted);width:100%;}
  .file-drop .status{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5;}
  .file-drop .status.ok{color:var(--up);}
  .file-drop .status.err{color:var(--down);}
  .preview-box{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;font-size:12px;}
  .preview-box .row{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted);}
  .preview-box .row b{color:var(--text);}
  .col-ref{background:rgba(139,124,255,.08);border:1px dashed var(--border);border-radius:8px;padding:9px 11px;margin:-4px 0 10px;}
  .col-ref-title{font-size:12px;color:var(--accent-text,var(--accent));font-weight:700;margin-bottom:3px;}
  .col-ref-list{font-family:'Pretendard',monospace;font-size:12px;color:var(--muted);line-height:1.6;word-break:break-all;}
  .col-ref-list b{color:var(--text);}
  .btn{border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:7px;}
  .btn-ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--border);}
  .btn-accent{background:linear-gradient(135deg,var(--accent-solid,#6354d6),#6f5fdd);color:#fff;}
  .status-msg{font-size:12px;margin-top:11px;padding:10px 12px;border-radius:8px;background:var(--panel-2);color:var(--muted);display:none;line-height:1.5;}
  .status-msg.show{display:block;}
  .status-msg.ok{color:var(--up);}
  .status-msg.err{color:var(--down);}

  .tabs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}

  .tab .dot{width:9px;height:9px;border-radius:50%;}

  .client-switcher{position:relative;display:inline-block;}
  .client-switcher-btn{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--border);cursor:pointer;font-size:14px;font-weight:600;color:var(--text);min-width:170px;}
  .client-switcher-btn .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .client-switcher-btn .chev{margin-left:auto;font-size:12px;color:var(--muted);}
  .client-switcher-dropdown{position:absolute;top:calc(100% + 6px);right:0;z-index:50;width:280px;max-height:360px;overflow-y:auto;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:none;}
  .client-switcher-dropdown.open{display:block;}
  .client-switcher-search{width:100%;box-sizing:border-box;padding:10px 12px;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text);font-size:14px;outline:none;position:sticky;top:0;background:var(--panel-2);}
  .client-switcher-biztabs{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);position:sticky;top:37px;background:var(--panel-2);z-index:1;}
  .client-switcher-biztab{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:5px 0;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;}
  .client-switcher-biztab.active{border-color:var(--accent);color:var(--accent-text,var(--accent));background:rgba(139,124,255,.03);}
  .client-switcher-item{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:14px;color:var(--text);}
  .client-switcher-item:hover{background:var(--panel);}
  .client-switcher-item.active{background:rgba(139,124,255,.15);color:var(--accent-text,var(--accent));font-weight:700;}
  .client-switcher-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .client-switcher-empty{padding:14px;color:var(--muted);font-size:12px;text-align:center;}
  .ai-chat-toggle{position:fixed;bottom:24px;right:24px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a89aff);border:none;font-size:28px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:100;}
  .ai-chat-panel{position:fixed;bottom:90px;right:24px;width:520px;max-height:min(760px,85vh);background:var(--panel-2);border:1px solid var(--border);border-radius:16px;box-shadow:0 16px 48px rgba(0,0,0,.5);display:none;flex-direction:column;overflow:hidden;z-index:100;}
  .ai-chat-panel.open{display:flex;}
  .ai-chat-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;color:var(--text);}
  .ai-chat-icon-btn{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:2px;}
  .ai-chat-setup{padding:16px;display:none;}
  .ai-chat-setup.show{display:block;}
  .ai-chat-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-height:320px;}
  .ai-chat-msg{font-size:14px;line-height:1.65;padding:11px 14px;border-radius:10px;max-width:90%;white-space:pre-wrap;}
  .ai-chat-msg.user{align-self:flex-end;background:var(--accent-solid);color:#fff;}
  .ai-chat-msg.assistant{align-self:flex-start;background:var(--panel);color:var(--text);}
  .ai-chat-msg.system{align-self:center;color:var(--muted);font-size:12px;text-align:center;}
  .ai-chat-input-row{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border);}
  .ai-chat-input-row textarea{flex:1;resize:none;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--text);font-size:14px;font-family:'Pretendard',sans-serif;max-height:140px;min-height:44px;}
  .ai-chat-input-row button{background:var(--accent-solid);color:#fff;border:none;border-radius:8px;padding:0 14px;font-size:14px;font-weight:600;cursor:pointer;}
  @media (max-width:640px){
    .ai-chat-panel{right:10px;left:10px;width:auto;bottom:84px;}
    .ai-chat-toggle{right:16px;bottom:16px;}
  }

  .main-layout{display:grid;grid-template-columns:1fr 250px;gap:20px;align-items:start;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px 28px;min-height:400px;}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:360px;color:var(--muted);font-size:14px;text-align:center;gap:10px;line-height:1.6;}
  header.rep{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:14px;}
  .idn{display:flex;align-items:center;gap:14px;}
  .icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0;font-family:'Pretendard',sans-serif;}
  .idn-name{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:700;}
  .badge{font-size:12px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.1);color:var(--muted);font-weight:600;}
  .period{font-size:14px;color:var(--muted);margin-top:4px;}
  .totals{display:flex;gap:32px;text-align:right;}
  .totals .lbl{font-size:12px;color:var(--muted);letter-spacing:.04em;font-weight:500;}
  .totals .val{font-family:'Pretendard',sans-serif;font-size:28px;font-weight:800;margin-top:3px;letter-spacing:-.01em;}
  .totals .val.accent{color:var(--accent-text,var(--accent));}

  .kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px;}
  .kpi{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:18px 20px;transition:border-color .2s;display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .kpi:hover{border-color:var(--accent);}
  .kpi-label{font-size:12px;color:var(--muted);margin-bottom:9px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .kpi-value{font-family:'Pretendard',sans-serif;font-size:28px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;}
  .kpi-note{font-size:16px;font-weight:800;padding:7px 13px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
  .kpi-note.up{color:var(--up);background:rgba(74,222,154,.14);} .kpi-note.down{color:var(--down);background:rgba(255,107,133,.14);}
  .kpi-spark{width:100%;height:30px;margin-top:9px;}

  .charts-row{display:grid;grid-template-columns:1fr;gap:20px;margin-bottom:22px;}
  .panel{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:20px;}
  .panel-title{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--text);}
  .chart-box{height:320px;}

  .bottom-row{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;color:var(--muted);font-weight:600;padding:8px 7px;border-bottom:1px solid var(--border);}
  td{padding:10px 9px;border-bottom:1px solid #262841;}
  /* 금액·비율 같은 숫자 칸이 좁아 '43,882,900 / 원'처럼 줄바꿈되던 문제 — 숫자는 한 줄로 유지 */
  table td:not(.kw-name):not(.camp-name-cell){white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  .kw-name{color:var(--text);font-weight:600;}
  /* 캠페인명 칸: 예전엔 150px로 묶고 칸마다 가로 스크롤바를 달았는데,
     이름마다 막대가 하나씩 생겨서 표가 지저분했음. 이제는 넓게 주고
     두 줄까지 줄바꿈, 그래도 넘치면 말줄임(…)으로 처리한다. */
  .camp-name-cell{max-width:none;min-width:210px;}
  .camp-name-scroll{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;white-space:normal;word-break:break-all;line-height:1.35;}
  .camp-acct{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);
    background:var(--panel-2);border:1px solid var(--border);border-radius:4px;
    padding:0 5px;margin-right:5px;vertical-align:1px;}
  .camp-type-sub{display:block;font-size:11px;color:var(--muted);margin-top:2px;}

  .improve-box{margin-bottom:16px;}
  .improve-row{display:flex;align-items:center;justify-content:space-between;}
  .improve-side .m{font-size:12px;color:var(--muted);font-weight:500;}
  .improve-side .v{font-family:'Pretendard',sans-serif;font-size:28px;font-weight:800;margin-top:4px;}
  .improve-side.right{text-align:right;}
  .improve-side.right .v{color:var(--accent-text,var(--accent));}
  .arrow{color:var(--muted);font-size:20px;}
  .divider{height:1px;background:var(--border);margin:14px 0;}
  .sub-metric{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);}
  .sub-metric .chg{color:var(--text);font-weight:700;font-family:'Pretendard',sans-serif;font-size:16px;}


  .filter-panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;position:sticky;top:20px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;}
  .filter-head{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .filter-group{margin-bottom:14px;}
  .filter-campaign-list{flex:1 1 auto;min-height:120px;overflow-y:auto;padding-right:4px;scrollbar-width:thin;overscroll-behavior:contain;}
  .filter-group.campaigns{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin-bottom:10px;}
  .filter-campaign-list::-webkit-scrollbar{width:5px;}
  .filter-campaign-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .filter-group-title{background:rgba(139,124,255,.18);color:#c3b8ff;border-radius:7px;padding:6px 9px;font-size:12px;font-weight:700;margin-bottom:6px;}
  .filter-item{display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:12px;color:var(--text);font-weight:500;}
  .filter-item input{accent-color:var(--accent);width:14px;height:14px;flex-shrink:0;}
  .filter-item .swatch{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

  @media (max-width:1100px){
    .wrap{grid-template-columns:1fr;}
    .input-panel{position:static;}
    .main-layout{grid-template-columns:1fr;}
    .filter-panel{position:static;max-height:none;display:block;}
    .filter-group.campaigns{display:block;}
    .filter-campaign-list{max-height:320px;}
    .kpi-row{grid-template-columns:repeat(3,1fr);}
    .charts-row, .bottom-row{grid-template-columns:1fr;}
  }

  @media (max-width:640px){
    body{font-size:14px;}
    .wrap{padding:14px;}
    header.rep{flex-direction:column;align-items:flex-start;}
    .totals{gap:16px;text-align:left;width:100%;}
    .idn-name{font-size:16px;}
    .kpi-row{grid-template-columns:repeat(2,1fr)!important;}
    .panel{padding:14px;overflow-x:auto;}
    .chart-box{height:240px!important;}
    table{font-size:12px;}

/* 표 숫자 칸은 줄바꿈 금지 — '92,539,282' 뒤에 '원'만 다음 줄로 떨어지는 문제 방지.
   첫 칸(키워드·상품명 등)만 두 줄 허용하고, 표가 넓어지면 카드 안에서 가로로 스크롤된다. */
table td, table th { white-space: nowrap; }
table td.kw-name, table td:first-child { white-space: normal; word-break: keep-all; }
table td.kw-name { min-width: 150px; }

/* ── 필터 접기: 오른쪽 필터 패널(250px)을 숨겨 표·차트를 넓게 본다 ──
   접힌 상태는 브라우저에 기억돼서 페이지를 옮겨도 유지된다. */
body.panel-off .main-layout{grid-template-columns:1fr;}
body.panel-off .filter-panel{display:none;}
#panelToggleBtn{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:60;

<script>
let activeSlug = null;
const filterState = {};
const monthRangeState = {}; // key -> { start: label, end: label } (start===end 이면 단일 월, 전체 범위면 예전 'ALL'과 동일)
const compareMonthState = {};
const expandedCampaignsState = {}; // key -> Set(campaign명) — 광고그룹 드릴다운을 펼쳐놓은 캠페인들
const dayCompareCampaigns = {}; // key -> [캠페인명, ...] (최대 3개) — 캠페인별 일별 비교 패널에서 선택된 캠페인들
const dayCompareMetric = {};
const dayCompareSearch = {};   // key -> 캠페인 비교 목록 검색어(캠페인이 많은 업체에서 목록을 좁히는 용도) // key -> 'conv'|'cpa'|'roas'|'cost'|'ctr'|'cvr' — 캠페인별 일별 비교 차트 지표
function mergeAdgroupsForCampaign(months, campaignName){
  // adgroupsByCampaign: { 캠페인명: [ {adgroup, cost, revenue, conv, impressions, clicks, avgRank} ] } 원본 데이터를
  // 현재 선택된 기간(months) 전체에 걸쳐 광고그룹별로 합산. 예전 형식으로 저장된 달은 이 필드가 없어서 자동으로 제외됨.
  const map = {};
  let anyData = false;
  months.forEach(m=>{
    const list = (m.adgroupsByCampaign && m.adgroupsByCampaign[campaignName]) || [];
    list.forEach(ag=>{
      if(!ag.adgroup) return;
      anyData = true;
      if(!map[ag.adgroup]) map[ag.adgroup] = { adgroup:ag.adgroup, cost:0, revenue:0, conv:0, impressions:0, clicks:0, rankSum:0, rankImp:0 };
      const g = map[ag.adgroup];
      g.cost += ag.cost||0; g.revenue += ag.revenue||0; g.conv += ag.conv||0;
      g.impressions += ag.impressions||0; g.clicks += ag.clicks||0;
      if(ag.avgRank!==null && ag.avgRank!==undefined && (ag.impressions||0)>0){ g.rankSum += ag.avgRank*ag.impressions; g.rankImp += ag.impressions; }
    });
  });
  const rows = Object.values(map).map(g=>({
    ...g,
    ctr: g.impressions>0 ? (g.clicks/g.impressions*100) : 0,
    cpa: g.conv>0 ? Math.round(g.cost*10000/g.conv) : null,
    roas: g.cost>0 ? (g.revenue/g.cost*100) : 0,
    avgRank: g.rankImp>0 ? (g.rankSum/g.rankImp) : null
  })).sort((a,b)=>b.cost-a.cost);
  return { rows, hasData: anyData };
}
function ensureMonthRange(key, allMonths){
  if(!allMonths.length) return;
  const cur = monthRangeState[key];
  const has = l => allMonths.some(m=>m.label===l);
  if(!cur || !has(cur.start) || !has(cur.end)){
    monthRangeState[key] = { start: allMonths[0].label, end: allMonths[allMonths.length-1].label };
  }
}
function monthsInRange(allMonths, range){
  const si = allMonths.findIndex(m=>m.label===range.start);
  const ei = allMonths.findIndex(m=>m.label===range.end);
  if(si<0 || ei<0) return allMonths;
  const lo = Math.min(si,ei), hi = Math.max(si,ei);
  return allMonths.slice(lo, hi+1);
}
// 캘린더 날짜(일 단위) 필터 — "📊 캠페인별 일별 비교" 패널 전용(옛 daily.html에서 이전, dailyByCampaign 기반)

// 사용자가 실제로 누른 날짜 버튼을 기억한다. 범위만 보고 되짚으면 '이번달'과 '최근 7일'이
// 같은 범위로 겹칠 때 엉뚱한 버튼에 색이 들어감.
const dayPresetChoice = {};

function presetDayRange(presetKey, boundsMin, boundsMax){
  if(!boundsMin || !boundsMax) return null;
  const toStr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const addDays = (d,n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
  const today = new Date(); today.setHours(0,0,0,0);
  let start, end;
  if(presetKey==='today'){ start = end = toStr(today); }
  else if(presetKey==='yesterday'){ const y = addDays(today,-1); start = end = toStr(y); }
  else if(presetKey==='last7'){ start = toStr(addDays(today,-6)); end = toStr(today); }
  else if(presetKey==='thisMonth'){ start = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-01`; end = toStr(today); }
  else if(presetKey==='lastMonth'){
    const firstOfThis = new Date(today.getFullYear(), today.getMonth(), 1);
    const lastOfPrev = addDays(firstOfThis, -1);
    start = `${lastOfPrev.getFullYear()}-${String(lastOfPrev.getMonth()+1).padStart(2,'0')}-01`;
    end = toStr(lastOfPrev);
  }
  else if(presetKey==='all'){ return { start:null, end:null }; }
  else return null;
  if(start < boundsMin) start = boundsMin;
  if(end > boundsMax) end = boundsMax;
  if(start > boundsMax || end < boundsMin) return null;
  return { start, end };
}
/* 프리셋 버튼 활성화 판정.
   예전엔 "현재 범위 == 그 프리셋의 범위"만 봤는데, 데이터 상한(boundsMax)에 걸려 잘리면
   서로 다른 프리셋이 같은 범위로 수렴함. 예를 들어 오늘이 9/1이고 데이터도 9/1까지면
   '어제'(8/31~8/31)와 '이번달'(9/1~9/1)이 각각 잘려서 둘 다 파랗게 켜졌음.
   그래서 PRESET_ORDER 순으로 "가장 먼저 일치하는 하나"만 활성으로 봄. */
const PRESET_ORDER = ['all','yesterday','last7','thisMonth','lastMonth','today'];
function activePresetKey(range, boundsMin, boundsMax){
  for(const pk of PRESET_ORDER){
    if(pk==='all'){ if(!range.start && !range.end) return 'all'; continue; }
    const p = presetDayRange(pk, boundsMin, boundsMax);
    if(p && range.start===p.start && range.end===p.end) return pk;
  }
  return null;
}
function isPresetActive(presetKey, range, boundsMin, boundsMax){
  return activePresetKey(range, boundsMin, boundsMax) === presetKey;
}

function toDateInputValue(dateStr){
  const parts = String(dateStr).split('.').map(s=>s.trim()).filter(Boolean);
  if(parts.length<3) return null;
  const [y,m,d] = parts;
  return `${y.padStart(4,'0')}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
}
function filterRowsByDayRange(rows, range){
  if(!range || (!range.start && !range.end)) return rows;
  const startKey = range.start ? range.start.replace(/\D/g,'') : null;
  const endKey = range.end ? range.end.replace(/\D/g,'') : null;
  return rows.filter(r=>{
    const k = dateKey(r.date);
    if(startKey && k < startKey) return false;
    if(endKey && k > endKey) return false;
    return true;
  });
}

function randomAccentColor(){
  const hue = Math.floor(Math.random()*360);
  const sat = 60 + Math.random()*15;
  const light = 52 + Math.random()*10;
  return hslToHex(hue, sat, light);
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
function contrastText(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.6 ? '#12131c' : '#ffffff';
}
function sparkPath(vals, w, h){
  if(!vals.length) return '';
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = (max - min) || 1;
  const step = w / (Math.max(vals.length-1,1));
  return vals.map((v,i)=>{
    const x = i*step;
    const y = h - ((v-min)/range)*h;
    return `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
}

}

/* 플레이스(네이버 캠페인유형 코드 6)는 지도 노출 기반이라 검색광고 지표와 성격이 달라 대시보드에서 제외한다.
   여기 한 곳에서 걸러내면 필터·표·합계·인사이트·AI까지 전부 자동으로 빠진다.
   월 합계(cost/revenue/conv/impressions/clicks)에서도 플레이스 몫을 빼서 숫자가 어긋나지 않게 한다. */
const IS_PLACE_TYPE = (t) => { const v = String(t==null?'':t).trim();
  return v === '6' || v.indexOf('플레이스') >= 0; };
/* ── 브랜드검색 정액제 비용 얹기 ────────────────────────────────────────────
   브랜드검색광고는 정액제라 네이버 일별 리포트의 비용이 0원으로 온다. input.html에서
   등록한 계약(brandContracts: 캠페인·시작월·종료월·계약금액)을 읽어, 계약 금액을 계약
   기간의 각 달에 일수 비율로 나눠 그 달 그 캠페인의 비용으로 채운다. 월 합계(cost)에도
   같은 금액을 더해서 대시보드 어디서 보든 숫자가 어긋나지 않게 한다.
   금액 단위: 저장은 '원', 월/캠페인 데이터는 '만원' 단위라 10000으로 나눠서 넣는다.
   이미 비용이 잡혀 있으면(정액제가 아닌 경우) 건드리지 않는다. */
function __bcMonthDays(y,m){ return new Date(y,m,0).getDate(); }
function __bcParseYM(v){ const mm=String(v||'').match(/^(\d{4})-(\d{2})$/); return mm?{y:+mm[1],m:+mm[2]}:null; }
function __bcSplit(start,end,amount){
  const s=__bcParseYM(start), e=__bcParseYM(end);
  if(!s||!e||!(amount>0)) return {};
  if(e.y*12+e.m < s.y*12+s.m) return {};
  const spans=[]; let y=s.y,m=s.m,total=0;
  while(y*12+m <= e.y*12+e.m){
    const d=__bcMonthDays(y,m);
    spans.push({label:y+'.'+String(m).padStart(2,'0'), days:d}); total+=d;
    m++; if(m>12){ m=1; y++; }
  }
  if(!total) return {};
  const out={}; let acc=0;
  spans.forEach((sp,i)=>{
    const c = (i===spans.length-1) ? (amount-acc) : Math.round(amount*sp.days/total);
    if(i<spans.length-1) acc+=c;
    out[sp.label]=(out[sp.label]||0)+c;
  });
  return out;
}
function applyBrandContracts(data){
  if(!data || !Array.isArray(data.months)) return data;
  const contracts = data.brandContracts;
  if(!Array.isArray(contracts) || !contracts.length) return data;
  // 캠페인 → { 'YYYY.MM': 원 } 로 펼쳐둔다(계약이 여러 건이면 같은 달끼리 합산).
  const byCamp = {};
  contracts.forEach(ct=>{
    if(!ct || !ct.campaign) return;
    const split = __bcSplit(ct.start, ct.end, Number(ct.amount)||0);
    const bucket = byCamp[ct.campaign] || (byCamp[ct.campaign]={});
    Object.keys(split).forEach(lab=>{ bucket[lab]=(bucket[lab]||0)+split[lab]; });
  });
  data.months.forEach(m=>{
    const lab = String(m.label||'');
    let added = 0;
    (m.campaigns||[]).forEach(c=>{
      const won = byCamp[c.campaign] && byCamp[c.campaign][lab];
      if(!won) return;
      if(Number(c.cost)>0) return;   // 이미 실비용이 있으면 덮어쓰지 않는다
      const man = won/10000;
      c.cost = man;
      c.__brandContractCost = true;  // 화면에서 '계약금액 기준'임을 표시할 때 쓴다
      added += man;
    });
    if(added>0 && typeof m.cost==='number') m.cost = m.cost + added;
  });
  return data;
}
/* ── 광고비 기준 통일(부가세 제외) ──────────────────────────────────────────
   네이버가 시기에 따라 부가세를 포함한 금액을 주기도 하고 뺀 금액을 주기도 해서,
   2025.10~2026.03 구간은 캠페인·월 합계가 부가세 포함으로 저장돼 있다.
   반면 하루치(daily)는 전 기간 부가세 제외로 통일돼 있다.
   그래서 하루치를 기준으로 삼아 캠페인·월 합계를 같은 기준으로 낮춘다.
   (원본은 그대로 두고 화면에 그릴 때만 맞춘다 — 플레이스 제외·브랜드검색 계약과 같은 방식)
   · 2025.10~2026.02: 모든 캠페인이 정확히 1.1배라 환산이 정확함
   · 2026.03: 달 중간에 기준이 바뀌어 캠페인마다 1.06~1.10로 제각각 — 월 합계는 정확히 맞고
     캠페인 개별값은 최대 2% 안쪽 오차가 남음
   · 2026.04 이후: 이미 같은 기준이라 건드리지 않음 */
function normalizeCostBasis(data){
  if(!data || !Array.isArray(data.months)) return data;
  data.months.forEach(m=>{
    const dailySum = (m.daily||[]).reduce((a,x)=>a+(x.cost||0),0);
    const campSum  = (m.campaigns||[]).reduce((a,c)=>a+(c.cost||0),0);
    if(!(dailySum>0) || !(campSum>0)) return;
    const k = dailySum / campSum;
    if(k > 0.999) return;   // 이미 같은 기준이면 그대로
    if(k < 0.85)  return;   // 부가세 차이로 보기엔 너무 큰 격차 — 다른 원인이므로 손대지 않음
    (m.campaigns||[]).forEach(c=>{ if(typeof c.cost === 'number') c.cost = c.cost * k; });
    if(typeof m.cost === 'number') m.cost = dailySum;
    m.__costRebased = true;   // 화면에서 "기준 맞춤" 표시가 필요할 때 쓴다
  });
  return data;
}
function stripPlaceCampaigns(data){
  if(!data || !Array.isArray(data.months)) return data;
  data.months.forEach(m=>{
    const camps = m.campaigns || [];
    const place = camps.filter(c=>IS_PLACE_TYPE(c.type));
    if(!place.length) return;
    const names = new Set(place.map(c=>c.campaign));
    m.campaigns = camps.filter(c=>!IS_PLACE_TYPE(c.type));
    // 월 합계에서 플레이스 몫 차감
    ['cost','revenue','conv','impressions','clicks'].forEach(k=>{
      if(typeof m[k] === 'number'){
        const sub = place.reduce((a,c)=>a+(Number(c[k])||0),0);
        m[k] = Math.max(0, m[k] - sub);
      }
    });
    // 캠페인 이름이 붙은 상세 배열에서도 제거
    ['dailyByCampaign','dailyByKeyword','hourlyByCampaign','hourlyByDowByCampaign','hourlyByAdgroup','hourlyByCampaignDate']
      .forEach(f=>{ if(Array.isArray(m[f])) m[f] = m[f].filter(r=>!r || !names.has(r.campaign)); });
    // 캠페인별 지도형 데이터에서도 제거
    ['keywordsByCampaign','wasteKeywordsByCampaign','expandKeywordsByCampaign','brandKeywordsByCampaign',
     'wasteBrandKeywordsByCampaign','expandBrandKeywordsByCampaign','searchTermsByCampaign',
     'wasteSearchTermsByCampaign','expandSearchTermsByCampaign','adgroupsByCampaign']
      .forEach(f=>{ const o=m[f]; if(o && typeof o==='object'){ names.forEach(n=>{ delete o[n]; }); } });
  });
  return data;
}

    // 아직 하위 컬렉션으로 안 옮겨진(예전 형식) 업체는 month 객체에 그대로 남아있는 값을 그대로 씀(하위호환).
    if(months.length){
      // 상세데이터는 예전엔 월 하나당 문서 하나(모든 필드를 합쳐서)로 저장했는데, 광고그룹별 시간대
      // 분석처럼 필드 하나만으로도 캠페인×광고그룹×요일×시간 조합이 많은 계정은 그 합쳐진 문서 하나가
      // Firestore 문서당 1MB 한도를 넘어버리는 경우가 생겨서, 이제 "월라벨__필드명" 단위로 문서를 더
      // 잘게 나눠 저장함 — 필드 하나가 아무리 커져도 같은 달의 다른 필드와 합쳐져서 한도를 넘는 일이 없어짐.
      // 예전 형식(월 하나에 모든 필드가 합쳐진 문서, id가 그냥 월라벨)으로 저장된 달은 그대로 읽어서 하위호환함.
      // 1순위: Storage 파일("clients/{id}/{월라벨}__{필드명}.json"). 없으면 아래 Firestore 경로로 폴백.
      const storageResults = await Promise.all(
        months.flatMap(m => DETAIL_DATA_FIELDS.map(f => ({ label:m.label, field:f })))
          .map(async ({label,field}) => ({ label, field, res: await fetchDetailFile(detailStorageRef(id,label,field)) }))
      );
      const storageMap = {}; // "월라벨__필드명" -> value (Storage에서 정상적으로 찾은 것만)
      const failedSet = new Set(); // "월라벨__필드명" — Storage에 파일이 있을 수도 있는데 네트워크/CORS 등으로 못 가져온 것
      storageResults.forEach(r=>{
        if(r.res && r.res.value!==undefined) storageMap[r.label+'__'+r.field] = r.res.value;
        else if(r.res && r.res.failed) failedSet.add(r.label+'__'+r.field);
      });
      const detailSnap = await docRef.collection('detailData').get().catch(()=>({docs:[]}));
      const fieldDocMap = {}; // "월라벨__필드명" -> {value}
      const legacyDocMap = {}; // "월라벨" -> {필드명: 값, ...}
      detailSnap.docs.forEach(d=>{
        const sep = d.id.indexOf('__');
        const fname = sep>0 ? d.id.slice(sep+2) : null;
        if(fname && DETAIL_DATA_FIELDS.includes(fname)) fieldDocMap[d.id] = d.data();
        else legacyDocMap[d.id] = d.data();
      });
      data.months = months.map(m=>{
        const legacy = legacyDocMap[m.label];
        const merged = { ...m };
        const unreliable = [];
        DETAIL_DATA_FIELDS.forEach(f=>{
          const key2 = m.label+'__'+f;
          if(storageMap[key2]!==undefined){ merged[f] = storageMap[key2]; return; }
          const perField = fieldDocMap[key2];
          if(perField){ merged[f] = perField.value!==undefined ? perField.value : fieldEmptyDefault(f); return; }
          if(legacy){ merged[f] = legacy[f]!==undefined ? legacy[f] : fieldEmptyDefault(f); return; }
          if(failedSet.has(key2)){
            // Storage 파일을 못 가져왔을 뿐 실제로는 데이터가 있을 수 있음 — 화면 표시는 일단 빈 값으로 하되,
            // 이 상태로 저장(setClient)하면 진짜 데이터를 빈 값으로 덮어쓸 위험이 있으니 표시해둠.
            merged[f] = fieldEmptyDefault(f);
            unreliable.push(f);
            return;
          }
          if(m[f]===undefined) merged[f] = fieldEmptyDefault(f);
        });
        if(unreliable.length) merged.__unreliableFields = unreliable;
        return merged;
      });
    }
    return data;
  }catch(e){ console.error(e); return null; }
}
async function setClient(key, data){
  try{
    const id = key.replace(/^client:/,'');
    const docRef = userClientsRef().doc(id);
    const months = data.months || [];
    // 문서 용량(1MB) 제한 대응: 무거운 필드(상세데이터)는 메인 문서에서 빼서 월별 하위 컬렉션 문서로 분리 저장
    const lightMonths = months.map(m=>{
      const light = { ...m };
      DETAIL_DATA_FIELDS.forEach(f=> delete light[f]);
      delete light.__unreliableFields; // getClient가 붙인 임시 내부 마커 — Firestore엔 저장하지 않음
      return light;
    });
    // lastBackup(되돌리기용 백업)에 예전 코드가 실수로 dailyByCampaign(날짜×캠페인 상세)까지 저장해둔
    // 경우가 있어서, 이미 Firestore에 저장돼있던 무거운 백업을 그대로 불러와 다시 저장하면 메인 문서 저장
    // 요청 자체가 커져서 실패할 수 있음 — 어떤 경로로 만들어진 백업이든 저장 시점에 항상 가볍게 정리함
    // (매번 자동으로 정리되므로 한 번만 저장해도 예전에 쌓인 무거운 백업이 자연히 사라짐).
    const lightData = { ...data };
    if(lightData.lastBackup && Array.isArray(lightData.lastBackup.entries)){
      lightData.lastBackup = {
        ...lightData.lastBackup,
        entries: lightData.lastBackup.entries.map(entry=>{
          if(!entry || !entry.month) return entry;
          const { dailyByCampaign, ...restMonth } = entry.month;
          return { ...entry, month: restMonth };
        })
      };
    }
    // 메인(가벼운) 문서를 먼저 저장 — 아래 상세데이터 저장 중 어떤 이유로든 실패하더라도 이름·색상·목표 등
    // 최신 요약 정보는 반영되도록 함.
    await docRef.set({ ...lightData, months: lightMonths });
    // 월별 상세데이터(키워드·시간대·일별 등)는 Firebase Storage에 "clients/{id}/{월라벨}__{필드명}.json"
    // 파일로 하나씩 저장함. Firestore 문서(1MB 한도)와 달리 Storage 파일은 사실상 용량 제한이 없음.
    // __unreliableFields: getClient가 이 필드를 Storage에서 불러오다 실패해서(네트워크/CORS 등) 화면엔
    // 일단 빈 값으로 채워둔 필드 목록 — 실제로는 값이 있을 수 있으므로 여기서 그대로 다시 저장하면
    // 진짜 데이터를 빈 값으로 영구히 덮어쓸 수 있음. 이런 필드는 업로드를 건너뛰고 기존 파일을 그대로 둠.
    const uploadTasks = [];
    for(const m of months){
      if(!m.label) continue;
      const unreliable = new Set(m.__unreliableFields||[]);
      for(const f of DETAIL_DATA_FIELDS){
        if(unreliable.has(f)) continue;
        const value = m[f]!==undefined ? m[f] : fieldEmptyDefault(f);
        uploadTasks.push({ label:m.label, field:f, value });
      }
    }
    const CONCURRENCY = 6;
    for(let i=0; i<uploadTasks.length; i+=CONCURRENCY){
      const slice = uploadTasks.slice(i, i+CONCURRENCY);
      await Promise.all(slice.map(async ({label,field,value})=>{
        const payloadStr = JSON.stringify({ value });
        await detailStorageRef(id, label, field).putString(payloadStr, 'raw', { contentType:'application/json' });
      }));
    }
    // 예전 Firestore 형식(합쳐진 문서, "월라벨__필드명" 단위 문서, 폐기된 필드)이 남아있다면 정리.
    const deleteDocIds = [];
    for(const m of months){
      if(!m.label) continue;
      deleteDocIds.push(m.label);
      DETAIL_DATA_FIELDS.forEach(f=> deleteDocIds.push(m.label+'__'+f));
      RETIRED_DETAIL_FIELDS.forEach(f=> deleteDocIds.push(m.label+'__'+f));
    }
    const CLEANUP_CHUNK = 450;
    for(let i=0; i<deleteDocIds.length; i+=CLEANUP_CHUNK){
      const cleanupBatch = db.batch();
      deleteDocIds.slice(i, i+CLEANUP_CHUNK).forEach(docId=> cleanupBatch.delete(docRef.collection('detailData').doc(docId)));
      await cleanupBatch.commit().catch(e=>console.warn('[setClient] legacy detailData cleanup failed (non-fatal)', e));
    }
    return true;
  }catch(e){ console.error(e); return false; }
}

/* ══════════════════════════════════════════════════════════════════════════
   표 공통 도구 — 조건 좁히기 + 엑셀 내려받기
   키워드 페이지에서 먼저 만든 것을 캠페인·쇼핑검색·시간대에서도 쓰려고 한 곳에 모았다.
   같은 코드를 세 번 복사하면 고칠 때도 세 번 고쳐야 하고, 한 곳만 빠뜨리면 페이지마다
   동작이 달라진다. 그래서 페이지들이 이 파일 하나를 같이 쓴다.

   쓰는 법 (페이지에서):
     const st = kmFilterState(key);                  // 조건 보관함 (없으면 만들어 줌)
     rows = kmApplyFilter(rows, st, {nameKey:'campaign'});   // 조건 적용
     ...HTML...  ${kmFilterBarHTML(st, rows.length, before)} // 조건 줄 그리기
     kmWireFilterBar(root, st, ()=>다시그리기());            // 입력 배선
     kmWireExcel(root, ()=>({rows, cols, meta}));            // 내려받기 배선
   ══════════════════════════════════════════════════════════════════════════ */

const KM_FILTER = {};   // key -> { minCost, minClicks, minConv, q }

function kmFilterState(key){
  if(!(key in KM_FILTER)) KM_FILTER[key] = { minCost:'', minClicks:'', minConv:'', q:'' };
  return KM_FILTER[key];
}
function kmNum(v){
  if(v===null || v===undefined || String(v).trim()==='') return null;
  const n = Number(String(v).replace(/[^0-9.]/g,''));
  return isFinite(n) ? n : null;
}
function kmFilterOn(st){
  return kmNum(st.minCost)!==null || kmNum(st.minClicks)!==null
      || kmNum(st.minConv)!==null || !!String(st.q||'').trim();
}
/* 조건 적용. cost는 화면 어디서나 '만원 단위'로 들고 다니는데 사람은 '원'으로 입력하므로
   10000을 곱해서 비교한다(이 규칙이 페이지마다 달라지면 같은 조건이 다르게 걸린다). */
function kmApplyFilter(rows, st, opt){
  const nameKey = (opt && opt.nameKey) || 'name';
  const fCost = kmNum(st.minCost), fClk = kmNum(st.minClicks), fCv = kmNum(st.minConv);
  const q = String(st.q||'').trim().toLowerCase();
  let out = rows;
  if(fCost!==null) out = out.filter(r=>(r.cost||0)*10000 >= fCost);
  if(fClk!==null)  out = out.filter(r=>(r.clicks||0) >= fClk);
  if(fCv!==null)   out = out.filter(r=>(r.conv||0) >= fCv);
  if(q)            out = out.filter(r=>String(r[nameKey]||'').toLowerCase().indexOf(q)>=0);
  return out;
}

function kmFilterBarHTML(st, shown, total, label){
  const on = kmFilterOn(st);
  const esc2 = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  const inp = (k,ph,w) => `<input type="${k==='q'?'text':'number'}" min="0" class="km-nf" data-nf="${k}" value="${esc2(st[k])}" placeholder="${ph}" style="width:${w}px;padding:5px 8px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:12px;">`;
  return `<div class="km-filterbar" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:12px 14px;border:1px solid var(--border);border-radius:11px;background:var(--panel-2);">
    <span style="font-size:12px;font-weight:700;color:var(--text);">조건 좁히기</span>
    <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);">비용 ${inp('minCost','예: 100000',112)}원 이상</label>
    <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);">클릭수 ${inp('minClicks','예: 10',78)}건 이상</label>
    <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);">전환수 ${inp('minConv','예: 1',78)}건 이상</label>
    <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);">${label||'이름'} ${inp('q','일부 검색',140)}</label>
    <button type="button" class="km-xlsx" style="margin-left:auto;font-size:12px;font-weight:700;padding:6px 14px;border-radius:8px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#12131c;">⬇️ 엑셀 내려받기 (${(shown||0).toLocaleString('ko-KR')}개)</button>
    ${on?`<button type="button" class="km-nf-reset" style="font-size:12px;font-weight:600;padding:5px 12px;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--muted);">조건 해제</button>
    <span style="font-size:12px;color:var(--accent);font-weight:700;">${(total||0).toLocaleString('ko-KR')}개 중 ${(shown||0).toLocaleString('ko-KR')}개</span>`:''}
  </div>`;
}

/* 입력 배선 — 글자를 칠 때마다 다시 그리면 커서가 튀므로 Enter 또는 포커스가 빠질 때만 적용 */
function kmWireFilterBar(st, rerender){
  document.querySelectorAll('.km-nf').forEach(inp=>{
    const apply = ()=>{ if(st[inp.dataset.nf] === inp.value) return; st[inp.dataset.nf] = inp.value; rerender(); };
    inp.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); apply(); } };
    inp.onblur = apply;
  });
  document.querySelectorAll('.km-nf-reset').forEach(b=>{
    b.onclick = ()=>{ st.minCost=''; st.minClicks=''; st.minConv=''; st.q=''; rerender(); };
  });
}

async function kmEnsureExcel(){
  if(typeof ExcelJS !== 'undefined') return true;
  return new Promise(res=>{
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    sc.onload=()=>res(true); sc.onerror=()=>res(false);
    document.head.appendChild(sc);
  });
}

/* 엑셀 만들기.
   cols = [{h:'제목', v:행=>값, w:폭}] — 값이 숫자면 숫자로, 문자열이면 문자열로 들어간다.
   meta = [['기간','2026.09'], ...] — 파일 첫머리에 어떤 조건으로 뽑았는지 남긴다. */
async function kmDownloadExcel({ rows, cols, meta, title, sheet, filename }){
  if(!rows || !rows.length){ alert('내려받을 데이터가 없어요.'); return; }
  if(!(await kmEnsureExcel())){ alert('엑셀 모듈을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.'); return; }
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(sheet || '데이터');
  ws.addRow([title || '데이터']);
  ws.getRow(1).font = { name:'맑은 고딕', size:14, bold:true };
  (meta||[]).forEach(m=>ws.addRow(m));
  ws.addRow([]);
  const headRow = ws.addRow(cols.map(c=>c.h));
  headRow.eachCell(c=>{
    c.font = { name:'맑은 고딕', size:10, bold:true, color:{argb:'FFFFFFFF'} };
    c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF2F3A52'} };
    c.alignment = { horizontal:'center', vertical:'middle' };
    c.border = { top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'} };
  });
  rows.forEach(r=>{
    const line = ws.addRow(cols.map(c=>{ const v = c.v(r); return (v===null||v===undefined) ? '' : v; }));
    line.eachCell(c=>{
      c.font = { name:'맑은 고딕', size:10 };
      c.border = { top:{style:'hair'},left:{style:'hair'},bottom:{style:'hair'},right:{style:'hair'} };
    });
  });
  ws.columns.forEach((col,i)=>{
    col.width = cols[i] && cols[i].w ? cols[i].w : 14;
    if(i>0 && !(cols[i] && cols[i].text)) col.numFmt = '#,##0';
  });
  ws.views = [{ state:'frozen', ySplit: headRow.number }];
  ws.autoFilter = { from:{row:headRow.number,column:1}, to:{row:headRow.number,column:cols.length} };
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (filename || '데이터') + '_' + new Date().toISOString().slice(0,10) + '.xlsx';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* 내려받기 버튼 배선. getSpec()은 위 kmDownloadExcel 이 받는 객체를 그때그때 만들어 돌려준다
   (버튼을 누르는 시점의 조건·정렬이 반영돼야 하므로 미리 만들어 두지 않는다). */
function kmWireExcel(getSpec){
  document.querySelectorAll('.km-xlsx').forEach(btn=>{
    btn.onclick = async ()=>{
      const label = btn.textContent;
      btn.disabled = true; btn.textContent = '만드는 중…';
      try { await kmDownloadExcel(getSpec()); }
      catch(e){ alert('엑셀을 만들지 못했어요: ' + (e && e.message ? e.message : e)); }
      finally { btn.disabled = false; btn.textContent = label; }
    };
  });
}

/* 제미나이 무료 등급은 요청이 몰리면 "high demand"로 자주 막힌다(특히 데이터를 통째로 넣는 총평).
   같은 모델을 계속 두드리는 대신, 막히면 다른 모델로 바로 넘어간다.
   앞쪽일수록 답변 품질이 좋고, 뒤쪽(lite)은 4배쯤 빠르고 덜 막힌다. */
const AI_MODELS = ['gemini-flash-latest','gemini-3.5-flash','gemini-flash-lite-latest','gemini-3.5-flash-lite'];
async function aiFetchWithFallback(apiKey, bodyObj, onRetry){
  let lastErr = null;
  for(let mi=0; mi<AI_MODELS.length; mi++){
    const model = AI_MODELS[mi];
    try{
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
        method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(bodyObj)
      });
      if(res.ok) return await res.json();
      const errBody = await res.json().catch(()=>({}));
      const msg = (errBody && errBody.error && errBody.error.message) || `HTTP ${res.status}`;
      const err = new Error(msg); err.status = res.status; lastErr = err;
      // 혼잡/과부하/한도면 다음 모델로. 그 외(키 오류 등)는 바꿔봐야 소용없으니 중단.
      const switchable = res.status===429 || res.status===503 || res.status===500 || /high demand|overloaded|quota|rate/i.test(msg);
      if(!switchable) throw err;
      if(onRetry && mi < AI_MODELS.length-1) onRetry(mi+1, AI_MODELS.length, AI_MODELS[mi+1]);
      await new Promise(r=>setTimeout(r, 600));
    }catch(e){
      lastErr = e;
      if(e.status && e.status!==429 && e.status!==503 && e.status!==500) throw e;
    }
  }
  throw lastErr || new Error('AI 응답 실패');
}
function getAIApiKey(){ return localStorage.getItem(AI_KEY_STORAGE) || ''; }
function setAIApiKey(k){ localStorage.setItem(AI_KEY_STORAGE, k); }
function extractTopKeywordsFromClientData(data){
  const months = data.months || [];
  if(!months.length) return [];
  const last = months[months.length-1];
  const maps = [last.keywordsByCampaign, last.brandKeywordsByCampaign, last.searchTermsByCampaign].filter(Boolean);
  const all = [];
  maps.forEach(map=>{
    Object.keys(map||{}).forEach(camp=>{
      (map[camp]||[]).forEach(item=> all.push({ ...item, campaign: camp }));
    });
  });
  all.sort((a,b)=> ((b.revenue||0)-(a.revenue||0)) || ((b.conv||0)-(a.conv||0)));
  return all.slice(0,15);
}
async function buildAllClientsSummary(){
  const keys = await listClients();
  const rows = (await Promise.all(keys.map(async key=>{
    const d = await getClientLight(key);
    if(!d) return null;
    const months = d.months || [];
    const last = months[months.length-1];
    if(!last) return null;
    return { name: d.name, industry: d.industry||'-', isDB: d.bizType==='DB', label: last.label, cost: last.cost||0, conv: last.conv||0, revenue: last.revenue||0 };
  }))).filter(Boolean);
  return rows;
}
async function buildAIContext(){
  const data = window.__currentClientData;
  const ctx = window.__pageAIContext;
  if(!data || !ctx){
    const rows = await buildAllClientsSummary();
    if(!rows.length) return '아직 등록된 업체가 없어요.';
    const lines = ['현재 특정 업체가 선택돼있지 않아요. 아래는 전체 업체의 최근 기간 요약이에요 — 특정 업체를 지정하지 않은 질문에는 이 요약을 참고해서 답하고, 특정 업체의 자세한 분석이 필요한 질문이면 어떤 업체를 볼지 먼저 사용자에게 물어보세요.', ''];
    rows.forEach(r=>{
      const metric = r.isDB ? `전환 ${r.conv}건` : `매출 ${Math.round(r.revenue*10000).toLocaleString('ko-KR')}원`;
      lines.push(`- ${r.name} (${r.industry}, ${r.label}): 비용 ${Math.round(r.cost*10000).toLocaleString('ko-KR')}원, ${metric}`);
    });
    return lines.join('\n');
  }
  const lines = [];
  lines.push(`업체명: ${data.name} (${data.industry||'-'}), 업종: ${ctx.isDB?'DB(상담·전환형)':'B2C(매출형)'}`);
  lines.push(`현재 보고 있는 화면: 캠페인 비교 전용 페이지 - ${ctx.periodLabel} 기준`);
  if(ctx.rows.length){
    lines.push('\n캠페인별 성과 (효율 좋은 순):');
    ctx.rows.forEach(r=>{
      const metric = ctx.isDB ? `전환 ${r.conv}건, CPA ${r.cpa!==null?Math.round(r.cpa).toLocaleString('ko-KR')+'원':'-'}` : `매출 ${Math.round((r.revenue||0)*10000).toLocaleString('ko-KR')}원, ROAS ${r.roas.toFixed(0)}%`;
      lines.push(`- ${r.campaign} (${campaignTypeLabel(r.type)}): 비용 ${Math.round(r.cost*10000).toLocaleString('ko-KR')}원, ${metric}`);
    });
  }
  if(ctx.insights.length){
    lines.push('\n이 페이지가 이미 뽑아낸 인사이트:');
    ctx.insights.forEach(t=> lines.push(`- ${t}`));
  }
  const topKeywords = extractTopKeywordsFromClientData(data);
  if(topKeywords.length){
    lines.push('\n참고: 이 업체의 최근 기간 키워드/검색어 성과:');
    topKeywords.forEach(k=> lines.push(`- ${k.keyword} (${k.campaign}): 비용 ${Math.round((k.cost||0)*10000).toLocaleString('ko-KR')}원, 전환 ${k.conv||0}건`));
  }
  return lines.join('\n');
}
function formatChatText(text){
  // 마크다운 별표(**굵게**, * 목록)를 그대로 화면에 노출하지 않고 자연스러운 텍스트로 바꿔줌
  let s = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/^[*-]\s+/gm, '• ');
  s = s.replace(/\*/g, '');
  s = s.replace(/^-{3,}\s*$/gm, '');
  return s;
}
function appendChatMsg(role, text){
  const body = document.getElementById('aiChatBody');
  const div = document.createElement('div');
  div.className = 'ai-chat-msg ' + role;
  div.innerHTML = formatChatText(text);
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  return div;
}

async function sendAIChat(){
  const input = document.getElementById('aiChatInput');
  const text = input.value.trim();
  if(!text) return;
  const apiKey = getAIApiKey();
  if(!apiKey){ refreshChatUI(); return; }
  appendChatMsg('user', text);
  input.value = '';
  aiChatHistory.push({ role:'user', content: text });
  saveChatHistory();
  const sendBtn = document.getElementById('aiChatSendBtn');
  sendBtn.disabled = true;
  const loadingEl = appendChatMsg('assistant', '생각 중...');
  try{
    const contextStr = await buildAIContext();
    const systemPrompt = `당신은 네이버 검색광고 성과 데이터를 분석해주는 어시스턴트입니다. 아래는 지금 대행사 담당자가 보고 있는 화면의 데이터 요약입니다. 이 데이터를 바탕으로 한국어로 간결하고 실용적으로 답변하세요. 데이터에 없는 내용은 추측하지 말고 모른다고 답하세요.\n\n${contextStr}`;
    const contents = aiChatHistory.slice(-10).map(m=>({ role: m.role==='assistant' ? 'model' : 'user', parts: [{ text: m.content }] }));
    const json = await aiFetchWithFallback(apiKey, {
      contents,
      systemInstruction: { parts: [{ text: systemPrompt }] }
    }, (n, total, next)=>{
      try{ loadingEl.innerHTML = formatChatText('\uc751\ub2f5\uc774 \ubab0\ub824\uc11c \ub2e4\ub978 \ubaa8\ub378\ub85c \ubc14\uafd4 \ub2e4\uc2dc \uc2dc\ub3c4\ud558\ub294 \uc911... ('+(n+1)+'/'+total+')'); }catch(_){}
    });
    const cand = (json.candidates && json.candidates[0]) || {};
    const parts = (cand.content && cand.content.parts) || [];
    const replyText = parts.map(p=>p.text||'').join('\n').trim() || '(응답이 없어요)';
    loadingEl.innerHTML = formatChatText(replyText);
    aiChatHistory.push({ role:'assistant', content: replyText });
    saveChatHistory();
  }catch(e){
    console.error(e);
    loadingEl.innerHTML = formatChatText('오류가 발생했어요: ' + (e.message||e));
    loadingEl.style.color = 'var(--down)';
  }finally{
    sendBtn.disabled = false;
    input.focus();
  }
}
document.getElementById('aiChatSendBtn').onclick = sendAIChat;
document.getElementById('aiChatInput').addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendAIChat(); }
});

/* ---------- AI 총평 (성과 인사이트를 자연스러운 문단으로 종합) ---------- */
// 기존 "질문하면 답하는" 챗봇과 같은 Gemini 연동·컨텍스트(buildAIContext)를 재사용하되,
// 규칙 기반 인사이트 목록을 그대로 나열하지 않고 하나의 자연스러운 총평 문단으로 종합해서 보여줌.
// 고객 리포트에 바로 붙여넣기 좋은 문장을 목표로 함. 업체+기간별로 결과를 따로 기억해서
// 기간을 바꾸면 새로 생성하기 전까지는 "아직 생성 안 함" 상태로 보이게 함.
const aiSummaryState = {}; // "client:slug::기간라벨" -> { status:'loading'|'done'|'error', text, errorMsg }
function aiSummaryStateKey(key, periodLabel){ return key + '::' + periodLabel; }
// Gemini API가 "high demand"(일시적 과부하) 응답을 줄 때가 잦아서, 매번 사용자가 손으로 "다시 시도"를
// 누르지 않아도 되도록 몇 초 간격을 두고 자동으로 재시도함. 429(요청 과다)·503(서버 과부하)류의 일시적
// 오류나 "overloaded"/"high demand" 문구가 섞인 오류만 재시도 대상으로 보고, 그 외(예: API 키 자체가
// 잘못된 경우)는 재시도해봐야 소용없으니 바로 실패 처리함.
const GEMINI_RETRY_DELAYS_MS = [1500, 4000, 9000]; // 최대 3회 자동 재시도, 갈수록 간격을 늘림
function isRetryableGeminiError(status, errBody){
  if(status===429 || status===503) return true;
  const msg = ((errBody && errBody.error && errBody.error.message) || '').toLowerCase();
  return msg.includes('overloaded') || msg.includes('high demand') || msg.includes('unavailable');
}
async function callGeminiGenerateContent(apiKey, systemPrompt, userText, onRetry){
  for(let attempt=0; ; attempt++){
    let res, networkErr = null;
    try{
      // 한 모델이 막히면 다른 모델로 넘어간다(같은 모델 재시도보다 성공률이 훨씬 높음)
      const _json = await aiFetchWithFallback(apiKey, {
        contents: [{ role:'user', parts:[{ text:userText }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] }
      }, onRetry ? (i,total,next)=>onRetry(i,total) : null);
      const _c = (_json.candidates && _json.candidates[0]) || {};
      const _p = (_c.content && _c.content.parts) || [];
      return _p.map(p=>p.text||'').join('\n').trim() || '(응답이 없어요)';
    }catch(e){ networkErr = e; }
    if(!networkErr && res.ok){
      const json = await res.json();
      const cand = (json.candidates && json.candidates[0]) || {};
      const parts = (cand.content && cand.content.parts) || [];
      return parts.map(p=>p.text||'').join('\n').trim() || '(응답이 없어요)';
    }
    const errBody = networkErr ? null : await res.json().catch(()=>({}));
    const canRetry = attempt < GEMINI_RETRY_DELAYS_MS.length && (networkErr || isRetryableGeminiError(res.status, errBody));
    if(!canRetry){
      if(networkErr) throw networkErr;
      throw new Error((errBody && errBody.error && errBody.error.message) || `HTTP ${res.status}`);
    }
    if(onRetry) onRetry(attempt+1, GEMINI_RETRY_DELAYS_MS.length+1);
    await new Promise(r=>setTimeout(r, GEMINI_RETRY_DELAYS_MS[attempt]));
  }
}
async function generateAISummary(data, key, periodLabel){
  const apiKey = getAIApiKey();
  if(!apiKey){
    document.getElementById('aiChatPanel').classList.add('open');
    sessionStorage.setItem(CHAT_OPEN_STORAGE, '1');
    document.getElementById('aiChatSetup').classList.add('show');
    refreshChatUI();
    return;
  }
  const sKey = aiSummaryStateKey(key, periodLabel);
  aiSummaryState[sKey] = { status:'loading' };
  renderCampaignsPage(data);
  try{
    const contextStr = await buildAIContext();
    const systemPrompt = `당신은 네이버 검색광고 대행사의 시니어 매니저입니다. 아래는 지금 보고 있는 화면(캠페인 비교 페이지)의 데이터 요약과, 이미 규칙 기반으로 뽑아낸 인사이트 목록입니다.\n\n${contextStr}\n\n위 내용을 바탕으로, 고객 보고서에 그대로 붙여넣을 수 있는 자연스러운 한국어 총평을 2~4문장으로 작성하세요. 규칙: (1) 위 데이터·인사이트에 없는 내용은 추측하지 마세요. (2) 인사이트 목록을 그대로 나열하지 말고 핵심만 골라 하나의 자연스러운 글로 종합하세요. (3) 가능하면 다음 기간에 시도해볼 만한 액션을 한 가지 짧게 제안하세요. (4) 마크다운(별표, 목록 기호 등)은 쓰지 마세요.`;
    const replyText = await callGeminiGenerateContent(apiKey, systemPrompt, '위 데이터를 바탕으로 총평을 작성해주세요.', (attempt, max)=>{
      aiSummaryState[sKey] = { status:'loading', retryAttempt: attempt, retryMax: max };
      renderCampaignsPage(data);
    });
    aiSummaryState[sKey] = { status:'done', text: replyText };
  }catch(e){
    console.error(e);
    aiSummaryState[sKey] = { status:'error', errorMsg: e.message||String(e) };
  }
  renderCampaignsPage(data);
}
function buildAISummaryBoxHTML(key, periodLabel){
  const sKey = aiSummaryStateKey(key, periodLabel);
  const st = aiSummaryState[sKey];
  if(!st){
    return `<button class="btn btn-ghost ai-summary-btn" style="margin-top:10px;width:100%;font-size:12px;">🤖 AI 총평 쓰기 (이 기간 데이터로 자연스러운 요약 문단 생성)</button>`;
  }
  if(st.status==='loading'){
    return `<div style="margin-top:10px;font-size:12px;color:var(--muted);">🤖 ${st.retryAttempt ? `일시적 오류로 자동 재시도 중이에요 (${st.retryAttempt}/${st.retryMax})...` : '총평을 쓰는 중...'}</div>`;
  }
  if(st.status==='error'){
    return `<div style="margin-top:10px;font-size:12px;color:var(--down);">⚠️ 총평 생성 실패: ${st.errorMsg}</div><button class="btn btn-ghost ai-summary-btn" style="margin-top:6px;width:100%;font-size:12px;">다시 시도</button>`;
  }
  return `
    <div style="margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--border);font-size:12px;line-height:1.7;color:var(--text);">
      🤖 <b>AI 총평</b> <span style="font-size:11px;color:var(--muted);font-weight:400;">(Gemini 생성 · 참고용, 내보내기 전 검토 권장)</span>
      <div style="margin-top:6px;">${formatChatText(st.text)}</div>
    </div>
    <button class="btn btn-ghost ai-summary-btn" style="margin-top:8px;width:100%;font-size:12px;">🔄 다시 생성</button>
  `;
}


function ensureFilterState(key, data){
  if(filterState[key]) return filterState[key];
  const campSet = new Set();
  const typeSet = new Set();
  (data.months||[]).forEach(m=>{
    (m.campaigns||[]).forEach(c=>{ if(IS_PLACE_TYPE(c.type)) return; campSet.add(c.campaign); typeSet.add(c.type); });
  });
  filterState[key] = { types: new Set(typeSet), campaigns: new Set(campSet) };
  return filterState[key];
}


// monthsScope를 주면 그 기간에 실제로 돌아간(노출·클릭·비용 중 하나라도 있는) 캠페인만 남긴다.
// 예전엔 전체 기간 목록을 그대로 뿌려서, 어제 하루를 봐도 몇 달 전에 끝난 캠페인이 필터에 잔뜩 남았음.
function mergedCampaignList(data, monthsScope){
  const map = {};
  const scope = (monthsScope && monthsScope.length) ? monthsScope : (data.months||[]);
  const active = new Set();
  scope.forEach(m=>{ (m.campaigns||[]).forEach(c=>{
    if((c.cost||0)>0 || (c.impressions||0)>0 || (c.clicks||0)>0 || (c.conv||0)>0) active.add(c.campaign);
  }); });
  (scope).forEach(m=>{
    (m.campaigns||[]).forEach(c=>{
      if(IS_PLACE_TYPE(c.type)) return;
      if(active.size && !active.has(c.campaign)) return;
      if(!map[c.campaign]) map[c.campaign] = { type:c.type, campaign:c.campaign };
    });
  });
  return Object.values(map);
}

/* ---------- 렌더링 ---------- */

// 제안 실행 추적 — 인사이트(캠페인 지목형)에 "적용 표시" 토글을 붙여서, 다음 달에 실제로
// 그 캠페인의 문제 지표(CPA/ROAS/전환)가 개선됐는지 확인할 수 있게 함.
// 키는 "적용 표시한 시점의 기간::캠페인명::인사이트 종류" 문자열 — 같은 캠페인의 같은 종류 문제가
// 다시 발생하면 새 기간으로 다시 표시할 수 있도록 기간을 키에 포함시킴.
function suggestionKey(monthLabel, campaign, kind){ return `${monthLabel}::${campaign}::${kind}`; }
function parseSuggestionKey(k){
  const parts = String(k).split('::');
  if(parts.length!==3) return null;
  const [month, campaign, kind] = parts;
  return { month, campaign, kind };
}
// kind별로 "이 캠페인의 문제 지표"를 특정 달의 원본 campaigns[] 데이터에서 직접 계산 (필터·병합 영향 안 받게)
function getCampaignMetricForMonth(monthObj, campaignName, kind){
  if(!monthObj || !monthObj.campaigns) return null;
  const c = monthObj.campaigns.find(x=>x.campaign===campaignName);
  if(!c) return null;
  if(kind==='high-cpa') return c.conv>0 ? (c.cost*10000/c.conv) : null;
  if(kind==='roas-low') return c.cost>0 ? (c.revenue/c.cost*100) : null;
  if(kind==='zero-conv') return c.conv||0;
  return null;
}
const KIND_LABEL = { 'high-cpa':'CPA 개선', 'zero-conv':'전환 발생', 'roas-low':'ROAS 개선' };
// improved: metric이 "좋아지는 방향"으로 바뀌었는지 판단 (kind마다 좋은 방향이 다름)
function isMetricImproved(kind, before, after){
  if(before===null || after===null || before===undefined || after===undefined) return null;
  if(kind==='high-cpa') return after < before;
  if(kind==='roas-low') return after > before;
  if(kind==='zero-conv') return after > 0;
  return null;
}
function fmtMetric(kind, v){
  if(v===null || v===undefined) return '-';
  if(kind==='high-cpa') return Math.round(v).toLocaleString('ko-KR')+'원';
  if(kind==='roas-low') return v.toFixed(0)+'%';
  if(kind==='zero-conv') return v+'건';
  return String(v);
}
// 지난 기간에 "적용함"으로 표시했던 제안들을 모아, 그 이후 가장 최근 달과 비교해서 실제로 개선됐는지 보여줌.
// 적용 표시한 달 자체가 최신 달이면 아직 비교할 "다음 달"이 없으므로 건너뜀.
function buildAppliedSuggestionsReviewHTML(data, allMonths){
  const applied = data.appliedSuggestions || [];
  if(!applied.length || !allMonths.length) return '';
  const latestMonth = allMonths[allMonths.length-1];
  const rows = applied.map(k=>{
    const parsed = parseSuggestionKey(k);
    if(!parsed) return null;
    if(parsed.month===latestMonth.label) return null; // 적용한 달 자체 = 아직 결과 판단 불가
    const monthObj = allMonths.find(m=>m.label===parsed.month);
    if(!monthObj) return null;
    const before = getCampaignMetricForMonth(monthObj, parsed.campaign, parsed.kind);
    const after = getCampaignMetricForMonth(latestMonth, parsed.campaign, parsed.kind);
    const improved = isMetricImproved(parsed.kind, before, after);
    return { key:k, ...parsed, before, after, improved };
  }).filter(Boolean);
  if(!rows.length) return '';
  rows.sort((a,b)=> (a.improved===b.improved) ? 0 : (a.improved ? -1 : 1)); // 개선된 것부터
  const rowHtml = r => `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--text);padding:5px 0;border-bottom:1px solid var(--border);">
    <span>${r.improved===true?'✅':r.improved===false?'⚠️':'ℹ️'} <b>${r.campaign}</b> — ${KIND_LABEL[r.kind]||r.kind} <span style="color:var(--muted);">(${r.month} 적용 표시)</span></span>
    <span style="white-space:nowrap;color:${r.improved===true?'var(--up)':r.improved===false?'var(--down)':'var(--muted)'};font-weight:600;">${fmtMetric(r.kind, r.before)} → ${fmtMetric(r.kind, r.after)}</span>
  </div>`;
  return `<div class="panel" style="margin-bottom:18px;">
    <div class="panel-title">✅ 제안 실행 추적 <span style="font-size:12px;color:var(--muted);font-weight:400;">— "적용 표시"한 제안이 이후(${latestMonth.label}) 실제로 개선됐는지</span></div>
    ${rows.map(rowHtml).join('')}
  </div>`;
}

const cpSortState = {}; // key -> { field, dir }

const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* 캠페인 ON/OFF 상태 — index.html에서 쓰는 것과 같은 규칙.
   수집기가 상태를 저장하기 시작하면 자동으로 배지가 뜸(없으면 on=undefined → 배지 미표시).
   저장 위치가 확정 전이라 가능한 경로를 모두 살펴봄. */
function lookupCampaignStatusMap(months, data){
  if(data && data.campaignStatus && typeof data.campaignStatus === 'object') return data.campaignStatus;
  for(let i=months.length-1;i>=0;i--){
    const m = months[i];
    if(m && m.campaignStatus && typeof m.campaignStatus === 'object') return m.campaignStatus;
  }
  for(let i=months.length-1;i>=0;i--){
    const m = months[i];
    if(m && m.campaigns && m.campaigns.some(c=>c && ('on' in c))){
      const map = {};
      m.campaigns.forEach(c=>{ if(c && ('on' in c)) map[c.campaign] = !!c.on; });
      return map;
    }
  }
  return null;
}
function applyCampaignStatus(rows, months, data){
  const statusMap = lookupCampaignStatusMap(months, data);
  if(!statusMap) return rows;
  rows.forEach(c=>{
    const st = statusMap[c.campaign];
    if(st === undefined || st === null) return;
    // { on:true/false } 형태와 true/false 원시값, 'ENABLED'/'PAUSED' 문자열 모두 허용
    if(typeof st === 'boolean') c.on = st;
    else if(typeof st === 'string') c.on = !/paused|off|disabled/i.test(st);
    else if(typeof st === 'object' && 'on' in st) c.on = !!st.on;
  });
  return rows;
}
function campaignStatusBadge(c){
  if(c.on === undefined) return '';
  return c.on
    ? `<span style="flex:none;font-size:12px;font-weight:700;border-radius:4px;padding:1px 5px;margin-right:5px;color:#0d0e15;background:var(--up);">ON</span>`
    : `<span style="flex:none;font-size:12px;font-weight:700;border-radius:4px;padding:1px 5px;margin-right:5px;color:var(--muted);background:var(--border);">OFF</span>`;
}
function mergeCampaignRows(months, fstate){
  const map = {};
  months.forEach(m=>{
    (m.campaigns||[]).forEach(c=>{
      if(!fstate.campaigns.has(c.campaign)) return;
      if(!map[c.campaign]) map[c.campaign] = { campaign:c.campaign, type:c.type, cost:0, revenue:0, conv:0, impressions:0, clicks:0, rankSum:0, rankImp:0 };
      map[c.campaign].cost += c.cost; map[c.campaign].revenue += c.revenue; map[c.campaign].conv += c.conv;
      map[c.campaign].impressions += c.impressions||0; map[c.campaign].clicks += c.clicks||0;
      if(c.avgRank!==null && c.avgRank!==undefined && c.impressions>0){
        map[c.campaign].rankSum += c.avgRank*c.impressions; map[c.campaign].rankImp += c.impressions;
      }
    });
  });
  return Object.values(map).map(v=>({ ...v, avgRank: v.rankImp>0 ? (v.rankSum/v.rankImp) : null }));
}
// 상단 캠페인 표에 날짜 선택(dayRange)이 걸려 있을 때 쓰는 버전 — 월별 스냅샷(campaigns)엔 날짜가 없어서
// 대신 dailyByCampaign(날짜×캠페인)을 날짜로 먼저 자르고 캠페인 단위로 재집계함. avgRank는 일별 데이터엔
// 없어서 이 모드에서는 항상 null로 나옴(원본 데이터 자체에 없는 값).
function mergeCampaignRowsByDayRange(months, fstate, dayRange){
  const map = {};
  // dailyByCampaign 행에는 캠페인 유형(type)이 없어서 그대로 쓰면 표에 'undefined'가 찍힘.
  // 같은 달의 월 단위 campaigns 목록에서 캠페인명 → 유형을 미리 뽑아두고 채워 넣음.
  const typeByCampaign = {};
  months.forEach(m=>(m.campaigns||[]).forEach(c=>{ if(c && c.campaign && c.type) typeByCampaign[c.campaign] = c.type; }));
  months.forEach(m=>{
    let rows = m.dailyByCampaign||[];
    rows = filterRowsByDayRange(rows, dayRange);
    rows.forEach(r=>{
      if(!fstate.campaigns.has(r.campaign)) return;
      if(!map[r.campaign]) map[r.campaign] = { campaign:r.campaign, type: r.type || typeByCampaign[r.campaign] || '기타', cost:0, revenue:0, conv:0, impressions:0, clicks:0 };
      map[r.campaign].cost += r.cost||0; map[r.campaign].revenue += r.revenue||0; map[r.campaign].conv += r.conv||0;
      map[r.campaign].impressions += r.impressions||0; map[r.campaign].clicks += r.clicks||0;
    });
  });
  return Object.values(map).map(v=>({ ...v, avgRank: null }));
}

// 인사이트·원인진단에서 쓰는 임계값들을 한 곳에 모음 — 예전엔 각 함수에 매직넘버로 흩어져 있어서

  BIG_MOVE_CPA_PCT: 30,      // "직전 대비 크게 나빠짐" 판단 기준 — CPA 변동률(%)
  BIG_MOVE_ROAS_PP: 20,      // "직전 대비 크게 나빠짐" 판단 기준 — ROAS 변동폭(%p)
  DIAG_MIN_IMPRESSIONS: 100, // 캠페인 원인진단 — 이 미만이면 "노출 자체가 적음"으로 판단
  DIAG_LOW_CTR_RATIO: 0.6,   // 캠페인 원인진단 — best 캠페인 CTR의 이 비율 미만이면 "CTR 낮음"

  DIAG_LOW_CVR_MIN_CLICKS: 20, // 위 CVR 낮음 판단에 필요한 최소 클릭수

  ZERO_CONV_HIGH_CLICKS: 20, // 전환 0건 캠페인 진단 — 이 이상 클릭이 있으면 "클릭은 있는데 전환 없음"으로 판단

};

function dcAlignTables(root){
  const scope = root || document;
  scope.querySelectorAll('table').forEach(tb=>{
    const body = tb.tBodies && tb.tBodies[0];
    if(!body || !body.rows.length) return;
    const head = tb.tHead && tb.tHead.rows[0];
    const cols = Math.max(...[...body.rows].map(r=>r.cells.length));
    for(let c=0;c<cols;c++){
      let num=0, tot=0;
      for(const row of body.rows){
        const cell = row.cells[c];
        if(!cell || cell.colSpan>1) continue;
        const txt = (cell.textContent||'').trim();
        if(!txt || txt==='-' || txt==='—') continue;
        tot++;
        if(/^[₩$]?[\d,.]+\s*(원|건|개|위|%|만|억)?/.test(txt) && /\d/.test(txt)) num++;
      }
      if(tot>=2 && num/tot >= 0.7){
        for(const row of body.rows){ const cell=row.cells[c]; if(cell && cell.colSpan===1 && !cell.style.textAlign) cell.style.textAlign='right'; }
        if(head && head.cells[c] && !head.cells[c].style.textAlign) head.cells[c].style.textAlign='right';
      }
    }
  });
}

/* 줄이 많은 표는 화면을 끝없이 늘려서, 일정 높이로 잘라 안쪽에서만 스크롤되게 한다.
   (머리글은 스크롤해도 위에 붙어 있어서 어느 칸인지 계속 보임) */
function dcCompactTables(root){
  const scope = root || document;
  scope.querySelectorAll('table').forEach(tb=>{
    if(tb.dataset.dcCompact) return;
    const body = tb.tBodies && tb.tBodies[0];
    if(!body) return;
    if(tb.closest('.hr-scroll, .dc-scroll')) { tb.dataset.dcCompact='1'; return; }
    const parent = tb.parentElement;
    if(!parent) return;
    // 줄이 많아서 세로로 길거나(16줄↑), 칸이 많아서 가로로 넓은(부모보다 큰) 표를 상자에 넣는다.
    // 가로로 넓은 표를 그냥 두면 카드 전체가 늘어나서 화면 오른쪽이 잘림.
    const tooTall = body.rows.length >= 16;
    const tooWide = tb.scrollWidth > parent.clientWidth + 4;
    if(!tooTall && !tooWide) return;
    const wrap = document.createElement('div');
    wrap.className = tooTall ? 'dc-scroll' : 'dc-scroll dc-scroll-x';
    parent.insertBefore(wrap, tb);
    wrap.appendChild(tb);
    tb.dataset.dcCompact = '1';
  });
}
// 화면이 다시 그려질 때마다 자동으로 정렬을 다시 적용 (페이지마다 렌더 함수가 달라서 한 곳에서 처리)
(function(){
  let t = null;
  const run = ()=>{ t=null; try{ dcCompactTables(document); dcAlignTables(document); }catch(e){} };
  const start = ()=>{
    try{ new MutationObserver(()=>{ if(t) return; t=setTimeout(run,60); }).observe(document.body,{childList:true,subtree:true}); }catch(e){}
    run();
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

function dcSpark(vals, w, h){
  const v = (vals||[]).filter(x=>isFinite(x));
  if(v.length < 2) return '';
  const W = w||84, H = h||22, max = Math.max(...v), min = Math.min(...v), span = (max-min)||1;
  const pts = v.map((x,i)=>`${(i/(v.length-1)*W).toFixed(1)},${(H - (x-min)/span*(H-2) - 1).toFixed(1)}`).join(' ');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="vertical-align:middle;overflow:visible">
    <polyline points="${pts}" fill="none" stroke="${DC.acc}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/></svg>`;
}

/* 날짜 프리셋을 누르면 위쪽 '기간(월)' 위젯도 그 날짜가 속한 달로 같이 옮긴다.
