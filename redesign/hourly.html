      cost:  { label:'비용(만원)', data:hourlyChartRows.map(h=>Number(h.cost.toFixed(1))), color:'#3fd4a3', axis:'count' },
      revenue: { label:'매출(만원)', data:hourlyChartRows.map(h=>Number(h.revenue.toFixed(1))), color:'#4dd0ff', axis:'count' },
      roas:  { label:'ROAS(%)', data:hourlyChartRows.map(h=> h.cost>0 ? Number((h.revenue/h.cost*100).toFixed(1)) : 0), color:'#ff9d4d', axis:'pct' },
      // CPA는 원화 단위라 노출수·클릭수·비용(count 축)과 스케일이 완전히 달라 같은 축에 두면 다른 지표가
      // 시각적으로 눌려 보임. pct 축(y1, 오른쪽)에 얹어서 분리 — 값 범위 자체는 Chart.js가 축마다 알아서 잡아줌.
      cpa:   { label:'CPA(원)', data:hourlyChartRows.map(h=> h.conv>0 ? Math.round(h.cost*10000/h.conv) : 0), color:'#ff9d4d', axis:'pct' },
    };
    const hourLabels = hourlyChartRows.map(h=>h.hour+'시');
    let hourChart = null;
    function buildChartHour(){
      const selected = [...document.querySelectorAll('.hour-metric:checked')].map(cb=>cb.value);
      const datasets = selected.map(k=>{
        const m = HOUR_METRICS[k];
        return { type:'line', label:m.label, data:m.data, borderColor:m.color, backgroundColor:m.color, tension:.3, pointRadius:2, yAxisID: m.axis==='pct' ? 'y1' : 'y' };
      });
      if(hourChart) hourChart.destroy();
      const hourEl = document.getElementById('chartHour');
      if(!hourEl) return;
      hourChart = new Chart(hourEl, {
        data:{ labels:hourLabels, datasets },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#8d90a8',font:{size:10}}}},
          scales:{ y:{position:'left',grid:{color:'#292a3d'},ticks:{color:'#8d90a8',font:{size:10}}}, y1:{position:'right',grid:{display:false},ticks:{color:'#8d90a8',font:{size:10}}}, x:{grid:{display:false},ticks:{color:'#8d90a8',font:{size:9},maxTicksLimit:24}} } }
      });
    }
    document.querySelectorAll('.hour-metric').forEach(cb=>{ cb.onchange = buildChartHour; });
    buildChartHour();

    const cmpSearchEl = document.getElementById('hourCmpSearch');
    if(cmpSearchEl){
      cmpSearchEl.oninput = ()=>{
        hourCompareSearch[key] = cmpSearchEl.value;
        const pos = cmpSearchEl.selectionStart;
        renderHourlyPage(data);
        // 다시 그리면 입력창이 새로 만들어져 포커스가 날아감 — 커서 위치까지 복원해줘야 계속 타이핑이 됨
        const again = document.getElementById('hourCmpSearch');
        if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
      };
    }
    document.querySelectorAll('.hour-cmp-camp').forEach(cb=>{
      cb.onchange = ()=>{
        const set = new Set(hourCompareCampaigns[key]);
        if(cb.checked) set.add(cb.value); else set.delete(cb.value);
        hourCompareCampaigns[key] = [...set].slice(0,3);
        renderHourlyPage(data);
      };
    });
    document.querySelectorAll('.hour-cmp-metric-btn').forEach(btn=>{
      btn.onclick = ()=>{ hourCompareMetric[key] = btn.dataset.metric; renderHourlyPage(data); };
    });
    if(compareCampaigns.length){
      const cmpEl = document.getElementById('chartHourCompare');
      if(cmpEl){
        const cmpDatasets = compareCampaigns.map((camp, i)=>{
          const arr = compareData[camp];
          const vals = realHours(arr).map(h=> compareMetric==='cost' ? Number(h.cost.toFixed(1)) : compareMetric==='ctr' ? Number(h.ctr.toFixed(2)) : compareMetric==='cvr' ? Number(h.cvr.toFixed(2)) : compareMetric==='cpa' ? (h.cpa||0) : compareMetric==='roas' ? Number(h.roas.toFixed(1)) : h.conv);
          return { type:'line', label:camp, data:vals, borderColor:CMP_COLORS[i%CMP_COLORS.length], backgroundColor:CMP_COLORS[i%CMP_COLORS.length], tension:.3, pointRadius:2 };
        });
        new Chart(cmpEl, {
          data:{ labels:hourLabels, datasets:cmpDatasets },
          options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#8d90a8',font:{size:10}}}},
            scales:{ y:{grid:{color:'#292a3d'},ticks:{color:'#8d90a8',font:{size:10}}}, x:{grid:{display:false},ticks:{color:'#8d90a8',font:{size:9},maxTicksLimit:24}} } }
        });
      }
    }
    // 시간대 표 엑셀 내려받기 (24줄뿐이라 조건 좁히기는 없음)
    kmWireExcel(()=>{
      const rs = hourlyWithTrend.filter(h=>!h.unknown || h.impressions>0 || h.cost>0 || h.conv>0);
      const cols = [
        { h:'시간대', v:h=>h.unknown ? '시간 미상' : (h.hour + '시'), w:12, text:1 },
        { h:'노출수', v:h=>h.impressions||0 },
        { h:'클릭수', v:h=>h.clicks||0 },
        { h:'클릭률(%)', v:h=>+(((h.impressions>0)?(h.clicks/h.impressions*100):0).toFixed(2)) },
        { h:'비용(원)', v:h=>Math.round((h.cost||0)*10000) },
        { h:'전환수', v:h=>h.conv||0 },
      ];
      if(isDB) cols.push({ h:'CPA(원)', v:h=>(h.conv>0)?Math.round(h.cost*10000/h.conv):'' });
      else {
        cols.push({ h:'매출(원)', v:h=>Math.round((h.revenue||0)*10000) });
        cols.push({ h:'ROAS(%)', v:h=>(h.cost>0)?+((h.revenue/h.cost*100).toFixed(0)):'' });
      }
      cols.push({ h:'전환율(%)', v:h=>+(((h.clicks>0)?(h.conv/h.clicks*100):0).toFixed(2)) });
      cols.push({ h:'평균노출순위', v:h=>(h.avgRank===null||h.avgRank===undefined)?'':+Number(h.avgRank).toFixed(1) });
      return { rows: rs, cols,
        meta:[['기간', periodLabel||''],['건수', rs.length + '개 시간대']],
        title: data.name + ' — 시간대별 성과', sheet:'시간대', filename: data.name + '_시간대' };
    });
    document.querySelectorAll('.hour-heat-metric-btn').forEach(btn=>{
      btn.onclick = ()=>{ hourHeatmapMetric[key] = btn.dataset.metric; renderHourlyPage(data); };
    });
    document.querySelectorAll('.ai-summary-btn').forEach(btn=>{
      btn.onclick = ()=> generateAISummary(data, key, periodLabel);
    });
    const adgroupHourSelectEl = document.getElementById('adgroupHourSelect');
    if(adgroupHourSelectEl){
      adgroupHourSelectEl.onchange = (e)=>{
        const idx = e.target.value.indexOf('::');
        hourAdgroupSelectState[key] = { campaign: e.target.value.slice(0,idx), adgroup: e.target.value.slice(idx+2) };
        renderHourlyPage(data);
      };
    }
    document.querySelectorAll('.adgroup-hour-metric').forEach(cb=>{
      cb.onchange = ()=>{
        const set = new Set([...document.querySelectorAll('.adgroup-hour-metric:checked')].map(c=>c.value));
        hourAdgroupMetricState[key] = set;
        buildChartAdgroupHour();
      };
    });
    let adgroupHourChart = null;
    function buildChartAdgroupHour(){
      const adgroupHourEl = document.getElementById('chartAdgroupHour');
      if(!adgroupHourEl || !adgroupHourlyEnriched) return;
      // 위쪽 "시간대별 성과" 차트의 HOUR_METRICS와 같은 지표 정의를 광고그룹 단위 데이터(adgroupHourlyEnriched)에 맞춰 재사용.
      const agChartRows = realHours(adgroupHourlyEnriched); // 그래프는 0~23시만
      const AG_HOUR_METRICS = {
        imp:   { label:'노출수', data:agChartRows.map(h=>h.impressions), color:'#6e6bff', axis:'count', type:'bar' },
        click: { label:'클릭수', data:agChartRows.map(h=>h.clicks), color:'#3fd4c4', axis:'count', type:'bar' },
        ctr:   { label:'클릭률(%)', data:agChartRows.map(h=>Number(h.ctr.toFixed(2))), color:data.color, axis:'pct', type:'line' },
        cvr:   { label:'전환율(%)', data:agChartRows.map(h=>Number(h.cvr.toFixed(2))), color:'#ff5d7a', axis:'pct', type:'line' },
        conv:  { label:'전환수', data:agChartRows.map(h=>h.conv), color:'#ffb84d', axis:'count', type:'bar' },
        cost:  { label:'비용(만원)', data:agChartRows.map(h=>Number(h.cost.toFixed(1))), color:hexToRgba(data.color,0.35), axis:'count', type:'bar' },
        revenue: { label:'매출(만원)', data:agChartRows.map(h=>Number(h.revenue.toFixed(1))), color:'#4dd0ff', axis:'count', type:'bar' },
        roas:  { label:'ROAS(%)', data:agChartRows.map(h=>Number(h.roas.toFixed(1))), color:'#ff9d4d', axis:'pct', type:'line' },
        cpa:   { label:'CPA(원)', data:agChartRows.map(h=>h.cpa||0), color:'#ff9d4d', axis:'pct', type:'line' },
      };
      const selected = [...(hourAdgroupMetricState[key] || [])];
      const datasets = selected.map(k=>{
        const m = AG_HOUR_METRICS[k];
        if(!m) return null;
        return { type:m.type, label:m.label, data:m.data, borderColor:m.color, backgroundColor:m.color, tension:.3, pointRadius:2, yAxisID: m.axis==='pct' ? 'y1' : 'y' };
      }).filter(Boolean);
      if(adgroupHourChart) adgroupHourChart.destroy();
      adgroupHourChart = new Chart(adgroupHourEl, {
        data:{
          labels: agChartRows.map(h=>h.hour+'시'),
          datasets
        },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#8d90a8',font:{size:10}}}},
          scales:{ y:{position:'left',grid:{color:'#292a3d'},ticks:{color:'#8d90a8',font:{size:10}}}, y1:{position:'right',grid:{display:false},ticks:{color:'#8d90a8',font:{size:10}}}, x:{grid:{display:false},ticks:{color:'#8d90a8',font:{size:9},maxTicksLimit:24}} } }
      });
    }
    buildChartAdgroupHour();
  }
  renderFilterPanel(key, data, campaignList, allTypes, renderHourlyPage);
}


/* ---------- 광고계정 / 삭제된 캠페인 표시 (index.html과 동일 규칙) ---------- */
function accountOfCampaign(name){
  const m = String(name||'').match(/^(\d{6,})\s*·\s*/);
  return m ? m[1] : null;
}
function accountListOf(campaignList){
  const set = new Set();
  campaignList.forEach(c=>{ const a = accountOfCampaign(c.campaign); if(a) set.add(a); });
  return [...set].sort();
}
/* 네이버 마스터 보고서에는 현재 존재하는 캠페인만 내려오는데 과거 성과 데이터에는 삭제된
   캠페인 기록이 남아 있어, 이름을 못 찾고 원본 ID가 그대로 노출됨. 표시만 알아보기 쉽게 바꾼다. */
function isDeletedCampaignName(name){
  return /(^|·\s*)cmp-[a-z0-9]+-\d+-\d+\s*$/i.test(String(name||'').trim());
}
function displayCampaignName(name){
  const s = String(name||'').trim();
  if(!isDeletedCampaignName(s)) return s;
  const m = s.match(/^(\d+)\s*·/);
  const idPart = s.replace(/^\d+\s*·\s*/,'');
  return `${m?m[1]+' · ':''}삭제된 캠페인 (…${idPart.slice(-6)})`;
}
/* 네이버는 시간을 특정할 수 없는 행에 hour='99'를 넣어 보냄.
   00~23이 아닌 값을 그냥 버리면 그 비용이 표에서 사라져 다른 페이지와 합계가 안 맞는다.
   (SN라이프 실측: 30건 약 2.5만원) — 24번째 칸 '시간 미상'으로 모아 합계를 보존한다. */
function isRealHour(h){ return /^([01]?\d|2[0-3])$/.test(String(h).trim()); }
function hourIndexOf(h){ return isRealHour(h) ? parseInt(h,10) : 24; }
function renderFilterPanel(key, data, campaignList, allTypes, renderFn){
  renderFn = renderFn || renderCard;
  const fstate = filterState[key];
  const mount = document.getElementById('mainLayout');
  let panel = document.getElementById('filterPanel');
  if(!panel){
    panel = document.createElement('div');
    panel.className = 'filter-panel';
    panel.id = 'filterPanel';
    mount.children[1].replaceWith(panel);
  }
  const accountList = accountListOf(campaignList);
  panel.innerHTML = `
    <div class="filter-head">필터</div>
    ${accountList.length > 1 ? `
    <div class="filter-group">
      <div class="filter-group-title">광고계정</div>
      ${accountList.map(a=>{
        const camps = campaignList.filter(c=>accountOfCampaign(c.campaign)===a);
        const anyOn = camps.some(c=>fstate.campaigns.has(c.campaign));
        const label = (data.accountLabels && data.accountLabels[a]) ? `${a} · ${data.accountLabels[a]}` : a;
        return `<label class="filter-item"><input type="checkbox" data-kind="account" value="${a}" ${anyOn?'checked':''}> ${label} <span style="color:var(--muted);font-size:12px;">(${camps.length})</span></label>`;
      }).join('')}
    </div>` : ''}
    <div class="filter-group">
      <div class="filter-group-title">캠페인 유형</div>
      ${allTypes.map(t=>{
        // 체크 표시는 '그 유형의 캠페인이 실제로 하나라도 켜져 있는가'로 판단한다.
        const typeCamps = campaignList.filter(c=>String(c.type)===String(t));
        const anyOn = typeCamps.some(c=>fstate.campaigns.has(c.campaign));
        return `<label class="filter-item"><input type="checkbox" data-kind="type" value="${t}" ${anyOn?'checked':''}> ${campaignTypeLabel(t)} <span style="color:var(--muted);font-size:12px;">(${typeCamps.length})</span></label>`;
      }).join('')}
    </div>
    <div class="filter-group campaigns">
      <div class="filter-group-title">캠페인명</div>
      <div class="filter-campaign-list">
      ${campaignList.map(c=>`
        <label class="filter-item"><input type="checkbox" data-kind="campaign" value="${c.campaign}" ${fstate.campaigns.has(c.campaign)?'checked':''}> ${displayCampaignName(c.campaign)}</label>
      `).join('')}
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-ghost" id="filterSelectAllBtn" style="flex:1;">전체 선택</button>
      <button class="btn btn-ghost" id="filterDeselectAllBtn" style="flex:1;">전체 해제</button>
    </div>
  `;
  panel.querySelectorAll('input[data-kind="type"]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) fstate.types.add(cb.value); else fstate.types.delete(cb.value);
      // 유형 체크에 맞춰 해당 유형의 캠페인들도 함께 토글
      campaignList.filter(c=>String(c.type)===String(cb.value)).forEach(c=>{
        if(cb.checked) fstate.campaigns.add(c.campaign); else fstate.campaigns.delete(c.campaign);
      });
      renderFn(data);
    };
  });
  panel.querySelectorAll('input[data-kind="account"]').forEach(cb=>{
    cb.onchange = ()=>{
      campaignList.filter(c=>accountOfCampaign(c.campaign)===cb.value).forEach(c=>{
        if(cb.checked) fstate.campaigns.add(c.campaign); else fstate.campaigns.delete(c.campaign);
      });
      allTypes.forEach(t=>{
        const campsOfType = campaignList.filter(c=>String(c.type)===String(t)).map(c=>c.campaign);
        if(campsOfType.some(c=>fstate.campaigns.has(c))) fstate.types.add(t); else fstate.types.delete(t);
      });
      renderFn(data);
    };
  });
  panel.querySelectorAll('input[data-kind="campaign"]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) fstate.campaigns.add(cb.value); else fstate.campaigns.delete(cb.value);
      // 캠페인명 체크에 맞춰 유형 체크박스 표시도 동기화 (그 유형의 캠페인이 하나라도 선택돼 있으면 유형도 선택된 것으로 표시)
      allTypes.forEach(t=>{
        const campsOfType = campaignList.filter(c=>String(c.type)===String(t)).map(c=>c.campaign);
        const anySelected = campsOfType.some(c=>fstate.campaigns.has(c));
        if(anySelected) fstate.types.add(t); else fstate.types.delete(t);
      });
      renderFn(data);
    };
  });
  document.getElementById('filterSelectAllBtn').onclick = ()=>{
    fstate.types = new Set(allTypes);
    fstate.campaigns = new Set(campaignList.map(c=>c.campaign));
    renderFn(data);
  };
  document.getElementById('filterDeselectAllBtn').onclick = ()=>{
    fstate.types = new Set();
    fstate.campaigns = new Set();
    renderFn(data);
  };
}

/* 필터 접기 버튼 — 어느 페이지에서든 화면 오른쪽 가장자리에 붙는다. */
(function(){
  function initPanelToggle(){
    if(document.getElementById('panelToggleBtn')) return;
    if(!document.querySelector('.main-layout')) return;
    var KEY='kmPanelOff';
    var btn=document.createElement('button');
    btn.id='panelToggleBtn'; btn.type='button';
    function paint(){
      var off=document.body.classList.contains('panel-off');
      btn.textContent = off ? '필터 펴기 ‹' : '필터 접기 ›';
      btn.title = off ? '오른쪽 필터를 다시 표시' : '오른쪽 필터를 숨기고 넓게 보기';
    }
    try{ if(localStorage.getItem(KEY)==='1') document.body.classList.add('panel-off'); }catch(e){}
    btn.onclick=function(){
      document.body.classList.toggle('panel-off');
      try{ localStorage.setItem(KEY, document.body.classList.contains('panel-off')?'1':'0'); }catch(e){}
      paint();
      window.dispatchEvent(new Event('resize')); // 차트가 새 폭에 맞게 다시 그려지도록
    };
    paint();
    document.body.appendChild(btn);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', initPanelToggle);
  else initPanelToggle();
  setTimeout(initPanelToggle, 1500);
})();
