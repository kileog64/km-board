<script>
/* ── 업체 색(accent)이 업체마다 달라서 글씨 대비가 들쭉날쭉해지는 걸 막는 보정기 ──
   --accent        : 업체 색 그대로 (선·아이콘·그래프용)
   --accent-text   : 어두운 배경 위에서 읽히도록 밝기를 올린 글씨용 색
   --accent-solid  : 흰 글씨를 얹어도 읽히도록 밝기를 낮춘 채움 배경용 색
   두 값 모두 대비 4.5:1을 넘을 때까지 자동으로 조정한다. */
function applyAccentColor(hex){
  const root = document.documentElement.style;
  root.setProperty('--accent', hex);
  const H = String(hex||'').trim().replace('#','');
  if(H.length !== 6){ return; }
  const toRgb = h => [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));
  const toHex = a => '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  const lum = ([r,g,b]) => { const f=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)};
    return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b); };
  const ratio = (a,b)=>{ const l1=lum(a),l2=lum(b),hi=Math.max(l1,l2),lo=Math.min(l1,l2); return (hi+0.05)/(lo+0.05); };
  const base = toRgb(H);
  const PANEL=[23,26,39], WHITE=[255,255,255];
  let text = base.slice();
  for(let i=0;i<24 && ratio(text,PANEL)<4.5;i++) text = text.map(v=>v+(255-v)*0.10);
  let solid = base.slice();
  for(let i=0;i<24 && ratio(solid,WHITE)<4.5;i++) solid = solid.map(v=>v*0.92);
  root.setProperty('--accent-text', toHex(text));
  root.setProperty('--accent-solid', toHex(solid));
}

<style>

    .ai-chat-panel{right:10px;left:10px;width:auto;bottom:84px;}
    .ai-chat-toggle{right:16px;bottom:16px;}
  }

  .main-layout{display:grid;grid-template-columns:1fr 250px;gap:20px;align-items:start;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px 28px;min-height:400px;}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:360px;color:var(--muted);font-size:14px;text-align:center;gap:10px;line-height:1.6;}
  header.rep{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:14px;}

  font-weight:400 !important; font-size:12px !important;
  color:var(--muted) !important; margin-bottom:6px !important;
}
.kpi-value{
  font-size:25px !important; font-weight:600 !important;
  letter-spacing:-.022em !important; font-variant-numeric:tabular-nums;
}
.kpi-note{
  font-size:12.5px !important; font-weight:600 !important;
  padding:4px 9px !important; border-radius:6px !important;
}

/* 배지 · 버튼 · 탭 */
.badge{ border-radius:5px !important; font-size:11.5px !important; font-weight:600 !important; padding:2.5px 8px !important; }
.btn{ border-radius:8px !important; font-weight:600 !important; font-size:13px !important; padding:11px !important; }
.tabs{ gap:6px !important; }
.tab{ border-radius:7px !important; padding:7px 12px !important; font-size:13px !important; }
.export-btn{ border-radius:8px !important; font-size:12.5px !important; }

/* 표 — 줄 간격 넓히고 숫자 자릿수 맞춤 */
table{ font-variant-numeric:tabular-nums; }
table th{ font-size:12px !important; font-weight:500 !important; color:var(--muted) !important; letter-spacing:0 !important; text-transform:none !important; }
table td{ font-size:13.5px !important; }
table td, table th{ padding-top:10px !important; padding-bottom:10px !important; }

/* 왼쪽 필터 */
.filter-panel{ border-radius:11px !important; }
.filter-group-title{ font-size:11.5px !important; letter-spacing:.05em !important; }
.filter-item{ font-size:13px !important; }
.section-title{ font-size:11.5px !important; letter-spacing:.05em !important; }

/* 업체 선택 */
.client-switcher-btn{ border-radius:8px !important; font-size:13.5px !important; }
.client-switcher-dropdown{ border-radius:11px !important; }
.client-switcher-item{ font-size:13.5px !important; }

/* 작은 글씨들 살짝 키움 */
.lbl, .sub, .kpi-note, .chg{ font-size:12.5px !important; }

/* 목표 대비 KPI — 4칸 + 진행 막대 */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:10px}
.kpi-cell{background:var(--panel-2);padding:15px 17px}
.kpi-cell .k-lab{font-size:12px;color:var(--muted)}
.kpi-cell .k-lab i{font-style:normal;color:#6d7288}
.kpi-cell .k-val{font-size:25px;font-weight:600;letter-spacing:-.022em;margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi-cell .k-bar{height:5px;border-radius:3px;background:var(--bg);overflow:hidden;margin-top:9px;display:flex}
.kpi-cell .k-bar b{display:block;height:100%;border-radius:3px}
.kpi-cell .k-foot{font-size:12px;color:var(--muted);margin-top:7px;min-height:17px}
.kpi-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:22px}
.kpi-mini > div{background:var(--panel-2);padding:11px 15px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.kpi-mini .m-lab{font-size:12px;color:var(--muted)}
.kpi-mini .m-val{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi-mini .kpi-note{font-size:11.5px!important;padding:2px 7px!important}
@media(max-width:1100px){.kpi-strip{grid-template-columns:repeat(2,1fr)}}

/* ---- 상단 필터 바 ---- */
.filterbar{display:flex;align-items:center;gap:0;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:4px 6px;margin:0 0 14px}
.filterbar .fb-g{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 12px;border-right:1px solid var(--border)}
.filterbar .fb-g:last-child{border-right:0}
.filterbar .fb-lab{font-size:11px;color:var(--muted);letter-spacing:.04em;font-weight:600}
.filterbar select{background:transparent!important;border:1px solid var(--border)!important;border-radius:7px!important;padding:4px 8px!important;font-size:12.5px!important}
.filterbar button{border-radius:7px!important}
.filterbar .day-preset-pill-idx{border-radius:7px!important;padding:5px 11px!important;font-size:12.5px!important}
.filterbar #dayRangeCustomToggle{border-radius:7px!important;padding:5px 11px!important;font-size:12.5px!important}
header.rep{align-items:center!important;padding-bottom:14px!important;margin-bottom:14px!important}
header.rep .totals{display:none}
.idn-name{font-size:20px!important;font-weight:600!important;letter-spacing:-.02em!important}
.period{font-size:12.5px!important;color:var(--muted)!important;margin-top:3px!important}
@media(max-width:900px){.filterbar .fb-g{border-right:0}}

/* ---- 성과 인사이트 2단 ---- */
.ins-top{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text);margin-bottom:12px}
.ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ins-col{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:13px 15px 14px}
.ins-col-good{border-left:3px solid var(--up)}
.ins-col-warn{border-left:3px solid var(--down)}
.ins-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:9px}
.ins-h b{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:1px 8px}
.ins-ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ins-li{position:relative;padding-left:13px;font-size:12.5px;line-height:1.65;color:var(--text)}
.ins-li::before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%}
.ins-good::before{background:var(--up)} .ins-warn::before{background:var(--down)} .ins-info::before{background:var(--muted)}
.ins-neutral{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.ins-neutral .ins-li{color:var(--muted)}
#insightsPanel{border-left:0!important}
@media(max-width:900px){.ins-grid{grid-template-columns:1fr}}

.dc-two{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
@media(max-width:1000px){.dc-two{grid-template-columns:1fr}}

/* ---- 큰 숫자 줄 ----
   칸 수가 6개(DB)/7개(B2C)로 달라지고 화면 폭에 따라 줄바꿈되는데, grid로 하면 마지막 줄에 빈칸이 남는다.
   flex + flex-grow 로 두면 남은 칸들이 늘어나 폭을 꽉 채운다. */
.dc-kpi{display:flex;flex-wrap:wrap;gap:1px;background:#262a3b;border:1px solid #262a3b;border-radius:9px;overflow:hidden}
.dc-kpi > div{flex:1 1 142px;min-width:0}

.dc-kpi2{display:flex;flex-direction:column;gap:1px;background:#262a3b;border:1px solid #262a3b;border-radius:9px;overflow:hidden}
.dc-k-top,.dc-k-bot{display:flex;flex-wrap:wrap;gap:1px;background:#262a3b}
.dc-k-top > div,.dc-k-bot > div{flex:1 1 160px;min-width:0}

/* ---- 표: 목업과 같은 모양으로 통일 ---- */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table thead tr{background:#1d2030}
table th{font-size:12px!important;font-weight:500!important;letter-spacing:.04em!important;
  color:#8f94ab!important;padding:9px 14px!important;border-bottom:1px solid #262a3b!important;
  text-transform:none!important;white-space:nowrap}
table td{font-size:13.5px!important;padding:9px 14px!important;border-bottom:1px solid #262a3b!important}
table tbody tr:hover td{background:#1b1e2c}
.panel table,.card table{border-radius:0}

/* 시간대 표: 24줄이라 그냥 두면 화면이 너무 길어짐 — 영역을 잘라 안에서만 스크롤되게 하고 줄 간격도 좁힘 */
.hr-scroll{max-height:430px;overflow-y:auto;border:1px solid #262a3b;border-radius:9px}
.hr-scroll table{margin:0}
.hr-scroll thead th{position:sticky;top:0;z-index:1;background:#1d2030}
.hr-scroll td{padding-top:5px!important;padding-bottom:5px!important;font-size:12.5px!important}
.hr-scroll th{padding-top:8px!important;padding-bottom:8px!important}
.hr-scroll tbody tr:last-child td{border-bottom:0!important}
.hr-scroll::-webkit-scrollbar{width:9px}
.hr-scroll::-webkit-scrollbar-thumb{background:#3f4468;border-radius:5px}
.hr-scroll::-webkit-scrollbar-track{background:transparent}

/* 줄 많은 표 — 높이를 잘라 안쪽 스크롤, 머리글 고정 */
.dc-scroll{max-height:440px;overflow-y:auto;overflow-x:auto;border:1px solid #262a3b;border-radius:9px}
.dc-scroll table{margin:0}
.dc-scroll thead th{position:sticky;top:0;z-index:1;background:#1d2030}
.dc-scroll td{padding-top:5px!important;padding-bottom:5px!important;font-size:12.5px!important}
.dc-scroll th{padding-top:8px!important;padding-bottom:8px!important}
.dc-scroll tbody tr:last-child td{border-bottom:0!important}
.dc-scroll::-webkit-scrollbar{width:9px;height:9px}
.dc-scroll::-webkit-scrollbar-thumb{background:#3f4468;border-radius:5px}
.dc-scroll::-webkit-scrollbar-track{background:transparent}

/* 카드·패널이 안쪽 표 때문에 늘어나지 않게 (안 그러면 화면 오른쪽이 잘림) */
.wrap,.main-layout,.card,.panel,.chart-box{min-width:0}
.card,.panel{overflow-x:hidden}
.dc-scroll{overflow-x:auto}
.dc-scroll-x{max-height:none;overflow-y:visible}
.hr-scroll{overflow-x:auto}

.hr-unknown td{background:#191b28!important;color:#a9adc2!important}
.hr-unknown td:first-child{color:#e8e9f2!important}
.hr-unknown td{border-top:1px solid #3a3350!important}

/* 세 덩어리 중 비는 게 있으면 남은 것들이 폭을 채우도록 flex 사용 */
.hr-reco{display:flex;flex-wrap:wrap;gap:1px;background:#262a3b;border:1px solid #262a3b;border-radius:9px;overflow:hidden}
.hr-reco > div{flex:1 1 220px;min-width:0}
/* 숫자 칸이 두 줄로 접히면 표가 쓸데없이 길어짐 */
.hr-scroll td,.dc-scroll td{white-space:nowrap}

/* ---- 상단 메뉴바 ---- */
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:3px;flex-wrap:wrap;row-gap:6px;
  margin:0 0 14px;padding:7px 12px;background:#12131c;border:1px solid #262a3b;border-radius:11px}
.nv-logo{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;
  letter-spacing:-.01em;color:#e8e9f2;margin-right:14px;white-space:nowrap}
.nv-mark{width:20px;height:20px;border-radius:6px;background:#8b7cff;display:inline-block;flex-shrink:0}
.nv{padding:5px 11px;border-radius:7px;font-size:12.5px;color:#a9adc2;text-decoration:none;white-space:nowrap;transition:background .12s,color .12s}
.nv:hover{background:#1b1e2c;color:#e8e9f2}
.nv-on{background:#232640;color:#e8e9f2;font-weight:500}
.nv-b{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 5px;
  margin-left:5px;border-radius:8px;background:#f5a524;color:#12131c;font-size:10px;font-weight:700;vertical-align:1px}
.topbar .client-switcher{margin-left:auto}

/* ===== 표 가독성 공통(_kmread.css) — 시작 ===== */
/* ══════════════════════════════════════════════════════════════════════
   표 가독성 공통 규칙
   숫자가 왼쪽으로 붙어 있고 모든 값이 같은 무게라, 뭐가 중요한지 알려면
   표를 다 읽어야 했다. 아래 규칙으로 훑기만 해도 눈에 걸리게 만든다.
   ※ 숫자 자체는 손대지 않는다(네이버와 같아야 하므로). 보이는 방식만 바꾼다.
   ══════════════════════════════════════════════════════════════════════ */

/* ① 숫자는 오른쪽 정렬 + 자릿수 고정폭.
   이게 없으면 1,531,644 와 987,000 의 자릿수가 안 맞아 크기 비교가 눈으로 안 된다.
   첫 칸(이름)과 kw-name/camp-name 은 글자라 왼쪽 그대로 둔다. */
table th, table td { text-align: right; font-variant-numeric: tabular-nums; }
table th:first-child, table td:first-child,
table td.kw-name, table th.camp-name-cell, table td.camp-name-cell { text-align: left; }
/* 캠페인·구분처럼 글자가 들어가는 칸은 개별적으로 왼쪽 정렬 */
table td.km-text, table th.km-text { text-align: left; }

/* ② 한 줄 걸러 옅은 배경 — 가로로 눈이 미끄러지지 않게 */
table tbody tr:nth-child(even) td { background: rgba(255,255,255,.022); }
table tbody tr:hover td { background: #1b1e2c; }

/* ③ 보조 지표(노출·클릭)는 뒤로 물린다.
   판단에 바로 쓰는 값은 비용·전환·CPA·ROAS 인데, 노출·클릭이 같은 무게로 끼어들면
   시선이 분산된다. 값은 그대로 두고 색만 옅게. */
table td.km-sub { color: var(--muted); }

/* ④ 핵심 값은 굵게 — 비용은 규모, 전환은 성과 */
table td.km-key { font-weight: 700; }

/* ⑤ 나쁜 값만 빨강 — 전환 0, 비정상적으로 높은 CPA 등 */
table td.km-bad { color: var(--down); font-weight: 700; }

/* ⑥ 가로 스크롤 시 이름 칸이 따라다니게 — 오른쪽 열을 볼 때
   "이게 무슨 키워드였지" 하고 되돌아가지 않아도 된다. */
.km-stick table td:first-child,
.km-stick table th:first-child {
  position: sticky; left: 0; z-index: 2;
  background: var(--panel);
  box-shadow: 1px 0 0 var(--border);
}
.km-stick table tbody tr:nth-child(even) td:first-child { background: var(--panel); }
.km-stick table tbody tr:hover td:first-child { background: #1b1e2c; }

/* ⑦ 표 위 요약 줄 — 지금 조건에서 얼마를 쓰고 얼마를 벌었는지 한 줄로 */
.km-summary { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.km-summary > div {
  flex:1; min-width:112px; background:var(--panel-2);
  border:1px solid var(--border); border-radius:9px; padding:9px 12px;
}
.km-summary .lb { font-size:11px; color:var(--muted); display:block; }
.km-summary .vl { font-size:16px; font-weight:700; display:block; margin-top:2px;
  font-variant-numeric:tabular-nums; }
.km-summary .vl.warn { color: var(--down); }
.km-summary .vl.good { color: var(--up); }

/* ===== 표 가독성 공통 — 끝 ===== */
</style>
</head>

function presetDayRange(presetKey, boundsMin, boundsMax){
  if(!boundsMin || !boundsMax) return null;
  const toStr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const addDays = (d,n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
  const today = new Date(); today.setHours(0,0,0,0);
  let start, end;
  if(presetKey==='today'){ start = end = toStr(today); }
  else if(presetKey==='yesterday'){ const y = addDays(today,-1); start = end = toStr(y); }
  else if(presetKey==='last7'){ start = toStr(addDays(today,-6)); end = toStr(today); }
  else if(presetKey==='thisMonth'){ start = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-01`; end = toStr(today); }
  else if(presetKey==='lastMonth'){
    const firstOfThis = new Date(today.getFullYear(), today.getMonth(), 1);
    const lastOfPrev = addDays(firstOfThis, -1);
    start = `${lastOfPrev.getFullYear()}-${String(lastOfPrev.getMonth()+1).padStart(2,'0')}-01`;
    end = toStr(lastOfPrev);
  }
  else if(presetKey==='all'){ return { start:null, end:null }; }
  else return null;
  if(start < boundsMin) start = boundsMin;
  if(end > boundsMax) end = boundsMax;
  if(start > boundsMax || end < boundsMin) return null;
  return { start, end };
}
/* 프리셋 버튼 활성화 판정.

   서로 다른 프리셋이 같은 범위로 수렴함. 예를 들어 오늘이 9/1이고 데이터도 9/1까지면
   '어제'(8/31~8/31)와 '이번달'(9/1~9/1)이 각각 잘려서 둘 다 파랗게 켜졌음.
   그래서 PRESET_ORDER 순으로 "가장 먼저 일치하는 하나"만 활성으로 봄. */
const PRESET_ORDER = ['all','yesterday','last7','thisMonth','lastMonth','today'];
function activePresetKey(range, boundsMin, boundsMax){
  for(const pk of PRESET_ORDER){
    if(pk==='all'){ if(!range.start && !range.end) return 'all'; continue; }

    if(p && range.start===p.start && range.end===p.end) return pk;
  }
  return null;
}
function isPresetActive(presetKey, range, boundsMin, boundsMax){

function hexToRgba(hex, alpha){

function hslToHex(h,s,l){

  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');

function sparkPath(vals, w, h){
  if(!vals.length) return '';
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = (max - min) || 1;
  const step = w / (Math.max(vals.length-1,1));

    return `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`;

/* 플레이스(네이버 캠페인유형 코드 6)는 지도 노출 기반이라 검색광고 지표와 성격이 달라 대시보드에서 제외한다.
   여기 한 곳에서 걸러내면 필터·표·합계·인사이트·AI까지 전부 자동으로 빠진다.
   월 합계(cost/revenue/conv/impressions/clicks)에서도 플레이스 몫을 빼서 숫자가 어긋나지 않게 한다. */
const IS_PLACE_TYPE = (t) => { const v = String(t==null?'':t).trim();
  return v === '6' || v.indexOf('플레이스') >= 0; };
/* ── 브랜드검색 정액제 비용 얹기 ────────────────────────────────────────────
   브랜드검색광고는 정액제라 네이버 일별 리포트의 비용이 0원으로 온다. input.html에서
   등록한 계약(brandContracts: 캠페인·시작월·종료월·계약금액)을 읽어, 계약 금액을 계약
   기간의 각 달에 일수 비율로 나눠 그 달 그 캠페인의 비용으로 채운다. 월 합계(cost)에도
   같은 금액을 더해서 대시보드 어디서 보든 숫자가 어긋나지 않게 한다.
   금액 단위: 저장은 '원', 월/캠페인 데이터는 '만원' 단위라 10000으로 나눠서 넣는다.
   이미 비용이 잡혀 있으면(정액제가 아닌 경우) 건드리지 않는다. */
function __bcMonthDays(y,m){ return new Date(y,m,0).getDate(); }
function __bcParseYM(v){ const mm=String(v||'').match(/^(\d{4})-(\d{2})$/); return mm?{y:+mm[1],m:+mm[2]}:null; }
function __bcSplit(start,end,amount){
  const s=__bcParseYM(start), e=__bcParseYM(end);
  if(!s||!e||!(amount>0)) return {};
  if(e.y*12+e.m < s.y*12+s.m) return {};
  const spans=[]; let y=s.y,m=s.m,total=0;
  while(y*12+m <= e.y*12+e.m){
    const d=__bcMonthDays(y,m);
    spans.push({label:y+'.'+String(m).padStart(2,'0'), days:d}); total+=d;
    m++; if(m>12){ m=1; y++; }
  }
  if(!total) return {};
  const out={}; let acc=0;
  spans.forEach((sp,i)=>{
    const c = (i===spans.length-1) ? (amount-acc) : Math.round(amount*sp.days/total);
    if(i<spans.length-1) acc+=c;
    out[sp.label]=(out[sp.label]||0)+c;
  });
  return out;
}
function applyBrandContracts(data){
  if(!data || !Array.isArray(data.months)) return data;
  const contracts = data.brandContracts;
  if(!Array.isArray(contracts) || !contracts.length) return data;
  // 캠페인 → { 'YYYY.MM': 원 } 로 펼쳐둔다(계약이 여러 건이면 같은 달끼리 합산).
  const byCamp = {};
  contracts.forEach(ct=>{
    if(!ct || !ct.campaign) return;
    const split = __bcSplit(ct.start, ct.end, Number(ct.amount)||0);
    const bucket = byCamp[ct.campaign] || (byCamp[ct.campaign]={});
    Object.keys(split).forEach(lab=>{ bucket[lab]=(bucket[lab]||0)+split[lab]; });
  });
  data.months.forEach(m=>{
    const lab = String(m.label||'');
    let added = 0;
    (m.campaigns||[]).forEach(c=>{
      const won = byCamp[c.campaign] && byCamp[c.campaign][lab];
      if(!won) return;
      if(Number(c.cost)>0) return;   // 이미 실비용이 있으면 덮어쓰지 않는다
      const man = won/10000;
      c.cost = man;
      c.__brandContractCost = true;  // 화면에서 '계약금액 기준'임을 표시할 때 쓴다
      added += man;
    });
    if(added>0 && typeof m.cost==='number') m.cost = m.cost + added;
  });
  return data;
}
/* ── 광고비 기준 통일(부가세 제외) ──────────────────────────────────────────
   네이버가 시기에 따라 부가세를 포함한 금액을 주기도 하고 뺀 금액을 주기도 해서,
   2025.10~2026.03 구간은 캠페인·월 합계가 부가세 포함으로 저장돼 있다.
   반면 하루치(daily)는 전 기간 부가세 제외로 통일돼 있다.
   그래서 하루치를 기준으로 삼아 캠페인·월 합계를 같은 기준으로 낮춘다.
   (원본은 그대로 두고 화면에 그릴 때만 맞춘다 — 플레이스 제외·브랜드검색 계약과 같은 방식)
   · 2025.10~2026.02: 모든 캠페인이 정확히 1.1배라 환산이 정확함
   · 2026.03: 달 중간에 기준이 바뀌어 캠페인마다 1.06~1.10로 제각각 — 월 합계는 정확히 맞고
     캠페인 개별값은 최대 2% 안쪽 오차가 남음
   · 2026.04 이후: 이미 같은 기준이라 건드리지 않음 */
function normalizeCostBasis(data){
  if(!data || !Array.isArray(data.months)) return data;
  data.months.forEach(m=>{
    const dailySum = (m.daily||[]).reduce((a,x)=>a+(x.cost||0),0);
    const campSum  = (m.campaigns||[]).reduce((a,c)=>a+(c.cost||0),0);
    if(!(dailySum>0) || !(campSum>0)) return;
    const k = dailySum / campSum;
    if(k > 0.999) return;   // 이미 같은 기준이면 그대로
    if(k < 0.85)  return;   // 부가세 차이로 보기엔 너무 큰 격차 — 다른 원인이므로 손대지 않음
    (m.campaigns||[]).forEach(c=>{ if(typeof c.cost === 'number') c.cost = c.cost * k; });
    if(typeof m.cost === 'number') m.cost = dailySum;
    m.__costRebased = true;   // 화면에서 "기준 맞춤" 표시가 필요할 때 쓴다
  });
  return data;
}
function stripPlaceCampaigns(data){
  if(!data || !Array.isArray(data.months)) return data;
  data.months.forEach(m=>{
    const camps = m.campaigns || [];
    const place = camps.filter(c=>IS_PLACE_TYPE(c.type));
    if(!place.length) return;
    const names = new Set(place.map(c=>c.campaign));
    m.campaigns = camps.filter(c=>!IS_PLACE_TYPE(c.type));
    // 월 합계에서 플레이스 몫 차감
    ['cost','revenue','conv','impressions','clicks'].forEach(k=>{
      if(typeof m[k] === 'number'){
        const sub = place.reduce((a,c)=>a+(Number(c[k])||0),0);
        m[k] = Math.max(0, m[k] - sub);
      }
    });
    // 캠페인 이름이 붙은 상세 배열에서도 제거
    ['dailyByCampaign','dailyByKeyword','hourlyByCampaign','hourlyByDowByCampaign','hourlyByAdgroup','hourlyByCampaignDate']
      .forEach(f=>{ if(Array.isArray(m[f])) m[f] = m[f].filter(r=>!r || !names.has(r.campaign)); });
    // 캠페인별 지도형 데이터에서도 제거
    ['keywordsByCampaign','wasteKeywordsByCampaign','expandKeywordsByCampaign','brandKeywordsByCampaign',
     'wasteBrandKeywordsByCampaign','expandBrandKeywordsByCampaign','searchTermsByCampaign',
     'wasteSearchTermsByCampaign','expandSearchTermsByCampaign','adgroupsByCampaign']
      .forEach(f=>{ const o=m[f]; if(o && typeof o==='object'){ names.forEach(n=>{ delete o[n]; }); } });
  });
  return data;
}

    const docRef = userClientsRef().doc(id);
    const doc = await docRef.get();
    if(!doc.exists) return null;
    const data = applyBrandContracts(normalizeCostBasis(stripPlaceCampaigns(doc.data())));
    const months = data.months || [];
    // 문서 용량(1MB) 제한 대응: 무거운 필드(상세데이터)는 월별 하위 컬렉션에 따로 저장돼있어서 여기서 합쳐줌.
    // 아직 하위 컬렉션으로 안 옮겨진(예전 형식) 업체는 month 객체에 그대로 남아있는 값을 그대로 씀(하위호환).
    if(months.length){
      // 상세데이터는 예전엔 월 하나당 문서 하나(모든 필드를 합쳐서)로 저장했는데, 광고그룹별 시간대
      // 분석처럼 필드 하나만으로도 캠페인×광고그룹×요일×시간 조합이 많은 계정은 그 합쳐진 문서 하나가
      // Firestore 문서당 1MB 한도를 넘어버리는 경우가 생겨서, 이제 "월라벨__필드명" 단위로 문서를 더
      // 잘게 나눠 저장함 — 필드 하나가 아무리 커져도 같은 달의 다른 필드와 합쳐져서 한도를 넘는 일이 없어짐.
      // 예전 형식(월 하나에 모든 필드가 합쳐진 문서, id가 그냥 월라벨)으로 저장된 달은 그대로 읽어서 하위호환함.
      // 1순위: Storage 파일("clients/{id}/{월라벨}__{필드명}.json"). 없으면 아래 Firestore 경로로 폴백.
      const storageResults = await Promise.all(
        months.flatMap(m => DETAIL_DATA_FIELDS.map(f => ({ label:m.label, field:f })))
          .map(async ({label,field}) => ({ label, field, res: await fetchDetailFile(detailStorageRef(id,label,field)) }))
      );
      const storageMap = {}; // "월라벨__필드명" -> value (Storage에서 정상적으로 찾은 것만)
      const failedSet = new Set(); // "월라벨__필드명" — Storage에 파일이 있을 수도 있는데 네트워크/CORS 등으로 못 가져온 것
      storageResults.forEach(r=>{
        if(r.res && r.res.value!==undefined) storageMap[r.label+'__'+r.field] = r.res.value;
        else if(r.res && r.res.failed) failedSet.add(r.label+'__'+r.field);
      });
      const detailSnap = await docRef.collection('detailData').get().catch(()=>({docs:[]}));
      const fieldDocMap = {}; // "월라벨__필드명" -> {value}
      const legacyDocMap = {}; // "월라벨" -> {필드명: 값, ...}
      detailSnap.docs.forEach(d=>{
        const sep = d.id.indexOf('__');
        const fname = sep>0 ? d.id.slice(sep+2) : null;
        if(fname && DETAIL_DATA_FIELDS.includes(fname)) fieldDocMap[d.id] = d.data();
        else legacyDocMap[d.id] = d.data();
      });
      data.months = months.map(m=>{
        const legacy = legacyDocMap[m.label];
        const merged = { ...m };
        const unreliable = [];
        DETAIL_DATA_FIELDS.forEach(f=>{
          const key2 = m.label+'__'+f;
          if(storageMap[key2]!==undefined){ merged[f] = storageMap[key2]; return; }
          const perField = fieldDocMap[key2];
          if(perField){ merged[f] = perField.value!==undefined ? perField.value : fieldEmptyDefault(f); return; }
          if(legacy){ merged[f] = legacy[f]!==undefined ? legacy[f] : fieldEmptyDefault(f); return; }
          if(failedSet.has(key2)){
            // Storage 파일을 못 가져왔을 뿐 실제로는 데이터가 있을 수 있음 — 화면 표시는 일단 빈 값으로 하되,
            // 이 상태로 저장(setClient)하면 진짜 데이터를 빈 값으로 영구히 덮어쓸 위험이 있으니 표시해둠.
            merged[f] = fieldEmptyDefault(f);
            unreliable.push(f);
            return;
          }
          if(m[f]===undefined) merged[f] = fieldEmptyDefault(f);
        });
        if(unreliable.length) merged.__unreliableFields = unreliable;
        return merged;
      });
    }
    return data;
  }catch(e){ console.error(e); return null; }
}
async function setClient(key, data){
  try{
    const id = key.replace(/^client:/,'');
    const docRef = userClientsRef().doc(id);
    const months = data.months || [];
    // 문서 용량(1MB) 제한 대응: 무거운 필드(상세데이터)는 메인 문서에서 빼서 월별 하위 컬렉션 문서로 분리 저장
    const lightMonths = months.map(m=>{
      const light = { ...m };
      DETAIL_DATA_FIELDS.forEach(f=> delete light[f]);
      delete light.__unreliableFields; // getClient가 붙인 임시 내부 마커 — Firestore엔 저장하지 않음
      return light;
    });
    // lastBackup(되돌리기용 백업)에 예전 코드가 실수로 dailyByCampaign(날짜×캠페인 상세)까지 저장해둔
    // 경우가 있어서, 이미 Firestore에 저장돼있던 무거운 백업을 그대로 불러와 다시 저장하면 메인 문서 저장
    // 요청 자체가 커져서 실패할 수 있음 — 어떤 경로로 만들어진 백업이든 저장 시점에 항상 가볍게 정리함
    // (매번 자동으로 정리되므로 한 번만 저장해도 예전에 쌓인 무거운 백업이 자연히 사라짐).
    const lightData = { ...data };
    if(lightData.lastBackup && Array.isArray(lightData.lastBackup.entries)){
      lightData.lastBackup = {
        ...lightData.lastBackup,
        entries: lightData.lastBackup.entries.map(entry=>{
          if(!entry || !entry.month) return entry;
          const { dailyByCampaign, ...restMonth } = entry.month;
          return { ...entry, month: restMonth };
        })
      };
    }
    // 메인(가벼운) 문서를 먼저 저장 — 아래 상세데이터 저장 중 어떤 이유로든 실패하더라도 이름·색상·목표 등
    // 최신 요약 정보는 반영되도록 함.
    await docRef.set({ ...lightData, months: lightMonths });
    // 월별 상세데이터(키워드·시간대·일별 등)는 Firebase Storage에 "clients/{id}/{월라벨}__{필드명}.json"
    // 파일로 하나씩 저장함. Firestore 문서(1MB 한도)와 달리 Storage 파일은 사실상 용량 제한이 없음.
    // __unreliableFields: getClient가 이 필드를 Storage에서 불러오다 실패해서(네트워크/CORS 등) 화면엔
    // 일단 빈 값으로 채워둔 필드 목록 — 실제로는 값이 있을 수 있으므로 여기서 그대로 다시 저장하면
    // 진짜 데이터를 빈 값으로 영구히 덮어쓸 수 있음. 이런 필드는 업로드를 건너뛰고 기존 파일을 그대로 둠.
    const uploadTasks = [];
    for(const m of months){
      if(!m.label) continue;
      const unreliable = new Set(m.__unreliableFields||[]);
      for(const f of DETAIL_DATA_FIELDS){
        if(unreliable.has(f)) continue;
        const value = m[f]!==undefined ? m[f] : fieldEmptyDefault(f);
        uploadTasks.push({ label:m.label, field:f, value });
      }
    }
    const CONCURRENCY = 6;
    for(let i=0; i<uploadTasks.length; i+=CONCURRENCY){
      const slice = uploadTasks.slice(i, i+CONCURRENCY);
      await Promise.all(slice.map(async ({label,field,value})=>{
        const payloadStr = JSON.stringify({ value });
        await detailStorageRef(id, label, field).putString(payloadStr, 'raw', { contentType:'application/json' });
      }));
    }
    // 예전 Firestore 형식(합쳐진 문서, "월라벨__필드명" 단위 문서, 폐기된 필드)이 남아있다면 정리.
    const deleteDocIds = [];
    for(const m of months){
      if(!m.label) continue;
      deleteDocIds.push(m.label);
      DETAIL_DATA_FIELDS.forEach(f=> deleteDocIds.push(m.label+'__'+f));
      RETIRED_DETAIL_FIELDS.forEach(f=> deleteDocIds.push(m.label+'__'+f));
    }
    const CLEANUP_CHUNK = 450;
    for(let i=0; i<deleteDocIds.length; i+=CLEANUP_CHUNK){
      const cleanupBatch = db.batch();
      deleteDocIds.slice(i, i+CLEANUP_CHUNK).forEach(docId=> cleanupBatch.delete(docRef.collection('detailData').doc(docId)));
      await cleanupBatch.commit().catch(e=>console.warn('[setClient] legacy detailData cleanup failed (non-fatal)', e));
    }
    return true;
  }catch(e){ console.error(e); return false; }
}

/* ══════════════════════════════════════════════════════════════════════════
   표 공통 도구 — 조건 좁히기 + 엑셀 내려받기
   키워드 페이지에서 먼저 만든 것을 캠페인·쇼핑검색·시간대에서도 쓰려고 한 곳에 모았다.
   같은 코드를 세 번 복사하면 고칠 때도 세 번 고쳐야 하고, 한 곳만 빠뜨리면 페이지마다
   동작이 달라진다. 그래서 페이지들이 이 파일 하나를 같이 쓴다.

   쓰는 법 (페이지에서):
     const st = kmFilterState(key);                  // 조건 보관함 (없으면 만들어 줌)
     rows = kmApplyFilter(rows, st, {nameKey:'campaign'});   // 조건 적용
     ...HTML...  ${kmFilterBarHTML(st, rows.length, before)} // 조건 줄 그리기
     kmWireFilterBar(root, st, ()=>다시그리기());            // 입력 배선
     kmWireExcel(root, ()=>({rows, cols, meta}));            // 내려받기 배선
   ══════════════════════════════════════════════════════════════════════════ */

const KM_FILTER = {};   // key -> { minCost, minClicks, minConv, q }

function kmFilterState(key){
  if(!(key in KM_FILTER)) KM_FILTER[key] = { minCost:'', minClicks:'', minConv:'', q:'' };
  return KM_FILTER[key];
}
function kmNum(v){
  if(v===null || v===undefined || String(v).trim()==='') return null;
  const n = Number(String(v).replace(/[^0-9.]/g,''));
  return isFinite(n) ? n : null;
}
function kmFilterOn(st){
  return kmNum(st.minCost)!==null || kmNum(st.minClicks)!==null
      || kmNum(st.minConv)!==null || !!String(st.q||'').trim();
}
/* 조건 적용. cost는 화면 어디서나 '만원 단위'로 들고 다니는데 사람은 '원'으로 입력하므로
   10000을 곱해서 비교한다(이 규칙이 페이지마다 달라지면 같은 조건이 다르게 걸린다). */
function kmApplyFilter(rows, st, opt){
  const nameKey = (opt && opt.nameKey) || 'name';
  const fCost = kmNum(st.minCost), fClk = kmNum(st.minClicks), fCv = kmNum(st.minConv);
  const q = String(st.q||'').trim().toLowerCase();
  let out = rows;
  if(fCost!==null) out = out.filter(r=>(r.cost||0)*10000 >= fCost);
  if(fClk!==null)  out = out.filter(r=>(r.clicks||0) >= fClk);
  if(fCv!==null)   out = out.filter(r=>(r.conv||0) >= fCv);
  if(q)            out = out.filter(r=>String(r[nameKey]||'').toLowerCase().indexOf(q)>=0);
  return out;
}

function kmFilterBarHTML(st, shown, total, label){
  const on = kmFilterOn(st);
  const esc2 = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  const inp = (k,ph,w) => `<input type="${k==='q'?'text':'number'}" min="0" class="km-nf" data-nf="${k}" value="${esc2(st[k])}" placeholder="${ph}" style="width:${w}px;padding:5px 8px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:12px;">`;
  return `<div class="km-filterbar" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:12px 14px;border:1px solid var(--border);border-radius:11px;background:var(--panel-2);">
    <span style="font-size:12px;font-weight:700;color:var(--text);">조건 좁히기</span>
    <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);">비용 ${inp('minCost','예: 100000',112)}원 이상</label>
    <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);">클릭수 ${inp('minClicks','예: 10',78)}건 이상</label>
    <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);">전환수 ${inp('minConv','예: 1',78)}건 이상</label>
    <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);">${label||'이름'} ${inp('q','일부 검색',140)}</label>
    <button type="button" class="km-xlsx" style="margin-left:auto;font-size:12px;font-weight:700;padding:6px 14px;border-radius:8px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#12131c;">⬇️ 엑셀 내려받기 (${(shown||0).toLocaleString('ko-KR')}개)</button>
    ${on?`<button type="button" class="km-nf-reset" style="font-size:12px;font-weight:600;padding:5px 12px;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--muted);">조건 해제</button>
    <span style="font-size:12px;color:var(--accent);font-weight:700;">${(total||0).toLocaleString('ko-KR')}개 중 ${(shown||0).toLocaleString('ko-KR')}개</span>`:''}
  </div>`;
}

/* 입력 배선 — 글자를 칠 때마다 다시 그리면 커서가 튀므로 Enter 또는 포커스가 빠질 때만 적용 */
/* root: 배선할 범위. 한 화면에 표가 둘 이상이면(쇼핑검색의 상품/검색어) 반드시 넘겨야
   서로의 입력이 섞이지 않는다. 안 넘기면 화면 전체가 대상. */
function kmWireFilterBar(st, rerender, root){
  (root||document).querySelectorAll('.km-nf').forEach(inp=>{
    const apply = ()=>{ if(st[inp.dataset.nf] === inp.value) return; st[inp.dataset.nf] = inp.value; rerender(); };
    inp.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); apply(); } };
    inp.onblur = apply;
  });
  (root||document).querySelectorAll('.km-nf-reset').forEach(b=>{
    b.onclick = ()=>{ st.minCost=''; st.minClicks=''; st.minConv=''; st.q=''; rerender(); };
  });
}

async function kmEnsureExcel(){
  if(typeof ExcelJS !== 'undefined') return true;
  return new Promise(res=>{
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    sc.onload=()=>res(true); sc.onerror=()=>res(false);
    document.head.appendChild(sc);
  });
}

/* 엑셀 만들기.
   cols = [{h:'제목', v:행=>값, w:폭}] — 값이 숫자면 숫자로, 문자열이면 문자열로 들어간다.
   meta = [['기간','2026.09'], ...] — 파일 첫머리에 어떤 조건으로 뽑았는지 남긴다. */
async function kmDownloadExcel({ rows, cols, meta, title, sheet, filename }){
  if(!rows || !rows.length){ alert('내려받을 데이터가 없어요.'); return; }
  if(!(await kmEnsureExcel())){ alert('엑셀 모듈을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.'); return; }
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(sheet || '데이터');
  ws.addRow([title || '데이터']);
  ws.getRow(1).font = { name:'맑은 고딕', size:14, bold:true };
  (meta||[]).forEach(m=>ws.addRow(m));
  ws.addRow([]);
  const headRow = ws.addRow(cols.map(c=>c.h));
  headRow.eachCell(c=>{
    c.font = { name:'맑은 고딕', size:10, bold:true, color:{argb:'FFFFFFFF'} };
    c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF2F3A52'} };
    c.alignment = { horizontal:'center', vertical:'middle' };
    c.border = { top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'} };
  });
  rows.forEach(r=>{
    const line = ws.addRow(cols.map(c=>{ const v = c.v(r); return (v===null||v===undefined) ? '' : v; }));
    line.eachCell(c=>{
      c.font = { name:'맑은 고딕', size:10 };
      c.border = { top:{style:'hair'},left:{style:'hair'},bottom:{style:'hair'},right:{style:'hair'} };
    });
  });
  ws.columns.forEach((col,i)=>{
    col.width = cols[i] && cols[i].w ? cols[i].w : 14;
    if(i>0 && !(cols[i] && cols[i].text)) col.numFmt = '#,##0';
  });
  ws.views = [{ state:'frozen', ySplit: headRow.number }];
  ws.autoFilter = { from:{row:headRow.number,column:1}, to:{row:headRow.number,column:cols.length} };
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (filename || '데이터') + '_' + new Date().toISOString().slice(0,10) + '.xlsx';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* 내려받기 버튼 배선. getSpec()은 위 kmDownloadExcel 이 받는 객체를 그때그때 만들어 돌려준다
   (버튼을 누르는 시점의 조건·정렬이 반영돼야 하므로 미리 만들어 두지 않는다). */
function kmWireExcel(getSpec, root){

/* 제미나이 무료 등급은 요청이 몰리면 "high demand"로 자주 막힌다(특히 데이터를 통째로 넣는 총평).
   같은 모델을 계속 두드리는 대신, 막히면 다른 모델로 바로 넘어간다.
   앞쪽일수록 답변 품질이 좋고, 뒤쪽(lite)은 4배쯤 빠르고 덜 막힌다. */
const AI_MODELS = ['gemini-flash-latest','gemini-3.5-flash','gemini-flash-lite-latest','gemini-3.5-flash-lite'];
async function aiFetchWithFallback(apiKey, bodyObj, onRetry){
  let lastErr = null;
  for(let mi=0; mi<AI_MODELS.length; mi++){
    const model = AI_MODELS[mi];
    try{
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
        method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(bodyObj)
      });
      if(res.ok) return await res.json();
      const errBody = await res.json().catch(()=>({}));
      const msg = (errBody && errBody.error && errBody.error.message) || `HTTP ${res.status}`;
      const err = new Error(msg); err.status = res.status; lastErr = err;
      // 혼잡/과부하/한도면 다음 모델로. 그 외(키 오류 등)는 바꿔봐야 소용없으니 중단.
      const switchable = res.status===429 || res.status===503 || res.status===500 || /high demand|overloaded|quota|rate/i.test(msg);
      if(!switchable) throw err;
      if(onRetry && mi < AI_MODELS.length-1) onRetry(mi+1, AI_MODELS.length, AI_MODELS[mi+1]);
      await new Promise(r=>setTimeout(r, 600));
    }catch(e){
      lastErr = e;
      if(e.status && e.status!==429 && e.status!==503 && e.status!==500) throw e;
    }
  }
  throw lastErr || new Error('AI 응답 실패');
}
function getAIApiKey(){ return localStorage.getItem(AI_KEY_STORAGE) || ''; }
function setAIApiKey(k){ localStorage.setItem(AI_KEY_STORAGE, k); }
function extractTopKeywordsFromClientData(data){
  const months = data.months || [];
  if(!months.length) return [];
  const last = months[months.length-1];
  const maps = [last.keywordsByCampaign, last.brandKeywordsByCampaign, last.searchTermsByCampaign].filter(Boolean);
  const all = [];
  maps.forEach(map=>{
    Object.keys(map||{}).forEach(camp=>{
      (map[camp]||[]).forEach(item=> all.push({ ...item, campaign: camp }));
    });
  });
  all.sort((a,b)=> ((b.revenue||0)-(a.revenue||0)) || ((b.conv||0)-(a.conv||0)));
  return all.slice(0,15);
}
async function buildAllClientsSummary(){
  const keys = await listClients();
  const rows = (await Promise.all(keys.map(async key=>{
    const d = await getClientLight(key);
    if(!d) return null;
    const months = d.months || [];
    const last = months[months.length-1];
    if(!last) return null;
    return { name: d.name, industry: d.industry||'-', isDB: d.bizType==='DB', label: last.label, cost: last.cost||0, conv: last.conv||0, revenue: last.revenue||0 };
  }))).filter(Boolean);
  return rows;
}
async function buildAIContext(){
  const data = window.__currentClientData;
  const ctx = window.__pageAIContext;
  if(!data || !ctx){
    const rows = await buildAllClientsSummary();
    if(!rows.length) return '아직 등록된 업체가 없어요.';
    const lines = ['현재 특정 업체가 선택돼있지 않아요. 아래는 전체 업체의 최근 기간 요약이에요 — 특정 업체를 지정하지 않은 질문에는 이 요약을 참고해서 답하고, 특정 업체의 자세한 분석이 필요한 질문이면 어떤 업체를 볼지 먼저 사용자에게 물어보세요.', ''];
    rows.forEach(r=>{
      const metric = r.isDB ? `전환 ${r.conv}건` : `매출 ${Math.round(r.revenue*10000).toLocaleString('ko-KR')}원`;
      lines.push(`- ${r.name} (${r.industry}, ${r.label}): 비용 ${Math.round(r.cost*10000).toLocaleString('ko-KR')}원, ${metric}`);
    });
    return lines.join('\n');
  }
  const lines = [];
  lines.push(`업체명: ${data.name} (${data.industry||'-'}), 업종: ${ctx.isDB?'DB(상담·전환형)':'B2C(매출형)'}`);
  lines.push(`현재 보고 있는 화면: 시간대별 전용 페이지 - ${ctx.periodLabel} 기준`);
  const withData = ctx.hourly.filter(h=>h.cost>0 || h.conv>0);
  if(withData.length){
    lines.push(ctx.isDB ? '\n시간대별(0~23시) 비용/전환/CPA:' : '\n시간대별(0~23시) 비용/전환/매출/ROAS:');
    withData.forEach(h=> lines.push(ctx.isDB
      ? `- ${h.hour}시: 비용 ${Math.round(h.cost*10000).toLocaleString('ko-KR')}원, 전환 ${h.conv}건${h.cpa!==null&&h.cpa!==undefined?`, CPA ${Math.round(h.cpa).toLocaleString('ko-KR')}원`:''}`
      : `- ${h.hour}시: 비용 ${Math.round(h.cost*10000).toLocaleString('ko-KR')}원, 전환 ${h.conv}건, 매출 ${Math.round((h.revenue||0)*10000).toLocaleString('ko-KR')}원, ROAS ${(h.roas||0).toFixed(0)}%`));
  }
  if(ctx.bestHour) lines.push(ctx.isDB
    ? `\n가장 효율적인 시간대: ${ctx.bestHour.hour}시 (CPA ${Math.round(ctx.bestHour.cpa).toLocaleString('ko-KR')}원, 전환 ${ctx.bestHour.conv}건)`
    : `\n가장 효율적인 시간대: ${ctx.bestHour.hour}시 (ROAS ${(ctx.bestHour.roas||0).toFixed(0)}%, 전환 ${ctx.bestHour.conv}건)`);
  if(ctx.cutHours.length) lines.push(`전환 0건인 시간대: ${ctx.cutHours.map(h=>h.hour+'시').join(', ')}`);
  if(ctx.boostHours.length) lines.push(`확대 검토 시간대(효율 좋음): ${ctx.boostHours.map(h=>h.hour+'시').join(', ')}`);
  if(ctx.trendInsight) lines.push(`\n${ctx.trendInsight}`);
  const topKeywords = extractTopKeywordsFromClientData(data);
  if(topKeywords.length){
    lines.push('\n참고: 이 업체의 최근 기간 키워드/검색어 성과:');
    topKeywords.forEach(k=> lines.push(`- ${k.keyword} (${k.campaign}): 비용 ${Math.round((k.cost||0)*10000).toLocaleString('ko-KR')}원, 전환 ${k.conv||0}건`));
  }
  return lines.join('\n');
}
function formatChatText(text){
  // 마크다운 별표(**굵게**, * 목록)를 그대로 화면에 노출하지 않고 자연스러운 텍스트로 바꿔줌
  let s = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/^[*-]\s+/gm, '• ');
  s = s.replace(/\*/g, '');
  s = s.replace(/^-{3,}\s*$/gm, '');
  return s;
}

/* ---------- AI 총평 (성과 인사이트를 자연스러운 문단으로 종합) ---------- */
// campaigns.html과 동일한 방식 — 기존 챗봇의 Gemini 연동·컨텍스트(buildAIContext)를 재사용해서
// 규칙 기반 인사이트를 나열하지 않고 하나의 자연스러운 총평 문단으로 종합해서 보여줌.
const aiSummaryState = {}; // "client:slug::기간라벨" -> { status:'loading'|'done'|'error', text, errorMsg }
function aiSummaryStateKey(key, periodLabel){ return key + '::' + periodLabel; }
// Gemini API가 "high demand"(일시적 과부하) 응답을 줄 때가 잦아서, 매번 사용자가 손으로 "다시 시도"를
// 누르지 않아도 되도록 몇 초 간격을 두고 자동으로 재시도함. 429(요청 과다)·503(서버 과부하)류의 일시적
// 오류나 "overloaded"/"high demand" 문구가 섞인 오류만 재시도 대상으로 보고, 그 외(예: API 키 자체가
// 잘못된 경우)는 재시도해봐야 소용없으니 바로 실패 처리함.
const GEMINI_RETRY_DELAYS_MS = [1500, 4000, 9000]; // 최대 3회 자동 재시도, 갈수록 간격을 늘림
function isRetryableGeminiError(status, errBody){
  if(status===429 || status===503) return true;
  const msg = ((errBody && errBody.error && errBody.error.message) || '').toLowerCase();
  return msg.includes('overloaded') || msg.includes('high demand') || msg.includes('unavailable');
}
async function callGeminiGenerateContent(apiKey, systemPrompt, userText, onRetry){
  for(let attempt=0; ; attempt++){
    let res, networkErr = null;
    try{
      // 한 모델이 막히면 다른 모델로 넘어간다(같은 모델 재시도보다 성공률이 훨씬 높음)
      const _json = await aiFetchWithFallback(apiKey, {
        contents: [{ role:'user', parts:[{ text:userText }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] }
      }, onRetry ? (i,total,next)=>onRetry(i,total) : null);
      const _c = (_json.candidates && _json.candidates[0]) || {};
      const _p = (_c.content && _c.content.parts) || [];
      return _p.map(p=>p.text||'').join('\n').trim() || '(응답이 없어요)';
    }catch(e){ networkErr = e; }
    if(!networkErr && res.ok){
      const json = await res.json();
      const cand = (json.candidates && json.candidates[0]) || {};
      const parts = (cand.content && cand.content.parts) || [];
      return parts.map(p=>p.text||'').join('\n').trim() || '(응답이 없어요)';
    }
    const errBody = networkErr ? null : await res.json().catch(()=>({}));
    const canRetry = attempt < GEMINI_RETRY_DELAYS_MS.length && (networkErr || isRetryableGeminiError(res.status, errBody));
    if(!canRetry){
      if(networkErr) throw networkErr;
      throw new Error((errBody && errBody.error && errBody.error.message) || `HTTP ${res.status}`);
    }
    if(onRetry) onRetry(attempt+1, GEMINI_RETRY_DELAYS_MS.length+1);
    await new Promise(r=>setTimeout(r, GEMINI_RETRY_DELAYS_MS[attempt]));
  }
}
async function generateAISummary(data, key, periodLabel){
  const apiKey = getAIApiKey();
  if(!apiKey){
    document.getElementById('aiChatPanel').classList.add('open');
    sessionStorage.setItem(CHAT_OPEN_STORAGE, '1');
    document.getElementById('aiChatSetup').classList.add('show');
    refreshChatUI();
    return;
  }
  const sKey = aiSummaryStateKey(key, periodLabel);
  aiSummaryState[sKey] = { status:'loading' };
  renderHourlyPage(data);
  try{
    const contextStr = await buildAIContext();
    const systemPrompt = `당신은 네이버 검색광고 대행사의 시니어 매니저입니다. 아래는 지금 보고 있는 화면(시간대 전용 보기)의 데이터 요약과, 이미 규칙 기반으로 뽑아낸 인사이트 목록입니다.\n\n${contextStr}\n\n위 내용을 바탕으로, 고객 보고서에 그대로 붙여넣을 수 있는 자연스러운 한국어 총평을 2~4문장으로 작성하세요. 규칙: (1) 위 데이터·인사이트에 없는 내용은 추측하지 마세요. (2) 인사이트 목록을 그대로 나열하지 말고 핵심만 골라 하나의 자연스러운 글로 종합하세요. (3) 가능하면 다음 기간에 시도해볼 만한 액션을 한 가지 짧게 제안하세요. (4) 마크다운(별표, 목록 기호 등)은 쓰지 마세요.`;
    const replyText = await callGeminiGenerateContent(apiKey, systemPrompt, '위 데이터를 바탕으로 총평을 작성해주세요.', (attempt, max)=>{
      aiSummaryState[sKey] = { status:'loading', retryAttempt: attempt, retryMax: max };
      renderHourlyPage(data);
    });
    aiSummaryState[sKey] = { status:'done', text: replyText };
  }catch(e){
    console.error(e);
    aiSummaryState[sKey] = { status:'error', errorMsg: e.message||String(e) };
  }
  renderHourlyPage(data);

function ensureFilterState(key, data){
  if(filterState[key]) return filterState[key];
  const campSet = new Set();
  const typeSet = new Set();
  (data.months||[]).forEach(m=>{
    (m.campaigns||[]).forEach(c=>{ if(IS_PLACE_TYPE(c.type)) return; campSet.add(c.campaign); typeSet.add(c.type); });
  });
  filterState[key] = { types: new Set(typeSet), campaigns: new Set(campSet) };
  return filterState[key];
}


// monthsScope를 주면 그 기간에 실제로 돌아간(노출·클릭·비용 중 하나라도 있는) 캠페인만 남긴다.
// 예전엔 전체 기간 목록을 그대로 뿌려서, 어제 하루를 봐도 몇 달 전에 끝난 캠페인이 필터에 잔뜩 남았음.
function mergedCampaignList(data, monthsScope){
  const map = {};
  const scope = (monthsScope && monthsScope.length) ? monthsScope : (data.months||[]);
  const active = new Set();
  scope.forEach(m=>{ (m.campaigns||[]).forEach(c=>{
    if((c.cost||0)>0 || (c.impressions||0)>0 || (c.clicks||0)>0 || (c.conv||0)>0) active.add(c.campaign);
  }); });
  (scope).forEach(m=>{
    (m.campaigns||[]).forEach(c=>{
      if(IS_PLACE_TYPE(c.type)) return;
      if(active.size && !active.has(c.campaign)) return;
      if(!map[c.campaign]) map[c.campaign] = { type:c.type, campaign:c.campaign };
    });
  });
  return Object.values(map);
}

function dcAlignTables(root){
  const scope = root || document;
  scope.querySelectorAll('table').forEach(tb=>{
    const body = tb.tBodies && tb.tBodies[0];
    if(!body || !body.rows.length) return;
    const head = tb.tHead && tb.tHead.rows[0];
    const cols = Math.max(...[...body.rows].map(r=>r.cells.length));
    for(let c=0;c<cols;c++){
      let num=0, tot=0;
      for(const row of body.rows){
        const cell = row.cells[c];
        if(!cell || cell.colSpan>1) continue;
        const txt = (cell.textContent||'').trim();
        if(!txt || txt==='-' || txt==='—') continue;
        tot++;
        if(/^[₩$]?[\d,.]+\s*(원|건|개|위|%|만|억)?/.test(txt) && /\d/.test(txt)) num++;
      }
      if(tot>=2 && num/tot >= 0.7){
        for(const row of body.rows){ const cell=row.cells[c]; if(cell && cell.colSpan===1 && !cell.style.textAlign) cell.style.textAlign='right'; }
        if(head && head.cells[c] && !head.cells[c].style.textAlign) head.cells[c].style.textAlign='right';
      }
    }
  });
}

/* 줄이 많은 표는 화면을 끝없이 늘려서, 일정 높이로 잘라 안쪽에서만 스크롤되게 한다.
   (머리글은 스크롤해도 위에 붙어 있어서 어느 칸인지 계속 보임) */
function dcCompactTables(root){
  const scope = root || document;
  scope.querySelectorAll('table').forEach(tb=>{
    if(tb.dataset.dcCompact) return;
    const body = tb.tBodies && tb.tBodies[0];
    if(!body) return;
    if(tb.closest('.hr-scroll, .dc-scroll')) { tb.dataset.dcCompact='1'; return; }
    const parent = tb.parentElement;
    if(!parent) return;
    // 줄이 많아서 세로로 길거나(16줄↑), 칸이 많아서 가로로 넓은(부모보다 큰) 표를 상자에 넣는다.
    // 가로로 넓은 표를 그냥 두면 카드 전체가 늘어나서 화면 오른쪽이 잘림.
    const tooTall = body.rows.length >= 16;
    const tooWide = tb.scrollWidth > parent.clientWidth + 4;
    if(!tooTall && !tooWide) return;
    const wrap = document.createElement('div');
    wrap.className = tooTall ? 'dc-scroll' : 'dc-scroll dc-scroll-x';
    parent.insertBefore(wrap, tb);
    wrap.appendChild(tb);
    tb.dataset.dcCompact = '1';
  });
}

function dcSpark(vals, w, h){

function monthFirstDay(label){ const t=String(label||'').replace('.','-'); return t?`${t}-01`:null; }
function monthLastDay(label){ const t=String(label||'').split('.'); if(t.length<2) return null;
  const y=+t[0], m=+t[1]; return `${y}-${String(m).padStart(2,'0')}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`; }
function dayToMonthLabel(d){ return String(d||'').slice(0,7).replace('-','.'); }
function syncMonthRangeToDays(key, allMonths, dr){
  if(!dr || !dr.start || !dr.end) return false;
  const labels = (allMonths||[]).map(m=>m.label);
  const si = labels.indexOf(dayToMonthLabel(dr.start));
  const ei = labels.indexOf(dayToMonthLabel(dr.end));
  if(si<0 || ei<0) return false;
  const a = Math.min(si,ei), b = Math.max(si,ei);
  const cur = monthRangeState[key] || {};
  if(cur.start===labels[a] && cur.end===labels[b]) return false;
  monthRangeState[key] = { start: labels[a], end: labels[b] };
  if(typeof compareMonthState !== 'undefined') compareMonthState[key] = 'AUTO';
  return true;
}

function renderHourlyPage(data){
  const key = 'client:' + slugify(data.name);
  const fstate = ensureFilterState(key, data);
  applyAccentColor(data.color);
  const allMonths = data.months || [];
  ensureMonthRange(key, allMonths);
  const months = monthsInRange(allMonths, monthRangeState[key]);
  const isMultiMonth = months.length > 1;
  const campaignList = mergedCampaignList(data, months);
  // 기간을 바꾸면 목록이 달라지므로, 처음 보는 캠페인은 기본으로 켜 둔다(사용자가 끈 건 그대로 유지).
  if(!fstate.seen) fstate.seen = new Set(fstate.campaigns);
  campaignList.forEach(c=>{ if(!fstate.seen.has(c.campaign)){ fstate.seen.add(c.campaign); fstate.campaigns.add(c.campaign); } });
  // 사용자가 일부러 전체 해제한 상태는 그대로 존중한다(자동으로 다시 켜지 않음).
  // 다만 '한 번도 본 적 없는' 캠페인만 켜는 위 규칙 때문에, 예전 상태가 지금 목록과
  // 전혀 겹치지 않는 경우(업체·기간이 바뀌어 목록이 통째로 달라진 경우)에는 빈 화면이
  // 되므로, 그때만 새 목록을 기본 선택으로 되돌린다.
  if(campaignList.length && !campaignList.some(c=>fstate.seen.has(c.campaign))){
    campaignList.forEach(c=>{ fstate.campaigns.add(c.campaign); fstate.seen.add(c.campaign); });
  }
  campaignList.forEach(c=>{ if(c.type!=null && !fstate.types.has(c.type) && !fstate.seenTypes) fstate.types.add(c.type); });
  const allTypes = [...new Set(campaignList.map(c=>c.type))];
  const isDB = data.bizType === 'DB';
  const isFullSelection = campaignList.every(c=>fstate.campaigns.has(c.campaign));

  /* 네이버는 시간을 특정할 수 없는 실적을 hour='99'로 내려보냄. 예전엔 0~23시 범위 밖이라고 그냥 버렸는데,
     그러면 이 페이지 합계가 index.html보다 조용히 작아짐(실측 수만 원 단위). 25번째 칸('시간 미상')으로 모아
     표와 합계에는 넣고, 그래프·시간대 추천에서는 뺌(몇 시인지 모르니 조치할 수가 없음). */
  const UNKNOWN_HOUR_IDX = 24;
  function blankAgg(){
    const a = Array.from({ length:24 }, (_,i)=>({ hour:String(i).padStart(2,'0'), impressions:0, clicks:0, cost:0, conv:0, revenue:0, rankSum:0, rankImp:0 }));
    a.push({ hour:'미상', unknown:true, impressions:0, clicks:0, cost:0, conv:0, revenue:0, rankSum:0, rankImp:0 });
    return a;
  }
  function hourLabel(h){ return h && h.unknown ? '시간 미상' : `${h.hour}시`; }
  function realHours(list){ return list.filter(h=>!h.unknown); }
  function aggHourly(monthsList, campaignFilterSet){
    const agg = blankAgg();
    let hasCampaignData = false;
    monthsList.forEach(m=>{
      if(m.hourlyByCampaign && m.hourlyByCampaign.length){
        hasCampaignData = true;
        m.hourlyByCampaign.forEach(h=>{
          if(campaignFilterSet && !campaignFilterSet.has(h.campaign)) return;
          const idx = hourIndexOf(h.hour);
          agg[idx].impressions += h.impressions||0; agg[idx].clicks += h.clicks||0; agg[idx].cost += h.cost||0; agg[idx].conv += h.conv||0; agg[idx].revenue += h.revenue||0;
          if(h.avgRank!==null && h.avgRank!==undefined && h.impressions>0){
            agg[idx].rankSum += h.avgRank*h.impressions; agg[idx].rankImp += h.impressions;
          }
        });
      }
    });
    return { agg, hasCampaignData };
  }
  // 광고그룹별 시간대(0~23시) 데이터(hourlyByAdgroup)를 캠페인 안의 특정 광고그룹 하나로 필터링해서 보여줌.
  // input.html에서 시간대별 리포트에 광고그룹 컬럼이 있어야만 채워짐(옛날에 저장된 달은 비어있을 수 있음 —
  // 다시 업로드하면 채워짐). 예전엔 요일별로도 쪼개서(hourlyByDowByAdgroup) 저장했는데 이 화면에서 요일
  // 구분은 쓰지 않아서, 광고그룹·캠페인이 많은 계정의 문서 용량을 아끼려고 시간 단위로만 저장하도록 변경함.
  function aggAdgroupHourly(monthsList, campaignName, adgroupName){
    const agg = blankAgg();
    let anyData = false;
    monthsList.forEach(m=>{
      (m.hourlyByAdgroup||[]).forEach(cell=>{
        if(cell.campaign!==campaignName || cell.adgroup!==adgroupName) return;
        anyData = true;
        const idx = hourIndexOf(cell.hour);
        agg[idx].impressions += cell.impressions||0; agg[idx].clicks += cell.clicks||0; agg[idx].cost += cell.cost||0; agg[idx].conv += cell.conv||0; agg[idx].revenue += cell.revenue||0;
        if(cell.avgRank!==null && cell.avgRank!==undefined && cell.impressions>0){
          agg[idx].rankSum += cell.avgRank*cell.impressions; agg[idx].rankImp += cell.impressions;
        }
      });
    });
    return { agg, hasData: anyData };
  }
  // 캘린더 날짜 범위 필터(dayRangeState) — hourlyByCampaignDate(날짜×시간×캠페인, 광고그룹 차원 없음)가
  // 있는 달에서만 정확한 날짜 필터링이 가능함. 필터가 꺼져있으면(기본) 기존과 동일하게 월 전체를 씀.
  const dayBoundsMinHr = (()=>{ const all=[]; months.forEach(m=>(m.hourlyByCampaignDate||[]).forEach(r=>all.push(r.date))); return all.length ? toDateInputValue(all.sort((a,b)=>dateKey(a).localeCompare(dateKey(b)))[0]) : null; })();
  const dayBoundsMaxHr = (()=>{ const all=[]; months.forEach(m=>(m.hourlyByCampaignDate||[]).forEach(r=>all.push(r.date))); return all.length ? toDateInputValue(all.sort((a,b)=>dateKey(a).localeCompare(dateKey(b)))[all.length-1]) : null; })();
  if(!(key in dayRangeState)){ dayRangeState[key] = { start: null, end: null }; dayPresetChoice[key] = null; }
  if(!(key in dayRangeCustomOpen)) dayRangeCustomOpen[key] = false;
  {
    const dr = dayRangeState[key];
    if(dayBoundsMinHr && dayBoundsMaxHr){
      // 데이터 범위를 벗어나면 통째로 지우지 말고 범위 안으로 당긴다.
      // (통째로 지우면 '최근 7일' 같은 버튼이 눌린 걸로 인식이 안 돼서 색이 안 들어감)
      if(dr.start && dr.start < dayBoundsMinHr) dr.start = dayBoundsMinHr;
      if(dr.start && dr.start > dayBoundsMaxHr) dr.start = null;
      if(dr.end && dr.end > dayBoundsMaxHr) dr.end = dayBoundsMaxHr;
      if(dr.end && dr.end < dayBoundsMinHr) dr.end = null;
      if(dr.start && dr.end && dr.start > dr.end) { dr.start = null; dr.end = null; }
    } else { dr.start = null; dr.end = null; }
  }
  const hasHourlyDayFilter = !!(dayRangeState[key].start || dayRangeState[key].end) && !!dayBoundsMinHr;

  function aggHourlyByDateRange(monthsList, campaignFilterSet, range){
    const agg = blankAgg();
    let anyData = false;
    monthsList.forEach(m=>{
      (m.hourlyByCampaignDate||[]).forEach(cell=>{
        if(campaignFilterSet && !campaignFilterSet.has(cell.campaign)) return;
        const k = dateKey(cell.date);
        if(range.start && k < range.start.replace(/\D/g,'')) return;
        if(range.end && k > range.end.replace(/\D/g,'')) return;
        anyData = true;
        const idx = hourIndexOf(cell.hour);
        agg[idx].impressions += cell.impressions||0; agg[idx].clicks += cell.clicks||0; agg[idx].cost += cell.cost||0; agg[idx].conv += cell.conv||0; agg[idx].revenue += cell.revenue||0;
        // 다른 집계 경로는 avgRank를 노출수로 가중해 모으는데 이 경로만 빠져서, 날짜 필터를 켜면
        // 평균노출순위가 전부 '-'로 바뀌었음. 원본에 값이 있는 달에서는 똑같이 채워줌.
        if(cell.avgRank!==null && cell.avgRank!==undefined && cell.impressions>0){

    });
    return { agg, hasData: anyData };
  }

  let hourlyAgg, hourlyHasCampaignData;
  if(hasHourlyDayFilter){

    hourlyAgg = r.agg;
    hourlyHasCampaignData = r.hasData;
  } else {
    let hrAggResult = aggHourly(months, fstate.campaigns);

    hourlyHasCampaignData = hrAggResult.hasCampaignData;
    if(isFullSelection || !hourlyHasCampaignData){
      hourlyAgg = blankAgg();
      months.forEach(m=>{
        (m.hourly||[]).forEach(h=>{
          const idx = hourIndexOf(h.hour);
          hourlyAgg[idx].impressions += h.impressions||0; hourlyAgg[idx].clicks += h.clicks||0; hourlyAgg[idx].cost += h.cost||0; hourlyAgg[idx].conv += h.conv||0; hourlyAgg[idx].revenue += h.revenue||0;
          if(h.avgRank!==null && h.avgRank!==undefined && h.impressions>0){

  }
  const hourlyFilterLimited = !hasHourlyDayFilter && !isFullSelection && !hourlyHasCampaignData;
  const hasHourlyData = hourlyAgg.some(h=>h.impressions>0 || h.cost>0);

  // 전기간 대비: 직전 기간 시간대별 집계
  // 선택 구간이 여러 달이면(isMultiMonth) "직전 기간"도 같은 길이만큼의 직전 구간을 통째로 집계해서 비교함
  // (index.html/campaigns.html의 prevRangeMonths 패턴과 동일). 특정 월을 콕 집어 비교하고 싶을 땐
  // 드롭다운에서 직접 고른 단일 월(prevMonth)을 그대로 사용.
  if(!(key in compareMonthState)) compareMonthState[key] = 'AUTO';
  let prevMonths = [];
  if(months.length){
    if(compareMonthState[key]!=='AUTO'){
      const picked = allMonths.find(m=>m.label===compareMonthState[key]);
      if(picked && !months.some(m=>m.label===picked.label)) prevMonths = [picked];
    } else {
      const si = allMonths.findIndex(m=>m.label===months[0].label);
      const rangeLen = months.length;
      if(si>=rangeLen) prevMonths = allMonths.slice(si-rangeLen, si);
    }
  }
  const prevRangeLabel = prevMonths.length
    ? (prevMonths.length>1 ? `${prevMonths[0].label} ~ ${prevMonths[prevMonths.length-1].label}` : prevMonths[0].label)
    : null;
  let prevHourlyAgg = null;
  /* 날짜 필터(어제·최근 7일 등)를 켜면 '지금' 값은 그 며칠치인데 비교 대상은 '직전 달 한 달 전체'라,
     표 전체에 ▼97% 같은 값이 찍혀 추이가 의미를 잃었다(대시보드·캠페인·키워드는 이미 고쳐진 문제).
     → 바로 앞의 같은 길이 날짜 구간과 비교하고, 그 구간에 데이터가 없으면 ▲▼ 자체를 감춘다. */
  let hourTrendOff = false;
  if(hasHourlyDayFilter){
    const dr = dayRangeState[key];
    const pr = (function(){
      if(!dr || !dr.start || !dr.end) return null;
      const d1=new Date(dr.start+'T00:00:00'), d2=new Date(dr.end+'T00:00:00');
      if(isNaN(d1)||isNaN(d2)) return null;
      const len=Math.round((d2-d1)/86400000)+1;
      if(!(len>0)||!isFinite(len)) return null;
      const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const pe=new Date(d1.getTime()-86400000), ps=new Date(pe.getTime()-(len-1)*86400000);

    })();
    if(pr){
      // 직전 구간이 다른 달에 걸칠 수 있으므로 전체 달에서 찾는다.
      const r = aggHourlyByDateRange(allMonths, isFullSelection ? null : fstate.campaigns, pr);
      const any = (r && r.agg) ? r.agg.some(x=>(x.impressions||0)>0 || (x.cost||0)>0 || (x.conv||0)>0) : false;
      if(any) prevHourlyAgg = r.agg; else hourTrendOff = true;
    } else { hourTrendOff = true; }
  } else if(prevMonths.length){
    let pResult = aggHourly(prevMonths, fstate.campaigns);
    let pAgg = pResult.agg;
    if(isFullSelection || !pResult.hasCampaignData){
      pAgg = blankAgg();
      prevMonths.forEach(pm=>(pm.hourly||[]).forEach(h=>{
        const idx = hourIndexOf(h.hour);
        pAgg[idx].impressions += h.impressions||0; pAgg[idx].clicks += h.clicks||0; pAgg[idx].cost += h.cost||0; pAgg[idx].conv += h.conv||0; pAgg[idx].revenue += h.revenue||0;
        if(h.avgRank!==null && h.avgRank!==undefined && h.impressions>0){
          pAgg[idx].rankSum += h.avgRank*h.impressions; pAgg[idx].rankImp += h.impressions;
        }
      }));
    }
    prevHourlyAgg = pAgg;
  }
  // 직전 기간에 시간대별 데이터 자체가 없으면(0으로만 채워진 배열) 트렌드 계산을 아예 건너뜀 —
  // 안 그러면 "0 → N"이 전부 "▲100%"로 표시돼서 마치 실제 변화인 것처럼 보이는 오류가 생김.
  const prevHourlyHasData = !!(prevHourlyAgg && prevHourlyAgg.some(h=>h.impressions>0 || h.cost>0));

  function enrich(agg){
    return agg.map(h=>({ ...h, cpa: h.conv>0 ? Math.round(h.cost*10000/h.conv) : null, ctr: h.impressions>0 ? (h.clicks/h.impressions*100) : 0, cvr: h.clicks>0 ? (h.conv/h.clicks*100) : 0,
      roas: h.cost>0 ? (h.revenue/h.cost*100) : 0,
      avgRank: (h.rankImp>0) ? (h.rankSum/h.rankImp) : null }));
  }
  const hourlyEnriched = enrich(hourlyAgg);
  const prevEnriched = (prevHourlyAgg && prevHourlyHasData) ? enrich(prevHourlyAgg) : null;
  function pctOf(curr, prev){
    if(prev===null || prev===undefined || curr===null || curr===undefined) return null;
    if(prev===0) return curr>0 ? 100 : null;
    return (curr-prev)/prev*100;
  }
  /* goodDir: 이 지표가 어느 방향으로 가야 "좋은" 것인지.
     'up'   = 올라가면 좋음(전환수·매출·ROAS·CTR·CVR)
     'down' = 내려가야 좋음(비용·CPA·평균노출순위)
     호출부는 이미 정확히 넘기고 있었는데 함수가 이 값을 쓰지 않아, 비용이나 CPA가 올라도
     초록(▲)으로 표시돼 나빠진 것이 좋아 보이는 문제가 있었음. */
  function cellTrend(pct, goodDir){
    if(pct===null || pct===undefined || isNaN(pct) || Math.abs(pct)<5) return '';
    const rising = pct >= 0;
    const isGood = (goodDir === 'down') ? !rising : rising;
    return `<span style="margin-left:5px;font-size:12px;font-weight:700;color:${isGood?'var(--up)':'var(--down)'};">${rising?'▲':'▼'}${Math.abs(pct).toFixed(0)}%</span>`;
  }
  const hourlyWithTrend = hourlyEnriched.map((h,i)=>{
    const p = prevEnriched ? prevEnriched[i] : null;
    const trends = p ? { cost: pctOf(h.cost,p.cost), conv: pctOf(h.conv,p.conv), cpa: pctOf(h.cpa,p.cpa), revenue: pctOf(h.revenue,p.revenue), roas: pctOf(h.roas,p.roas), ctr: pctOf(h.ctr,p.ctr), cvr: pctOf(h.cvr,p.cvr), avgRank: pctOf(h.avgRank,p.avgRank) } : {};
    return { ...h, trends };
  });

  // 시간대 운영 추천
  const withConv = realHours(hourlyEnriched).filter(h=>h.conv>0 && h.cost>0);
  const MIN_CONV_HOUR = 5; // 표본이 너무 적은 시간대는 우연일 수 있어서 제외
  const totalCostWithConv = withConv.reduce((s,h)=>s+h.cost,0), totalConvWithConv = withConv.reduce((s,h)=>s+h.conv,0), totalRevenueWithConv = withConv.reduce((s,h)=>s+h.revenue,0);
  const avgCpaHour = totalConvWithConv>0 ? (totalCostWithConv*10000/totalConvWithConv) : null; // 전환수로 가중한 평균 CPA (시간대별 단순평균이 아님)
  const avgRoasHour = totalCostWithConv>0 ? (totalRevenueWithConv/totalCostWithConv*100) : null; // 비용으로 가중한 평균 ROAS
  const cutCandidates = realHours(hourlyEnriched).filter(h=> h.cost>=1 && h.conv===0).sort((a,b)=>b.cost-a.cost).slice(0,5);
  const boostCandidates = isDB
    ? (avgCpaHour ? realHours(hourlyEnriched).filter(h=> h.conv>=MIN_CONV_HOUR && h.cpa < avgCpaHour*0.6).sort((a,b)=>a.cpa-b.cpa).slice(0,5) : [])
    : (avgRoasHour ? realHours(hourlyEnriched).filter(h=> h.conv>=MIN_CONV_HOUR && h.roas > avgRoasHour*1.4).sort((a,b)=>b.roas-a.roas).slice(0,5) : []);
  const bestHourCandidates = withConv.filter(h=>h.conv>=MIN_CONV_HOUR);
  const bestHour = bestHourCandidates.length ? bestHourCandidates.reduce((a,b)=> isDB ? (a.cpa<b.cpa?a:b) : (a.roas>b.roas?a:b)) : null;
  let overallTrendInsight = null;
  if(prevEnriched){
    const curTotalCost = hourlyEnriched.reduce((a,b)=>a+b.cost,0), curTotalConv = hourlyEnriched.reduce((a,b)=>a+b.conv,0), curTotalRevenue = hourlyEnriched.reduce((a,b)=>a+b.revenue,0);
    const prevTotalCost = prevEnriched.reduce((a,b)=>a+b.cost,0), prevTotalConv = prevEnriched.reduce((a,b)=>a+b.conv,0), prevTotalRevenue = prevEnriched.reduce((a,b)=>a+b.revenue,0);
    if(isDB){
      const curCpa = curTotalConv>0 ? curTotalCost*10000/curTotalConv : null;
      const prevCpa = prevTotalConv>0 ? prevTotalCost*10000/prevTotalConv : null;
      if(curCpa!==null && prevCpa!==null && curTotalConv>=5 && prevTotalConv>=5){
        const diff = (curCpa-prevCpa)/prevCpa*100;
        if(Math.abs(diff)>=10) overallTrendInsight = { good: diff<=0, text:`직전 기간 대비 전체 시간대 CPA가 ${Math.abs(diff).toFixed(0)}% ${diff<=0?'개선':'상승'}됐어요 (${Math.round(prevCpa).toLocaleString('ko-KR')}원 → ${Math.round(curCpa).toLocaleString('ko-KR')}원).` };
      }
    } else {
      const curRoas = curTotalCost>0 ? curTotalRevenue/curTotalCost*100 : null;
      const prevRoas = prevTotalCost>0 ? prevTotalRevenue/prevTotalCost*100 : null;
      if(curRoas!==null && prevRoas!==null && prevRoas>0 && curTotalCost>=1 && prevTotalCost>=1){
        const diff = curRoas-prevRoas;
        if(Math.abs(diff)>=5) overallTrendInsight = { good: diff>=0, text:`직전 기간 대비 전체 시간대 ROAS가 ${Math.abs(diff).toFixed(0)}%p ${diff>=0?'상승':'하락'}했어요 (${prevRoas.toFixed(0)}% → ${curRoas.toFixed(0)}%).` };
      }
    }
  }
  window.__currentClientData = data;
  const periodLabel = isMultiMonth ? `${months[0].label} ~ ${months[months.length-1].label} 누적` : (months[0] ? months[0].label : '기간 없음');
  window.__pageAIContext = {
    isDB,
    periodLabel,
    hourly: hourlyEnriched.map(h=>({ hour:h.hour, cost:h.cost, conv:h.conv, cpa:h.cpa, revenue:h.revenue, roas:h.roas, ctr:h.ctr })),
    bestHour: bestHour ? { hour:bestHour.hour, cpa:bestHour.cpa, roas:bestHour.roas, conv:bestHour.conv } : null,
    cutHours: cutCandidates.map(h=>({ hour:h.hour, cost:h.cost })),
    boostHours: boostCandidates.map(h=>({ hour:h.hour, cpa:h.cpa, roas:h.roas })),
    trendInsight: overallTrendInsight ? overallTrendInsight.text : null
  };

  // 요일×시간대 히트맵 데이터 (시간대별 리포트에 일별 컬럼이 포함된 경우에만 존재).
  // 캠페인별 세부 데이터(hourlyByDowByCampaign)가 있는 달은 캠페인 필터를 반영하고,
  // 옛날에 저장돼서 이 세부 데이터가 없는 달은 어쩔 수 없이 전체 캠페인 기준으로 합산함.
  let hasDowData = false, hasDowByCampaignData = false;
  months.forEach(m=>{
    if(m.hourlyByDow && m.hourlyByDow.length) hasDowData = true;
    if(m.hourlyByDowByCampaign && m.hourlyByDowByCampaign.length) hasDowByCampaignData = true;
  });
  let dowGrid = null;
  let dowHeatmapIsFiltered = false; // true면 현재 캠페인 필터가 히트맵에도 실제로 반영된 상태
  let dowHeatmapPartiallyUnfiltered = false; // true면 필터 적용 중인데 일부(예전 형식) 달은 캠페인별 세부 정보가 없어서 필터 없이 전체 기준으로 섞여 들어감
  if(hasDowData){
    dowGrid = Array.from({ length:7 }, ()=> Array.from({ length:24 }, ()=>({ impressions:0, clicks:0, cost:0, conv:0, revenue:0, rankSum:0, rankImp:0 })));
    const addCell = (d,h,cell)=>{
      dowGrid[d][h].impressions += cell.impressions||0;
      dowGrid[d][h].clicks += cell.clicks||0;
      dowGrid[d][h].cost += cell.cost||0;
      dowGrid[d][h].conv += cell.conv||0;
      dowGrid[d][h].revenue += cell.revenue||0;
      if(cell.avgRank!==null && cell.avgRank!==undefined && cell.impressions>0){
        dowGrid[d][h].rankSum += cell.avgRank*cell.impressions; dowGrid[d][h].rankImp += cell.impressions;
      }
    };
    if(!isFullSelection && hasDowByCampaignData){
      dowHeatmapIsFiltered = true;
      // 달 단위로 분기: 캠페인별 세부 데이터(hourlyByDowByCampaign)가 있는 달만 필터를 적용할 수 있음.
      // 이전에는 범위 안에 그런 달이 하나라도 있으면 세부 데이터가 없는(예전 형식) 달은 통째로
      // 제외돼서 조용히 데이터가 누락됐음 — 완전히 빼는 대신, 필터를 적용할 수 없는 달은 전체
      // 캠페인 기준으로라도 포함하고 캡션으로 안내함.
      months.forEach(m=>{
        if(m.hourlyByDowByCampaign && m.hourlyByDowByCampaign.length){

            const h = parseInt(cell.hour,10);
            const d = cell.dow;
            if(isNaN(h) || h<0 || h>23 || d==null || d<0 || d>6) return;
            if(!fstate.campaigns.has(cell.campaign)) return;
            addCell(d,h,cell);
          });
        } else if(m.hourlyByDow && m.hourlyByDow.length){
          dowHeatmapPartiallyUnfiltered = true;
          m.hourlyByDow.forEach(cell=>{
            const h = parseInt(cell.hour,10);
            const d = cell.dow;
            if(isNaN(h) || h<0 || h>23 || d==null || d<0 || d>6) return;
            addCell(d,h,cell);
          });
        }
      });
    } else {
      months.forEach(m=>{
        (m.hourlyByDow||[]).forEach(cell=>{
          const h = parseInt(cell.hour,10);
          const d = cell.dow;
          if(isNaN(h) || h<0 || h>23 || d==null || d<0 || d>6) return;
          addCell(d,h,cell);
        });
      });
    }
  }
  const DOW_LABELS = ['일','월','화','수','목','금','토'];

  // 요일 단위 운영 추천 — 시간대(0~23시) 인사이트는 이미 있었지만, "주말 노출 끄기"처럼 실무 판단은
  // 요일 단위로 이뤄지는 경우가 많아서 dowGrid(요일×시간대)를 요일별로 합산해 같은 패턴의 인사이트를 추가.
  let dowInsight = null, dowWorstInsight = null, dowZeroConvInsight = null;
  if(dowGrid){
    const MIN_CONV_DOW = 5;
    const dowAgg = dowGrid.map((row, d)=>{
      const agg = row.reduce((s,c)=>({ impressions:s.impressions+c.impressions, clicks:s.clicks+c.clicks, cost:s.cost+c.cost, conv:s.conv+c.conv, revenue:s.revenue+c.revenue }), { impressions:0, clicks:0, cost:0, conv:0, revenue:0 });
      return { dow:d, label:DOW_LABELS[d], ...agg,

    });
    const dowWithConv = dowAgg.filter(d=>d.conv>=MIN_CONV_DOW && d.cost>0);
    if(dowWithConv.length>=2){
      const best = dowWithConv.reduce((a,b)=> isDB ? (a.cpa<b.cpa?a:b) : (a.roas>b.roas?a:b));
      const worst = dowWithConv.reduce((a,b)=> isDB ? (a.cpa>b.cpa?a:b) : (a.roas<b.roas?a:b));
      if(best.dow!==worst.dow){
        dowInsight = isDB
          ? { text:`가장 효율적인 요일은 '${best.label}요일'이에요 (CPA ${best.cpa.toLocaleString('ko-KR')}원, 전환 ${best.conv}건 기준).` }
          : { text:`가장 효율적인 요일은 '${best.label}요일'이에요 (ROAS ${best.roas.toFixed(0)}%, 전환 ${best.conv}건 기준).` };
        dowWorstInsight = isDB
          ? { text:`'${worst.label}요일'은 상대적으로 CPA가 높아요 (${worst.cpa.toLocaleString('ko-KR')}원, 전환 ${worst.conv}건 기준) — 예산 비중을 낮추는 걸 검토해보세요.` }
          : { text:`'${worst.label}요일'은 상대적으로 ROAS가 낮아요 (${worst.roas.toFixed(0)}%, 전환 ${worst.conv}건 기준) — 예산 비중을 낮추는 걸 검토해보세요.` };
      }
    }
    // 전환 0건인데 비용만 쓴 요일(주말 노출 끄기 등 판단에 직접 쓰이는 정보)
    const zeroConv = dowAgg.filter(d=>d.cost>=1 && d.conv===0).sort((a,b)=>b.cost-a.cost);
    if(zeroConv.length){
      dowZeroConvInsight = { text:`${zeroConv.map(d=>`'${d.label}요일'(${fmtWon(d.cost)}원)`).join(', ')}은 비용만 쓰고 전환이 0건이에요 — 이 요일 노출을 줄이거나 끄는 걸 검토해보세요.` };
    }
  }

  if(!(key in hourHeatmapMetric)) hourHeatmapMetric[key] = 'cost';
  let heatMetric = hourHeatmapMetric[key];
  if(isDB && (heatMetric==='revenue' || heatMetric==='roas')) heatMetric = hourHeatmapMetric[key] = 'cost';
  if(!isDB && heatMetric==='cpa') heatMetric = hourHeatmapMetric[key] = 'cost';

  // 캠페인별 시간대 비교
  if(!(key in hourCompareCampaigns)) hourCompareCampaigns[key] = [];
  if(!(key in hourCompareMetric)) hourCompareMetric[key] = 'conv';
  if(isDB && hourCompareMetric[key]==='roas') hourCompareMetric[key] = 'conv';
  if(!isDB && hourCompareMetric[key]==='cpa') hourCompareMetric[key] = 'roas';
  const compareCampaigns = hourCompareCampaigns[key];
  const compareMetric = hourCompareMetric[key];
  const compareData = {};
  if(compareCampaigns.length){
    compareCampaigns.forEach(camp=>{
      const agg = blankAgg();
      months.forEach(m=>{
        (m.hourlyByCampaign||[]).forEach(h=>{
